<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 190" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- Five folds of the wine file with its duplicates left in: a row in training and its exact copy in the test fold. Illustrative. Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<rect x="40" y="40" width="176" height="54" rx="3" fill="#e9edf0"/>
<text x="128.0" y="28" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">training fold 1</text>
<rect x="222" y="40" width="176" height="54" rx="3" fill="#e9edf0"/>
<text x="310.0" y="28" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">training fold 2</text>
<rect x="404" y="40" width="176" height="54" rx="3" fill="#e9edf0"/>
<text x="492.0" y="28" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">training fold 3</text>
<rect x="586" y="40" width="176" height="54" rx="3" fill="#e9edf0"/>
<text x="674.0" y="28" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">training fold 4</text>
<rect class="accent-a-light-fill" x="768" y="40" width="176" height="54" rx="3" fill="#8cb3cf"/>
<text x="856.0" y="28" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c2e36">test fold</text>
<circle class="accent-fill" cx="282" cy="67.0" r="11" fill="#00609c"/>
<circle class="accent-fill" cx="878" cy="67.0" r="11" fill="#00609c"/>
<path d="M 282 81.0 C 282 154, 878 154, 878 81.0" fill="none" stroke="#da232f" stroke-width="2.2"/>
<text x="580.0" y="162" font-size="17" font-weight="normal" text-anchor="middle" fill="#da232f">the same wine, twice: the model is tested on a row it has learned</text>
</svg>
