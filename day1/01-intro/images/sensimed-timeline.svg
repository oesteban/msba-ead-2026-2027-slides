<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 476" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- SENSIMED, above the arrow from its record (CTI 17325.1; FDA 2016; Martin et al. 2018), below it after D. Genoud's 2025 slide, with his team's pictures (not openly licensed; see sensimed/LICENSE.txt). Oscar Esteban, CC BY 4.0 for the drawing. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<polygon class="accent-fill" points="30,233 1088,233 1088,218 1116,250 1088,282 1088,267 30,267" fill="#00609c"/>
<path d="M122,271 L134,229 M134,271 L146,229" stroke="#ffffff" stroke-width="5"/>
<text x="60" y="256" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">2003</text>
<text x="200" y="256" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">2010</text>
<text x="310" y="256" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">2011</text>
<text x="420" y="256" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">2012</text>
<text x="530" y="256" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">2013</text>
<text x="640" y="256" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">2014</text>
<text x="760" y="256" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">2016</text>
<text x="1000" y="256" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">2018</text>
<text x="1062" y="256" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">now</text>
<text x="22" y="40" font-size="16" font-weight="bold" text-anchor="start" fill="#556268">The record</text>
<text x="22" y="305" font-size="15" font-weight="bold" text-anchor="start" fill="#556268">As D. Genoud's</text>
<text x="22" y="325" font-size="15" font-weight="bold" text-anchor="start" fill="#556268">team told it</text>
<line x1="60" y1="212" x2="60" y2="231" stroke="#556268" stroke-width="1.4" stroke-dasharray="3 3"/>
<text class="accent-fill" x="22" y="140" font-size="17" font-weight="bold" text-anchor="start" fill="#00609c">A device</text>
<text x="22" y="161" font-size="16" font-weight="normal" text-anchor="start" fill="#1c2e36">EPFL spin-off: a contact</text>
<text x="22" y="182" font-size="16" font-weight="normal" text-anchor="start" fill="#1c2e36">lens records the eye's</text>
<text x="22" y="203" font-size="16" font-weight="normal" text-anchor="start" fill="#1c2e36">volume over 24 hours</text>
</g>
<g data-step="2">
<line x1="200" y1="269" x2="200" y2="283" stroke="#556268" stroke-width="1.4"/>
<text x="200" y="305" font-size="16" font-weight="normal" text-anchor="middle" fill="#556268" font-style="italic">Device</text>
<line x1="310" y1="269" x2="310" y2="283" stroke="#556268" stroke-width="1.4"/>
<text x="310" y="305" font-size="16" font-weight="normal" text-anchor="middle" fill="#556268" font-style="italic">Signal</text>
<text x="310" y="325" font-size="16" font-weight="normal" text-anchor="middle" fill="#556268" font-style="italic">processing</text>
<line x1="420" y1="269" x2="420" y2="283" stroke="#556268" stroke-width="1.4"/>
<text x="420" y="305" font-size="16" font-weight="normal" text-anchor="middle" fill="#556268" font-style="italic">Information</text>
<text x="420" y="325" font-size="16" font-weight="normal" text-anchor="middle" fill="#556268" font-style="italic">system</text>
<line x1="200" y1="313" x2="99.78313253012048" y2="370" stroke="#556268" stroke-width="1" stroke-dasharray="2 3"/>
