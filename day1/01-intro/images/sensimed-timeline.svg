<rect x="187.56626506024097" y="374" width="126.21513944223108" height="96" rx="0" fill="none" stroke="#c9cfd2" stroke-width="1"/>
<line x1="420" y1="333" x2="403.461404502472" y2="370" stroke="#556268" stroke-width="1" stroke-dasharray="2 3"/>
<image href="sensimed/information-system.jpg" x="323.8" y="374" width="159.4" height="96"/>
<rect x="323.781404502472" y="374" width="159.36" height="96" rx="0" fill="none" stroke="#c9cfd2" stroke-width="1"/>
</g>
<g data-step="3">
<rect class="accent-b-fill" x="618" y="233" width="164" height="34" rx="0" fill="#25bcca" fill-opacity="0.85"/>
<text x="640" y="256" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">2014</text>
<text x="760" y="256" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">2016</text>
<line x1="700" y1="108" x2="700" y2="231" stroke="#556268" stroke-width="1.4" stroke-dasharray="3 3"/>
<text class="accent-fill" x="700" y="40" font-size="17" font-weight="bold" text-anchor="middle" fill="#00609c">A platform</text>
<text x="700" y="61" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">HES-SO Valais-Wallis:</text>
<text x="700" y="82" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">machine learning on</text>
<text x="700" y="103" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">the 24-hour profiles</text>
<line x1="760" y1="124" x2="760" y2="231" stroke="#556268" stroke-width="1.4" stroke-dasharray="3 3"/>
<text class="accent-fill" x="772" y="140" font-size="17" font-weight="bold" text-anchor="start" fill="#00609c">A narrower use</text>
<text x="772" y="161" font-size="16" font-weight="normal" text-anchor="start" fill="#1c2e36">US marketing to time</text>
<text x="772" y="182" font-size="16" font-weight="normal" text-anchor="start" fill="#1c2e36">eye-pressure checks;</text>
<text x="772" y="203" font-size="16" font-weight="normal" text-anchor="start" fill="#1c2e36">not a diagnostic tool</text>
<line x1="585" y1="269" x2="585" y2="283" stroke="#556268" stroke-width="1.4"/>
<text x="585" y="305" font-size="16" font-weight="normal" text-anchor="middle" fill="#556268" font-style="italic">Machine learning,</text>
<text x="585" y="325" font-size="16" font-weight="normal" text-anchor="middle" fill="#556268" font-style="italic">data mining,</text>
<text x="585" y="345" font-size="16" font-weight="normal" text-anchor="middle" fill="#556268" font-style="italic">new features</text>
<line x1="760" y1="269" x2="760" y2="283" stroke="#556268" stroke-width="1.4"/>
<text x="760" y="305" font-size="16" font-weight="normal" text-anchor="middle" fill="#556268" font-style="italic">Speed of disease</text>
<text x="760" y="325" font-size="16" font-weight="normal" text-anchor="middle" fill="#556268" font-style="italic">prediction</text>
<line x1="585" y1="353" x2="569.9000251921273" y2="370" stroke="#556268" stroke-width="1" stroke-dasharray="2 3"/>
<image href="sensimed/features.jpg" x="493.1" y="374" width="153.5" height="96"/>
<rect x="493.141404502472" y="374" width="153.51724137931035" height="96" rx="0" fill="none" stroke="#c9cfd2" stroke-width="1"/>
<line x1="585" y1="353" x2="731.5157887389253" y2="370" stroke="#556268" stroke-width="1" stroke-dasharray="2 3"/>
<image href="sensimed/workflow.jpg" x="656.7" y="374" width="149.7" height="96"/>
<rect x="656.6586458817824" y="374" width="149.71428571428572" height="96" rx="0" fill="none" stroke="#c9cfd2" stroke-width="1"/>
<line x1="760" y1="333" x2="847.4572689454658" y2="370" stroke="#556268" stroke-width="1" stroke-dasharray="2 3"/>
<image href="sensimed/diagnostic-helper.jpg" x="816.4" y="374" width="62.2" height="96"/>
<rect x="816.3729315960682" y="374" width="62.16867469879518" height="96" rx="0" fill="none" stroke="#c9cfd2" stroke-width="1"/>
</g>
<g data-step="4">
<line x1="1000" y1="108" x2="1000" y2="231" stroke="#556268" stroke-width="1.4" stroke-dasharray="3 3"/>
<text class="accent-fill" x="1000" y="40" font-size="17" font-weight="bold" text-anchor="middle" fill="#00609c">An evaluation</text>
<text x="1000" y="61" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">glaucoma or healthy, AUC:</text>
<text x="1000" y="82" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">lens 0.61, pressure 0.68,</text>
<text x="1000" y="103" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">both 0.76</text>
<line x1="1050" y1="269" x2="1050" y2="283" stroke="#556268" stroke-width="1.4"/>
<text x="1050" y="305" font-size="16" font-weight="normal" text-anchor="middle" fill="#556268" font-style="italic">Improvement,</text>
<text x="1050" y="325" font-size="16" font-weight="normal" text-anchor="middle" fill="#556268" font-style="italic">deep learning</text>
</g>
