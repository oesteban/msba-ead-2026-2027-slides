<text x="867" y="326" font-size="14" font-weight="normal" text-anchor="middle" fill="#ffffff">scored once on the test:</text>
<text x="867" y="346" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">the number to report</text>
<path d="M860.0,112 L860.0,300" fill="none" stroke="#1c2e36" stroke-width="1.4" marker-end="url(#ah)"/>
