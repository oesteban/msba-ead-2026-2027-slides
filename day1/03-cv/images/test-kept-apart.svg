<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 366" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- Model selection with a test set kept apart: choices made by cross-validation on the training data, one final score on the test data (after Provost and Fawcett 2013, pp. 134 to 135); folds and test stratified. Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<text x="500" y="26" font-size="17" font-weight="bold" text-anchor="middle" fill="#1c2e36">the 1,000 credits</text>
<rect x="40" y="40" width="720" height="44" rx="0" fill="#e9edf0" stroke="#1c2e36" stroke-width="1.2"/>
<text x="400.0" y="68" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">training data: 800 credits</text>
<rect class="accent-a-light-fill" x="760" y="40" width="140.0" height="44" rx="0" fill="#8cb3cf"/>
<rect class="accent-fill" x="900.0" y="40" width="60.0" height="44" rx="0" fill="#00609c"/>
<rect x="760" y="40" width="200" height="44" rx="0" fill="none" stroke="#1c2e36" stroke-width="1.2"/>
<text x="860.0" y="68" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">test: 200</text>
<g data-step="1">
<text x="860.0" y="106" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">kept apart, not opened</text>
</g>
