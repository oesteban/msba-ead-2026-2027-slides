<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- Model selection with a test set kept apart: choices made by cross-validation on the training data, one final score on the test data (after Provost and Fawcett 2013, pp. 134 to 135). Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<text x="500" y="26" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c2e36">the 1,000 credits</text>
<rect x="40" y="40" width="720" height="40" rx="0" fill="#e9edf0" stroke="#1c2e36" stroke-width="1.2"/>
<text x="400.0" y="66" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2e36">training data: 800 credits</text>
<rect x="760" y="40" width="200" height="40" rx="0" fill="#c9cfd2" stroke="#1c2e36" stroke-width="1.2"/>
<text x="860.0" y="66" font-size="14" font-weight="bold" text-anchor="middle" fill="#1c2e36">test data: 200</text>
<g data-step="1">
<text x="860.0" y="100" font-size="13" font-weight="normal" text-anchor="middle" fill="#556268">kept apart, not opened</text>
</g>
<g data-step="2">
<rect class="accent-fill" x="42.0" y="118" width="140.0" height="15" rx="2" fill="#00609c"/>
<rect x="186.0" y="118" width="140.0" height="15" rx="2" fill="#e9edf0"/>
<rect x="330.0" y="118" width="140.0" height="15" rx="2" fill="#e9edf0"/>
<rect x="474.0" y="118" width="140.0" height="15" rx="2" fill="#e9edf0"/>
<rect x="618.0" y="118" width="140.0" height="15" rx="2" fill="#e9edf0"/>
<rect x="42.0" y="138" width="140.0" height="15" rx="2" fill="#e9edf0"/>
<rect class="accent-fill" x="186.0" y="138" width="140.0" height="15" rx="2" fill="#00609c"/>
<rect x="330.0" y="138" width="140.0" height="15" rx="2" fill="#e9edf0"/>
<rect x="474.0" y="138" width="140.0" height="15" rx="2" fill="#e9edf0"/>
<rect x="618.0" y="138" width="140.0" height="15" rx="2" fill="#e9edf0"/>
<rect x="42.0" y="158" width="140.0" height="15" rx="2" fill="#e9edf0"/>
<rect x="186.0" y="158" width="140.0" height="15" rx="2" fill="#e9edf0"/>
<rect class="accent-fill" x="330.0" y="158" width="140.0" height="15" rx="2" fill="#00609c"/>
<rect x="474.0" y="158" width="140.0" height="15" rx="2" fill="#e9edf0"/>
<rect x="618.0" y="158" width="140.0" height="15" rx="2" fill="#e9edf0"/>
<rect x="42.0" y="178" width="140.0" height="15" rx="2" fill="#e9edf0"/>
<rect x="186.0" y="178" width="140.0" height="15" rx="2" fill="#e9edf0"/>
<rect x="330.0" y="178" width="140.0" height="15" rx="2" fill="#e9edf0"/>
<rect class="accent-fill" x="474.0" y="178" width="140.0" height="15" rx="2" fill="#00609c"/>
<rect x="618.0" y="178" width="140.0" height="15" rx="2" fill="#e9edf0"/>
<rect x="42.0" y="198" width="140.0" height="15" rx="2" fill="#e9edf0"/>
<rect x="186.0" y="198" width="140.0" height="15" rx="2" fill="#e9edf0"/>
<rect x="330.0" y="198" width="140.0" height="15" rx="2" fill="#e9edf0"/>
<rect x="474.0" y="198" width="140.0" height="15" rx="2" fill="#e9edf0"/>
<rect class="accent-fill" x="618.0" y="198" width="140.0" height="15" rx="2" fill="#00609c"/>
<text x="400.0" y="236" font-size="13" font-weight="normal" text-anchor="middle" fill="#1c2e36">cross-validation on the training data: compare algorithms, their settings (hyperparameters) and thresholds</text>
<text x="400.0" y="254" font-size="13" font-weight="normal" text-anchor="middle" fill="#1c2e36">and keep the best</text>
</g>
<g data-step="3">
<path d="M758,216 L758,270 L770,270" fill="none" stroke="#1c2e36" stroke-width="1.6" marker-end="url(#ah)"/>
<rect class="accent-fill" x="774" y="248" width="186" height="44" rx="8" fill="#00609c"/>
<text x="867" y="268" font-size="12" font-weight="normal" text-anchor="middle" fill="#ffffff">scored once on the test:</text>
<text x="867" y="285" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">the number to report</text>
<path d="M860.0,106 L860.0,244" fill="none" stroke="#1c2e36" stroke-width="1.4" marker-end="url(#ah)"/>
</g>
</svg>
