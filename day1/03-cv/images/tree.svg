<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- A classification tree of depth 2 fitted to the 1,000 credits of South German Credit (scikit-learn), then a random forest as many such trees on resampled credits. Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<rect class="accent-stroke" x="215.0" y="10" width="250" height="58" rx="8" fill="#ffffff" stroke="#00609c" stroke-width="1.6"/>
<text x="340" y="34" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c2e36">Checking account at 200 DM</text>
<text x="340" y="54" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c2e36">or more, or a salary for a year?</text>
<line x1="280" y1="68" x2="160" y2="110" stroke="#1c2e36" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="205" y="86" font-size="14" font-weight="normal" text-anchor="end" fill="#556268">no</text>
<line x1="400" y1="68" x2="520" y2="110" stroke="#1c2e36" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="475" y="86" font-size="14" font-weight="normal" text-anchor="start" fill="#556268">yes</text>
<rect class="accent-stroke" x="35.0" y="112" width="250" height="58" rx="8" fill="#ffffff" stroke="#00609c" stroke-width="1.6"/>
<text x="160" y="136" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c2e36">duration over 22.5 months?</text>
<text x="160" y="156" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2e36">606 credits, 42% bad</text>
<rect class="accent-stroke" x="395.0" y="112" width="250" height="58" rx="8" fill="#ffffff" stroke="#00609c" stroke-width="1.6"/>
<text x="520" y="136" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c2e36">amount over 3,891 DM?</text>
<text x="520" y="156" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2e36">394 credits, 12% bad</text>
<line x1="120" y1="170" x2="68" y2="214" stroke="#1c2e36" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="56" y="196" font-size="13" font-weight="normal" text-anchor="end" fill="#556268">no</text>
<rect class="accent-stroke" x="-2.0" y="216" width="140" height="58" rx="8" fill="#ffffff" stroke="#00609c" stroke-width="1.6"/>
<text x="68" y="240" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c2e36">349 credits</text>
<text x="68" y="260" font-size="15" font-weight="normal" text-anchor="middle" fill="#1c2e36">33% bad</text>
<line x1="200" y1="170" x2="252" y2="214" stroke="#1c2e36" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="264" y="196" font-size="13" font-weight="normal" text-anchor="start" fill="#556268">yes</text>
<rect class="accent-stroke" x="182.0" y="216" width="140" height="58" rx="8" fill="#ffffff" stroke="#00609c" stroke-width="1.6"/>
<text x="252" y="240" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c2e36">257 credits</text>
<text x="252" y="260" font-size="15" font-weight="normal" text-anchor="middle" fill="#1c2e36">54% bad</text>
<line x1="480" y1="170" x2="428" y2="214" stroke="#1c2e36" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="416" y="196" font-size="13" font-weight="normal" text-anchor="end" fill="#556268">no</text>
<rect class="accent-stroke" x="358.0" y="216" width="140" height="58" rx="8" fill="#ffffff" stroke="#00609c" stroke-width="1.6"/>
<text x="428" y="240" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c2e36">301 credits</text>
<text x="428" y="260" font-size="15" font-weight="normal" text-anchor="middle" fill="#1c2e36">8% bad</text>
<line x1="560" y1="170" x2="612" y2="214" stroke="#1c2e36" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="624" y="196" font-size="13" font-weight="normal" text-anchor="start" fill="#556268">yes</text>
<rect class="accent-stroke" x="542.0" y="216" width="140" height="58" rx="8" fill="#ffffff" stroke="#00609c" stroke-width="1.6"/>
<text x="612" y="240" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c2e36">93 credits</text>
<text x="612" y="260" font-size="15" font-weight="normal" text-anchor="middle" fill="#1c2e36">23% bad</text>
<g data-step="2">
<line x1="700" y1="150" x2="734" y2="150" stroke="#1c2e36" stroke-width="1.6" marker-end="url(#ah)"/>
<rect class="accent-stroke" x="740" y="60" width="252" height="190" rx="10" fill="#ffffff" stroke="#00609c" stroke-width="1.6"/>
<circle class="accent-fill" cx="786" cy="96" r="9" fill="#00609c"/>
<line x1="786" y1="105" x2="766" y2="128" stroke="#1c2e36" stroke-width="1.6"/>
<line x1="786" y1="105" x2="806" y2="128" stroke="#1c2e36" stroke-width="1.6"/>
<circle cx="766" cy="134" r="7" fill="#8cb3cf" class="accent-a-light-fill"/>
<circle cx="806" cy="134" r="7" fill="#8cb3cf" class="accent-a-light-fill"/>
<circle class="accent-fill" cx="866" cy="96" r="9" fill="#00609c"/>
<line x1="866" y1="105" x2="846" y2="128" stroke="#1c2e36" stroke-width="1.6"/>
<line x1="866" y1="105" x2="886" y2="128" stroke="#1c2e36" stroke-width="1.6"/>
<circle cx="846" cy="134" r="7" fill="#8cb3cf" class="accent-a-light-fill"/>
<circle cx="886" cy="134" r="7" fill="#8cb3cf" class="accent-a-light-fill"/>
<circle class="accent-fill" cx="946" cy="96" r="9" fill="#00609c"/>
<line x1="946" y1="105" x2="926" y2="128" stroke="#1c2e36" stroke-width="1.6"/>
<line x1="946" y1="105" x2="966" y2="128" stroke="#1c2e36" stroke-width="1.6"/>
<circle cx="926" cy="134" r="7" fill="#8cb3cf" class="accent-a-light-fill"/>
<circle cx="966" cy="134" r="7" fill="#8cb3cf" class="accent-a-light-fill"/>
<text x="866" y="82" font-size="16" font-weight="normal" text-anchor="middle" fill="#556268">…</text>
<text x="866" y="172" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2e36">500 trees, each grown on</text>
<text x="866" y="190" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2e36">a resample of the credits,</text>
<text x="866" y="208" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2e36">each question from a few</text>
<text x="866" y="226" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2e36">columns drawn at random</text>
<text x="866" y="280" font-size="14" font-weight="bold" text-anchor="middle" fill="#1c2e36">the forest's P(bad): the average</text>
<text x="866" y="298" font-size="14" font-weight="bold" text-anchor="middle" fill="#1c2e36">of the 500 trees' answers</text>
</g>
</svg>
