<circle class="accent-a-light-fill" cx="402.4" cy="199.6" r="8" fill="#8cb3cf"/>
<text class="accent-fill" x="42" y="42" font-size="17" font-weight="bold" text-anchor="start" fill="#00609c">bad</text>
<text x="518" y="342" font-size="17" font-weight="bold" text-anchor="end" fill="#556268">good</text>
<text x="280.0" y="390" font-size="17" font-weight="normal" text-anchor="middle" fill="#1c2e36">the boundary: the middle of the widest band free of points</text>
<text x="280.0" y="416" font-size="17" font-weight="normal" text-anchor="middle" fill="#556268">ringed: the support vectors, the points that fix the band</text>
