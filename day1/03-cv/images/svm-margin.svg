<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- A support vector machine's margin on fourteen illustrative points: the boundary sits in the middle of the widest band free of points; the ringed points fix it. Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<defs><clipPath id="svm-plot"><rect x="30" y="16" width="500" height="340"/></clipPath></defs>
<g clip-path="url(#svm-plot)">
