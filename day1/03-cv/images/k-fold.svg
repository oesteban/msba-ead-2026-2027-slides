<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 384" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- K-fold cross-validation with five stratified folds: each fold is tested once while the model learns from the four others, and each keeps the data's 70/30 mix. Oscar Esteban, CC BY 4.0. -->
