# CRISP-DM organises a project in six phases

.pull-left[
<img src="images/crisp-dm-cycle.png" style="width: 92%;" alt="The CRISP-DM cycle: six phases around the data, inside a circle of arrows" />
]

.pull-right[
<br />

**CRISP-DM**: the *Cross-Industry Standard Process for Data Mining*.

The **inner arrows** are the most frequent moves between phases, not a fixed order.

The **outer circle**: a deployed model raises new business questions, and the cycle starts again.
]

.footnote[Diagram: Kenneth Jensen, based on IBM SPSS Modeler CRISP-DM documentation, .lic[CC BY-SA 3.0, via Wikimedia Commons]. Model: P. Chapman et al. (2000), *CRISP-DM 1.0*, Fig. 2, p. 13. <br /> .book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), Fig. 2-2, p. 27]]

.boxed-content.center[
<object type="image/svg+xml" data="images/kdd-to-crisp.svg" style="width: 100%; padding-top: 30pt; pointer-events: none;"></object>

# Drawn as a line, the cycle shows where to stop

.pull-left[
<object type="image/svg+xml" data="images/crisp-linear.svg" style="height: 540px; pointer-events: none;"></object>
]

.pull-right[
<br />

Three gates, each a task of CRISP-DM 1.0:

- **Verify data quality** (task 2.4): can these data answer the question?
- **Assess model** (task 4.4): is it worth preparing the data again?
- **Determine next steps** (task 5.3): deploy, turn again, or stop.

The last step of the build names the Dataiku screen of each phase.
]

.footnote[Phases and tasks: P. Chapman et al. (2000), *CRISP-DM 1.0*, pp. 13 to 31. Gates adapted from D. Genoud's 2025 flowchart.]

# Expect several turns of the cycle

.cards.cols-3.vcenter[
.card.accent[
.kicker[the rule]

### Iterate

A first pass that does not solve the problem is not a failure: it is information for the next one.
]
.card[
.kicker[inside the cycle]

### Loops within the loop

Business and data understanding go back and forth before any model is trained.
]
.card[
.kicker[a plan from practice]

### Three turns

The second takes about half the time of the first, the third about a quarter.
]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 27 to 28 and 34.] Three turns: R. Wirth and J. Hipp (2000), response modelling at DaimlerChrysler.]

# People, not tools, decide at five points

.data-table.people[
| Phase | What a person has to do | |
|---|---|---|
| Business understanding | Formulate the problem: what to predict, for which decision | p. 28 |
| Data understanding | Judge what each data source costs and what it is worth | pp. 28 to 29 |
| Data preparation | Define the variables, and spot the ones that leak the answer | p. 30 |
| Evaluation | Check the business goal, not only the model; get the stakeholders to sign off | pp. 31 to 32 |
| Deployment | Have the model rebuilt for production by engineers | p. 33 |
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 19 and 28 to 33.]]

# The data: 1,000 credits from a bank, 1973 to 1975

.cards.cols-4.vcenter[
.card[
.kicker[credits]

.metric[1,000]

Each row is one credit a south German bank granted, with how it ended.
]
.card.accent[
.kicker[bad credits]

.metric[300]

`credit_risk` is `bad`: the contract was not complied with. 700 are `good`.
]
.card.alert[
.kicker[by design]

.metric[30%]

Bad credits were over-sampled: in the bank's portfolio, about 5% went bad.
]
.card[
.kicker[attributes]

.metric[20]

Account, history, purpose, amount, savings, job, age, ... Refused applicants are absent.
]
]

.footnote[U. Grömping (2019), *South German Credit Data: Correcting a Widely Used Data Set*, Report 4/2019, Beuth Hochschule für Technik Berlin. UCI Machine Learning Repository, dataset 573, .lic[CC BY 4.0].]

# A famous dataset was miscoded for 25 years

.cards.cols-3.vcenter[
.card[
.kicker[1994]

### Published

As "Statlog German Credit", with a code table that swapped the categories of 8 of its 20 columns.
]
.card.alert[
.kicker[the symptoms]

### Implausible

963 debtors out of 1,000 were foreign workers (really 37); no single women; having no checking account looked like a good sign.
]
.card.accent[
.kicker[2019]

### Corrected

Grömping traced the data back to the bank's sample and fixed the code table. Today's file is the corrected one.
]
]

.admonition.question[
<i class="fa-solid fa-circle-question"></i> Data understanding is a phase of the project, not a formality before it.
]

.footnote[U. Grömping (2019), Report 4/2019, Beuth Hochschule für Technik Berlin, pp. 2 to 7.]

# Credit scoring is classification, with a probability

.pull-left.tasks[
<ol>
<li class="on">Classification and class probability estimation</li>
<li>Regression</li>
<li>Similarity matching</li>
<li>Clustering</li>
<li>Co-occurrence grouping</li>
<li>Profiling</li>
<li>Link prediction</li>
<li>Data reduction</li>
<li>Causal modeling</li>
</ol>
]

.pull-right[
<br />

**Supervised**: a target exists, and past cases carry its value. Here, `credit_risk`.

**Classification**: the target is a category, `good` or `bad`.

**With a probability**: the bank needs how likely `bad` is, not only a label.
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), the nine tasks pp. 19 to 22; supervised and unsupervised pp. 24 to 25.]]

# Hands-on 1: explore, train, look, note

.boxed-content.large[
**The need.** The bank asks whether a model could help it decide. Before anyone explains how to judge a model, look at one.

**What you do.** Explore the credits, train a first model with Dataiku's defaults, open its results, and write three notes on what you see or cannot explain yet.

**How.** Sheet *Hands-on 1*, panels 1 to 3. Groups of three. 40 minutes.
]

.cards.cols-3[
.card[
.kicker[keyboard]

### Driver

Works Dataiku; says what each screen shows before clicking on.
]
.card[
.kicker[sheet]

### Mapper

Writes the answers and places each note on a phase of the map.
]
.card.accent[
.kicker[voice]

### Referee

Checks each step, challenges each conclusion, speaks for the group.
]
]
