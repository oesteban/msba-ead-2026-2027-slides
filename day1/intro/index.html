# Data mining + business

.pull-left[
<img src="images/crisp-dm-cycle.png" style="width: 92%;" alt="The CRISP-DM cycle: six phases around the data, inside a circle of arrows" />
]

.pull-right[
<br />

**CRISP-DM**: the *Cross-Industry Standard Process for Data Mining*.

**Business understanding** comes first: the question, before any data.

**Deployment** closes the cycle: the *use* of the model, the half of slide 3 that KDD left out.

The **inner arrows** are the frequent moves, not a fixed order; the **outer circle** starts the next turn.
]

.footnote[Diagram: Kenneth Jensen, based on IBM SPSS Modeler CRISP-DM documentation, .lic[CC BY-SA 3.0, via Wikimedia Commons]. Model: P. Chapman et al. (2000), *CRISP-DM 1.0*, Fig. 2, p. 13. <br /> .book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), Fig. 2-2, p. 27]]

???

class: stepwise-svg

# Drawn as a line, the cycle shows where to stop

.pull-left[
<object type="image/svg+xml" data="images/crisp-linear.svg" style="height: 540px; pointer-events: none;"></object>
]

.pull-right[
<br />

Three gates, each a task of CRISP-DM 1.0:

- **Verify data quality** (task 2.4): can these data answer the question?
- **Assess model** (task 4.4): is it worth preparing the data again?
- **Determine next steps** (task 5.3): deploy, turn again, or stop.

The last step of the build names the Dataiku screen of each phase.
]

.footnote[Phases and tasks: P. Chapman et al. (2000), *CRISP-DM 1.0*, pp. 13 to 31. Gates adapted from D. Genoud's 2025 flowchart.]

# The bank's canvas: the decision before the data

<img class="phase-thumb" src="images/phase-bu.svg" alt="The CRISP-DM phases, business understanding lit" />

.beside-thumb[
<div class="ml-canvas">
<div class="pt predict"><h4>PREDICTION TASK</h4><p class="step-4">Will this credit go bad? Two classes, and a probability for each application.</p></div>
<div class="dec predict"><h4>DECISIONS</h4><p class="step-4">Grant or refuse the application.</p></div>
<div class="vp goal"><h4>VALUE PROPOSITION</h4><p class="step-1">The credit committee refuses fewer good customers and grants fewer credits that go bad.</p></div>
<div class="col learn"><h4>DATA COLLECTION</h4><p class="step-2">Each credit's outcome is known only when it ends, repaid or not.</p></div>
<div class="src learn"><h4>DATA SOURCES</h4><p class="step-2">The bank's past credits: the application, the accounts, how each credit ended.</p></div>
<div class="imp predict"><h4>IMPACT SIMULATION</h4><p class="step-4">Price the two errors: next slide.</p></div>
<div class="mak predict"><h4>MAKING PREDICTIONS</h4><p class="step-4">For each application, before the committee decides.</p></div>
<div class="bld learn"><h4>BUILDING MODELS</h4><p class="step-4">Learned from the past credits, again as new outcomes arrive.</p></div>
<div class="fea learn"><h4>FEATURES</h4><p class="step-3">What the bank knows at the application: accounts, duration, purpose, amount, savings, age, ...</p></div>
<div class="mon evaluate"><h4>MONITORING</h4><p class="step-5">Count the credits that went bad and the good customers refused, as credits end.</p></div>
</div>
]

.footnote[Canvas: after L. Dorard, *The Machine Learning Canvas* v1.1 (ownml.co), .lic[CC BY-SA 4.0], filled for the bank in the order of the phases on slide 7.]

<img class="phase-thumb" src="images/phase-du.svg" alt="The CRISP-DM phases, data understanding lit" />

.beside-thumb.terms[
<table>
<tr><th>status</th><th>duration</th><th>purpose</th><th>amount</th><th>savings</th><th>age</th><th>...</th><th class="tgt">credit_risk</th></tr>
<tr><td>no checking account</td><td>18</td><td>car (used)</td><td>1049</td><td>unknown or none</td><td>21</td><td>...</td><td class="tgt">good</td></tr>
<tr><td>no checking account</td><td>9</td><td>others</td><td>2799</td><td>unknown or none</td><td>36</td><td>...</td><td class="tgt">good</td></tr>
<tr><td>below 0 DM</td><td>12</td><td>retraining</td><td>841</td><td>below 100 DM</td><td>23</td><td>...</td><td class="tgt">good</td></tr>
<tr><td>below 0 DM</td><td>36</td><td>domestic appliances</td><td>2384</td><td>unknown or none</td><td>33</td><td>...</td><td class="tgt">bad</td></tr>
<tr><td>no checking account</td><td>18</td><td>others</td><td>1216</td><td>unknown or none</td><td>23</td><td>...</td><td class="tgt">bad</td></tr>

<div class="legend step-1">
<div><b>A row, an instance</b>: one credit the bank granted.</div>
<div><b>A column, an attribute</b>: what the bank knew when it decided.</div>

<div><span class="num">1,000</span>credits from a south German bank, 1973 to 1975, with 20 attributes.</div>

# Hands-on 1: explore, train, look, note

<img class="phase-thumb" src="images/phase-du-mo.svg" alt="The CRISP-DM phases, data understanding to modeling lit" />

.beside-thumb[
.need[**The need.** The bank asks whether a model could help it decide. Before anyone explains how to judge a model, look at one.]

<div class="moves">
<div><b>1. Explore</b>The credits, and how many went bad.<br /><code>Dataset → Explore, Charts</code></div>
<div><b>2. Train</b>A first model, with Dataiku's defaults.<br /><code>Lab → AutoML Prediction</code></div>
<div><b>3. Look</b>Its results: what does each screen show?<br /><code>Results → model</code></div>
<div><b>4. Note</b>Three things you see, or cannot explain yet.<br />On the sheet</div>
</div>

<div class="roles">
<div><b>Driver</b>: works Dataiku; says what each screen shows before clicking on.</div>
<div><b>Mapper</b>: writes the answers and places each note on a phase of the map.</div>
<div><b>Referee</b>: checks each step, challenges each conclusion, speaks for the group.</div>
</div>

.need[Sheet *Hands-on 1*, panels 1 to 3. Groups of three. 40 minutes.]
