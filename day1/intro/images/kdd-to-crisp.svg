<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 280" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- KDD steps after Fayyad, Piatetsky-Shapiro and Smyth (1996), Fig. 1; CRISP-DM phases after Chapman et al. (2000). Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<text x="30" y="40" font-size="15" font-weight="bold" text-anchor="start" fill="#556268">Knowledge Discovery in Databases (KDD), after Fayyad et al. 1996</text>
<rect x="80" y="64" width="72" height="44" rx="22" fill="#f3f3f3" stroke="#556268" stroke-width="1.6"/>
<text x="116" y="92" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2e36">Data</text>
<rect x="970" y="64" width="96" height="44" rx="22" fill="#f3f3f3" stroke="#556268" stroke-width="1.6"/>
<text x="1018" y="92" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2e36">Knowledge</text>
<rect x="180" y="58" width="128" height="56" rx="8" fill="#ffffff" stroke="#556268" stroke-width="1.3"/>
<text x="244" y="92" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2e36">Selection</text>
<rect x="338" y="58" width="128" height="56" rx="8" fill="#ffffff" stroke="#556268" stroke-width="1.3"/>
<text x="402" y="92" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2e36">Preprocessing</text>
<rect x="496" y="58" width="128" height="56" rx="8" fill="#ffffff" stroke="#556268" stroke-width="1.3"/>
<text x="560" y="92" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2e36">Transformation</text>
<rect x="654" y="58" width="128" height="56" rx="8" fill="#ffffff" stroke="#556268" stroke-width="1.3"/>
<text x="718" y="92" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2e36">Data mining</text>
<rect x="812" y="58" width="128" height="56" rx="8" fill="#ffffff" stroke="#556268" stroke-width="1.3"/>
<text x="876" y="82" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2e36">Interpretation /</text>
<text x="876" y="100" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2e36">evaluation</text>
<line x1="152" y1="86" x2="178" y2="86" stroke="#556268" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="308" y1="86" x2="336" y2="86" stroke="#556268" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="466" y1="86" x2="494" y2="86" stroke="#556268" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="624" y1="86" x2="652" y2="86" stroke="#556268" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="782" y1="86" x2="810" y2="86" stroke="#556268" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="940" y1="86" x2="968" y2="86" stroke="#556268" stroke-width="1.3" marker-end="url(#ah)"/>
</g>
<g data-step="2">
<text x="560" y="254" font-size="15" font-weight="bold" text-anchor="middle" fill="#556268">CRISP-DM (Chapman et al. 2000)</text>
<rect class="accent-stroke" x="180" y="172" width="128" height="50" rx="8" fill="#ffffff" stroke="#00609c" stroke-width="1.6"/>
<text x="244.0" y="193" font-size="14" font-weight="bold" text-anchor="middle" fill="#1c2e36">Data</text>
<text x="244.0" y="211" font-size="14" font-weight="bold" text-anchor="middle" fill="#1c2e36">understanding</text>
<rect class="accent-stroke" x="417" y="172" width="128" height="50" rx="8" fill="#ffffff" stroke="#00609c" stroke-width="1.6"/>
<text x="481.0" y="193" font-size="14" font-weight="bold" text-anchor="middle" fill="#1c2e36">Data</text>
<text x="481.0" y="211" font-size="14" font-weight="bold" text-anchor="middle" fill="#1c2e36">preparation</text>
<rect class="accent-stroke" x="654" y="172" width="128" height="50" rx="8" fill="#ffffff" stroke="#00609c" stroke-width="1.6"/>
<text x="718.0" y="202" font-size="14" font-weight="bold" text-anchor="middle" fill="#1c2e36">Modeling</text>
<rect class="accent-stroke" x="812" y="172" width="128" height="50" rx="8" fill="#ffffff" stroke="#00609c" stroke-width="1.6"/>
<text x="876.0" y="202" font-size="14" font-weight="bold" text-anchor="middle" fill="#1c2e36">Evaluation</text>
<line x1="244" y1="116" x2="244" y2="169" stroke="#556268" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="402" y1="116" x2="481" y2="169" stroke="#556268" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="560" y1="116" x2="481" y2="169" stroke="#556268" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="718" y1="116" x2="718" y2="169" stroke="#556268" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="876" y1="116" x2="876" y2="169" stroke="#556268" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="308" y1="197" x2="415" y2="197" stroke="#1c2e36" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="545" y1="197" x2="652" y2="197" stroke="#1c2e36" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="782" y1="197" x2="810" y2="197" stroke="#1c2e36" stroke-width="1.6" marker-end="url(#ah)"/>
</g>
<g data-step="3">
<rect class="accent-stroke" x="6" y="12" width="1068" height="262" rx="18" fill="none" stroke="#00609c" stroke-width="2.4" stroke-dasharray="8 5"/>
<rect x="460" y="1" width="160" height="24" rx="4" fill="#ffffff"/>
<text class="accent-fill" x="540" y="19" font-size="16" font-weight="bold" text-anchor="middle" fill="#00609c">the business</text>
<rect class="accent-fill" x="30" y="172" width="136" height="50" rx="8" fill="#00609c" stroke="#00609c" stroke-width="1.6"/>
<text x="98.0" y="193" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Business</text>
<text x="98.0" y="211" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">understanding</text>
<rect class="accent-fill" x="950" y="172" width="116" height="50" rx="8" fill="#00609c" stroke="#00609c" stroke-width="1.6"/>
<text x="1008.0" y="202" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Deployment</text>
<line x1="166" y1="197" x2="178" y2="197" stroke="#1c2e36" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="940" y1="197" x2="948" y2="197" stroke="#1c2e36" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="accent-fill" x="98" y="244" font-size="14" font-weight="bold" text-anchor="middle" fill="#00609c">the question,</text>
<text class="accent-fill" x="98" y="262" font-size="14" font-weight="normal" text-anchor="middle" fill="#00609c">before the data</text>
<text class="accent-fill" x="1008" y="244" font-size="14" font-weight="bold" text-anchor="middle" fill="#00609c">the use of</text>
<text class="accent-fill" x="1008" y="262" font-size="14" font-weight="normal" text-anchor="middle" fill="#00609c">the model</text>
</g>
</svg>
