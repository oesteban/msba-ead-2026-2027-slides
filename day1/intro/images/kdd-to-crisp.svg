<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 310" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- KDD steps after Fayyad, Piatetsky-Shapiro and Smyth (1996), Fig. 1; CRISP-DM phases after Chapman et al. (2000). Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<text x="20" y="24" font-size="15" font-weight="bold" text-anchor="start" fill="#556268">Knowledge Discovery in Databases (KDD), the figure (Fayyad et al. 1996)</text>
<rect x="80" y="50" width="72" height="44" rx="22" fill="#f3f3f3" stroke="#556268" stroke-width="1.6"/>
<text x="116" y="78" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2e36">Data</text>
<rect x="970" y="50" width="96" height="44" rx="22" fill="#f3f3f3" stroke="#556268" stroke-width="1.6"/>
<text x="1018" y="78" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2e36">Knowledge</text>
<rect x="180" y="44" width="128" height="56" rx="8" fill="#ffffff" stroke="#556268" stroke-width="1.3"/>
<text x="244" y="78" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2e36">Selection</text>
<rect x="338" y="44" width="128" height="56" rx="8" fill="#ffffff" stroke="#556268" stroke-width="1.3"/>
<text x="402" y="78" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2e36">Preprocessing</text>
<rect x="496" y="44" width="128" height="56" rx="8" fill="#ffffff" stroke="#556268" stroke-width="1.3"/>
<text x="560" y="78" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2e36">Transformation</text>
<rect x="654" y="44" width="128" height="56" rx="8" fill="#ffffff" stroke="#556268" stroke-width="1.3"/>
<text x="718" y="78" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2e36">Data mining</text>
<rect x="812" y="44" width="128" height="56" rx="8" fill="#ffffff" stroke="#556268" stroke-width="1.3"/>
<text x="876" y="68" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2e36">Interpretation /</text>
<text x="876" y="86" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2e36">evaluation</text>
<line x1="152" y1="72" x2="178" y2="72" stroke="#556268" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="308" y1="72" x2="336" y2="72" stroke="#556268" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="466" y1="72" x2="494" y2="72" stroke="#556268" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="624" y1="72" x2="652" y2="72" stroke="#556268" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="782" y1="72" x2="810" y2="72" stroke="#556268" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="940" y1="72" x2="968" y2="72" stroke="#556268" stroke-width="1.3" marker-end="url(#ah)"/>
</g>
<g data-step="2">
<text x="20" y="186" font-size="15" font-weight="bold" text-anchor="start" fill="#556268">CRISP-DM (Chapman et al. 2000)</text>
<rect class="accent-stroke" x="180" y="200" width="128" height="56" rx="8" fill="#ffffff" stroke="#00609c" stroke-width="1.6"/>
<text x="244.0" y="224" font-size="14" font-weight="bold" text-anchor="middle" fill="#1c2e36">Data</text>
<text x="244.0" y="242" font-size="14" font-weight="bold" text-anchor="middle" fill="#1c2e36">understanding</text>
<rect class="accent-stroke" x="417" y="200" width="128" height="56" rx="8" fill="#ffffff" stroke="#00609c" stroke-width="1.6"/>
<text x="481.0" y="224" font-size="14" font-weight="bold" text-anchor="middle" fill="#1c2e36">Data</text>
<text x="481.0" y="242" font-size="14" font-weight="bold" text-anchor="middle" fill="#1c2e36">preparation</text>
<rect class="accent-stroke" x="654" y="200" width="128" height="56" rx="8" fill="#ffffff" stroke="#00609c" stroke-width="1.6"/>
<text x="718.0" y="233" font-size="14" font-weight="bold" text-anchor="middle" fill="#1c2e36">Modeling</text>
<rect class="accent-stroke" x="812" y="200" width="128" height="56" rx="8" fill="#ffffff" stroke="#00609c" stroke-width="1.6"/>
<text x="876.0" y="233" font-size="14" font-weight="bold" text-anchor="middle" fill="#1c2e36">Evaluation</text>
<line x1="244" y1="102" x2="244" y2="197" stroke="#556268" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="402" y1="102" x2="481" y2="197" stroke="#556268" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="560" y1="102" x2="481" y2="197" stroke="#556268" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="718" y1="102" x2="718" y2="197" stroke="#556268" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="876" y1="102" x2="876" y2="197" stroke="#556268" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="308" y1="228" x2="415" y2="228" stroke="#1c2e36" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="545" y1="228" x2="652" y2="228" stroke="#1c2e36" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="782" y1="228" x2="810" y2="228" stroke="#1c2e36" stroke-width="1.6" marker-end="url(#ah)"/>
</g>
<g data-step="3">
<rect class="accent-fill" x="30" y="200" width="136" height="56" rx="8" fill="#00609c" stroke="#00609c" stroke-width="1.6"/>
<text x="98.0" y="224" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Business</text>
<text x="98.0" y="242" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">understanding</text>
<rect class="accent-fill" x="950" y="200" width="116" height="56" rx="8" fill="#00609c" stroke="#00609c" stroke-width="1.6"/>
<text x="1008.0" y="233" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Deployment</text>
<line x1="166" y1="228" x2="178" y2="228" stroke="#1c2e36" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="940" y1="228" x2="948" y2="228" stroke="#1c2e36" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="accent-fill" x="98" y="280" font-size="14" font-weight="bold" text-anchor="middle" fill="#00609c">added: the business</text>
<text class="accent-fill" x="98" y="298" font-size="14" font-weight="normal" text-anchor="middle" fill="#00609c">question, before the data</text>
<text class="accent-fill" x="1008" y="280" font-size="14" font-weight="bold" text-anchor="middle" fill="#00609c">added: acting on</text>
<text class="accent-fill" x="1008" y="298" font-size="14" font-weight="normal" text-anchor="middle" fill="#00609c">what was learned</text>
</g>
</svg>
