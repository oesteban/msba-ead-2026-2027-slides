# What is a good model?

.large[Good for the decision it serves, not only good on the data.]

.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), chapter 7, p. 187]
]

???

---
class: stepwise-svg

# Dataiku ranks the models by one number

<img class="phase-thumb" src="images/phase-mo.svg" alt="The CRISP-DM phases, modeling lit" />

.beside-thumb[
<object type="image/svg+xml" data="images/results-capture.svg" style="width: 74%; display: block; margin: 0.2em auto 0; pointer-events: none;"></object>

<div class="marks3">
<div class="step-1"><b>1 ROC AUC</b>: how well the scores rank the bad credits above the good ones; 0.5 is chance (slide 16).</div>
<div class="step-2"><b>2 0.702</b>: the score that put this model first.</div>
<div class="step-3"><b>3 ± 0.049</b>: how much that score moves from one test set to another (next deck).</div>
</div>

.step-3[
Three questions for this deck and the next: what does a score say about the bank's decision? Which model, at which threshold? How far can the number be trusted?
]
]

.footnote[Screen capture: Dataiku DSS, course server, 14 October 2026, cropped. The questions after D. Genoud (2025), *Hands-on ML*, p. 3. The numbers on the next slides come from another run (scikit-learn, all 20 attributes) and differ.]

???

---
class: stepwise-svg

# A classifier ends in a decision rule

<img class="phase-thumb" src="images/phase-mo.svg" alt="The CRISP-DM phases, modeling lit" />

.beside-thumb[
<object type="image/svg+xml" data="images/decision-rule.svg" style="width: 100%; padding-top: 10pt; pointer-events: none;"></object>

.step-4[In Dataiku, **Results → model → Predicted data** shows both probabilities and the class, row by row.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 26, 188 and 209 to 210.] The attributes are row 1 of the course file; the probability is an example.]

???

---
class: stepwise-svg

# In the inputs, a threshold draws a boundary

<img class="phase-thumb" src="images/phase-mo.svg" alt="The CRISP-DM phases, modeling lit" />

.beside-thumb[
.col-wide[
<object type="image/svg+xml" data="images/boundary.svg" style="width: 100%; pointer-events: none;"></object>
]

.col-narrow[
<br />

A **logistic regression** turns the attributes into P(bad) through one weighted sum. This one uses two of the twenty: duration and amount.

.step-2[Where P(bad) = 0.5, a line splits the applicants: refused to its right.]

.step-3[A lower threshold moves the line: 421 refused instead of 66.]

With twenty attributes the line cannot be drawn; the threshold on the score still places it.
]
]

.footnote[Fitted on all 1,000 credits of the course file, to show a boundary, not to score. .book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 83 to 85 and 97 to 98.]]

???

---

# Name the positive class first

<img class="phase-thumb" src="images/phase-mo.svg" alt="The CRISP-DM phases, modeling lit" />

.beside-thumb[
.cards.cols-2[
.card.accent[
.kicker[positive]

### bad

The class worth attention: the bank acts on it, by refusing. Precision and recall are always *about* this class.
]
.card.muted[
.kicker[negative]

### good

The benign class: the credit is granted.
]
]

<div class="check">
<b><i class="fa-solid fa-triangle-exclamation"></i>Check it in Dataiku before reading any number.</b> The <b>cut-off</b>, Dataiku's word for the threshold, applies to the probability of the class Dataiku takes as positive.
<ol>
<li><b>Results → model → Predicted data</b>: the columns <code>proba_bad</code> and <code>proba_good</code> hold the two probabilities, <code>prediction</code> the class.</li>
<li>Find a row whose <code>proba_bad</code> is just above the cut-off. If it is predicted <code>bad</code>, <i>bad</i> is the positive class.</li>
</ol>
</div>
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), p. 188.] Screen path: Dataiku DSS, course server.]

???

---
class: stepwise-svg

# A threshold turns probabilities into decisions

<img class="phase-thumb" src="images/phase-mo.svg" alt="The CRISP-DM phases, modeling lit" />

.beside-thumb[
.col-wide[
<object type="image/svg+xml" data="images/threshold-regions.svg" style="width: 100%; pointer-events: none;"></object>
]

.col-narrow.cm[
<div class="step-4">
<table>
<thead><tr><th>at 0.5</th><th>refused</th><th>granted</th></tr></thead>
<tbody>
<tr><th>was bad (300)</th><td class="tp">95<small>true positives</small></td><td class="fn">205<small>false negatives</small></td></tr>
<tr><th>was good (700)</th><td class="fp">40<small>false positives</small></td><td class="tn">660<small>true negatives</small></td></tr>
</tbody>
</table>

<p>The confusion matrix: each credit counted once, by what it was and what the bank decided.</p>

<p>At 0.5, bad is the more probable class.</p>
</div>
]
]

.footnote[Scores of credits the model did not learn from (a random forest, scikit-learn, South German Credit). .book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 189 to 190 and 210.]]

???

---

# Start with the baseline

<img class="phase-thumb" src="images/phase-mo.svg" alt="The CRISP-DM phases, modeling lit" />

.beside-thumb[
.cards.cols-2[
.card.muted[
.kicker[grant every credit]

.metric[70.0%]

right, with no model at all: 700 of the 1,000 credits were good.
]
.card[
.kicker[the model, threshold 0.5]

.metric[75.5%]

right: (95 + 660) / 1,000.
]
]

**Accuracy** = (TP + TN) / all credits: the share of right decisions. It rewards the majority class, so report it **next to the baseline**, or not at all.
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 189 to 191 and 204 to 205.]]

???

---

# Each metric answers one business question

<img class="phase-thumb" src="images/phase-mo.svg" alt="The CRISP-DM phases, modeling lit" />

.beside-thumb.metrics[
<table>
<thead><tr><th></th><th>metric</th><th>business question</th><th>formula</th><th>at 0.5</th></tr></thead>
<tbody>
<tr class="step-1"><td><span class="mini"><i class="n"></i><i></i><i class="d"></i><i></i></span></td><td><b>precision</b></td><td>Of the applicants refused, how many were bad?</td><td>TP / (TP + FP)</td><td class="num">95 / 135 = 70%</td></tr>
<tr class="step-2"><td><span class="mini"><i class="n"></i><i class="d"></i><i></i><i></i></span></td><td><b>recall</b></td><td>Of the bad applicants, how many were refused?</td><td>TP / (TP + FN)</td><td class="num">95 / 300 = 32%</td></tr>
<tr class="step-3"><td><span class="mini"><i class="n"></i><i class="d"></i><i class="d"></i><i></i></span></td><td><b>F1</b></td><td>One number for the two above, their harmonic mean</td><td>2 P R / (P + R)</td><td class="num">0.44</td></tr>
<tr class="step-4"><td><span class="mini"><i></i><i></i><i class="n"></i><i class="d"></i></span></td><td><b>false-positive rate</b></td><td>Of the good applicants, how many were refused?</td><td>FP / (FP + TN)</td><td class="num">40 / 700 = 5.7%</td></tr>
</tbody>
</table>

.step-4[Each square is the matrix of the previous slide: dark, the cells counted; light, the cells added below the line.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 203 to 204.] TP, FP, FN, TN: true positives, false positives, false negatives, true negatives.]

???

# Moving the threshold trades precision for recall

<img class="phase-thumb" src="images/phase-mo.svg" alt="The CRISP-DM phases, modeling lit" />

.beside-thumb[
<img src="images/threshold-tradeoff.svg" style="width: 82%; display: block; margin: 0.2em auto 0;" alt="Precision rises and recall falls as the threshold on P(bad) rises" />

Dataiku moves its cut-off to the value that maximises one metric, chosen in **Design → Metrics** (*Optimize threshold for*). That is why the cut-off of panel 3 was not 0.5.
]

.footnote[The same scores as slide 6, at every threshold from 0.02 to 0.98. Dataiku draws the same curves under **Performance → Decision chart**.]

???

# Hands-on 1, continued: move the threshold

<img class="phase-thumb" src="images/phase-mo.svg" alt="The CRISP-DM phases, modeling lit" />

.beside-thumb[
.need[**The need.** Before it approves any threshold, the bank's risk committee wants to see what the model does at others.]

<div class="moves">
<div><b>1. Reopen</b>The best model of panel 3.<br /><code>Results → model → Performance → Confusion matrix</code></div>
<div><b>2. Move</b>The cut-off to 0.2, then 0.5, then 0.8.<br />The slider above the table</div>
<div><b>3. Record</b>The four counts, precision and recall, for each.<br />Sheet, panel 4</div>
</div>

.need[Groups of three, same roles. 10 minutes.]
]

???

# Which threshold would you put in production?

<img class="phase-thumb" src="images/phase-ev.svg" alt="The CRISP-DM phases, evaluation lit" />

.beside-thumb[
<br />

.large[Each group: one threshold from panel 4, and one reason.]

<br />

.admonition.question[
<i class="fa-solid fa-circle-question"></i> And why can't the model tell you?
]
]

???

---
class: stepwise-svg

# Two errors, two prices, now with numbers

<img class="phase-thumb" src="images/phase-ev.svg" alt="The CRISP-DM phases, evaluation lit" />

.beside-thumb[
<object type="image/svg+xml" data="images/expected-value-numbers.svg" style="width: 100%; padding-top: 8pt; pointer-events: none;"></object>

The intro deck left the two prices open. The bank's data came with them: granting a credit that goes bad costs **five times** more than refusing a good customer.
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> After Provost & Fawcett (2013), Fig. 7-2, p. 197; pp. 194 to 200.] Costs: the matrix published with the Statlog German credit data (H. Hofmann, 1994, UCI dataset 144, .lic[CC BY 4.0]).]

???

---

# The costs give the threshold

<img class="phase-thumb" src="images/phase-ev.svg" alt="The CRISP-DM phases, evaluation lit" />

.beside-thumb[
.boxed-content.center.large[
Refuse when granting is expected to cost more than refusing:

.formula[
P(bad) × 5 &gt; (1 − P(bad)) × 1 &nbsp;⟺&nbsp; P(bad) &gt; 1 / (1 + 5) ≈ **0.17**
]
]

<div style="clear: both;"></div>

A **calibrated** score means what it says: of the credits scored 0.2, about one in five goes bad. The rule assumes calibrated scores. A random forest's are not, and Dataiku's *class weights*, on by default, shift them too.
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 195 to 196.] C. Elkan (2001), *The foundations of cost-sensitive learning*. Dataiku DSS 13, *Prediction settings*, weighting strategy.]

???

---

# The cost-optimal threshold halves the bill

<img class="phase-thumb" src="images/phase-ev.svg" alt="The CRISP-DM phases, evaluation lit" />

.beside-thumb[
.col-wide[
<img src="images/cost-vs-threshold.svg" style="width: 100%;" alt="Total cost against the threshold: high at 0.5, lowest near 0.2" />
]

.col-narrow[
<ul class="points">
<li>At 0.5: <b>1,065</b>.</li>
<li>At 0.21, the cheapest: <b>525</b>.</li>
<li>At 0.17, the rule's threshold: 569, because these scores are not calibrated.</li>
<li>Refuse everyone: 700, already cheaper than the model at 0.5. Lend to everyone: 1,500.</li>
</ul>
]
]

.footnote[Total cost over the 1,000 credits, at 5 per bad credit granted and 1 per good customer refused. .book[<i class="fa-solid fa-book-open"></i> After Provost & Fawcett's profit curves (2013), pp. 212 to 213.]]

???

---

# Same model, three thresholds, three businesses

<img class="phase-thumb" src="images/phase-ev.svg" alt="The CRISP-DM phases, evaluation lit" />

.beside-thumb.cm[
<table style="width: 100%;">
<thead><tr><th>threshold chosen for</th><th>t</th><th>bad refused</th><th>good refused</th><th>bad granted</th><th>cost</th></tr></thead>
<tbody>
<tr><th>the more probable class</th><td>0.50</td><td>95</td><td>40</td><td>205</td><td>1,065</td></tr>
<tr><th>the best F1</th><td>0.29</td><td>232</td><td>257</td><td>68</td><td>597</td></tr>
<tr><th>the lowest cost</th><td class="hit">0.21</td><td>272</td><td>385</td><td>28</td><td class="hit">525</td></tr>
</tbody>
</table>

<br />

.large.center[F1 weighs the two errors alike; the bank does not. Choose the metric **from** the costs.]
]

???

---

# ROC and PR curves summarise every threshold

<img class="phase-thumb" src="images/phase-mo.svg" alt="The CRISP-DM phases, modeling lit" />

.beside-thumb[
<img src="images/roc-pr.svg" style="width: 78%; display: block; margin: 0 auto;" alt="The ROC curve, AUC 0.78, and the precision-recall curve of the credit model" />

**ROC**, receiver operating characteristic: recall against the false-positive rate, one point per threshold. **AUC**, the area under it: the chance that a random bad credit scores above a random good one, 0.5 for guessing. **PR**: precision against recall; its floor is the share of bad credits, 0.30.
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 214 to 219.] In Dataiku: **Performance → ROC & PR curves**. The ROC AUC is the number of slide 2.]

???

---

# Gains answer "how many can we review?"

<img class="phase-thumb" src="images/phase-mo.svg" alt="The CRISP-DM phases, modeling lit" />

.beside-thumb[
<img src="images/cumulative-gains.svg" style="width: 62%; display: block; margin: 0 auto;" alt="Cumulative gains: the riskiest 20% of applicants hold 44% of the bad credits" />

.large.center[If analysts can check 200 files, the model's riskiest 200 hold 44% of the bad credits; in random order, 20%.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 219 to 222.] In Dataiku: **Performance → Lift charts**.]

???

---

# Hands-on 1, continued: costs and gains

<img class="phase-thumb" src="images/phase-ev.svg" alt="The CRISP-DM phases, evaluation lit" />

.beside-thumb[
.need[**The need.** The committee approved the two prices. It wants the threshold they imply, and what a review of the riskiest fifth would catch.]

<div class="moves">
<div><b>1. Price</b>Enter the costs as gains: −5, −1, 0, 0. Train again.<br /><code>Design → Metrics → Cost matrix gain</code></div>
<div><b>2. Read</b>The cut-off Dataiku now picks, against the rule's 0.17.<br />Sheet, panel 5</div>
<div><b>3. Review</b>The share of bad credits in the riskiest 20%.<br /><code>Performance → Lift charts</code>, panel 6</div>
</div>

.need[Groups of three, same roles. 15 minutes.]
]

???
