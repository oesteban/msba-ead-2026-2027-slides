<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 598 173" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- Screen capture of Dataiku DSS 15.0 (an XGBoost model, Results, Predicted data), course server, 15 October 2026: the header and four rows, two either side of the 0.35 cut-off; frames by Oscar Esteban. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<image href="dataiku/predicted-data.png" x="0" y="0" width="598" height="173"/>
<g data-step="2">
<rect class="accent-stroke" x="250" y="4" width="146" height="47" rx="5" fill="none" stroke="#00609c" stroke-width="2.6"/>
<circle class="accent-fill" cx="250" cy="4" r="12" fill="#00609c"/><text x="250" y="9" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
</g>
<g data-step="3">
<rect class="accent-stroke" x="250" y="83" width="346" height="25" rx="5" fill="none" stroke="#00609c" stroke-width="2.6"/>
<circle class="accent-fill" cx="250" cy="95" r="12" fill="#00609c"/><text x="250" y="100" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
<rect class="accent-stroke" x="250" y="120" width="346" height="25" rx="5" fill="none" stroke="#00609c" stroke-width="2.6"/>
<circle class="accent-fill" cx="250" cy="132" r="12" fill="#00609c"/><text x="250" y="137" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
</g>
</svg>
