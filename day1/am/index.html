Your final deliverable is a model **and the evidence that it works**.

By noon you can answer, for any classifier:

# Name the positive class first

.cards.cols-2[
.card.accent[
.kicker[positive]

### bad

The class you **act on**: refuse the loan.

.foot[Recall and precision are always *about* this class.]
]
.card.muted[
.kicker[negative]

### good

The class you leave alone: grant the loan.
]
]

.admonition.warning[
<i class="fa-solid fa-triangle-exclamation"></i> Dataiku picks one of the two values as positive. Check which before you read any metric.
]

# A threshold turns each probability into a decision

.cm.data-table.center[
<table>
<thead><tr><th>threshold 0.5</th><th>refused (predicted bad)</th><th>granted (predicted good)</th></tr></thead>

<tr><td>actually good (700)</td><td class="miss">42 · false positives</td><td class="hit">658 · true negatives</td></tr>
</tbody>
</table>
]

# Start with the baseline

.cards.cols-2[
.card.muted[
.kicker[grant every loan]

.metric[70.0%]

accurate, with no model at all.

accurate.
]

.large.center[Accuracy rewards the majority class. Report it **next to the baseline**, or not at all.]

---

# Each metric answers one business question

.data-table.center[
| metric | question | at 0.5 |
|---|---|---|
| **precision** | Of the applicants we refuse, how many were really bad? | 108 / 150 = **72%** |
| **recall** | Of the bad applicants, how many do we refuse? | 108 / 300 = **36%** |
| **F1** | One number balancing the two (harmonic mean) | **0.48** |
| **accuracy** | How many decisions are right? | 766 / 1000 = **76.6%** |
]

---

# Errors do not cost the same

.cm.data-table.center[
<table>
<thead><tr><th>cost of a decision</th><th>refuse</th><th>grant</th></tr></thead>
<tbody>
<tr><td>actually bad</td><td>0</td><td class="hit">5</td></tr>
<tr><td>actually good</td><td class="hit">1</td><td>0</td></tr>
</tbody>
</table>
]

.large.center[Granting a loan that defaults costs **five times** more than refusing a good customer.]

.footnote[The cost matrix published with the Statlog German credit data.]

???

---

# The costs give the threshold

.boxed-content.center.large[
Refuse when granting is expected to cost more than refusing:

.formula[
P(bad) × 5 &gt; (1 − P(bad)) × 1 &nbsp;⟺&nbsp; P(bad) &gt; 1 / (1 + 5) ≈ **0.17**
]

<br />

Valid when the probabilities are well calibrated. Otherwise, search for the threshold that minimises the cost.
]

???

# Cross-validation tests every row exactly once

.boxed-content.center[
<img src="images/cross-validation.svg" style="width: 74%;" />
]

.large.center[*Stratified*: every fold keeps the 70/30 mix. Report the mean **and** the spread.]

???

---

# Read the ± as spread, and compare fold by fold

.cards.cols-3[
.card[
.kicker[the ±]

### Spread of the folds

How much the score moves between folds. Not a confidence interval.
]
.card[
.kicker[two models]

### Same folds, paired

Count the folds where A beats B. Overlapping ± says little.
]
.card.alert[
.kicker[the trap]

### Tuned on the folds

Choosing the model and threshold on the folds flatters the score. Keep a test set you never tune on.
]
]

???

# One column took Zalaxus from chance to 0.89

.boxed-content.center[
<img src="images/zalaxus-leak.svg" style="width: 66%;" />
]

???

---

# Leaks to hunt before you trust a score

.boxed-content.large[
* A column recorded **after** the outcome (orders, payments, follow-ups).
* A column that **re-encodes** the target, or the target itself under another name.
* **Duplicates** across training and test rows.
* Preparation **fitted on all the data** before the split.
* Time ignored: training on the future, testing on the past.
]

<div class="clear"></div>

.large.center[An AUC near 1.0 on a business problem is a bug report.]

???

---

# Your Projet EAD evaluation, as a checklist

.boxed-content.large.no-bullet[
- <i class="fa-regular fa-square"></i> The positive class is named.
- <i class="fa-regular fa-square"></i> Every metric sits next to its baseline.
- <i class="fa-regular fa-square"></i> The metric follows from what each error costs.
- <i class="fa-regular fa-square"></i> The threshold is chosen and justified.
- <i class="fa-regular fa-square"></i> Scores come from stratified cross-validation, with their spread.
- <i class="fa-regular fa-square"></i> A held-out check was never used for tuning.
- <i class="fa-regular fa-square"></i> You hunted for leaks, and say how.
]

???
