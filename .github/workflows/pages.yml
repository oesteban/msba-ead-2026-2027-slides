# Publish the decks to GitHub Pages.
#
# Replaces GitHub's automatic "pages-build-deployment" (Deploy from a branch),
# which checks out submodules recursively and drops symlinks (Jekyll safe
# mode). This workflow checks out the one submodule the decks load, the
# public slide engine, and uploads the tree as is.
#
# Requires Settings -> Pages -> Source = "GitHub Actions".
name: Deploy slides

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # The repository stays private until the year's decks are accepted; Pages
    # starts with the first push after it is made public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out the slide engine
        run: git submodule update --init remark

      - uses: actions/configure-pages@v5

      # upload-pages-artifact dereferences symlinks, so the per-day roster.yml
      # symlinks that roulette.js fetches at run time survive. The Jekyll
      # builder used by the branch deployment drops them (safe mode).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
