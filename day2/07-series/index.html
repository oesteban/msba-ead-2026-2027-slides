.section-mark.center[
## Reading a time series

### Trend, season, and the change from one day to the next

<br />

Oscar Esteban &lt;<code>oscar.esteban@hevs.ch</code>>

<br />

EAD · Exploration avancée de données et intelligence décisionnelle · 23.10.2026

<div style="font-size: 0.8em; margin-top: 1.2em;"><a href="https://oesteban.github.io/msba-ead-2026-2027-slides/day2/07-series/index.html">
https://oesteban.github.io/msba-ead-2026-2027-slides/day2/07-series/index.html
</a></div>
]

???

**This afternoon, we'll read a time series before anyone forecasts it.** This morning, in *Text mining and sentiment analysis*, each row of our data was a review. Now each row is a moment in time: a day of bike rentals, a day's closing price of a stock index, each following the one before. Firms forecast such numbers to plan staff, stock and purchases, and a forecast of tomorrow can only use what came before it. So before any model, we look at what the past of a series holds. What can the past of a series tell us about its next value?

???

**We'll go in four parts.** A forecast built from data assumes that some patterns of the past will continue, so before forecasting we need to know which patterns a series carries. First, what a time series is, and why the order of its rows is itself information. Second, the two patterns we can name and separate: the trend, a long-run direction, and the season, a pattern that repeats with the calendar. Third, autocorrelation: how much each value tells us about the next. Last, the hands-on in Dataiku, where we run these checks on one year of the Dow Jones, a stock index. So, first: what is a time series?


---
.section-mark.part[
.kicker[Part 1 of 4]

# Time series

<div class="parts"><span class="now">Time series</span><span>Trend and season</span><span>Autocorrelation</span><span>Hands-on 6</span></div>
]

???

**Part 1 is about what a time series is: numbers recorded one after another in time.** We'll see which such numbers firms record and why they forecast them, how the decision a forecast serves sets how far ahead it must look, what exactly a series is, and the bike rentals we'll use all afternoon. Then we'll shuffle those rentals to see what their order holds. First: what do firms record in time?


---
class: vcenter
# Series in a firm

.fullw[
<div class="trio">
<div><b class="k">Demand</b>Units sold per day, calls per hour, electricity per half-hour.</div>
<div><b class="k">Prices</b>A share, an index, an exchange rate, at each trading day's close.</div>
<div class="lit"><b class="k">Sensors</b>A machine's temperature, a patient's heart, many times a second.</div>
</div>

.lead.big.center[Firms forecast what they record in time, to set stock, staff and budgets.]
]

.footnote[R. J. Hyndman and G. Athanasopoulos (2021), section 1.1.]

???

**Firms forecast what they record in time, to set stock, staff and budgets.** A firm records numbers as they happen: units sold each day, calls each hour, a share's price at each close, a machine's temperature many times a second. A call centre rosters next week's staff on a forecast of next week's calls: with too few agents, callers wait; with too many, the firm pays for idle time. An energy firm decides whether to build a power plant on a forecast of demand five years ahead. A week for the roster, five years for the plant: what decides how far ahead a forecast must look?


---
class: vcenter
# A forecast serves a decision

.fullw[
<div class="trio">
<div><b class="k">Hours to days</b>Staff for next week, bikes to move tonight, production to schedule.</div>
<div><b class="k">Months</b>Raw materials to buy, people to hire, machines to order.</div>
<div><b class="k">Years</b>Sites, capacity, strategy: the long-term plan.</div>
</div>

.lead.big.center[The decision fixes the horizon: how far ahead the forecast must see.]
]

.footnote[R. J. Hyndman and G. Athanasopoulos (2021), section 1.2. *From a business question to a first model*: the machine-learning canvas, L. Dorard (2015).]

???

**The decision fixes the horizon: how far ahead the forecast must see.** The horizon is the time from the moment we forecast to the moment we predict. Scheduling staff, production or transport needs forecasts hours to days ahead. Buying raw materials, hiring people or ordering machines takes months, so their forecasts must see months ahead. Choosing sites and capacity, the long-term strategy, needs years. The machine-learning canvas of *From a business question to a first model* already asks for the horizon, in its prediction-task box: how long we wait before the outcome is observed. So far, a series has meant any numbers recorded in time. What exactly counts as a time series?


---
class: stepwise-svg, vcenter
# A time series

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/examples.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Four series: daily bike rentals over two years, four seconds of an ECG, two seconds of an EEG, and one fMRI voxel over seven and a half minutes"></object></div>
.step-5.lead.big.center[A time series is one quantity measured at regular steps, in order.]
]

.footnote[Bike rentals: H. Fanaee-T (2013), UCI, .lic[CC BY 4.0]. ECG: G. B. Moody and R. G. Mark (2001); EEG: G. Schalk et al. (2004); PhysioNet, .lic[ODC-By 1.0]. fMRI: K. J. Gorgolewski et al. (2013), OpenNeuro ds000114, .lic[CC0]. R. J. Hyndman and G. Athanasopoulos (2021), section 1.4.]

???

**A time series is one quantity measured at regular steps, in order.** In the widest sense, anything observed one value after another over time is a time series; we keep to series measured at regular steps, so that one step back always means the same span of time. Our main example is a city's bike rentals: one value a day, the bikes rented that day, for 731 days. The step can be far shorter. An electrocardiogram, ECG, measures a heart 360 times a second; an electroencephalogram, EEG, measures a brain 160 times a second; a functional MRI scan measures each 4-millimetre cube of a brain, called a voxel, every 2.5 seconds. What does such a series look like as a table?


---
class: vcenter
# Example: bike rentals

.fullw.terms[
<table style="width: 100%;" class="rows">
<caption class="data-lead">Capital Bikeshare, Washington DC: one row a day</caption>
<tr><th>Date</th><th>Casual</th><th>Registered</th><th>Rentals</th></tr>
<tr class="meaning"><td>a day</td><td>rentals by casual users</td><td>by registered users</td><td>the two together</td></tr>
<tr><td>2011-01-01</td><td>331</td><td>654</td><td>985</td></tr>
<tr><td>2011-01-02</td><td>131</td><td>670</td><td>801</td></tr>
<tr><td>2011-01-03</td><td>120</td><td>1,229</td><td>1,349</td></tr>
<tr><td>2011-01-04</td><td>108</td><td>1,454</td><td>1,562</td></tr>
<tr><td>2011-01-05</td><td>82</td><td>1,518</td><td>1,600</td></tr>
</table>

<div class="facts two">
<div><span class="num">731</span>days, 1 January 2011 to 31 December 2012: one value a day, none missing.</div>
<div><span class="num">2</span>kinds of riders, counted apart: casual users and registered users.</div>
</div>
]

.footnote[H. Fanaee-T (2013), Bike Sharing, UCI dataset 275, `day.csv`, .lic[CC BY 4.0]; H. Fanaee-T and J. Gama (2013), section 3.1.]

???

**Our example series is Capital Bikeshare in Washington DC: one row a day, the bikes rented that day.** The file covers every day of 2011 and 2012, 731 days with none missing: one value at each regular step. The system records each trip's member type, so the rentals are counted apart for registered users and for casual users; the two add up to the day's rentals. The researchers who published the data saw the system as a network of sensors of how people move through the city, so an event in the city should show in its counts. This file carries the next two parts, and you'll upload it in the hands-on. What would we lose if we shuffled its rows?


---
class: stepwise-svg, vcenter
# Order is the data

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/shuffle.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The daily bike rentals in order, rising over two years, then the same 731 values shuffled, a flat band of noise"></object></div>
.step-3.lead.big.center[Shuffle the rows and the series is gone.]
]

.footnote[*Model selection and cross-validation*: K-fold. G. James et al. (2021), p. 427; C. Bergmeir et al. (2018). Data: H. Fanaee-T (2013), UCI, .lic[CC BY 4.0].]

???

**Shuffle the rows and the series is gone.** The shuffled panel holds the same 731 values, with the same mean and spread. But the rise from 2011 to 2012, the summers and the winters have disappeared: they were in the order, not in the values. On the first day, each row was one credit, independent of the others, so k-fold in *Model selection and cross-validation* could put any row in any fold. In a series, neighbouring rows are related: a busy day tends to follow a busy day. This sets a time series apart from data whose rows can be taken as independent, and it is why, after the break, forecasts are tested on the days after those they learned from. So what does the order hold?


---
.section-mark.part[
.kicker[Part 2 of 4]

# Trend and season

<div class="parts"><span>Time series</span><span class="now">Trend and season</span><span>Autocorrelation</span><span>Hands-on 6</span></div>
]

???

**Part 2 is about the patterns a series can carry, and how to separate them.** A series can have a trend, a long-run direction, and a season, a pattern that repeats with the calendar, both mixed in the same numbers. We'll split the series into parts, look at each part on the bike rentals, see that a season can keep its size or grow with the level, and run a method that does the split. But why would anyone take a series apart?


---
class: vcenter
# Time series decomposition

.fullw[
.model-eq[y<sub>t</sub> = T<sub>t</sub> + S<sub>t</sub> + R<sub>t</sub>]

<div class="trio">
<div><b class="k">T, the trend-cycle</b>The long-run direction, and any rise and fall of no fixed period: a cycle.</div>
<div><b class="k">S, the season</b>What repeats with a fixed period: the week, the year.</div>
<div><b class="k">R, the remainder</b>What is left: noise, and the unusual days.</div>
</div>

.lead.big.center[Since the 1920s, statisticians split series so, to read a figure without its season.]
]

.footnote[R. J. Hyndman and G. Athanasopoulos (2021), sections 3.2 to 3.5. R. B. Cleveland et al. (1990), section 6.5.]

???

**Since the 1920s, statisticians have split series into parts, to read a figure without its season.** Monthly unemployment rises every year when school leavers look for work, and it rises in a recession; an economist wants to see the second rise, not the first. So official statistics publish it seasonally adjusted, with the season taken out, and most agencies use variants of X-11, a method of the US Census Bureau from the 1950s and 1960s. The split writes each value as the sum of three parts: the trend-cycle T, the long-run direction plus any rise and fall of no fixed period, called a cycle; the season S, which repeats with a fixed period; and the remainder R, what is left. In the bike rentals, how do we pull out the long-run direction alone?


---
class: stepwise-svg, vcenter
# Trend

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/trend.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Daily bike rentals in 2011 and 2012, their trend as each day's mean over the 365 days around it, rising from 3,406 in July 2011 to 5,609 in July 2012, and each year's mean: 3,406 a day in 2011, 5,600 in 2012"></object></div>
.step-4.lead.big.center[A trend is the long-run direction of a series.]
]

.footnote[R. J. Hyndman and G. Athanasopoulos (2021), sections 2.3 and 3.3. Data: H. Fanaee-T (2013), Capital Bikeshare, UCI dataset 275, .lic[CC BY 4.0].]

???

**A trend is the long-run direction of a series.** The rentals jump from day to day and swing with the seasons, so how do we see their direction? The blue line gives each day the mean of the 365 days around it. Every such window holds one whole year, every summer and every winter, so the yearly season cancels out and the direction remains. The line can start only where a full year lies around a day, on 2 July 2011, and there it equals 2011's mean, 3,406 rentals a day; a year later it reaches 5,609. A trend need not be straight, and two years cannot tell it from a cycle, which usually lasts two years or more. What do the yearly swings look like on their own?


---
class: stepwise-svg, vcenter
# Seasonality

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/season.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Monthly means of all rentals, low in January and high from May to September; weekday means of registered riders, high on weekdays, and of casual riders, high at weekends"></object></div>
.step-3.lead.big.center[A season repeats with a fixed period set by the calendar: the year, the week.]
]

.footnote[R. J. Hyndman and G. Athanasopoulos (2021), section 2.3. Data: H. Fanaee-T (2013), UCI, .lic[CC BY 4.0].]

???

**A season repeats with a fixed period set by the calendar: the year, the week.** Its period is fixed and known, so we know in advance when the next summer and the next Saturday come. In the rentals, a January day averages 2,176 rentals, a day from May to September between 5,350 and 5,772. The week is a second season, and our two kinds of riders show it in opposite ways. Registered users ride most from Monday to Friday; casual users ride at weekends, 1,465 a day on Saturdays against 551 on Wednesdays. Added up, the two weekly seasons largely cancel: the total's weekday means stay between 4,229 and 4,690. A total can hide the seasons of its parts. Do the casual riders' weekends add as many riders in winter as in summer?


---
class: stepwise-svg, vcenter
# Additive or multiplicative

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/additive.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Two drawn sketches, swings of the same size and swings that grow with the level, with their formulas, y equals T plus S plus R and y equals T times S times R; then casual riders' weekday and weekend means by month, the gap growing with the level"></object></div>
.step-4.lead.big.center[Additive swings keep their size; multiplicative swings grow with the level.]
]

.footnote[R. J. Hyndman and G. Athanasopoulos (2021), section 3.2. Data: H. Fanaee-T (2013), UCI, .lic[CC BY 4.0].]

???

**Additive swings keep their size; multiplicative swings grow with the level.** The two sketches are drawn, not data. In an additive series, the parts add up, so a weekend would add about as many riders in winter as in summer. In a multiplicative series, the parts multiply, so the weekend adds a share: the busier the month, the larger the swing. Our casual riders are multiplicative: their weekend mean stays between 1.6 and 3.0 times their weekday mean in every month, while the gap grows from 84 riders a day in January 2011 to 1,729 in May 2012. Logarithms turn a product into a sum, so an additive method can still split such a series. But a few strange days pull at the trend and the season: how does a method keep them out?


---
class: stepwise-svg, vcenter
# STL decomposition

.fullw[
.need[**STL**: Seasonal and Trend decomposition using Loess, a smoother that fits a line through the points near each day.]

<div class="step-1"><object type="image/svg+xml" data="images/stl.svg" style="width: 100%; max-height: 360px; display: block; margin: 0 auto; pointer-events: none;" aria-label="Casual riders' daily rentals split by STL into a trend-cycle, a weekly season and a remainder; 29 October 2012, the lowest day of the two years, is circled in the remainder"></object></div>
.step-5.lead.big.center[STL's remainder shows the days that broke the pattern.]
]

.footnote[R. B. Cleveland et al. (1990); R. J. Hyndman and G. Athanasopoulos (2021), section 3.6; H. Fanaee-T and J. Gama (2013). Data: UCI, .lic[CC BY 4.0].]

???

**STL's remainder shows the days that broke the pattern.** STL stands for Seasonal and Trend decomposition using Loess, a smoother that fits, around each point, a simple line to its nearest neighbours. Unlike X-11, built for monthly and quarterly figures, STL takes any period, here 7 days for the casual riders, and lets the season change slowly over time. Its robust option keeps a few unusual days from pulling the trend-cycle and the season, so they land in the remainder. The circled day, 29 October 2012, had the fewest rentals of the two years, 22: the data's authors, who wanted to detect such events, tied it to Hurricane Sandy. Beyond the patterns we can name, how much does each value tell about the next?


---
.section-mark.part[
.kicker[Part 3 of 4]

# Autocorrelation

<div class="parts"><span>Time series</span><span>Trend and season</span><span class="now">Autocorrelation</span><span>Hands-on 6</span></div>
]

???

**Part 3 measures how much each value of a series tells about the next.** That measure is the autocorrelation. We'll compute it on the rentals, read a heartbeat's rhythm from it, see what a series with nothing to tell looks like, and read a trend and a season in it. Then we'll ask what a model needs from a series, and how to give it that. First: does today's number tell us anything about tomorrow's?


---
class: stepwise-svg, vcenter
# Autocorrelation

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/lag.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A table of days with their rentals and the day before's, then 730 days plotted against the day before, correlation 0.85, then the formula of the autocorrelation at lag k"></object></div>
.step-5.lead.big.center[Autocorrelation is the correlation of a series with itself k steps earlier, at lag k.]
]

.footnote[R. J. Hyndman and G. Athanasopoulos (2021), sections 1.4 and 2.8. Data: H. Fanaee-T (2013), UCI, .lic[CC BY 4.0].]

???

**Autocorrelation is the correlation of a series with itself k steps earlier, at lag k.** A forecast built from past values works only if today tells us something about tomorrow. How much? Put each day beside the day before: 730 pairs. Plotted, they lie close to a rising line. The correlation measures how close: 1 when the points lie on a rising line, 0 when no line fits, negative when one tends to fall as the other rises. Here it is 0.85. The number of steps back is the lag, k. The formula measures each value and the value k steps earlier from the mean of the whole series, ȳ. All the lags together, r₁, r₂ and so on, form the autocorrelation function, ACF. What does it show for a series with a rhythm?


---
class: stepwise-svg, vcenter
# A heartbeat

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/ecg-acf.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Ten seconds of an ECG with thirteen beats, then its autocorrelation at lags up to two seconds, its highest peak at 0.81 seconds: 74 beats a minute"></object></div>
.step-4.lead.big.center[The autocorrelation peaks at the time between two beats.]
]

.footnote[MIT-BIH Arrhythmia Database, record 100: G. Moody and R. Mark (2005); G. B. Moody and R. G. Mark (2001); T. Pollard et al. (2026). .lic[ODC-By 1.0].]

???

**The autocorrelation peaks at the time between two beats.** This is ten seconds of a heart's ECG, 360 values a second, from the MIT-BIH Arrhythmia Database, heart recordings in which cardiologists marked every beat. At small lags each value is close to its neighbour, so the autocorrelation starts high, then falls. When the lag reaches the time between two beats, each beat lines up with the next, and the autocorrelation rises again: its highest peak is at 0.81 seconds, 74 beats a minute. Over the same ten seconds, the cardiologists' marks give a mean interval of 0.806 seconds. We read the heart's period from the series alone, without telling the computer what a beat is. Any pattern that repeats makes the autocorrelation peak at its period. And a series with no pattern at all?


---
class: stepwise-svg, vcenter
# White noise

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/white-noise.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A simulated series of 731 independent values around zero, then its autocorrelation at lags 1 to 28, inside a grey band of plus or minus 0.072 but for one bar, at lag 15"></object></div>
.step-4.lead.big.center[White noise is a series of independent values: nothing in it to forecast.]
]

.footnote[R. J. Hyndman and G. Athanasopoulos (2021), section 2.9. Simulated.]

???

**White noise is a series of independent values: nothing in it to forecast.** Each of these 731 values was drawn at random, independently of the others, so no value says anything about the next. Its autocorrelations should be zero, yet the bars are not exactly zero: in a finite series, chance alone makes small correlations. How small? For a series of T values, about 95% of white noise's autocorrelations fall within ±1.96/√T: here, with 731 values, ±0.072, the grey band. So about one bar in twenty falls outside by chance, and here one of 28 does, at lag 15, just over the edge. The band is our test: a bar well outside it shows a real autocorrelation. What do a trend and a season do to these bars?


---
class: stepwise-svg, vcenter
# Reading an autocorrelation

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/acf.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The autocorrelation of all rentals, high and slowly decaying over 28 days; that of casual riders, with spikes at 7, 14, 21 and 28 days; the grey band where noise would fall"></object></div>
.step-3.lead.big.center[A trend decays slowly; a season spikes at its period.]
]

.footnote[R. J. Hyndman and G. Athanasopoulos (2021), sections 2.8 and 2.9. Data: H. Fanaee-T (2013), UCI, .lic[CC BY 4.0].]

???

**A trend decays slowly; a season spikes at its period.** All rentals have an autocorrelation of 0.85 at lag 1, and still 0.65 four weeks later. With a trend, two days a few weeks apart usually sit on the same side of the series' mean, both above in the summer of 2012, both below in the winter of 2011, so their products in the formula stay positive and the bars fall only slowly. The casual riders spike at 7, 14, 21 and 28 days, 0.73 at one week, because a Saturday resembles the Saturdays before: their weekly season. All these bars lie far outside the band of noise. With a trend, next year will not look like last year: what does that do to a model that learns from the past?


---
class: stepwise-svg, vcenter
# Stationarity

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/stationary.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Daily rentals, their 30-day mean drifting up and down; their change from the day before, its 30-day mean flat at zero, its 30-day spread wider in summer than in winter"></object></div>
.step-3.lead.big.center[A stationary series keeps the same mean and spread over time.]
]

.footnote[R. J. Hyndman and G. Athanasopoulos (2021), chapter 9; H. Hewamalage et al. (2023), section 3.1. Data: H. Fanaee-T (2013), UCI, .lic[CC BY 4.0].]

???

**A stationary series keeps the same mean and spread over time.** A model learns from the past, and what it learned holds only if the series keeps behaving the same way. Trained on 2011 alone, a model would meet in 2012 many days busier than any it had seen, and many machine-learning models predict poorly beyond the range of values they learned from. A series is stationary when its statistical properties do not depend on when we observe it: a trend or a season rules that out, while white noise is stationary. On the left, the rentals' 30-day mean drifts with the year. On the right, their change from the day before keeps its mean near zero, but its spread, the pale band, swings from about 400 to 1,900: closer to stationary, not fully. Why does the change steady the mean?


---
class: stepwise-svg, vcenter
# Differencing

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/diff.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The autocorrelation of the rentals' change from the day before, near zero past lag 1; that of casual riders' change from a week before, the spikes at 14, 21 and 28 days gone and one negative bar left at 7"></object></div>
.step-3.lead.big.center[Differencing removes a trend, and at a lag of 7 days, a weekly season.]
]

.footnote[R. J. Hyndman and G. Athanasopoulos (2021), section 9.1. Data: H. Fanaee-T (2013), UCI, .lic[CC BY 4.0].]

???

**Differencing removes a trend, and at a lag of 7 days, a weekly season.** Differencing replaces each value by its change. The change from the day before, the first difference, no longer carries the level, so the trend drops out. The change from the same day a week before, a seasonal difference, sets each Saturday against the last, so what all Saturdays share drops out, and the casual riders' spikes at 14, 21 and 28 days go. The negative bars left, −0.29 at lag 1 and −0.465 at lag 7, come from differencing itself: a rainy day makes the change into it negative and the change out of it, one step later, positive. So we take as few differences as we need, rarely more than two. What do these checks say about a series a firm would like to forecast?


---
.section-mark.part[
.kicker[Part 4 of 4]

# Hands-on 6: the Dow Jones

<div class="parts"><span>Time series</span><span>Trend and season</span><span>Autocorrelation</span><span class="now">Hands-on 6</span></div>
]

???

**In the hands-on, we run this afternoon's checks on one year of the Dow Jones, in Dataiku.** The Dow Jones Industrial Average is a stock index, one number computed from the share prices of 30 companies. A firm's treasury team, which manages its cash, has a question about it, and we'll answer it with the checks of parts 2 and 3: is there a season, how much does each day tell about the next, and how does the change from one day to the next behave? We build no model: we read the series first. What does one row of the file hold?


---
class: vcenter

# The data

<img class="phase-thumb" src="images/phase-du.svg" alt="The CRISP-DM phases, data understanding lit" />

.beside-thumb.terms[
<table style="width: 100%;" class="big">

</table>

</div>

</div>
]

.footnote[Downloaded from stooq (symbol ^DJI) with the previous edition's material; counts on the course file. Its licence is not recorded: no value is shown.]

???

**Each row is one trading day of the Dow Jones.** A trading day is a day the market is open, and the series we read is the close, the index's value at the day's end, quoted in points. The file holds 256 trading days, from 1 October 2024 to 8 October 2025. Weekends and 11 holidays are absent, so a step is a trading day: Monday's change is Monday's close minus Friday's. The series is regular in trading days, not in calendar days. The close moved 292 points a day on average, up or down: the size of an ordinary day's move. You'll chart the values yourselves in Dataiku. Who wants to know where this series goes next, and why?


---
class: vcenter

# The case

<img class="phase-thumb" src="images/phase-bu.svg" alt="The CRISP-DM phases, business understanding lit" />

.beside-thumb[
<div class="duo big">
<div><b class="k">The decision</b>A treasury team buys an index fund once a month, on a day of its choosing.</div>
<div class="lit"><b class="k">The question</b>Do the past days' moves tell whether the next trading day will be lower? The horizon: one trading day.</div>
</div>

.lead.big.center[If the past days tell the next one, the team can pick its day.]
]

.footnote[A scenario, not data.]

???

**If the past days tell the next one, the team can pick its day.** In our scenario, the treasury team buys an index fund once a month, a fund whose value follows the Dow Jones, on any day it chooses. If the days before could tell that tomorrow's close will be lower, the team would wait a day and buy cheaper. So the decision fixes the horizon at one trading day, the shortest of the horizons we met at the start. The question for you: do the past days' moves say whether the next trading day will be lower? To answer it, which of the file's six columns do we need, and as what?


---
class: vcenter

# Column types

<img class="phase-thumb" src="images/phase-du.svg" alt="The CRISP-DM phases, data understanding lit" />

.beside-thumb[
<div class="types three">
<div><b>A date<span class="n">1</span></b><code>Date</code>
<p>It orders the rows; Dataiku reads it as a date on upload.</p></div>
<div><b>The series<span class="n">1</span></b><code>Close</code>
<p>A number a trading day: its level, and its change from the day before.</p></div>
<div><b>Left aside<span class="n">4</span></b><code>Open</code>, <code>High</code>, <code>Low</code>, <code>Volume</code>
<p>The same day's other prices and its volume.</p></div>
</div>

<p class="types-after">No target and no model yet: the hands-on reads the series before anyone forecasts it.</p>
]

.footnote[The course file's columns, as downloaded; read on DSS 15.0, course server, 23 October 2026.]

???

**Two columns carry the question: the date, which orders the rows, and the close, the series we read.** Everything this afternoon rests on the order, so Dataiku must read `Date` as a date, not as text. On the course server it does so on upload: under the column's name, where Dataiku shows the kind of value it found, `Date` reads *Date only*, after *Text* for a moment. `Close` is read twice: as its level, and as its change from the day before, the first difference. The day's opening, highest and lowest prices and its volume are left aside, since the question is about one close and the next. No column is a target: we train no model yet. Now to Dataiku, with the sheet. Steps 1 to 3 chart the close, put each day beside the two before with a Window recipe, correlate the changes, average them by weekday, and answer the treasury team; panel 4 runs the same means on the bike rentals, where a season exists. Does today's change say anything about tomorrow's?
