# Series in a firm

.fullw[
<div class="trio">
<div><b class="k">Demand</b>Units sold per day, calls per hour, electricity per half-hour.</div>
<div><b class="k">Prices</b>A share, an index, an exchange rate, at each trading day's close.</div>
<div class="lit"><b class="k">Sensors</b>A machine's temperature, a patient's heart, many times a second.</div>
</div>

.lead.big.center[Firms forecast what they record in time, to set stock, staff and budgets.]
]

.footnote[R. J. Hyndman and G. Athanasopoulos (2021), section 1.1.]

class: vcenter
# A forecast serves a decision

.fullw[
<div class="trio">
<div><b class="k">Hours to days</b>Staff for next week, bikes to move tonight, production to schedule.</div>
<div><b class="k">Months</b>Raw materials to buy, people to hire, machines to order.</div>
<div><b class="k">Years</b>Sites, capacity, strategy: the long-term plan.</div>
</div>

.lead.big.center[The decision fixes the horizon: how far ahead the forecast must see.]
]

.footnote[R. J. Hyndman and G. Athanasopoulos (2021), section 1.2. *From a business question to a first model*: the machine-learning canvas, L. Dorard (2015).]

class: vcenter
# Time series decomposition

.fullw[
.model-eq[y<sub>t</sub> = T<sub>t</sub> + S<sub>t</sub> + R<sub>t</sub>]

<div class="trio">
<div><b class="k">T, the trend-cycle</b>The long-run direction, and any rise and fall of no fixed period: a cycle.</div>
<div><b class="k">S, the season</b>What repeats with a fixed period: the week, the year.</div>
<div><b class="k">R, the remainder</b>What is left: noise, and the unusual days.</div>
</div>

.lead.big.center[Since the 1920s, statisticians split series so, to read a figure without its season.]
]

.footnote[R. J. Hyndman and G. Athanasopoulos (2021), sections 3.2 to 3.5. R. B. Cleveland et al. (1990), section 6.5.]
