<text x="228" y="292" font-size="15" font-weight="normal" text-anchor="middle" fill="#1c2e36">dated</text>
<text x="228" y="310" font-size="13" font-weight="normal" text-anchor="middle" fill="#556268">weekday, month</text>
<path d="M 260 245 L 300 245 L 300 218 L 492 218" fill="none" stroke="#1c2e36" stroke-width="1.6" marker-end="url(#ah)"/>
<circle cx="514" cy="218" r="20" fill="#8fd19e" stroke="#1c2e36" stroke-width="1.2"/>
