<rect class="accent-a-light-fill accent-stroke" x="390" y="60" width="56" height="50" rx="6" fill="#8cb3cf" stroke="#00609c" stroke-width="1.6"/>
<text x="418" y="132" font-size="15" font-weight="normal" text-anchor="middle" fill="#1c2e36">changes</text>
