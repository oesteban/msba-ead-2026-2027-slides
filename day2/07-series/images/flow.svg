<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- The Flow of Hands-on 6, drawn after Dataiku DSS's Flow (datasets and visual recipes), with the sheet's steps; recipe colours schematic. Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<g transform="translate(60,0)"><rect class="accent-a-light-fill accent-stroke" x="10" y="60" width="56" height="50" rx="6" fill="#8cb3cf" stroke="#00609c" stroke-width="1.6"/>
<text x="38" y="132" font-size="15" font-weight="normal" text-anchor="middle" fill="#1c2e36">dowjones</text>
<text x="38" y="150" font-size="13" font-weight="normal" text-anchor="middle" fill="#556268">Date read as a date</text>
