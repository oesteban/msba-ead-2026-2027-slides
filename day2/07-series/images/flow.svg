<line x1="536" y1="218" x2="576" y2="218" stroke="#1c2e36" stroke-width="1.6" marker-end="url(#ah)"/>
<rect class="accent-a-light-fill accent-stroke" x="580" y="193" width="56" height="50" rx="6" fill="#8cb3cf" stroke="#00609c" stroke-width="1.6"/>
<text x="608" y="265" font-size="15" font-weight="normal" text-anchor="middle" fill="#1c2e36">by weekday</text>
<path d="M 300 245 L 300 282 L 492 282" fill="none" stroke="#1c2e36" stroke-width="1.6" marker-end="url(#ah)"/>
<circle cx="514" cy="282" r="20" fill="#8fd19e" stroke="#1c2e36" stroke-width="1.2"/>
<text x="514" y="324" font-size="14" font-weight="normal" text-anchor="middle" fill="#556268">Group</text>
<line x1="536" y1="282" x2="706" y2="282" stroke="#1c2e36" stroke-width="1.6" marker-end="url(#ah)"/>
<rect class="accent-a-light-fill accent-stroke" x="710" y="257" width="56" height="50" rx="6" fill="#8cb3cf" stroke="#00609c" stroke-width="1.6"/>
<text x="738" y="329" font-size="15" font-weight="normal" text-anchor="middle" fill="#1c2e36">by month</text>
<text class="accent-fill" x="10" y="190" font-size="15" font-weight="bold" text-anchor="start" fill="#00609c">panel 4</text></g>
