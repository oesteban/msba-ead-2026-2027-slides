<text x="765.5" y="56" font-size="16" font-weight="normal" text-anchor="end" fill="#556268">today</text>
<text x="60" y="380" font-size="15" font-weight="normal" text-anchor="start" fill="#556268">simulated</text>
<text x="80" y="84" font-size="28" font-weight="bold" text-anchor="start" fill="#1c2e36">y<tspan baseline-shift='sub' font-size='16'>t</tspan> = y<tspan baseline-shift='sub' font-size='16'>t−1</tspan> + ε<tspan baseline-shift='sub' font-size='16'>t</tspan></text>
<text x="80" y="116" font-size="16" font-weight="normal" text-anchor="start" fill="#556268">ε: white noise, a random change each step</text>
