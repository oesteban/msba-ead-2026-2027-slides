<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- A simulated random walk (seed 11, Gaussian steps) and its naive forecast, the last value carried forward (R. J. Hyndman and G. Athanasopoulos 2021, section 5.2). Drawn by Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<polyline points="60.0,275.2 69.0,270.5 78.0,258.2 87.0,264.5 96.0,281.0 105.0,281.9 114.0,275.9 123.0,262.3 132.0,277.4 141.0,293.4 150.0,284.7 159.0,278.8 168.0,259.7 177.0,247.5 186.0,248.8 195.0,252.2 204.0,220.3 213.0,223.9 222.0,233.6 231.0,247.8 240.0,246.6 249.0,244.8 258.0,249.0 267.0,249.8 276.0,246.4 285.0,237.8 294.0,224.2 303.0,221.6 312.0,243.8 321.0,235.1 330.0,252.7 339.0,254.9 348.0,273.2 357.0,273.1 366.0,282.8 375.0,280.2 384.0,239.2 393.0,239.8 402.0,229.3 411.0,245.8 420.0,249.3 429.0,241.1 438.0,242.3 447.0,237.7 456.0,236.4 465.0,248.9 474.0,241.9 483.0,252.0 492.0,228.7 501.0,235.0 510.0,226.5 519.0,226.4 528.0,214.6 537.0,222.1 546.0,209.7 555.0,211.2 564.0,195.5 573.0,187.8 582.0,186.0 591.0,195.7 600.0,186.2 609.0,180.4 618.0,160.0 627.0,164.7 636.0,157.8 645.0,151.5 654.0,148.0 663.0,145.4 672.0,143.1 681.0,150.5 690.0,163.1 699.0,168.1 708.0,160.7 717.0,142.0 726.0,129.8 735.0,116.7 744.0,107.1 753.0,98.4 762.0,96.1 771.0,86.6" fill="none" stroke="#1c2e36" stroke-width="2" stroke-linejoin="round"/>
