.section-mark.center[
## Forecasting a time series

### Simple forecasts first, judged on days they have not seen

<br />

Oscar Esteban &lt;<code>oscar.esteban@hevs.ch</code>>

<br />

EAD · Exploration avancée de données et intelligence décisionnelle · 23.10.2026

<div style="font-size: 0.8em; margin-top: 1.2em;"><a href="https://oesteban.github.io/msba-ead-2026-2027-slides/day2/08-forecast/index.html">
https://oesteban.github.io/msba-ead-2026-2027-slides/day2/08-forecast/index.html
</a></div>
]

???

**After the break, we forecast a series and learn to judge the forecast.** In Hands-on 6, you found that the Dow Jones's change from one day to the next says almost nothing about the next change. Yet the treasury team still has to plan, and other series, like the bike rentals, do carry a trend and a season. So we need two things: forecasts to make, from the simplest rules to fitted models, and a fair way to tell whether one forecast is better than another. Which forecast should we make, and how will we know it is any good?

???

**We'll go in four parts.** First, the simple forecasts, which carry a number from the past forward: every model must beat them, so we meet them first. Second, the models, and what each adds to the simple forecasts. Third, how to judge a forecast: on which days to test it and how to count its misses, so that we can tell whether a model beats the simple ones. Last, the hands-on in Dataiku, where we forecast the Dow Jones a week ahead and set every model beside the last value. So, first: what is the simplest forecast we can make?


---
.section-mark.part[
.kicker[Part 1 of 4]

# Simple forecasts

<div class="parts"><span class="now">Simple forecasts</span><span>Models</span><span>Judging a forecast</span><span>Hands-on 7</span></div>
]

???

**Part 1 is about the simple forecasts, the benchmarks every model must beat.** We'll see four of them, each a fixed rule applied to the past. Then why, for a series like the Dow Jones, the last value is the best forecast there is, and how the simple forecasts have fared against far more complex methods in forecasting competitions. What does a forecast look like when it learns nothing from the data?


---
class: stepwise-svg, vcenter
# Four simple forecasts

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/simple.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Six weeks of daily bike rentals and four forecasts of the next two weeks, each with its formula: the mean of every day so far, the last value, the same day a week before, and the drift line"></object></div>
.step-5.lead.big.center[A simple forecast carries a number from the past forward.]
]

.footnote[R. J. Hyndman and G. Athanasopoulos (2021), section 5.2. Data: H. Fanaee-T (2013), Capital Bikeshare, UCI dataset 275, .lic[CC BY 4.0].]

???

**A simple forecast carries a number from the past forward.** On the bike rentals up to 30 April 2011, four rules forecast the next two weeks. The mean repeats the average of all days so far, 2,044 rentals. The last value, 5,312, is the naive forecast. The seasonal naive repeats the same weekday of the last week. The drift line joins the first day to the last and extends it. In the formulas, T is the last day observed and h the number of days ahead. A fitted model chooses its parameters, the numbers it learns, to match the past; these four rules have none to choose. When is the last value the best one can do?


---
class: stepwise-svg, vcenter
# A random walk

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/naive.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A simulated random walk, its formula, y at t equals y at t minus 1 plus a random change, and its forecast for every day ahead: a flat line at today's value"></object></div>
.step-3.lead.big.center[In a random walk, the best forecast of the next value is the last one.]
]

.footnote[E. F. Fama (1970): L. Bachelier (1900), M. G. Kendall (1953). N. Beck et al. (2025). R. J. Hyndman and G. Athanasopoulos (2021), section 9.1. Simulated.]

???

**In a random walk, the best forecast of the next value is the last one.** Each value is the last one plus a random change, ε, white noise. The level wanders and the next change is as likely up as down, so the best forecast for every day ahead is today's value. That is what you found in the Dow Jones. In 1953, Kendall found share indices moving "as if once a week the Demon of Chance drew a random number" (Fama, 1970, p. 390, verbatim). Prices behave so because, if past prices told tomorrow's, buyers would act today, and today's price would already hold the rise. A 2025 study found no model that beat the last value on exchange rates or share prices. Are the simple forecasts as hard to beat on the series a firm usually forecasts?


---
class: vcenter
# Forecasting competitions

.fullw[
<div class="trio">
<div><b class="k">The M competitions</b>Run since 1982 by S. Makridakis and colleagues: forecasts of real series, scored on the values held back; 3,003 series in 2000, 100,000 in 2018.</div>
<div><b class="k">1,045 monthly series</b>Of the M3 competition: the last value adjusted for the season beat <span class="num">half</span> the machine-learning methods.</div>
<div class="lit"><b class="k">M4, 2018</b>On 100,000 series, <span class="num">one</span> machine-learning entry in five beat that benchmark.</div>
</div>

.lead.big.center[In forecasting competitions, the simple forecasts are hard to beat.]
]

.footnote[S. Makridakis et al. (2020), finding 7; S. Makridakis et al. (2018), section 4; R. J. Hyndman and G. Athanasopoulos (2021), section 5.2.]

???

**In forecasting competitions, the simple forecasts are hard to beat.** Since 1982, the M competitions, run by Spyros Makridakis and colleagues, have asked forecasters to send in forecasts of real series and scored them on values the forecasters had not seen: 3,003 series in 2000, 100,000 in 2018. One benchmark is Naive 2, the last value adjusted for the season. On 1,045 monthly series of the 2000 competition, Naive 2 beat half of the machine-learning methods tested. In 2018, five machine-learning methods were sent in, and only one beat it. Hence the rule: set every method beside the simple forecasts, and if it does not beat them, it is not worth considering. So what can a model add?


---
.section-mark.part[
.kicker[Part 2 of 4]

# Models

<div class="parts"><span>Simple forecasts</span><span class="now">Models</span><span>Judging a forecast</span><span>Hands-on 7</span></div>
]

???

**Part 2 is about models: forecasts that learn their numbers from the past.** A simple forecast carries one number forward. A model fits parameters, numbers it chooses so that its forecasts would have matched the past, and so it can follow what the series does. We'll see two families. The first smooths the series: it keeps a running level, then adds a trend and a season. The second forecasts the series from its own past values and its past errors. Last, the deep networks of this morning, and what they need. Between the mean, where every day counts alike, and the last value, where only one counts, is there a middle way?


---
class: stepwise-svg, vcenter
# Exponential smoothing

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/weights.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Tomorrow's forecast as a weighted average of past days: the weights of the last twelve days for alpha 0.8, in dark, and 0.2, in blue, falling with age; then the formula and what alpha is"></object></div>
.step-4.lead.big.center[Exponential smoothing averages all past days, the recent ones weighing more.]
]

.footnote[R. J. Hyndman and G. Athanasopoulos (2021), section 8.1; S. Makridakis et al. (2018), section 5.]

???

**Exponential smoothing averages all past days, the recent ones weighing more.** A day's rentals are the series' level plus that day's noise, and a forecast wants the level. The mean keeps every old day, the winter's included; the last value keeps only today, noise and all. Exponential smoothing forecasts tomorrow with a weighted average of all past days. The last day weighs α, the smoothing parameter, between 0 and 1; each day further back weighs 1 − α times the day after it. The weights fall exponentially with age, hence the name. With α = 0.8, the last day takes 80% of the weight; with α = 0.2, older days still count. At α = 1, the forecast is the last value; near 0, almost the mean. Brown used it in the 1950s to forecast the demand for thousands of items in navy shipyards. Must each of those forecasts weigh every past day again?


---
class: stepwise-svg, vcenter
# The smoothed level

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/smooth.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Six weeks of daily rentals to 30 April 2011, their smoothed level for alpha 0.8, in dark, which chases each day, and for alpha 0.2, in blue, which moves slowly, each with its flat forecast; then the update formula with the same alpha"></object></div>
.step-5.lead.big.center[Each day's level is a weighted average of that day's value and the level before.]
]

.footnote[R. J. Hyndman and G. Athanasopoulos (2021), section 8.1. Data: H. Fanaee-T (2013), UCI, .lic[CC BY 4.0].]

???

**Each day's level is a weighted average of that day's value and the level before.** The forecast needs no sum over every past day. Smoothing keeps one number, the level ℓ, and updates it daily: the new value weighs α, the level before 1 − α, with the α of the weights. The level before held every earlier day, so each update multiplies the old days once more by 1 − α: that is why the weights fall with age. On the rentals, with α = 0.8 the level chases each day and ends at 5,146; with α = 0.2 it moves slowly and ends at 4,230. The forecast for every day ahead is the last level, one number per item. The method fits α to the series, the value whose one-step forecasts missed least. But the forecast is a flat line: what about a trend, or a weekly season?


---
class: vcenter
# How ETS works

.fullw[
.model-eq[ŷ<sub>T+h</sub> = ℓ<sub>T</sub> + h b<sub>T</sub> + s<sub>T+h−7</sub>]

<div class="trio">
<div><b class="k">Level ℓ</b><span class="eq">ℓ<sub>t</sub> = α (y<sub>t</sub> − s<sub>t−7</sub>) + (1 − α)(ℓ<sub>t−1</sub> + b<sub>t−1</sub>)</span>The series without its season, smoothed as before.</div>
<div><b class="k">Trend b</b><span class="eq">b<sub>t</sub> = β (ℓ<sub>t</sub> − ℓ<sub>t−1</sub>) + (1 − β) b<sub>t−1</sub></span>The slope, the level's change per day, smoothed the same way: Holt, 1957.</div>
<div><b class="k">Season s</b><span class="eq">s<sub>t</sub> = γ (y<sub>t</sub> − ℓ<sub>t−1</sub> − b<sub>t−1</sub>) + (1 − γ) s<sub>t−7</sub></span>Each weekday's gap from the level, smoothed week by week: Winters, 1960.</div>
</div>

.lead.big.center[ETS, for Error, Trend and Seasonal, smooths a level, a trend and a season, and adds them up.]
]

.footnote[R. J. Hyndman and G. Athanasopoulos (2021), sections 8.2, 8.3 and 8.5: the additive Holt-Winters method, period 7.]

???

**ETS, for Error, Trend and Seasonal, smooths a level, a trend and a season, and adds them up.** Simple smoothing forecasts a flat line, which misses a series that grows or repeats a week. In 1957, Holt added a trend, b: the slope, how much the level changes per day, smoothed like the level with its own parameter β. In 1960, Winters added a season, s: each weekday's gap from the level, smoothed week by week with γ. Every day, each part moves part of the way toward what the new value says. The forecast h days ahead is the last level, plus h times the slope, plus that weekday's gap. Written with an error term, each such method becomes a statistical model, and three letters name its form. Which form should a series get?


---
class: stepwise-svg, vcenter
# Choosing an ETS form

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/ets.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Three exponential smoothing forms on the same rentals: a flat forecast, a forecast with a trend, and one with a trend and a weekly season; the form chosen by Akaike's information criterion"></object></div>
.step-5.lead.big.center[A criterion, the AIC, picks which error, trend and season a series gets.]
]

.footnote[R. J. Hyndman and G. Athanasopoulos (2021), sections 8.4 to 8.6; R. J. Hyndman et al. (2002). Data: H. Fanaee-T (2013), UCI dataset 275, .lic[CC BY 4.0].]

???

**A criterion, the AIC, picks which error, trend and season a series gets.** The letters name the form. The error is A, additive, or M, multiplicative; the trend N, none, A, or damped, flattening further ahead; the season N, A or M, as the seasons of *Reading a time series* were. The error term turns a smoothing method into a statistical model: it says how far the next value may fall from the forecast, so each form can be scored against the data. On the same rentals, ETS(A,N,N) is simple smoothing, ETS(A,A,N) adds a trend, ETS(A,A,A) a weekly season. More parts always fit the past better, so Akaike's information criterion, the AIC, charges each parameter, and the lowest wins. Chosen this way, ETS forecast about as well as the best methods of two M competitions. Could a model forecast from the autocorrelation instead?


---
class: vcenter
# How ARIMA works

.fullw[
.need[**ARIMA**: AutoRegressive Integrated Moving Average, made popular by Box and Jenkins in 1970.]

.model-eq.long[y′<sub>t</sub> = c + φ<sub>1</sub>y′<sub>t−1</sub> + … + φ<sub>p</sub>y′<sub>t−p</sub> + θ<sub>1</sub>ε<sub>t−1</sub> + … + θ<sub>q</sub>ε<sub>t−q</sub> + ε<sub>t</sub>]

<div class="trio">
<div><b class="k">AR: autoregressive</b>A regression of the series on its own past values, p of them, each with a weight φ.</div>
<div><b class="k">I: integrated</b>The model works on the series differenced d times, y′; integration, the reverse, turns its forecasts back into levels.</div>
<div><b class="k">MA: moving average</b>A weighted sum of the last q forecast errors ε, each weighted by θ; not the moving average that smooths a series.</div>
</div>

.lead.big.center[ARIMA forecasts a series from its own past values and past errors, after differencing.]
]

.footnote[R. J. Hyndman and G. Athanasopoulos (2021), sections 9.3 to 9.5 and 9.12.]

???

**ARIMA, for AutoRegressive Integrated Moving Average, forecasts a series from its own past values and its past errors, after differencing.** Box and Jenkins made it popular in 1970. Where smoothing describes a level, a trend and a season, ARIMA describes the autocorrelation: how each value relates to the ones before. Integrated: the model works on differences, the changes of *Reading a time series*, taken d times until they no longer drift; integration, the reverse, adds the forecast changes back up into levels. Autoregressive: the next change is a regression on the last p changes, each with a weight φ. Moving average: it also corrects itself with the last q forecast errors ε, the gaps between past forecasts and what happened, each weighted by θ. This moving average is not the one that drew the rentals' trend. How are p, d and q chosen?


---
class: stepwise-svg, vcenter
# ARIMA's orders

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/arima.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="ARIMA's three parts, past values, differences and past forecast errors; ARIMA(0,1,0) is the random walk; AutoARIMA searches the orders by the AICc"></object></div>
.step-4.lead.big.center[AutoARIMA chooses the orders p, d and q by itself.]
]

.footnote[R. J. Hyndman and G. Athanasopoulos (2021), sections 9.5 to 9.7 and table 9.1; R. J. Hyndman and Y. Khandakar (2008).]

???

**AutoARIMA chooses the orders p, d and q by itself.** A model is named ARIMA(p,d,q): p past values, d differences, q past errors. With one difference and nothing else, ARIMA(0,1,0), the forecast change is zero, so the forecast is the last value: the random walk. To choose, AutoARIMA first sets d with unit-root tests, which test whether a series still drifts and needs one more difference. Then it tries several p and q and keeps the pair with the lowest AICc, the AIC corrected for short series. Dataiku also reports P, D and Q, the same three orders for the weekly season. Orders are numbers on a screen: what does each one do to the forecast?


---
class: stepwise-svg, vcenter
# What d says: the long run

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/arima-long.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Four ARIMA forecasts of the rentals six weeks ahead: with no difference and a constant, the mean; with one past value, a decay back to the mean; with one difference, the last value held; with a drift, a straight line"></object></div>
.step-5.lead.big.center[With d = 0 the forecast returns to the mean; with d = 1 it holds the last level.]
]

.footnote[R. J. Hyndman and G. Athanasopoulos (2021), section 9.5; fitted with statsmodels. Data: H. Fanaee-T (2013), UCI, .lic[CC BY 4.0].]

???

**With d = 0 the forecast returns to the mean; with d = 1 it holds the last level.** Each panel fits one ARIMA to the same rentals, to 30 April 2011, and forecasts six weeks. With no difference and only a constant, ARIMA(0,0,0) forecasts the mean of the past, 2,044. Add one past value, ARIMA(1,0,0), and the forecast starts near the last day, at 4,434, then decays back to the mean: a model of the level without a difference expects the series to return to its mean. With one difference, ARIMA(0,1,0) holds the last value, 5,312; add a constant, the drift, and the forecast climbs 36 rentals a day along a straight line. So d decides the long run, where the forecast settles. What do p and q add in the days just ahead?


---
class: stepwise-svg, vcenter
# What p and q say: the short run

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/arima-short.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Three ARIMA forecasts with one difference: the last value; with one past change, part of the last jump undone, then flat; with one past error, a smoothed level, flat"></object></div>
.step-4.lead.big.center[p and q shape the first days ahead; then the forecast settles.]
]

.footnote[R. J. Hyndman and G. Athanasopoulos (2021), sections 9.5 and 9.10; fitted with statsmodels. Data: H. Fanaee-T (2013), UCI dataset 275, .lic[CC BY 4.0].]

???

**p and q shape the first days ahead; then the forecast settles.** All three panels have one difference. Without p or q, ARIMA(0,1,0) forecasts the last value, 5,312. With one past change, ARIMA(1,1,0), the fitted weight is φ = −0.37: after a jump, the next change tends to go the other way, so the forecast takes back part of the last day's rise and settles at 5,120 within days. With one past error, ARIMA(0,1,1), θ = −0.73: each forecast corrects the last by part of its error, so the forecast is a smoothed level, 4,427, held flat. That is simple exponential smoothing, with α = 1 + θ = 0.27: the two families meet here. And a weekly season: which orders carry it?


---
class: stepwise-svg, vcenter
# The seasonal orders: P, D, Q

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/arima-season.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Two seasonal ARIMA forecasts of the rentals: with one seasonal difference and nothing else, last week repeated; with seasonal and non-seasonal errors, a weekly pattern that keeps updating"></object></div>
.step-3.lead.big.center[The seasonal orders P, D and Q do the same with the same day of past weeks.]
]

.footnote[R. J. Hyndman and G. Athanasopoulos (2021), section 9.9; fitted with statsmodels. Data: H. Fanaee-T (2013), UCI dataset 275, .lic[CC BY 4.0].]

???

**The seasonal orders P, D and Q do the same with the same day of past weeks.** A seasonal ARIMA adds a second set of orders, written after the first with the season's period, here 7 days. D counts seasonal differences, the change from the same day a week before; P and Q use past values and past errors one, two or more weeks back. With one seasonal difference and nothing else, ARIMA(0,0,0)(0,1,0)₇, the forecast is last week, repeated: the seasonal naive of the simple forecasts. Add q = 1 and Q = 1, and the weekly pattern keeps being corrected by the errors; with a difference of each kind, it can also drift, here upward. When Dataiku reports P, D and Q of 0, the model has found no weekly season to use. How do we read a model's orders at a glance?


---
class: vcenter
# Reading ARIMA's orders

.fullw.terms[
<table style="width: 100%;" class="orders">
<tr><th>Orders</th><th>The forecast</th><th>The simple forecast it equals</th></tr>
<tr><td>(0,0,0) with a constant</td><td>the mean of the past</td><td>the mean</td></tr>
<tr><td>(0,1,0)</td><td>the last value, held</td><td>the last value, the naive forecast</td></tr>
<tr><td>(0,1,0) with a drift</td><td>a straight line from the last value</td><td>the drift line</td></tr>
<tr><td>(0,0,0)(0,1,0)<sub>7</sub></td><td>last week, repeated</td><td>the same day a week before</td></tr>
<tr><td>(0,1,1)</td><td>a smoothed level, held</td><td>simple exponential smoothing</td></tr>
<tr><td>(p,0,q)</td><td>a few days of moves, then back to the mean</td><td>none</td></tr>
<tr><td>(p,1,q)</td><td>a few days of moves, then a level held</td><td>none</td></tr>
</table>

.lead.big.center[The simple forecasts are ARIMA's simplest members.]
]

.footnote[R. J. Hyndman and G. Athanasopoulos (2021), sections 9.5, 9.9 and 9.10, table 9.1.]

???

**The simple forecasts are ARIMA's simplest members.** Read the middle order, d, for the long run: 0 brings the forecast back to the mean, 1 holds the last level. A constant with d = 1 turns the held level into a straight line. A seasonal D of 1 repeats last week. p and q only shape the first days. Four rows are the simple forecasts of the first part: the mean, the last value, the drift line and the same day a week before; and ARIMA(0,1,1) is simple exponential smoothing. So when AutoARIMA returns ARIMA(0,1,0) with seasonal orders of 0, it has found nothing better than the last value. Smoothing and ARIMA fit one series at a time: what if a firm has thousands?


---
class: stepwise-svg, vcenter
# Deep models

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/global.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A sketch: many related series feed one network; one series alone gives the network nothing to share"></object></div>
.step-3.lead.big.center[Deep models learn one network from many related series.]
]

.footnote[Dataiku DSS 13 documentation, time series forecasting; D. Salinas et al. (2020); S. Makridakis et al. (2023). A sketch.]

???

**Deep models learn one network from many related series.** A retailer forecasts the demand for each of its products, and the products resemble one another; some new ones have almost no history. A deep model, a neural network of the kind we met in *Deep learning*, learns one network from all these series at once, so each series gains from the others, and the network's many parameters have enough data to learn from. DeepAR is one such model. In Dataiku, the deep learning algorithms train one model on all the series; the statistical ones, one per series. Our index is a single series: the network would have nothing to share. With so many candidates, how do we tell which forecast is better?


---
.section-mark.part[
.kicker[Part 3 of 4]

# Judging a forecast

<div class="parts"><span>Simple forecasts</span><span>Models</span><span class="now">Judging a forecast</span><span>Hands-on 7</span></div>
]

???

**Part 3 is about judging a forecast: which tests are fair, and how to count a miss.** We'll test on the future and keep the future out of every preparation step. Then we choose how to measure a miss: in units, in percent, or scaled by the last value's own miss. Last, how far to trust a ± and a chart. But first: why not judge a model by how well it fits the past?


---
class: stepwise-svg, vcenter
# Test on the future

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/rolling.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Folds in time: each trains on all the days before its test set and tests on the next horizon; Dataiku steps back one horizon at a time"></object></div>
.step-3.lead.big.center[Train on the past, test on the next horizon, from several origins.]
]

.footnote[S. Makridakis et al. (2020); R. J. Hyndman and G. Athanasopoulos (2021), section 5.10; L. J. Tashman (2000); Dataiku DSS 13 documentation.]

???

**Train on the past, test on the next horizon, from several origins.** The M competitions showed that the model fitting the past best is often not the one that forecasts best, a result theoretical statisticians took long to accept. So each fold trains on all the days before a cut, the origin, and tests on the horizon after it, as the forecast would be used. One origin is not enough: a storm in the week after it would decide the score. Dataiku tests the last horizon first, then one horizon earlier with each fold. The order stays intact, where the shuffled folds of *Model selection and cross-validation* would break it. Can anything else carry the test days into training?


---
class: stepwise-svg, vcenter
# Leakage in time

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/leak.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A sketch: a seven-day average at the last training day reads three test days"></object></div>
.step-4.lead.big.center[A preparation computed on the whole series carries the test days into training.]
]

.footnote[H. Hewamalage et al. (2023), section 3.4. A sketch.]

???

**A preparation computed on the whole series carries the test days into training.** Leakage, in *Beyond binary classification*, was the use of information a model will not have when it is used; in a series, it comes in through time. In the sketch, day 27 is the last training day, and a seven-day average centred on it reads days 28 to 30, in the test. A model trained on that average has seen the test. Smoothing, decomposing or scaling the whole series before the split leaks in the same way. So every preparation is fitted on each fold's training days only, then applied to its test days. Each fold now gives one error per test day: how do we turn them into one score?


---
class: vcenter
# Which error costs more

.fullw[
<div class="duo big">
<div><b class="k">Mean absolute error</b><span class="eq">MAE = mean of |y − ŷ|</span>When every rental missed costs the same. The forecast that minimises it is the median.</div>
<div class="lit"><b class="k">Root mean squared error</b><span class="eq">RMSE = √ mean of (y − ŷ)²</span>When one large miss costs more than several small ones. The forecast that minimises it is the mean.</div>
</div>

.lead.big.center[The cost of a miss decides the measure.]
]

.footnote[R. J. Hyndman and G. Athanasopoulos (2021), section 5.8.]

???

**The cost of a miss decides the measure.** The mean absolute error, MAE, averages the sizes of the errors: missing by 100 rentals on two days counts as much as missing by 200 on one day and by nothing on the other. That fits when every rental missed costs the same, a ride lost at an empty station. The root mean squared error, RMSE, averages the squared errors and takes the root, so the single miss of 200 counts more: that fits when one large miss costs more than several small ones, a rush hour with no bikes. The forecast that minimises the MAE is the median of what may happen, the one that minimises the RMSE the mean. Both count in rentals: what if we must compare series in other units?


---
class: stepwise-svg, vcenter
# Errors in units and percent

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/mape.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The week of 28 October 2012: rentals fell to 22 on the 29th; the last value's errors in rentals and in percent, MAPE above 5,000%"></object></div>
.step-4.lead.big.center[MAPE, the mean absolute percentage error, explodes near zero.]
]

.footnote[R. J. Hyndman and G. Athanasopoulos (2021), section 5.8; H. Fanaee-T and J. Gama (2013), Table 4. Data: H. Fanaee-T (2013), UCI dataset 275, .lic[CC BY 4.0].]

???

**MAPE, the mean absolute percentage error, explodes near zero.** Take the week of Hurricane Sandy, 28 October to 3 November 2012, forecast by the last value before it, 7,852 rentals on 27 October. In rentals, the MAE is 3,836 and the RMSE 4,449, higher because the storm days missed most. But errors in rentals cannot compare series in different units, rentals and index points. A percentage error divides each error by the day's value, and MAPE is their mean. On the 29th only 22 bikes were rented, so a miss of 7,830 becomes 35,591%, and the week's MAPE 5,206%. On a day with none, it would be infinite. How can a measure be free of units without dividing by the day's value?


---
class: stepwise-svg, vcenter
# MASE

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/mase.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The scale: the mean change from one day to the next in training, 709 rentals; the hurricane week's error divided by it, MASE 5.41"></object></div>
.step-4.lead.big.center[MASE, the mean absolute scaled error, scales by the last value's one-step error.]
]

.footnote[R. J. Hyndman and A. B. Koehler (2006), sections 3 and 4; R. J. Hyndman and G. Athanasopoulos (2021), section 5.8.]

???

**MASE, the mean absolute scaled error, divides the error by the last value's one-step error in training.** Its scale comes from the training days: the mean size of the change from one day to the next, which is how far the last value missed, on average, one day ahead. Over the 665 changes up to 27 October 2012, that is 709 rentals. The hurricane week's MAE, 3,836, divided by 709 gives a MASE of 5.41. Below 1, a forecast misses less than the last value did one day ahead in training. A week ahead is harder than a day, so forecasts several steps ahead typically score above 1. Rentals or index points, the scale cancels the unit. Each fold gives one MASE: what does the ± over the folds tell us?


---
class: stepwise-svg, vcenter
# The ±

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/spread.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A sketch: two forecasts whose means and ± bars overlap, yet one is lower on 8 folds of 10"></object></div>
.step-3.lead.big.center[The ± is the spread of the fold scores, not a precision.]
]

.footnote[Dataiku DSS 13 documentation, K-fold cross-test; S. J. Taylor and B. Letham (2018), section 4.3. A sketch.]

???

**The ± is the spread of the fold scores, not a precision.** Dataiku reports each model's mean score over the folds with a ± of twice their standard deviation, as in *Model selection and cross-validation*. Time-ordered folds share most of their training days, so their scores are correlated, and ten folds carry less information than ten independent tests. In the sketch, drawn, not data, the bars of A and B overlap. Yet on the same folds, B is lower on 8 of 10: a week that is hard for A is hard for B too. So we compare models fold by fold. And a chart of the forecast against the series: can we trust our eyes?


---
class: stepwise-svg, vcenter
# The chart deceives

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/trail.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A simulated random walk and its forecast, the day before's value: on the chart they almost overlap; close up, the forecast is one day late"></object></div>
.step-4.lead.big.center[On a chart, a forecast one day late hugs the series.]
]

.footnote[H. Hewamalage et al. (2023), section 3.3. The walk is simulated.]

???

**On a chart, a forecast one day late hugs the series.** The series is a simulated random walk, and each day's forecast is the day before's value. On the chart, the two lines almost overlap, and the forecast looks excellent. Close up, it is one day late, every day. The eye reads the short horizontal gap between the lines, while the error is the vertical gap, the day's whole change. So a plot serves as a sanity check, to catch a forecast that is plainly wrong, and decisions rest on the error measures. We have the forecasts, the tests and the measures. What does the treasury team want forecast now?

**A one-day step fills the missing days with the last close, never with the next.** Hands-on 6's file holds 256 trading days of the Dow Jones, 1 October 2024 to 8 October 2025, and the target is `Close`. Dataiku's forecasting needs equally spaced steps, and trading days are not, so we take a step of one day: of the 373 calendar days, 117 have no close, the weekends and 11 holidays. Repeating the previous value fills a Saturday with Friday's close, known by then. A line to Monday would borrow Monday's close, unknown on Saturday, and, filled before the folds are cut, put a test value into a training set that ends on a weekend. The tail forecasts `Casual`, the casual riders: 731 days with a weekly season. How do we set up the session?
