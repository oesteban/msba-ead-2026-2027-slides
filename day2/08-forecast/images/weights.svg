<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- The weights simple exponential smoothing gives the last twelve days, α(1 - α)^k, for α = 0.8 and 0.2 (R. J. Hyndman and G. Athanasopoulos 2021, section 8.1). Drawn by Oscar Esteban, CC BY 4.0. -->
<defs>
