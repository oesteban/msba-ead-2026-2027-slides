<g data-step="3">
<text class="accent-fill" x="500" y="400" font-size="24" font-weight="bold" text-anchor="middle" fill="#00609c">ŷ<tspan baseline-shift='sub' font-size='14'>T+1</tspan> = α y<tspan baseline-shift='sub' font-size='14'>T</tspan> + α(1 − α) y<tspan baseline-shift='sub' font-size='14'>T−1</tspan> + α(1 − α)² y<tspan baseline-shift='sub' font-size='14'>T−2</tspan> + …</text>
<text x="500" y="442" font-size="17" font-weight="normal" text-anchor="middle" fill="#1c2e36">α = 1: all the weight on the last day, the naive forecast;   α near 0: almost equal weights, close to the mean</text>
</g>
</svg>
