<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- The parts of an ARIMA(p,d,q) model, the random walk as ARIMA(0,1,0), and the automatic search of R. J. Hyndman and Y. Khandakar (2008); after R. J. Hyndman and G. Athanasopoulos (2021), sections 9.5 to 9.7 and Table 9.1. Drawn by Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<rect x="40" y="20" width="280" height="120" rx="8" fill="#f4f6f7" stroke="#c9cfd2" stroke-width="1.4"/>
<text class="accent-fill" x="180" y="66" font-size="28" font-weight="bold" text-anchor="middle" fill="#00609c">AR  ·  p</text>
<text x="180" y="106" font-size="19" font-weight="normal" text-anchor="middle" fill="#1c2e36">past values</text>
<rect x="360" y="20" width="280" height="120" rx="8" fill="#f4f6f7" stroke="#c9cfd2" stroke-width="1.4"/>
<text class="accent-fill" x="500" y="66" font-size="28" font-weight="bold" text-anchor="middle" fill="#00609c">I  ·  d</text>
<text x="500" y="106" font-size="19" font-weight="normal" text-anchor="middle" fill="#1c2e36">differences</text>
<rect x="680" y="20" width="280" height="120" rx="8" fill="#f4f6f7" stroke="#c9cfd2" stroke-width="1.4"/>
<text class="accent-fill" x="820" y="66" font-size="28" font-weight="bold" text-anchor="middle" fill="#00609c">MA  ·  q</text>
<text x="820" y="106" font-size="19" font-weight="normal" text-anchor="middle" fill="#1c2e36">past errors</text>
</g>
<g data-step="2">
<rect class="accent-a-light-fill accent-stroke" x="40" y="180" width="920" height="90" rx="8" fill="#8cb3cf" stroke="#00609c" stroke-width="2"/>
<text x="70" y="216" font-size="21" font-weight="bold" text-anchor="start" fill="#1c2e36">ARIMA(0,1,0): one difference, no other term</text>
<text x="70" y="250" font-size="19" font-weight="normal" text-anchor="start" fill="#1c2e36">the random walk: its forecast is the last value</text>
</g>
<g data-step="3">
<text x="40" y="320" font-size="18" font-weight="bold" text-anchor="start" fill="#1c2e36">AutoARIMA: it chooses the differences, tries the other orders, keeps the lowest AICc</text>
<rect class="accent-a-light-fill accent-stroke" x="40" y="340" width="135" height="46" rx="6" fill="#8cb3cf" stroke="#00609c" stroke-width="2"/>
<text x="107" y="370" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">(0,1,0)</text>
<rect x="195" y="340" width="135" height="46" rx="6" fill="#ffffff" stroke="#9aa4a8" stroke-width="1.2"/>
<text x="262" y="370" font-size="18" font-weight="normal" text-anchor="middle" fill="#1c2e36">(1,1,0)</text>
<rect x="350" y="340" width="135" height="46" rx="6" fill="#ffffff" stroke="#9aa4a8" stroke-width="1.2"/>
<text x="417" y="370" font-size="18" font-weight="normal" text-anchor="middle" fill="#1c2e36">(0,1,1)</text>
<rect x="505" y="340" width="135" height="46" rx="6" fill="#ffffff" stroke="#9aa4a8" stroke-width="1.2"/>
<text x="572" y="370" font-size="18" font-weight="normal" text-anchor="middle" fill="#1c2e36">(1,1,1)</text>
<rect x="660" y="340" width="135" height="46" rx="6" fill="#ffffff" stroke="#9aa4a8" stroke-width="1.2"/>
<text x="727" y="370" font-size="18" font-weight="normal" text-anchor="middle" fill="#1c2e36">(2,1,2)</text>
<rect x="815" y="340" width="135" height="46" rx="6" fill="#ffffff" stroke="#9aa4a8" stroke-width="1.2"/>
<text x="882" y="370" font-size="18" font-weight="normal" text-anchor="middle" fill="#1c2e36">...</text>
</g>
</svg>
