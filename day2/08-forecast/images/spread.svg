<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- A drawn sketch, not data. The error margin Dataiku DSS shows after a K-fold cross-test is twice the standard deviation of the fold scores (DSS 13 documentation); the folds share most of their training days, so their scores are correlated (S. J. Taylor and B. Letham 2018, section 4.3). Drawn by Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<text x="80" y="26" font-size="17" font-weight="bold" text-anchor="start" fill="#1c2e36">mean ± twice the spread</text>
<line x1="80" y1="40" x2="80" y2="340" stroke="#9aa4a8" stroke-width="1.2"/>
<line x1="74" y1="340.0" x2="80" y2="340.0" stroke="#9aa4a8" stroke-width="1.2"/>
<text x="70" y="345.0" font-size="13" font-weight="normal" text-anchor="end" fill="#556268">0</text>
<line x1="74" y1="265.0" x2="80" y2="265.0" stroke="#9aa4a8" stroke-width="1.2"/>
<text x="70" y="270.0" font-size="13" font-weight="normal" text-anchor="end" fill="#556268">1</text>
<line x1="74" y1="190.0" x2="80" y2="190.0" stroke="#9aa4a8" stroke-width="1.2"/>
<text x="70" y="195.0" font-size="13" font-weight="normal" text-anchor="end" fill="#556268">2</text>
<line x1="74" y1="115.0" x2="80" y2="115.0" stroke="#9aa4a8" stroke-width="1.2"/>
<text x="70" y="120.0" font-size="13" font-weight="normal" text-anchor="end" fill="#556268">3</text>
<line x1="74" y1="40.0" x2="80" y2="40.0" stroke="#9aa4a8" stroke-width="1.2"/>
<text x="70" y="45.0" font-size="13" font-weight="normal" text-anchor="end" fill="#556268">4</text>
<line x1="180.0" y1="340.0" x2="180.0" y2="101.86764363646321" stroke="#1c2e36" stroke-width="3"/>
<circle cx="180.0" cy="228.2" r="9" fill="#1c2e36"/>
<text x="180.0" y="368.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#1c2e36">A</text>
<line class="accent-stroke" x1="280.0" y1="340.0" x2="280.0" y2="143.7159148000042" stroke="#00609c" stroke-width="3"/>
<circle cx="280.0" cy="245.5" r="9" fill="#00609c" class="accent-fill"/>
<text class="accent-fill" x="280.0" y="368.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#00609c">B</text>
</g>
<g data-step="2">
<text x="470" y="26" font-size="17" font-weight="bold" text-anchor="start" fill="#1c2e36">fold by fold</text>
<line x1="470" y1="340" x2="950" y2="340" stroke="#9aa4a8" stroke-width="1.2"/>
<line x1="494.0" y1="340" x2="494.0" y2="346" stroke="#9aa4a8" stroke-width="1.2"/>
<text x="494.0" y="364" font-size="13" font-weight="normal" text-anchor="middle" fill="#556268">1</text>
