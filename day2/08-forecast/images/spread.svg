<text x="734.0" y="364" font-size="13" font-weight="normal" text-anchor="middle" fill="#556268">6</text>
<line x1="782.0" y1="340" x2="782.0" y2="346" stroke="#9aa4a8" stroke-width="1.2"/>
<text x="782.0" y="364" font-size="13" font-weight="normal" text-anchor="middle" fill="#556268">7</text>
<line x1="830.0" y1="340" x2="830.0" y2="346" stroke="#9aa4a8" stroke-width="1.2"/>
<text x="830.0" y="364" font-size="13" font-weight="normal" text-anchor="middle" fill="#556268">8</text>
<line x1="878.0" y1="340" x2="878.0" y2="346" stroke="#9aa4a8" stroke-width="1.2"/>
<text x="878.0" y="364" font-size="13" font-weight="normal" text-anchor="middle" fill="#556268">9</text>
<line x1="926.0" y1="340" x2="926.0" y2="346" stroke="#9aa4a8" stroke-width="1.2"/>
<text x="926.0" y="364" font-size="13" font-weight="normal" text-anchor="middle" fill="#556268">10</text>
<line class="accent-stroke" x1="494.0" y1="265.0" x2="494.0" y2="280.0" stroke="#00609c" stroke-width="2"/>
<circle cx="494.0" cy="265.0" r="6" fill="#1c2e36"/>
<circle class="accent-fill" cx="494.0" cy="280.0" r="6" fill="#00609c"/>
<line class="accent-stroke" x1="542.0" y1="160.0" x2="542.0" y2="190.0" stroke="#00609c" stroke-width="2"/>
<circle cx="542.0" cy="160.0" r="6" fill="#1c2e36"/>
<circle class="accent-fill" cx="542.0" cy="190.0" r="6" fill="#00609c"/>
<line x1="590.0" y1="220.0" x2="590.0" y2="212.5" stroke="#da232f" stroke-width="2"/>
<circle cx="590.0" cy="220.0" r="6" fill="#1c2e36"/>
<circle class="accent-fill" cx="590.0" cy="212.5" r="6" fill="#00609c"/>
<line class="accent-stroke" x1="638.0" y1="235.0" x2="638.0" y2="257.5" stroke="#00609c" stroke-width="2"/>
<circle cx="638.0" cy="235.0" r="6" fill="#1c2e36"/>
<circle class="accent-fill" cx="638.0" cy="257.5" r="6" fill="#00609c"/>
<line class="accent-stroke" x1="686.0" y1="85.0" x2="686.0" y2="137.5" stroke="#00609c" stroke-width="2"/>
<circle cx="686.0" cy="85.0" r="6" fill="#1c2e36"/>
<circle class="accent-fill" cx="686.0" cy="137.5" r="6" fill="#00609c"/>
<line class="accent-stroke" x1="734.0" y1="227.5" x2="734.0" y2="250.0" stroke="#00609c" stroke-width="2"/>
<circle cx="734.0" cy="227.5" r="6" fill="#1c2e36"/>
<circle class="accent-fill" cx="734.0" cy="250.0" r="6" fill="#00609c"/>
<line class="accent-stroke" x1="782.0" y1="242.5" x2="782.0" y2="265.0" stroke="#00609c" stroke-width="2"/>
<circle cx="782.0" cy="242.5" r="6" fill="#1c2e36"/>
<circle class="accent-fill" cx="782.0" cy="265.0" r="6" fill="#00609c"/>
<line x1="830.0" y1="280.0" x2="830.0" y2="272.5" stroke="#da232f" stroke-width="2"/>
<circle cx="830.0" cy="280.0" r="6" fill="#1c2e36"/>
<circle class="accent-fill" cx="830.0" cy="272.5" r="6" fill="#00609c"/>
<line class="accent-stroke" x1="878.0" y1="295.0" x2="878.0" y2="302.5" stroke="#00609c" stroke-width="2"/>
<circle cx="878.0" cy="295.0" r="6" fill="#1c2e36"/>
<circle class="accent-fill" cx="878.0" cy="302.5" r="6" fill="#00609c"/>
<line class="accent-stroke" x1="926.0" y1="272.5" x2="926.0" y2="287.5" stroke="#00609c" stroke-width="2"/>
<circle cx="926.0" cy="272.5" r="6" fill="#1c2e36"/>
<circle class="accent-fill" cx="926.0" cy="287.5" r="6" fill="#00609c"/>
<text class="accent-fill" x="710" y="400" font-size="19" font-weight="bold" text-anchor="middle" fill="#00609c">B is lower on 8 folds of 10</text>
</g>
</svg>
