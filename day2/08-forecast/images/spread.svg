<text x="542.0" y="364" font-size="13" font-weight="normal" text-anchor="middle" fill="#556268">2</text>
<line x1="590.0" y1="340" x2="590.0" y2="346" stroke="#9aa4a8" stroke-width="1.2"/>
<text x="590.0" y="364" font-size="13" font-weight="normal" text-anchor="middle" fill="#556268">3</text>
<line x1="638.0" y1="340" x2="638.0" y2="346" stroke="#9aa4a8" stroke-width="1.2"/>
<text x="638.0" y="364" font-size="13" font-weight="normal" text-anchor="middle" fill="#556268">4</text>
<line x1="686.0" y1="340" x2="686.0" y2="346" stroke="#9aa4a8" stroke-width="1.2"/>
<text x="686.0" y="364" font-size="13" font-weight="normal" text-anchor="middle" fill="#556268">5</text>
