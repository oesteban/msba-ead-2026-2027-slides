<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- Daily rentals to 2011-04-30 (grey, the last six weeks shown), their exponentially smoothed level for α = 0.8 and 0.2, started at the first day, and each level's flat forecast two weeks ahead (R. J. Hyndman and G. Athanasopoulos 2021, section 8.1). Data: Capital Bikeshare daily rentals, 2011 and 2012, H. Fanaee-T (2013), UCI dataset 275, CC BY 4.0. Drawn by Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
