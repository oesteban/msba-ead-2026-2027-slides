<g data-step="4">
<text class="accent-fill" x="500" y="400" font-size="24" font-weight="bold" text-anchor="middle" fill="#00609c">ℓ<tspan baseline-shift='sub' font-size='14'>t</tspan> = ℓ<tspan baseline-shift='sub' font-size='14'>t−1</tspan> + α (y<tspan baseline-shift='sub' font-size='14'>t</tspan> − ℓ<tspan baseline-shift='sub' font-size='14'>t−1</tspan>);   the forecast: ŷ<tspan baseline-shift='sub' font-size='14'>T+h</tspan> = ℓ<tspan baseline-shift='sub' font-size='14'>T</tspan></text>
<text x="500" y="440" font-size="17" font-weight="normal" text-anchor="middle" fill="#1c2e36">ℓ: the level;  α, the smoothing parameter, between 0 and 1: how far the level moves toward each new value</text>
