<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 492" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- Daily rentals to 2011-04-30 (grey, the last six weeks shown), their exponentially smoothed level for α = 0.8 and 0.2, started at the first day, and each level's flat forecast two weeks ahead (R. J. Hyndman and G. Athanasopoulos 2021, section 8.1). Data: Capital Bikeshare daily rentals, 2011 and 2012, H. Fanaee-T (2013), UCI dataset 275, CC BY 4.0. Drawn by Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<line x1="80" y1="30" x2="80" y2="292" stroke="#9aa4a8" stroke-width="1.2"/>
<line x1="74" y1="292.0" x2="80" y2="292.0" stroke="#9aa4a8" stroke-width="1.2"/>
<text x="70" y="297.0" font-size="14" font-weight="normal" text-anchor="end" fill="#556268">0</text>
<line x1="74" y1="182.83333333333331" x2="80" y2="182.83333333333331" stroke="#9aa4a8" stroke-width="1.2"/>
<text x="70" y="187.83333333333331" font-size="14" font-weight="normal" text-anchor="end" fill="#556268">3,000</text>
<line x1="74" y1="73.66666666666666" x2="80" y2="73.66666666666666" stroke="#9aa4a8" stroke-width="1.2"/>
<text x="70" y="78.66666666666666" font-size="14" font-weight="normal" text-anchor="end" fill="#556268">6,000</text>
<line x1="751.5454545454545" y1="30" x2="751.5454545454545" y2="292" stroke="#9aa4a8" stroke-width="1.2" stroke-dasharray="5 4"/>
<polyline points="80.0,202.1 96.2,216.4 112.4,193.6 128.5,214.8 144.7,224.1 160.9,211.6 177.1,201.2 193.3,230.4 209.5,218.2 225.6,203.8 241.8,236.1 258.0,230.7 274.2,211.0 290.4,210.1 306.5,173.8 322.7,178.6 338.9,226.7 355.1,189.8 371.3,177.7 387.5,238.5 403.6,202.7 419.8,186.7 436.0,170.2 452.2,218.0 468.4,213.3 484.5,173.1 500.7,178.2 516.9,263.1 533.1,155.8 549.3,167.2 565.5,175.4 581.6,148.5 597.8,139.6 614.0,230.8 630.2,145.1 646.4,139.5 662.5,143.8 678.7,131.9 694.9,151.1 711.1,144.3 727.3,124.8 743.5,98.7" fill="none" stroke="#9aa4a8" stroke-width="1.4" stroke-linejoin="round"/>
<text x="80" y="18" font-size="15" font-weight="normal" text-anchor="start" fill="#556268">rentals a day, to 30 April 2011, and two weeks ahead</text>
</g>
<g data-step="2">
<polyline points="80.0,197.4 96.2,212.6 112.4,197.4 128.5,211.3 144.7,221.6 160.9,213.6 177.1,203.7 193.3,225.0 209.5,219.6 225.6,206.9 241.8,230.3 258.0,230.6 274.2,214.9 290.4,211.0 306.5,181.2 322.7,179.2 338.9,217.2 355.1,195.3 371.3,181.2 387.5,227.0 403.6,207.5 419.8,190.8 436.0,174.3 452.2,209.2 468.4,212.5 484.5,181.0 500.7,178.8 516.9,246.2 533.1,173.9 549.3,168.5 565.5,174.0 581.6,153.6 597.8,142.4 614.0,213.1 630.2,158.7 646.4,143.3 662.5,143.7 678.7,134.3 694.9,147.7 711.1,145.0 727.3,128.8 743.5,104.7" fill="none" stroke="#1c2e36" stroke-width="3" stroke-linejoin="round"/>
<polyline points="759.6,104.7 775.8,104.7 792.0,104.7 808.2,104.7 824.4,104.7 840.5,104.7 856.7,104.7 872.9,104.7 889.1,104.7 905.3,104.7 921.5,104.7 937.6,104.7 953.8,104.7 970.0,104.7" fill="none" stroke="#1c2e36" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 5"/>
<text x="970.0" y="90.72920661731294" font-size="17" font-weight="bold" text-anchor="end" fill="#1c2e36">α = 0.8: forecast 5,146</text>
</g>
<g data-step="3">
<polyline class="accent-stroke" points="80.0,200.9 96.2,204.0 112.4,201.9 128.5,204.5 144.7,208.4 160.9,209.1 177.1,207.5 193.3,212.1 209.5,213.3 225.6,211.4 241.8,216.3 258.0,219.2 274.2,217.6 290.4,216.1 306.5,207.6 322.7,201.8 338.9,206.8 355.1,203.4 371.3,198.3 387.5,206.3 403.6,205.6 419.8,201.8 436.0,195.5 452.2,200.0 468.4,202.6 484.5,196.7 500.7,193.0 516.9,207.0 533.1,196.8 549.3,190.9 565.5,187.8 581.6,179.9 597.8,171.9 614.0,183.6 630.2,175.9 646.4,168.6 662.5,163.7 678.7,157.3 694.9,156.1 711.1,153.7 727.3,147.9 743.5,138.1" fill="none" stroke="#00609c" stroke-width="3" stroke-linejoin="round"/>
<polyline class="accent-stroke" points="759.6,138.1 775.8,138.1 792.0,138.1 808.2,138.1 824.4,138.1 840.5,138.1 856.7,138.1 872.9,138.1 889.1,138.1 905.3,138.1 921.5,138.1 937.6,138.1 953.8,138.1 970.0,138.1" fill="none" stroke="#00609c" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 5"/>
<text class="accent-fill" x="970.0" y="164.09182055952107" font-size="17" font-weight="bold" text-anchor="end" fill="#00609c">α = 0.2: forecast 4,230</text>
</g>
<g data-step="4">
<text class="accent-fill" x="500" y="342" font-size="24" font-weight="bold" text-anchor="middle" fill="#00609c">ℓ<tspan baseline-shift='sub' font-size='14'>t</tspan> = α y<tspan baseline-shift='sub' font-size='14'>t</tspan> + (1 − α) ℓ<tspan baseline-shift='sub' font-size='14'>t−1</tspan></text>
<text x="500" y="374" font-size="17" font-weight="normal" text-anchor="middle" fill="#1c2e36">ℓ, the level: the new day weighs α and the level before it 1 − α, the same α as the weights</text>
</g>
<g data-step="5">
<text class="accent-fill" x="500" y="428" font-size="24" font-weight="bold" text-anchor="middle" fill="#00609c">ℓ<tspan baseline-shift='sub' font-size='14'>T</tspan> = α y<tspan baseline-shift='sub' font-size='14'>T</tspan> + α(1 − α) y<tspan baseline-shift='sub' font-size='14'>T−1</tspan> + …  =  ŷ<tspan baseline-shift='sub' font-size='14'>T+1</tspan> = ŷ<tspan baseline-shift='sub' font-size='14'>T+2</tspan> = …</text>
<text x="500" y="460" font-size="17" font-weight="normal" text-anchor="middle" fill="#1c2e36">unrolled, the last level is the weighted average of the days up to T: tomorrow's forecast</text>
<text x="500" y="484" font-size="17" font-weight="normal" text-anchor="middle" fill="#1c2e36">with no trend or season to tell the days apart, every later day gets the same forecast</text>
</g>
</svg>
