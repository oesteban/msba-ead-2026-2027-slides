<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 318" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- Forecasts six weeks ahead of two seasonal ARIMA models, period 7 days, fitted with statsmodels to the daily rentals to 2011-04-30; the seasonal orders (P, D, Q) act on the same day of past weeks (R. J. Hyndman and G. Athanasopoulos 2021, section 9.9). Data: Capital Bikeshare daily rentals, 2011 and 2012, H. Fanaee-T (2013), UCI dataset 275, CC BY 4.0. Drawn by Oscar Esteban, CC BY 4.0. -->
