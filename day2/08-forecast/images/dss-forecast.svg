<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- A drawing, not a capture, of the settings of a Time Series Forecasting analysis in Dataiku DSS and the order in which Hands-on 7 trains its algorithms; labels after the DSS 13 documentation and the 2025 course server, to be checked on DSS 15.0. Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<rect x="20" y="20" width="220" height="468" rx="4" fill="#f4f6f7" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="42" y="60" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">General settings</text>
<text x="42" y="106" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">Train / Test Set</text>
<text x="42" y="152" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">Metrics</text>
<text x="42" y="198" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">Algorithms</text>
<rect x="256" y="20" width="724" height="120" rx="4" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="276" y="50" font-size="18" font-weight="bold" text-anchor="start" fill="#1c2e36">General settings</text>
<text x="296" y="84" font-size="16" font-weight="normal" text-anchor="start" fill="#1c2e36">Time step</text>
<rect class="accent-stroke" x="626" y="60" width="150" height="34" rx="4" fill="#ffffff" stroke="#00609c" stroke-width="2"/>
<text x="701.0" y="84" font-size="16" font-weight="bold" text-anchor="middle" fill="#1c2e36">1 Day</text>
<text x="296" y="124" font-size="16" font-weight="normal" text-anchor="start" fill="#1c2e36">Forecast horizon (in time steps)</text>
<rect class="accent-stroke" x="626" y="100" width="150" height="34" rx="4" fill="#ffffff" stroke="#00609c" stroke-width="2"/>
<text x="701.0" y="124" font-size="16" font-weight="bold" text-anchor="middle" fill="#1c2e36">7</text>
</g>
<g data-step="2">
<rect x="256" y="152" width="724" height="140" rx="4" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="276" y="182" font-size="18" font-weight="bold" text-anchor="start" fill="#1c2e36">Train / Test Set</text>
<text x="296" y="216" font-size="16" font-weight="normal" text-anchor="start" fill="#1c2e36">Numerical interpolation</text>
<rect class="accent-stroke" x="626" y="192" width="180" height="34" rx="4" fill="#ffffff" stroke="#00609c" stroke-width="2"/>
<text x="716.0" y="216" font-size="16" font-weight="bold" text-anchor="middle" fill="#1c2e36">previous value</text>
<text x="296" y="256" font-size="16" font-weight="normal" text-anchor="start" fill="#1c2e36">K-fold cross-test, number of folds</text>
<rect class="accent-stroke" x="626" y="232" width="150" height="34" rx="4" fill="#ffffff" stroke="#00609c" stroke-width="2"/>
<text x="701.0" y="256" font-size="16" font-weight="bold" text-anchor="middle" fill="#1c2e36">10</text>
<text x="296" y="284" font-size="16" font-weight="normal" text-anchor="start" fill="#556268">Fold offset: ticked</text>
</g>
<g data-step="3">
<rect x="256" y="304" width="724" height="76" rx="4" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="276" y="334" font-size="18" font-weight="bold" text-anchor="start" fill="#1c2e36">Metrics</text>
<text class="accent-fill" x="296" y="364" font-size="17" font-weight="bold" text-anchor="start" fill="#00609c">Mean Absolute Scaled Error</text>
</g>
<g data-step="4">
<rect x="256" y="392" width="724" height="96" rx="4" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="276" y="422" font-size="18" font-weight="bold" text-anchor="start" fill="#1c2e36">Algorithms</text>
<text x="296" y="456" font-size="16" font-weight="normal" text-anchor="start" fill="#556268">first:</text>
<text class="accent-fill" x="350" y="456" font-size="17" font-weight="bold" text-anchor="start" fill="#00609c">Trivial identity (the last value), Seasonal naive (season 7)</text>
<text x="296" y="480" font-size="16" font-weight="normal" text-anchor="start" fill="#556268">then:</text>
<text x="350" y="480" font-size="17" font-weight="bold" text-anchor="start" fill="#1c2e36">AutoARIMA, ETS, each read beside Trivial identity</text>
</g>
</svg>
