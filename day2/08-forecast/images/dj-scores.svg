<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- MASE of four forecasts of the Dow Jones close, horizon 7 days, 10 folds with an offset as Dataiku DSS lays them out, tests from 2025-05-29 to 2025-10-08, on the module's extract put on a one-day step with the previous value repeated; models fitted with statsmodels (ETS and ARIMA chosen by AICc). 'Beats it': folds where the forecast scores below the last value. Statistics only. Drawn by Oscar Esteban, CC BY 4.0. -->
