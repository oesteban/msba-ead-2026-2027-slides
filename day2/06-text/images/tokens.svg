<rect class="accent-stroke" x="556.6999999999999" y="60" width="70.80000000000001" height="35.0" rx="6" fill="#ffffff" stroke="#00609c" stroke-width="2"/>
<text x="592.0999999999999" y="84.7" font-size="20" font-weight="normal" text-anchor="middle" fill="#1c2e36">does</text>
