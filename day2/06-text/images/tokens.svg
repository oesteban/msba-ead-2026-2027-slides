<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- Subword tokens: 'lower' as 'low' and 'er', a very rare acronym such as 'GRPO' as letters (Jurafsky & Martin 2026, section 2.4); the split of 'screen' illustrative. Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<text x="190" y="80" font-size="25" font-weight="normal" text-anchor="end" fill="#1c2e36">“screen”</text>
<line x1="210" y1="71" x2="268" y2="71" stroke="#1c2e36" stroke-width="1.8" marker-end="url(#ah)"/>
<rect class="accent-a-light-fill accent-stroke" x="282" y="50" width="99.92" height="38.5" rx="6" fill="#8cb3cf" stroke="#00609c" stroke-width="2"/>
<text x="331.96" y="77.17" font-size="22" font-weight="normal" text-anchor="middle" fill="#1c2e36">screen</text>
<text x="560" y="78" font-size="19" font-weight="normal" text-anchor="start" fill="#1c2e36">a common word: one token</text>
</g>
<g data-step="2">
<text x="190" y="176" font-size="25" font-weight="normal" text-anchor="end" fill="#1c2e36">“lower”</text>
<line x1="210" y1="167" x2="268" y2="167" stroke="#1c2e36" stroke-width="1.8" marker-end="url(#ah)"/>
<rect class="accent-a-light-fill accent-stroke" x="282" y="146" width="57.900000000000006" height="38.5" rx="6" fill="#8cb3cf" stroke="#00609c" stroke-width="2"/>
<text x="310.95" y="173.17" font-size="22" font-weight="normal" text-anchor="middle" fill="#1c2e36">low</text>
<rect class="accent-a-light-fill accent-stroke" x="347.9" y="146" width="50.64" height="38.5" rx="6" fill="#8cb3cf" stroke="#00609c" stroke-width="2"/>
<text x="373.21999999999997" y="173.17" font-size="22" font-weight="normal" text-anchor="middle" fill="#1c2e36">er</text>
<text x="560" y="174" font-size="19" font-weight="normal" text-anchor="start" fill="#1c2e36">not seen in training: known pieces</text>
</g>
<g data-step="3">
<text x="190" y="272" font-size="25" font-weight="normal" text-anchor="end" fill="#1c2e36">“GRPO”</text>
<line x1="210" y1="263" x2="268" y2="263" stroke="#1c2e36" stroke-width="1.8" marker-end="url(#ah)"/>
<rect class="accent-a-light-fill accent-stroke" x="282" y="242" width="39.64" height="38.5" rx="6" fill="#8cb3cf" stroke="#00609c" stroke-width="2"/>
<text x="301.82" y="269.17" font-size="22" font-weight="normal" text-anchor="middle" fill="#1c2e36">G</text>
<rect class="accent-a-light-fill accent-stroke" x="329.64" y="242" width="39.64" height="38.5" rx="6" fill="#8cb3cf" stroke="#00609c" stroke-width="2"/>
<text x="349.46" y="269.17" font-size="22" font-weight="normal" text-anchor="middle" fill="#1c2e36">R</text>
<rect class="accent-a-light-fill accent-stroke" x="377.28" y="242" width="39.64" height="38.5" rx="6" fill="#8cb3cf" stroke="#00609c" stroke-width="2"/>
<text x="397.09999999999997" y="269.17" font-size="22" font-weight="normal" text-anchor="middle" fill="#1c2e36">P</text>
<rect class="accent-a-light-fill accent-stroke" x="424.91999999999996" y="242" width="39.64" height="38.5" rx="6" fill="#8cb3cf" stroke="#00609c" stroke-width="2"/>
<text x="444.73999999999995" y="269.17" font-size="22" font-weight="normal" text-anchor="middle" fill="#1c2e36">O</text>
<text x="560" y="270" font-size="19" font-weight="normal" text-anchor="start" fill="#1c2e36">very rare: in the worst case, letters</text>
</g>
</svg>
