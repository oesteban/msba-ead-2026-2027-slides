<rect class="accent-a-light-fill accent-stroke" x="487.2" y="164" width="115.60000000000001" height="35.0" rx="6" fill="#8cb3cf" stroke="#00609c" stroke-width="2"/>
<text x="545.0" y="188.7" font-size="20" font-weight="normal" text-anchor="middle" fill="#1c2e36">##screen</text>
</g>
<g data-step="3">
<text x="40" y="254" font-size="18" font-weight="bold" text-anchor="start" fill="#1c2e36">“overheating”</text>
<text x="960" y="254" font-size="17" font-weight="normal" text-anchor="end" fill="#556268">pieces need not mean anything</text>
<rect class="accent-a-light-fill accent-stroke" x="371.29999999999995" y="268" width="70.80000000000001" height="35.0" rx="6" fill="#8cb3cf" stroke="#00609c" stroke-width="2"/>
<text x="406.69999999999993" y="292.7" font-size="20" font-weight="normal" text-anchor="middle" fill="#1c2e36">over</text>
<rect class="accent-a-light-fill accent-stroke" x="450.09999999999997" y="268" width="82.0" height="35.0" rx="6" fill="#8cb3cf" stroke="#00609c" stroke-width="2"/>
<text x="491.09999999999997" y="292.7" font-size="20" font-weight="normal" text-anchor="middle" fill="#1c2e36">##hea</text>
<rect class="accent-a-light-fill accent-stroke" x="540.0999999999999" y="268" width="88.60000000000001" height="35.0" rx="6" fill="#8cb3cf" stroke="#00609c" stroke-width="2"/>
<text x="584.3999999999999" y="292.7" font-size="20" font-weight="normal" text-anchor="middle" fill="#1c2e36">##ting</text>
</g>
<g data-step="4">
<text x="500" y="346" font-size="17" font-weight="normal" text-anchor="middle" fill="#1c2e36">BERT's vocabulary: 30,522 tokens; “##” marks a piece that continues a word</text>
