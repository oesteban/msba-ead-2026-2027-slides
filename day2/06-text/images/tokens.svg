<rect class="accent-stroke" x="822.5000000000001" y="60" width="59.6" height="35.0" rx="6" fill="#ffffff" stroke="#00609c" stroke-width="2"/>
<text x="852.3000000000001" y="84.7" font-size="20" font-weight="normal" text-anchor="middle" fill="#1c2e36">day</text>
<rect class="accent-stroke" x="890.1000000000001" y="60" width="32.6" height="35.0" rx="6" fill="#ffffff" stroke="#00609c" stroke-width="2"/>
<text x="906.4000000000001" y="84.7" font-size="20" font-weight="normal" text-anchor="middle" fill="#1c2e36">.</text>
</g>
<g data-step="2">
<text x="40" y="150" font-size="18" font-weight="bold" text-anchor="start" fill="#1c2e36">“touchscreen”</text>
<text x="960" y="150" font-size="17" font-weight="normal" text-anchor="end" fill="#556268">a rarer word: two known pieces</text>
<rect class="accent-a-light-fill accent-stroke" x="397.2" y="164" width="82.0" height="35.0" rx="6" fill="#8cb3cf" stroke="#00609c" stroke-width="2"/>
