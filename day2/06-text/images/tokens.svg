<text x="284.79999999999995" y="84.7" font-size="20" font-weight="normal" text-anchor="middle" fill="#1c2e36">,</text>
<rect class="accent-stroke" x="309.09999999999997" y="60" width="59.6" height="35.0" rx="6" fill="#ffffff" stroke="#00609c" stroke-width="2"/>
