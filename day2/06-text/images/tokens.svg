<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- BERT base uncased's WordPiece tokenizer (Devlin et al. 2019, p. 4), run by text.py: lower case, then whole words or pieces from a vocabulary of 30,522. Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<text x="40" y="46" font-size="18" font-weight="bold" text-anchor="start" fill="#1c2e36">the review</text>
<text x="960" y="46" font-size="17" font-weight="normal" text-anchor="end" fill="#556268">every word and mark is one token</text>
<rect class="accent-stroke" x="77.29999999999995" y="60" width="82.0" height="35.0" rx="6" fill="#ffffff" stroke="#00609c" stroke-width="2"/>
<text x="118.29999999999995" y="84.7" font-size="20" font-weight="normal" text-anchor="middle" fill="#1c2e36">great</text>
