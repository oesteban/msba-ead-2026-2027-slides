<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- The care team's scenario: a missed unhappy review costs four times a wasted reading, so the threshold is cost(FP) / (cost(FP) + cost(FN)) = 1 / (1 + 4) = 0.2. A scenario, not data. Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<rect x="60" y="30" width="400" height="120" rx="8" fill="#ffffff" stroke="#da232f" stroke-width="2.4"/>
<text x="84" y="70" font-size="19" font-weight="normal" text-anchor="start" fill="#1c2e36">missed: an unhappy review left unread</text>
<text x="260" y="128" font-size="30" font-weight="bold" text-anchor="middle" fill="#da232f">costs 4</text>
<rect x="540" y="30" width="400" height="120" rx="8" fill="#ffffff" stroke="#9aa4a8" stroke-width="2"/>
<text x="564" y="70" font-size="19" font-weight="normal" text-anchor="start" fill="#1c2e36">wasted: a happy review read</text>
<text x="740" y="128" font-size="30" font-weight="bold" text-anchor="middle" fill="#1c2e36">costs 1</text>
</g>
<g data-step="2">
<line x1="80" y1="250" x2="920" y2="250" stroke="#1c2e36" stroke-width="2"/>
<line x1="80" y1="242" x2="80" y2="258" stroke="#1c2e36" stroke-width="2"/>
<text x="80" y="284" font-size="18" font-weight="normal" text-anchor="middle" fill="#1c2e36">0</text>
<line x1="248.0" y1="242" x2="248.0" y2="258" stroke="#1c2e36" stroke-width="2"/>
<text x="248.0" y="284" font-size="18" font-weight="normal" text-anchor="middle" fill="#1c2e36">0.2</text>
<line x1="500.0" y1="242" x2="500.0" y2="258" stroke="#1c2e36" stroke-width="2"/>
<text x="500.0" y="284" font-size="18" font-weight="normal" text-anchor="middle" fill="#1c2e36">0.5</text>
<line x1="920" y1="242" x2="920" y2="258" stroke="#1c2e36" stroke-width="2"/>
<text x="920" y="284" font-size="18" font-weight="normal" text-anchor="middle" fill="#1c2e36">1</text>
<text x="500" y="316" font-size="17" font-weight="normal" text-anchor="middle" fill="#556268">P(unhappy), the model's score for one review</text>
<text x="500.0" y="228" font-size="17" font-weight="normal" text-anchor="middle" fill="#556268">default 0.5</text>
</g>
<g data-step="3">
<path class="accent-stroke" d="M 248.0 246 L 248.0 204" fill="none" stroke="#00609c" stroke-width="3" marker-end="url(#)"/>
<text class="accent-fill" x="248.0" y="194" font-size="21" font-weight="bold" text-anchor="middle" fill="#00609c">read from 0.2 = 1 / (1 + 4)</text>
</g>
</svg>
