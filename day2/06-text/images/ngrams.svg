<text x="40" y="188" font-size="17" font-weight="normal" text-anchor="start" fill="#556268">review 2</text>
<rect class="accent-stroke" x="253.0" y="200" width="62.96" height="38.5" rx="6" fill="#ffffff" stroke="#00609c" stroke-width="2"/>
<text x="284.48" y="227.17" font-size="22" font-weight="normal" text-anchor="middle" fill="#1c2e36">not</text>
<rect class="accent-stroke" x="329.96000000000004" y="200" width="87.60000000000001" height="38.5" rx="6" fill="#ffffff" stroke="#00609c" stroke-width="2"/>
<text x="373.76000000000005" y="227.17" font-size="22" font-weight="normal" text-anchor="middle" fill="#1c2e36">great</text>
<rect class="accent-stroke" x="431.56000000000006" y="200" width="99.92" height="38.5" rx="6" fill="#ffffff" stroke="#00609c" stroke-width="2"/>
<text x="481.52000000000004" y="227.17" font-size="22" font-weight="normal" text-anchor="middle" fill="#1c2e36">screen</text>
<rect class="accent-stroke" x="545.48" y="200" width="112.24000000000001" height="38.5" rx="6" fill="#ffffff" stroke="#00609c" stroke-width="2"/>
