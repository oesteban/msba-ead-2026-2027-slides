<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- Word pairs (bi-grams) of the deck's reviews after stop words but 'not' are removed; 9 distinct pairs (Provost & Fawcett 2013, pp. 263 to 264). Oscar Esteban, CC BY 4.0. -->
<defs>
