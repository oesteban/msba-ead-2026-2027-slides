<g data-step="2">
<path class="accent-stroke" d="M 558.8100000000002 110 L 558.8100000000002 122 L 705.9900000000002 122 L 705.9900000000002 110" fill="none" stroke="#00609c" stroke-width="2.4" marker-end="url(#)"/>
<text class="accent-fill" x="632.4000000000002" y="150" font-size="21" font-weight="bold" text-anchor="middle" fill="#00609c">“not last”</text>
