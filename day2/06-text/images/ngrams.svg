<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<text x="40" y="48" font-size="17" font-weight="normal" text-anchor="start" fill="#556268">review 1</text>
<rect class="accent-stroke" x="217.05000000000007" y="60" width="87.60000000000001" height="38.5" rx="6" fill="#ffffff" stroke="#00609c" stroke-width="2"/>
<text x="260.8500000000001" y="87.17" font-size="22" font-weight="normal" text-anchor="middle" fill="#1c2e36">great</text>
