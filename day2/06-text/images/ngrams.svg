<text x="488.6900000000001" y="87.17" font-size="22" font-weight="normal" text-anchor="middle" fill="#1c2e36">battery</text>
<rect class="accent-stroke" x="558.8100000000002" y="60" width="62.96" height="38.5" rx="6" fill="#ffffff" stroke="#00609c" stroke-width="2"/>
<text x="590.2900000000002" y="87.17" font-size="22" font-weight="normal" text-anchor="middle" fill="#1c2e36">not</text>
<rect class="accent-stroke" x="635.7700000000002" y="60" width="70.22" height="38.5" rx="6" fill="#ffffff" stroke="#00609c" stroke-width="2"/>
<text x="670.8800000000002" y="87.17" font-size="22" font-weight="normal" text-anchor="middle" fill="#1c2e36">last</text>
<rect class="accent-stroke" x="719.9900000000002" y="60" width="62.96" height="38.5" rx="6" fill="#ffffff" stroke="#00609c" stroke-width="2"/>
