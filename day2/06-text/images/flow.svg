<polygon class="accent-fill" points="462,45 492,75 462,105 432,75" fill="#00609c"/>
<text x="502" y="81" font-size="15" font-weight="bold" text-anchor="start" fill="#1c2e36">the model</text>
<text class="accent-fill" x="20" y="24" font-size="15" font-weight="bold" text-anchor="start" fill="#00609c">panels 1 to 3</text></g>
