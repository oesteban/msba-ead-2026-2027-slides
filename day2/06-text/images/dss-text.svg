<text x="42" y="152" font-size="17" font-weight="bold" text-anchor="start" fill="#1c2e36">Features handling</text>
<text x="42" y="198" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">Algorithms</text>
<text x="42" y="244" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">Metrics</text>
<rect x="256" y="20" width="210" height="320" rx="4" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="276" y="62" font-size="17" font-weight="bold" text-anchor="start" fill="#1c2e36">TextSimple</text>
<text x="276" y="106" font-size="17" font-weight="normal" text-anchor="start" fill="#9aa4a8">Text</text>
<text x="446" y="106" font-size="13" font-weight="normal" text-anchor="end" fill="#9aa4a8">rejected</text>
<text x="276" y="150" font-size="17" font-weight="normal" text-anchor="start" fill="#9aa4a8">URL</text>
<text x="446" y="150" font-size="13" font-weight="normal" text-anchor="end" fill="#9aa4a8">rejected</text>
<rect x="482" y="20" width="498" height="320" rx="4" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="504" y="58" font-size="19" font-weight="bold" text-anchor="start" fill="#1c2e36">TextSimple · text</text>
<text x="504" y="110" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">Text handling</text>
<rect class="accent-stroke" x="684" y="86" width="276" height="38" rx="4" fill="#ffffff" stroke="#00609c" stroke-width="2.4"/>
<text x="698" y="111" font-size="17" font-weight="bold" text-anchor="start" fill="#1c2e36">TF/IDF vectorization</text>
</g>
<g data-step="2">
<text x="504" y="170" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">Min. rows fraction %</text>
<rect x="800" y="145" width="120" height="36" rx="4" fill="#ffffff" stroke="#9aa4a8" stroke-width="1.6"/>
<text x="860" y="170" font-size="17" font-weight="bold" text-anchor="middle" fill="#1c2e36">0.1</text>
<text x="504" y="220" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">Max. rows fraction %</text>
<rect x="800" y="195" width="120" height="36" rx="4" fill="#ffffff" stroke="#9aa4a8" stroke-width="1.6"/>
