<text x="504" y="270" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">N-grams</text>
<rect x="800" y="245" width="120" height="36" rx="4" fill="#ffffff" stroke="#9aa4a8" stroke-width="1.6"/>
<text x="860" y="270" font-size="17" font-weight="bold" text-anchor="middle" fill="#1c2e36">1 to 2</text>
</g>
<g data-step="3">
<text x="731" y="324" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268" font-style="italic">rarest and commonest terms cut; words and pairs</text>
