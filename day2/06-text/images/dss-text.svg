<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- A drawing, not a capture, of Dataiku DSS's Design, Features handling panel for a text column, labels and values as in the previous teacher's 2025 captures of the course server; to be checked on DSS 15.0. Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<rect x="20" y="20" width="220" height="320" rx="4" fill="#f4f6f7" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="42" y="60" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">Target</text>
<text x="42" y="106" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">Train / Test set</text>
<rect class="accent-a-light-fill" x="20" y="128" width="220" height="38" rx="0" fill="#8cb3cf"/>
