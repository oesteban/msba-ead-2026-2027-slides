<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- Landmarks of language models before they became large, after Jurafsky & Martin (2026), pp. 13, 89, 137, 150 and 207. Drawn. Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<line x1="50" y1="160" x2="950" y2="160" stroke="#1c2e36" stroke-width="2"/>
</g>
<g data-step="1">
<circle class="accent-fill" cx="140" cy="160" r="9" fill="#00609c"/>
<line x1="140" y1="150" x2="140" y2="118" stroke="#c9cfd2" stroke-width="1.4"/>
<text class="accent-fill" x="140" y="48" font-size="20" font-weight="bold" text-anchor="middle" fill="#00609c">1948</text>
<text x="140" y="72" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">Shannon</text>
<text x="140" y="94" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">next words predicted</text>
<text x="140" y="114" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">from counts of the ones before</text>
</g>
<g data-step="2">
<circle class="accent-fill" cx="320" cy="160" r="9" fill="#00609c"/>
<line x1="320" y1="170" x2="320" y2="192" stroke="#c9cfd2" stroke-width="1.4"/>
<text class="accent-fill" x="320" y="210" font-size="20" font-weight="bold" text-anchor="middle" fill="#00609c">1975 to 1985</text>
<text x="320" y="234" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">IBM, speech recognition</text>
<text x="320" y="256" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">the term “language model”;</text>
<text x="320" y="276" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">n-gram models</text>
</g>
<g data-step="3">
<circle class="accent-fill" cx="500" cy="160" r="9" fill="#00609c"/>
<line x1="500" y1="150" x2="500" y2="118" stroke="#c9cfd2" stroke-width="1.4"/>
<text class="accent-fill" x="500" y="48" font-size="20" font-weight="bold" text-anchor="middle" fill="#00609c">2003</text>
<text x="500" y="72" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">Bengio et al.</text>
<text x="500" y="94" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">a neural network</text>
<text x="500" y="114" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">predicts the next word</text>
</g>
<g data-step="4">
<circle class="accent-fill" cx="680" cy="160" r="9" fill="#00609c"/>
<line x1="680" y1="170" x2="680" y2="192" stroke="#c9cfd2" stroke-width="1.4"/>
<text class="accent-fill" x="680" y="210" font-size="20" font-weight="bold" text-anchor="middle" fill="#00609c">2013</text>
<text x="680" y="234" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">word2vec</text>
<text x="680" y="256" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">embeddings learned</text>
<text x="680" y="276" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">by predicting neighbours</text>
</g>
<g data-step="5">
<circle class="accent-fill" cx="860" cy="160" r="9" fill="#00609c"/>
<line x1="860" y1="150" x2="860" y2="118" stroke="#c9cfd2" stroke-width="1.4"/>
<text class="accent-fill" x="860" y="48" font-size="20" font-weight="bold" text-anchor="middle" fill="#00609c">2018</text>
<text x="860" y="72" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">ELMo</text>
<text x="860" y="94" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">one language model</text>
<text x="860" y="114" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">reused for many tasks</text>
</g>
</svg>
