<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- TF-IDF of the deck's three reviews: term count times IDF(t) = 1 + ln(N / documents containing t), Provost & Fawcett (2013), pp. 255 to 256, with the natural logarithm. Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<text x="500" y="36" font-size="22" font-weight="bold" text-anchor="middle" fill="#1c2e36">TF-IDF: term frequency × inverse document frequency (IDF)</text>
<text x="500" y="72" font-size="21" font-weight="normal" text-anchor="middle" fill="#1c2e36">count in the review × IDF,    IDF = 1 + ln(N / reviews holding the term)</text>
</g>
