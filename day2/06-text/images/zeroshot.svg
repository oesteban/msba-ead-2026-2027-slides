<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- Zero-shot and one-shot prompts on the deck's reviews, after Brown et al. (2020), Fig. 2.1, p. 6. Drawn; any answer is illustrative. Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<text class="accent-fill" x="40" y="46" font-size="19" font-weight="bold" text-anchor="start" fill="#00609c">zero-shot</text>
<rect x="40" y="60" width="440" height="160" rx="8" fill="#f4f6f7" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="58" y="92" font-size="17" font-weight="bold" text-anchor="start" fill="#1c2e36">Is this review positive or negative?</text>
<text x="58" y="122" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">Review: Great screen, but the battery</text>
<text x="58" y="152" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">does not last a day.</text>
<text x="58" y="182" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">Answer:</text>
<text x="40" y="246" font-size="15" font-weight="normal" text-anchor="start" fill="#556268">the task in words; no labelled example</text>
</g>
<g data-step="2">
<text class="accent-fill" x="520" y="46" font-size="19" font-weight="bold" text-anchor="start" fill="#00609c">one-shot</text>
<rect x="520" y="60" width="440" height="220" rx="8" fill="#f4f6f7" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="538" y="92" font-size="17" font-weight="bold" text-anchor="start" fill="#1c2e36">Is this review positive or negative?</text>
<text x="538" y="122" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">Review: Good battery, good screen.</text>
<text x="538" y="152" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">Answer: positive</text>
<text x="538" y="182" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">Review: Great screen, but the battery</text>
<text x="538" y="212" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">does not last a day.</text>
<text x="538" y="242" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">Answer:</text>
<text x="520" y="306" font-size="15" font-weight="normal" text-anchor="start" fill="#556268">one labelled example, in the prompt itself</text>
</g>
<g data-step="3">
<rect class="accent-a-light-fill accent-stroke" x="250" y="352" width="500" height="56" rx="10" fill="#8cb3cf" stroke="#00609c" stroke-width="2"/>
<text x="500" y="387" font-size="20" font-weight="bold" text-anchor="middle" fill="#1c2e36">the model writes the answer; no weight changes</text>
</g>
</svg>
