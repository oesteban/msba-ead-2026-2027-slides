<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- A language model used to generate text, schematic after Jurafsky & Martin (2026), Fig. 1.3, p. 6, and instruction tuning, p. 10; the words generated are illustrative. Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<text x="40" y="40" font-size="17" font-weight="normal" text-anchor="start" fill="#556268">the text so far</text>
<rect x="103.785" y="54" width="86.06" height="36.75" rx="6" fill="#ffffff" stroke="#9aa4a8" stroke-width="2"/>
<text x="146.815" y="79.935" font-size="21" font-weight="normal" text-anchor="middle" fill="#1c2e36">Great</text>
<rect x="197.845" y="54" width="103.49000000000001" height="36.75" rx="6" fill="#ffffff" stroke="#9aa4a8" stroke-width="2"/>
<text x="249.59" y="79.935" font-size="21" font-weight="normal" text-anchor="middle" fill="#1c2e36">screen,</text>
<rect x="309.33500000000004" y="54" width="61.28" height="36.75" rx="6" fill="#ffffff" stroke="#9aa4a8" stroke-width="2"/>
<text x="339.975" y="79.935" font-size="21" font-weight="normal" text-anchor="middle" fill="#1c2e36">but</text>
<rect x="378.615" y="54" width="61.28" height="36.75" rx="6" fill="#ffffff" stroke="#9aa4a8" stroke-width="2"/>
<text x="409.255" y="79.935" font-size="21" font-weight="normal" text-anchor="middle" fill="#1c2e36">the</text>
<rect x="447.895" y="54" width="108.32000000000001" height="36.75" rx="6" fill="#ffffff" stroke="#9aa4a8" stroke-width="2"/>
<text x="502.055" y="79.935" font-size="21" font-weight="normal" text-anchor="middle" fill="#1c2e36">battery</text>
</g>
<g data-step="2">
<line x1="564.215" y1="72" x2="610.215" y2="72" stroke="#1c2e36" stroke-width="2" marker-end="url(#ah)"/>
<rect class="accent-stroke" x="616.215" y="46" width="150" height="52" rx="8" fill="#ffffff" stroke="#00609c" stroke-width="2"/>
<text x="691.215" y="79" font-size="19" font-weight="bold" text-anchor="middle" fill="#1c2e36">the model</text>
<line x1="768.215" y1="72" x2="808.215" y2="72" stroke="#1c2e36" stroke-width="2" marker-end="url(#ah)"/>
<rect class="accent-a-light-fill accent-stroke" x="814.215" y="54" width="73.04" height="36.75" rx="6" fill="#8cb3cf" stroke="#00609c" stroke-width="2"/>
<text x="850.735" y="79.935" font-size="21" font-weight="normal" text-anchor="middle" fill="#1c2e36">does</text>
<text x="616.215" y="128" font-size="16" font-weight="normal" text-anchor="start" fill="#556268">predicts the next word</text>
</g>
<g data-step="3">
<text x="40" y="186" font-size="17" font-weight="normal" text-anchor="start" fill="#556268">the word is added, and the model predicts again</text>
<rect x="80.51999999999998" y="200" width="86.06" height="36.75" rx="6" fill="#ffffff" stroke="#9aa4a8" stroke-width="2"/>
<text x="123.54999999999998" y="225.935" font-size="21" font-weight="normal" text-anchor="middle" fill="#1c2e36">Great</text>
<rect x="174.57999999999998" y="200" width="103.49000000000001" height="36.75" rx="6" fill="#ffffff" stroke="#9aa4a8" stroke-width="2"/>
<text x="226.325" y="225.935" font-size="21" font-weight="normal" text-anchor="middle" fill="#1c2e36">screen,</text>
<rect x="286.07" y="200" width="61.28" height="36.75" rx="6" fill="#ffffff" stroke="#9aa4a8" stroke-width="2"/>
<text x="316.71" y="225.935" font-size="21" font-weight="normal" text-anchor="middle" fill="#1c2e36">but</text>
<rect x="355.35" y="200" width="61.28" height="36.75" rx="6" fill="#ffffff" stroke="#9aa4a8" stroke-width="2"/>
<text x="385.99" y="225.935" font-size="21" font-weight="normal" text-anchor="middle" fill="#1c2e36">the</text>
<rect x="424.63" y="200" width="108.32000000000001" height="36.75" rx="6" fill="#ffffff" stroke="#9aa4a8" stroke-width="2"/>
<text x="478.79" y="225.935" font-size="21" font-weight="normal" text-anchor="middle" fill="#1c2e36">battery</text>
<rect class="accent-a-light-fill accent-stroke" x="540.95" y="200" width="73.04" height="36.75" rx="6" fill="#8cb3cf" stroke="#00609c" stroke-width="2"/>
<text x="577.47" y="225.935" font-size="21" font-weight="normal" text-anchor="middle" fill="#1c2e36">does</text>
<rect class="accent-a-light-fill accent-stroke" x="621.99" y="200" width="61.28" height="36.75" rx="6" fill="#8cb3cf" stroke="#00609c" stroke-width="2"/>
<text x="652.63" y="225.935" font-size="21" font-weight="normal" text-anchor="middle" fill="#1c2e36">not</text>
<rect class="accent-a-light-fill accent-stroke" x="691.27" y="200" width="68.21000000000001" height="36.75" rx="6" fill="#8cb3cf" stroke="#00609c" stroke-width="2"/>
<text x="725.375" y="225.935" font-size="21" font-weight="normal" text-anchor="middle" fill="#1c2e36">last</text>
<text x="900" y="226" font-size="26" font-weight="normal" text-anchor="middle" fill="#556268">…</text>
</g>
<g data-step="4">
<rect x="60" y="292" width="880" height="84" rx="8" fill="#f4f6f7" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="84" y="324" font-size="18" font-weight="normal" text-anchor="start" fill="#1c2e36">trained further on hundreds of thousands of questions and answers (instruction tuning),</text>
<text x="84" y="352" font-size="18" font-weight="bold" text-anchor="start" fill="#1c2e36">it continues a question with its answer</text>
</g>
</svg>
