<g data-step="2">
<rect x="60" y="186" width="410" height="150" rx="10" fill="#f4f6f7" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="84" y="222" font-size="19" font-weight="bold" text-anchor="start" fill="#1c2e36">one fixed vector per word (GloVe)</text>
<text x="84" y="252" font-size="18" font-weight="normal" text-anchor="start" fill="#556268">“great” is the same in both</text>
<text x="265" y="312" font-size="28" font-weight="bold" text-anchor="middle" fill="#1c2e36">cosine 1.00</text>
</g>
<g data-step="3">
<rect class="accent-a-light-fill accent-stroke" x="530" y="186" width="410" height="150" rx="10" fill="#8cb3cf" stroke="#00609c" stroke-width="2"/>
<text x="554" y="222" font-size="19" font-weight="bold" text-anchor="start" fill="#1c2e36">read with its neighbours (BERT)</text>
<text x="554" y="252" font-size="18" font-weight="normal" text-anchor="start" fill="#556268">“great” after “not a” moves away</text>
<text x="735" y="312" font-size="28" font-weight="bold" text-anchor="middle" fill="#1c2e36">cosine 0.62</text>
</g>
<g data-step="4">
<text x="500" y="380" font-size="17" font-weight="normal" text-anchor="middle" fill="#1c2e36">each layer of a transformer mixes into a word's numbers those of the words around it</text>
</g>
