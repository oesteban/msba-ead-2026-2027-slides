<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- BERT base uncased's last-layer vectors for 'great' in the deck's reviews 1 and 2, compared by cosine, computed by text.py; a GloVe vector does not depend on the sentence. Oscar Esteban, CC BY 4.0. -->
<defs>
