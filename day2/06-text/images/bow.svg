<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- A bag of words of the deck's three reviews: normalised, stop words but 'not' removed, not stemmed, as term counts (Provost & Fawcett 2013, pp. 252 to 253). Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<text x="60" y="40" font-size="20" font-weight="normal" text-anchor="start" fill="#1c2e36">1   Great screen, but the battery does not last a day.</text>
<text x="60" y="74" font-size="20" font-weight="normal" text-anchor="start" fill="#1c2e36">2   Not a great screen, but the battery is good.</text>
<text x="60" y="108" font-size="20" font-weight="normal" text-anchor="start" fill="#1c2e36">3   Good battery, good screen.</text>
</g>
