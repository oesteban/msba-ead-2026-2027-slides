<g data-step="1">
<text x="40" y="30" font-size="19" font-weight="normal" text-anchor="start" fill="#1c2e36">1   Great screen, but the battery does not last a day.</text>
<text x="40" y="60" font-size="19" font-weight="normal" text-anchor="start" fill="#1c2e36">2   Not a great screen, but the battery is good.</text>
<text x="40" y="90" font-size="19" font-weight="normal" text-anchor="start" fill="#1c2e36">3   Good battery, good screen.</text>
</g>
