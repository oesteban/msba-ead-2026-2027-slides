.section-mark.center[
## Text mining and sentiment analysis

### How text becomes a table, and how its sentiment is scored

<br />

Oscar Esteban &lt;<code>oscar.esteban@hevs.ch</code>>

<br />

EAD · Exploration avancée de données et intelligence décisionnelle · 23.10.2026

<div style="font-size: 0.8em; margin-top: 1.2em;"><a href="https://oesteban.github.io/msba-ead-2026-2027-slides/day2/06-text/index.html">
https://oesteban.github.io/msba-ead-2026-2027-slides/day2/06-text/index.html
</a></div>
]

???

**Today, we'll cover how text becomes a table a model can read, and four ways to score the opinion it holds, its sentiment.** This is text mining: data mining applied to text. Provost and Fawcett call text "just another form of data" (Provost & Fawcett, 2013, p. 249, verbatim), but it must be transformed before a data mining algorithm can take it in (p. 251). *Deep learning* ended this morning on a question: which features can a classifier read from words? A photo arrived as numbers, three per pixel. A text arrives as characters, and none of them is a number yet. So how do we get from a string of characters to a verdict on an opinion?


---

???

**We go in four parts, from what a text is to a model that scores its opinion.** First, text as data: what text a firm holds, and what it wants to read from it, which decides what we build. Second, from text to a table of words, Provost and Fawcett's first way: "engineer the data to match existing tools" (Provost & Fawcett, 2013, p. 249, verbatim). We count words, so that a model of the first day can read each text. Third, scoring sentiment, in four ways, from a list of scored words up to language models, the networks for text we met this morning: their second way, tools built for text. Simplest first, so that each shows what the next one adds. Last, the hands-on in Dataiku, on film reviews. We start with the text a firm holds.


---
.section-mark.part[
.kicker[Part 1 of 4]

# Text as data

<div class="parts"><span class="now">Text as data</span><span>From text to a table of words</span><span>Scoring sentiment</span><span>Hands-on 5</span></div>
]

???

**Part 1 asks what text is, as data, and what we want to read from it.** We look at where a firm's text comes from, then at one review as a model receives it, then at the opinion that review holds. By the end, we know what we are after, and why a model cannot read it yet. We begin with a question: why would a firm want a model to read text at all?


---
class: vcenter
# Text in a firm

.fullw[
<div class="trio">
<div><b class="k">Records</b>Complaint logs, product inquiries, repair records: written for people to read.</div>
<div><b class="k">Reviews</b>What customers think of a product, in their own words, by the thousand.</div>
<div class="lit"><b class="k">Questions</b>"Why aren't consumers buying our laptop?" Sales figures alone cannot say.</div>
</div>

.lead.big.center[Firms hold more text than anyone can read.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), p. 250.] B. Pang and L. Lee (2008), sections 2.1 and 2.3.]

???

**Firms hold more text than anyone can read.** Complaint logs, product inquiries and repair records are written for people, not for computers, and "understanding customer feedback often requires understanding text" (Provost & Fawcett, 2013, p. 250, verbatim). Take a computer maker, disappointed by its sales: why aren't consumers buying its laptop? The sales figures say that it does not sell, not why. The answer lies in what people think of it: a design they find tacky, customer service they found condescending (Pang & Lee, 2008, section 2.3). Those views are online, but in dozens or hundreds of versions of the same complaints, too many for an analyst to read (section 2.3). We want a model to read them for us. So what does one such text look like to a model?


---
class: stepwise-svg, vcenter
# A review

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/review.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The review Great screen, but the battery does not last a day, then the same review as a row of single characters"></object></div>
.step-3.lead.big.center[To a model, a text is a string of characters.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), p. 250.] The review is written for this deck, as are all the reviews before the hands-on.]

???

**To a model, a text is a string of characters.** We read this review in a second and know what its writer thinks. A model receives 50 characters in a row. In the wines of *Beyond binary classification*, the alcohol column meant the same thing in every row. Text has no such columns: it lacks "tables of records with fields having fixed meanings" (Provost & Fawcett, 2013, p. 250, verbatim). Character 7 here is the "s" of "screen"; in another review, it belongs to another word, and the review has another length (p. 250). So a character's position cannot serve as a column. Before we give a review columns of some other kind, what do we want to read from it?


---
class: stepwise-svg, vcenter
# Sentiment analysis

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/aspects.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The review split in two: Great screen, positive about the screen; but the battery does not last a day, negative about the battery"></object></div>
.step-4.lead.big.center[Sentiment analysis reads the opinion a text expresses.]
]

.footnote[B. Pang and L. Lee (2008); W. Zhang et al. (2024): aspect-level tasks.]

???

**Sentiment analysis reads the opinion a text expresses.** From a review, a firm wants to know whether its writer liked the product. Labelling a whole text as positive or negative is polarity classification, much studied on reviews (Pang & Lee, 2008, section 4.1.1). It assumes that the text gives one overall opinion, about one thing (section 4.1.1). Ours gives two: it praises the screen and faults the battery. These are two aspects of the product, and one sentence can judge them differently (Zhang et al., 2024, section 3.1). One label for the whole review keeps one opinion and loses the other. In the hands-on, each review still gets one label, a simplification we accept. But a model reads columns, and a review has none. How can it get some?


---
.section-mark.part[
.kicker[Part 2 of 4]

# From text to a table of words

<div class="parts"><span>Text as data</span><span class="now">From text to a table of words</span><span>Scoring sentiment</span><span>Hands-on 5</span></div>
]

???

**Part 2 turns texts into a table by counting their words.** Why counting? It is the simplest route, and in text mining the simplest technique that works comes first (Provost & Fawcett, 2013, p. 251). Once a review is a row of numbers, any model of the first day can read it. We build the table on three short reviews, one step at a time, asking at each step what it keeps and what it throws away. What is the simplest table we could make?


---
class: stepwise-svg, vcenter
# Bag of words

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/bow.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The deck's three reviews, then a table with one row per review and one column per word as written, fifteen columns, with Great and great in two different columns"></object></div>
.step-4.lead.big.center[One column per word, one row per text, a count in each cell.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 252 to 253.] The reviews cut into words, nothing else done.]

???

**One column per word, one row per text, a count in each cell.** This is the bag of words: each text becomes a bag of its words, with their counts. Here are our review and two more, cut into words and nothing else. Each different word, as written, earns a column: 15 in all. Each cell counts that word in that review, its term frequency (Provost & Fawcett, 2013, pp. 252 to 253). Whatever earns a column is a term; for now, a term is a word. What we lose: the bag "ignores grammar, word order, sentence structure, and (usually) punctuation" (Provost & Fawcett, 2013, p. 252, verbatim). Review 1's "not" is about the battery, review 2's about the screen, and the counts cannot tell which. And look at "Great" and "great", in two columns: one word, or two?


---
class: stepwise-svg, vcenter
# Normalisation

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/normalise.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The review cut into words and punctuation, then written in lower case without punctuation"></object></div>
.step-5.lead.big.center[Normalisation writes each word one way, so that "Great" and "great" share a column.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), p. 253.] C. D. Manning, P. Raghavan and H. Schütze (2008), section 2.2.]

???

**Normalisation writes each word one way, so that "Great" and "great" share a column.** To us they are one word; to the table, two strings that split one word's counts. Folding the case writes every letter in lower case, so that "Skype and SKYPE are counted as the same thing" (Provost & Fawcett, 2013, p. 253, verbatim); we drop the punctuation too. Each step throws something away. Usually that is harmless, but folding also merges the Fed, a government body, with fed (Manning et al., 2008, sections 2.2.1 and 2.2.3). In the hands-on, Dataiku's *Simplify text* makes such choices for us, and the sheet's first panel checks what it does to "not", the word that carries our complaint. And "the" and "a" are in nearly every review: do they help tell reviews apart?


---
class: stepwise-svg, vcenter
# Stop words

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/stopwords.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The review's ten words; a short stop list drops the and a; a longer list also drops but, does and not, leaving great screen battery last day"></object></div>
.step-5.lead.big.center[Dropping the most frequent words can drop the verdict.]
]

.footnote[C. D. Manning et al. (2008), Figure 2.5 and section 2.2.2; the longer list illustrative. .book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 253 to 254.]]

???

**Dropping the most frequent words can drop the verdict.** Words such as "the" and "a" fill a column in nearly every text, so they tell texts apart little. These are stop words, often removed before counting (Provost & Fawcett, 2013, p. 253). A stop list of 25 common words (Manning et al., 2008, Figure 2.5) drops only "the" and "a" from our review. A longer list, illustrative here, also holds "but", "does" and "not", and with "not" goes the complaint. Search systems went from stop lists of 200 or 300 words to none, and a dropped word can carry the meaning, as "to" does in "flights to London" (section 2.2.2). "Stopword elimination is not always a good idea" (Provost & Fawcett, 2013, p. 254, verbatim). Even with "not" kept, "battery" and "batteries" would still take two columns.


---
class: stepwise-svg, vcenter
# Stemming

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/stemming.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Forms of the review's words cut to one stem by Porter's rules: battery and batteries to batteri, day and days to dai, last, lasts and lasting to last, screen and screens to screen"></object></div>
.step-4.lead.big.center[Stemming cuts the forms of a word to one stem, so that they share a column.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), p. 253.] M. F. Porter (1980), stems computed with NLTK's implementation; C. D. Manning et al. (2008), section 2.2.4; B. Pang et al. (2002).]

???

**Stemming cuts the forms of a word to one stem, so that they share a column.** "Battery" in one review and "batteries" in another make the same complaint, but in two columns they split its counts. Stemming removes suffixes by rule (Provost & Fawcett, 2013, p. 253). Porter's rules (Porter, 1980), the most common for English, turn battery and batteries into "batteri", day and days into "dai". A stem need not be a word: only the groups it forms matter. In English search, stemming helps little overall, as it also merges words of different meaning, such as operate and operational (Manning et al., 2008, section 2.2.4). An early study of review polarity did not stem at all (Pang et al., 2002, section 6.1). And the table still counts "not" without what it negates. Could it keep a little of the order?


---
class: stepwise-svg, vcenter
# N-grams

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/ngrams.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Reviews 1 and 2 as words; the pairs not last and not great become terms; 7 words and 9 pairs make 16 columns"></object></div>
.step-4.lead.big.center[N-grams, here pairs of adjacent words, keep a little of the order.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 118 and 263 to 264.] B. Pang, L. Lee and S. Vaithyanathan (2002); X. Zhang, J. Zhao and Y. LeCun (2015).]

???

**Pairs of adjacent words keep a little of the order.** N-grams are sequences of n adjacent words, and pairs are bi-grams (Provost & Fawcett, 2013, p. 263). With a column per pair, "not last" and "not great" become terms that say what is negated. The cost is columns: 7 words and 9 pairs make 16 (p. 264). Each column adds a weight that a model, such as a logistic regression, learns from the same labelled examples (p. 118). So pairs need many labelled texts. On 1,400 movie reviews, they did not improve accuracy (Pang et al., 2002, Figure 3). On Yelp reviews, 280,000 per class, n-grams cut a logistic regression's error from 7.76% to 4.36% (Zhang et al., 2015, Table 4). But "battery" is in all three reviews: does it tell any apart?


---
class: stepwise-svg, vcenter
# TF-IDF

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/tfidf.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The formula TF-IDF equals count times IDF, IDF equals 1 plus the natural log of N over the reviews holding the term; the IDF of each term; then the three reviews' counts weighted by it: battery and screen weigh least, day, last and good most"></object></div>
.step-5.lead.big.center[A term weighs most when it is frequent in this text and rare in the others.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 254 to 256, with the natural logarithm.] G. Salton and C. Buckley (1988).]

???

**A term weighs most when it is frequent in this text and rare in the others.** A term in every text "doesn't distinguish anything" (Provost & Fawcett, 2013, p. 254, verbatim). So each count is weighted by its term's rarity, the inverse document frequency, IDF: "the boost a term gets for being rare" (Provost & Fawcett, 2013, p. 255, verbatim). IDF is 1 plus the natural logarithm, ln, of the number of reviews, N, over the number holding the term. "Day" is in 1 of our 3 reviews: 1 + ln 3 = 2.10. "Battery" is in all 3: 1 + ln 1 = 1. TF-IDF multiplies each term frequency by its IDF (p. 256). Each review is now a row of weighted terms, a table like the first day's. How do we get a verdict from it?


---
.section-mark.part[
.kicker[Part 3 of 4]

# Scoring sentiment

<div class="parts"><span>Text as data</span><span>From text to a table of words</span><span class="now">Scoring sentiment</span><span>Hands-on 5</span></div>
]

???

**Part 3 is about scoring sentiment: getting from a review's terms to its verdict, positive or negative.** Part 2 left each review as a row of weighted terms. But a row of numbers is not an opinion: something must decide that "great" counts as praise and "does not last a day" as a complaint. We'll see four ways to decide, from the cheapest up, each answering what the one before could not. Then we ask how accurate each one is, and how a firm should choose. First, what does each way ask of us, and what does it give back?


---
class: vcenter

# Four ways to score sentiment

.fullw[
<div class="quad big">
<div><b>1 · A lexicon</b>A list of scored words, and rules; no labelled example, every verdict readable.</div>
<div class="lit"><b>2 · A model on words</b>A weight per term, learned from labelled texts; the weights can be read.</div>
<div><b>3 · A pretrained network</b>Trained first on plain text, then given a new head on labelled texts; hard to read.</div>
<div><b>4 · A prompted language model</b>Asked in words for the label; no training, hard to read.</div>
</div>
.lead.big.center[They differ in the labels they need and in how far a verdict can be read.]
]

.footnote[J. Hartmann et al. (2023); C. Hutto and E. Gilbert (2014); J. Devlin et al. (2019); W. Zhang et al. (2024).]

???

**The four ways differ in the labelled texts they need, and in how far we can read why they decided.** Labels cost people's time; a verdict we can read is one we can check and explain. A lexicon, a list of words scored by people plus a few rules, needs no labels, and each verdict traces back to its words (Hartmann et al., 2023, p. 78). A model on words learns a weight per term from labelled texts, and its weights can be read. A pretrained network learns from plain text, then a new head learns from labelled texts (Devlin et al., 2019, p. 1). A prompted language model, trained on vast amounts of text to predict words, is simply asked for the label. These two decide through millions of weights, too many to read. If labels cost, what can the way that needs none do with our review?


---
class: stepwise-svg, vcenter
# Lexicons

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/lexicon.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="VADER on the review: great scores plus 3.1; but makes the clause after it dominate; the complaint holds no listed word and scores 0; VADER's verdict is plus 0.37, positive"></object></div>
.step-5.lead.big.center[A lexicon scores only the words it lists.]
]

.footnote[C. Hutto and E. Gilbert (2014), section 3: the word scores and the rules. Computed with the vaderSentiment package.]

???

**A lexicon scores only the words it lists.** It needs no labels, and we can follow every verdict. VADER is a ready-made lexicon: about 7,500 entries, each rated by ten people from −4 to +4; "great" scores 3.1 (Hutto & Gilbert, 2014, section 3.1). One of its rules fits our review: after "but", the clause that follows counts more, so VADER halves what comes before and raises what follows by half (section 3.3). The complaint holds no listed word: "not" flips only a listed word after it, and neither "last" nor "day" is listed. So the complaint scores 0. What remains is the praise, halved and rescaled to between −1 and +1 (section 4): +0.37, positive. By its own "but" rule, the review should have leaned negative. Everything hangs on the list. Who should choose its words?


---
class: vcenter

# Word lists by hand

.fullw[
<div class="facts big">
<div><span class="num">58%</span>five positive and five negative words chosen by one person, on 1,400 movie reviews.</div>
<div><span class="num">64%</span>a second person's longer lists, on the same reviews.</div>
<div><span class="num">69%</span>seven words each way read off the reviews' counts, "?" and "!" among them.</div>
</div>
.lead.big.center[Words picked by intuition did little better than chance.]
]

.footnote[B. Pang, L. Lee and S. Vaithyanathan (2002), Figures 1 and 2. Half the reviews positive: 50% by chance.]

???

**Word lists picked by intuition did little better than chance.** Can people simply pick the words, by intuition? Pang et al. tested that on 1,400 movie reviews, half positive, so guessing gives 50%. Two computer science students each listed words that signal a positive or a negative review; a review went to the side with more of its words. Five words each way scored 58%, a longer list 64% (Pang et al., 2002, Figure 1). On 75% and 39% of the reviews, the counts tied: the list could not tell. The authors then picked seven words each way from the reviews' own word counts: 69% (Figure 2). Among them were "still" and the question mark, which nobody had proposed. Their conclusion: choose the words from the data, not by intuition (section 4). Then why not let the data also decide how much each word counts?


---
class: stepwise-svg, vcenter
# A linear model on words

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/linear.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Review 1's six terms, each with a weight towards negative, summed to plus 0.2, then the logistic function: a probability of 0.55 that the review is negative"></object></div>
.step-5.lead.big.center[A linear model learns one weight per term from labelled texts.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 85 and 97 to 98.] D. Jurafsky and J. H. Martin (2026), chapter 4 and p. 534; B. Pang et al. (2002), Figure 3. *Evaluating a classifier*, slide 3. Weights illustrative.]

???

**A linear model learns one weight per term from labelled texts.** It adds up each term's value times its weight, "a weighted sum of the attribute values" (Provost & Fawcett, 2013, p. 85, verbatim). The logistic function turns the sum into a probability: the first day's logistic regression (pp. 97 to 98). In review 1, with illustrative weights, "great" pulls towards positive (−1.5) and "not" towards negative (+1.1); the sum, +0.2, makes the review negative with probability 0.55. On the 1,400 movie reviews, such models reached up to 82.9%, against 69% for the best list (Pang et al., 2002, Figure 3). With many labelled texts like those to score, they are hard to beat (Jurafsky & Martin, 2026, p. 534). But a word no training review used gets no weight, and "superb" learns nothing from "excellent" (pp. 136 to 137). Can a model learn about words before any label?


---
class: stepwise-svg, vcenter
# Language models

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/lm.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The review with its last word hidden; BERT's five likeliest words: second 0.43, minute 0.14, moment 0.08, day 0.08, week 0.07"></object></div>
.step-4.lead.big.center[A language model learns from text alone, by guessing the words left out.]
]

.footnote[D. Jurafsky and J. H. Martin (2026), pp. 5 and 9; J. Devlin et al. (2019), p. 1: the masked language model. Computed with BERT base uncased, .lic[Apache 2.0].]

???

**A language model learns from text alone, by guessing the words left out.** A language model, technically, predicts the next word from the words before it (Jurafsky & Martin, 2026, p. 5), and learns by doing so again and again over a vast body of text: pretraining (p. 9). Why no labels? The text is its own answer key: hide a word, and the text holds the right one. BERT, from 2018, is a masked language model: it hides words anywhere and guesses each from both sides (Devlin et al., 2019, p. 1), pretrained on 3.3 billion words (p. 5). We hid our review's last word. BERT's first guess is "second", at 0.43, and the review's own "day" comes fourth. Look at that first guess: "does not last a second" is how people complain about a battery. But what does it read, when texts bring words it never saw?


---
class: stepwise-svg, vcenter
# Tokens

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/tokens.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="BERT's tokens: the review as twelve tokens, one per word or mark; touchscreen as touch and screen; overheating as over, hea and ting; a vocabulary of 30,522 tokens"></object></div>
.step-5.lead.big.center[A language model reads tokens: whole words, or pieces of rarer ones.]
]

.footnote[J. Devlin et al. (2019), p. 4: WordPiece. D. Jurafsky and J. H. Martin (2026), section 2.4. Computed with BERT's tokenizer.]

???

**A language model reads tokens: whole words, or pieces of rarer ones.** Why pieces? A model's vocabulary is fixed, and a word outside it would be unreadable. So the vocabulary is learned from data: most tokens are words, others pieces of words, and any unseen word can be written as known pieces (Jurafsky & Martin, 2026, pp. 42 to 43). BERT's tokenizer, WordPiece, holds 30,522 tokens, which its authors round to 30,000 (Devlin et al., 2019, p. 4). Our review becomes 12 tokens, one per word or punctuation mark. The rarer "touchscreen" becomes touch and ##screen, the "##" marking a piece that continues a word. "overheating" becomes over, ##hea and ##ting: a piece need not mean anything. And every token is in lower case: this uncased BERT applies the normalisation we met earlier. But a model computes with numbers, not strings. Which numbers stand for "battery"?


---
class: stepwise-svg, vcenter
# Embeddings

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/embeddings.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Eleven words placed by their GloVe vectors: screen and display together, battery and charger together, the judging words together; good and great at 0.80, good and bad at 0.80, good and battery at 0.23; battery as a vector of 50 numbers"></object></div>
.step-4.lead.big.center[Words used alike lie close: "good" as close to "bad" as to "great".]
]

.footnote[J. Pennington, R. Socher and C. D. Manning (2014): GloVe, 50 dimensions, 6 billion tokens, .lic[PDDL]; computed, the flat view being the first two principal components. D. Jurafsky and J. H. Martin (2026), chapter 5. A. L. Maas et al. (2011).]

???

**Words used in the same places get close vectors, so "good" lies as close to "bad" as to "great".** Each token becomes a vector, a list of numbers: its embedding. These numbers are learned from the words around each word: words used in similar contexts tend to mean similar things (Jurafsky & Martin, 2026, p. 127). The cosine compares two vectors: 1 when they point the same way, 0 when unrelated (p. 135). Here, GloVe learned 50 numbers per word from 6 billion tokens of text (Pennington et al., 2014, p. 1538). "good" scores 0.23 with "battery", 0.80 with "great", and 0.80 with "bad": "the battery is good" and "the battery is bad" put both in the same places, and such vectors largely miss sentiment (Maas et al., 2011, p. 142). So sentiment must still be learned from labelled reviews.


---
class: stepwise-svg, vcenter
# Pretrained transformers

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/transfer-text.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A review as tokens enters a pretrained network of seven locked blocks, then a new head that outputs positive or negative"></object></div>
.step-4.lead.big.center[A pretrained transformer learns sentiment from labelled texts through a new head.]
]

.footnote[J. Devlin et al. (2019), pp. 1 and 5. Transfer learning and fine-tuning: *Deep learning*.]

???

**A pretrained transformer learns sentiment from labelled texts through a new head.** A transformer is the network design behind today's language models (Jurafsky & Martin, 2026, p. 177). Each token enters as its embedding, and layer after layer its numbers take in information from the other tokens (p. 178). So "great" in "not a great screen" ends up with other numbers than in "great screen", which one fixed vector per word cannot do (Hartmann et al., 2023, p. 79). Pretraining taught BERT language, not our labels. As with the lions and tigers of *Deep learning*, we keep the pretrained layers and add a new head with one output per class, trained on labelled reviews. Layers locked, this is transfer learning; some unlocked, fine-tuning; BERT's authors unlocked them all (Devlin et al., 2019, pp. 1 and 3). Either way, it needs labelled reviews: what if we have none?


---
class: stepwise-svg, vcenter
# Prompted language models

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/prompt.svg" style="width: 86%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The question positive or negative and the review go to a language model, with no weight change; it answers negative"></object></div>
<div class="facts two step-4">
<div><span class="num">94% against 94%</span>on two-class IMDb reviews: level with a fine-tuned model.</div>
<div><span class="num">52% against 66%</span>on five-star Yelp reviews: the fine-tuned model far ahead.</div>
</div>
.step-5.lead.center[Zero-shot labels come close to a fine-tuned model's on two classes, not on five.]
]

.footnote[W. Zhang et al. (2024), section 4.3: ChatGPT against a fine-tuned T5. T. Brown et al. (2020), p. 7; D. Jurafsky and J. H. Martin (2026), p. 10. Answer illustrative.]

???

**Asked for the label in words, a language model comes close to a fine-tuned one on two classes, not on five.** Why would it answer at all? It writes by predicting the next word, and answers are likely continuations of questions (Jurafsky & Martin, 2026, p. 9). It is also trained further on hundreds of thousands of questions and answers: instruction tuning (p. 10). No weight changes, no labelled example: this is zero-shot (Brown et al., 2020, p. 7), the way *Deep learning* left dimmed. The answer drawn is illustrative. On two-class IMDb reviews, zero-shot ChatGPT matched a model fine-tuned on them, 94.2 against 93.9; on five-star Yelp reviews it trailed, 52.4 against 65.6. Over nine datasets, it averaged 97% of the fine-tuned accuracy (Zhang et al., 2024, section 4.3). Scores also move with the prompt's wording (section 4.4). How do the four ways compare across many studies?


---
class: vcenter

# How accurate

.fullw[
<div class="facts big">
<div><span class="num">69%</span>lexicons, on average, across 1,188 published accuracy figures.</div>
<div><span class="num">+9</span>points for traditional machine learning, such as a model on words.</div>
<div><span class="num">+20</span>points for a pretrained network, fine-tuned on labelled texts.</div>
</div>
.lead.big.center[Each step from a lexicon to a fine-tuned network adds accuracy.]
]

.footnote[J. Hartmann et al. (2023): 69.23%, +9.45 and +20.22 points, the last for what they call transfer learning. J. Devlin et al. (2019).]

???

**Each step from a lexicon to a fine-tuned network adds accuracy.** Across 1,188 published accuracy figures, lexicons averaged 69.23%. Traditional machine learning, such as a model on words, added 9.45 points; pretrained networks fine-tuned on labelled texts, which Hartmann et al. call transfer learning, added 20.22 (Hartmann et al., 2023, p. 83). The order follows what each learns from: a lexicon nothing, a model on words the labelled texts, a pretrained network billions of words besides. Three classes instead of two cost 12.7 points (p. 82). Benchmarks flatter: these networks reach 95 to 97% on SST-2, single sentences from movie reviews (Devlin et al., 2019, p. 15), but a median of about 89% on 19 datasets from applied studies (Hartmann et al., 2023, p. 80): levels, not a ranking. So what accuracy can we expect on our own texts?


---
class: vcenter

# Choosing one

.fullw[
<div class="quad big">
<div><b>Labels</b>How many labelled texts exist, or can be made?</div>
<div><b>Domain</b>How far are your texts from those the method learned on?</div>
<div><b>Explanation</b>Must each verdict be explained to someone?</div>
<div class="lit"><b>Where the texts go</b>May they be sent to a provider's model?</div>
</div>
.lead.big.center[Whatever the method, measure it on a labelled sample of your own texts.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), p. 251.] J. Hartmann et al. (2023); B. Pang and L. Lee (2008); Y. Chae and T. Davidson (2025).]

???

**Whatever the method, measure it on a labelled sample of your own texts.** Labels: with none, only a ready-made scorer will do: a lexicon, a prompted model or a network someone else fine-tuned (Hartmann et al., 2023, p. 80); more labels paid off significantly only for traditional machine learning (p. 83). Domain: "unpredictable" praises a film's plot but condemns a car's steering (Pang & Lee, 2008, section 4.4.1). Explanation: only a lexicon's or a model on words' verdict traces back to its words. Where the texts go: a provider may train its models on what we send, and change them without notice (Chae & Davidson, 2025, sections 7.3.3 and 7.3.4). The textbook's advice: "use the simplest (least expensive) technique that works" (Provost & Fawcett, 2013, p. 251, verbatim). That is what we do now: a model trained on our own labelled reviews, against a ready-made scorer.


---
.section-mark.part[
.kicker[Part 4 of 4]

# Hands-on 5: film reviews

<div class="parts"><span>Text as data</span><span>From text to a table of words</span><span>Scoring sentiment</span><span class="now">Hands-on 5</span></div>
]

???

**In this hands-on, we train our own sentiment model on film reviews, then set it against a scorer we could buy.** We train on 2,000 reviews from IMDb, the Internet Movie Database website: a subset of the 50,000 that Maas and colleagues released as a benchmark, each one clearly for or against its film (Maas et al., 2011, p. 149). Past the checkpoint come 2,000 reviews from another source, Pang and Lee's, all written before 2002 (Pang & Lee, 2004, section 3). Our model has never seen them, and Dataiku's ready-made scorer reads the same ones, so both are measured on labelled texts, as any method should be. But a model is built for someone. Who will act on its verdicts, and what does a wrong one cost them?


---
class: stepwise-svg, vcenter

# The case

<img class="phase-thumb" src="images/phase-bu.svg" alt="The CRISP-DM phases, business understanding lit" />

.beside-thumb[
<div class="step-1"><object type="image/svg+xml" data="images/costs.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A missed unhappy review costs 4, a wasted reading costs 1; on the probability axis, the default threshold 0.5 and the cost threshold 0.2 = 1 / (1 + 4)"></object></div>
.step-4.lead.big.center[The team reads every review scored 0.2 or more.]
]

.footnote[A scenario, not data. .book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 195 to 196.] *Evaluating a classifier*, slide 17: the costs give the threshold.]

???

**The team reads every review scored 0.2 or more.** Why 0.2? In our scenario, a streaming service's care team cannot read every review and wants the unhappy ones first. So unhappy is the positive class, the one worth attention. Missing one costs 4; reading a happy one for nothing, 1. Prices are not in the data: "usually the values must come from external domain knowledge" (Provost & Fawcett, 2013, p. 195, verbatim). If the model gives a review a probability p of being unhappy, leaving it costs 4 × p on average, and reading it (1 − p) × 1. Reading is cheaper when 4p > 1 − p, so above 1 / (1 + 4) = 0.2: the cost threshold of *Evaluating a classifier*, as for the textbook's mailing (pp. 195 to 196). What does the team have for a model to learn from?


---
class: vcenter

???

**Each row is one review of one film, and the model must find `unhappy` from the text alone.** Half the reviews are unhappy, so any model must beat the 50% of always guessing one class. Only clear verdicts were kept, 4 or less out of 10 or 7 or more (Maas et al., 2011, p. 149): our model never learns from a lukewarm review. We removed the copy of the opening sentence that ended most texts, which doubled those words' counts. And 161 texts stated their rating, such as "8/10". The label came from that rating, so a model could read the number instead of the opinion. Yet the team needs a model for reviews without one: a stated rating is a leak, information the model will not have when it is used. We stripped them. Of the three columns left, which can a model read?


---
class: vcenter

# Column types

<img class="phase-thumb" src="images/phase-du.svg" alt="The CRISP-DM phases, data understanding lit" />

.beside-thumb[
<div class="types three">
<div><b>Free text<span class="n">1</span></b><code>Text</code>
<p>One column, a review each: as terms, it becomes thousands of columns.</p></div>
<div><b>An identifier<span class="n">1</span></b><code>URL</code>
<p>It names the film: no feature, but it keeps a film's reviews together.</p></div>
<div><b>The target<span class="n">1</span></b><code>unhappy</code>
<p>1 or 0: the class the care team looks for is 1.</p></div>
</div>

<p class="types-after">Only <code>Text</code> enters the model, as the columns of a bag of words.</p>
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), p. 252.] Dataiku (2024), *Text variables*. The course file's columns; the original labels POS and NEG became <code>unhappy</code>.]

???

**Only the text enters the model, and as a bag of words its one column becomes thousands.** Why thousands? Every distinct term in the reviews becomes a column, so the reviews themselves decide the columns: "we don't know in advance what the features will be" (Provost & Fawcett, 2013, p. 252, verbatim). Dataiku can turn a text column into term counts, TF-IDF weights or embeddings, among others (Dataiku, 2024, *Text variables*); we take TF-IDF. The URL, the film's page on IMDb, names the film, not the opinion: a model that learned it would know which films were disliked, and nothing about a review of a new one. So it is no feature. The target, `unhappy`, is 1 for the class the care team looks for, our positive class. If the model never reads the URL, why keep it in the file?


---
class: vcenter

# Several reviews per film

<img class="phase-thumb" src="images/phase-du.svg" alt="The CRISP-DM phases, data understanding lit" />

.beside-thumb[
<div class="facts big">
<div><span class="num">1,225</span>of the 2,000 reviews share their film with another.</div>
<div><span class="num">7</span>reviews of one film, at most.</div>
<div><span class="num">5 folds</span>grouped by film: no film in its own test fold.</div>
</div>
.lead.big.center[Reviews of one film share its names, so they stay in one fold.]
]

.footnote[Counts on the course file; A. L. Maas et al. (2011). *Model selection and cross-validation*, slides 10 and 11: rows from one site.]

???

**Reviews of one film share its names, so they must stay in one fold.** In our file, 1,225 of the 2,000 reviews share their film with another, and with it the names of its characters and actors. With one review of a film in training and another in test, the model can get the second right by recognising the film, not the opinion. This happens: in the ten folds Pang and Lee published, about half of each test fold had a review of the same film, with the same label, in training (Maas et al., 2011, p. 149). Grouped folds keep all of a film's reviews in one fold, so every test review is of a film the model has never seen, as leaving one site out did in *Model selection and cross-validation*. How, then, do we set the text and the folds in Dataiku?


---
class: stepwise-svg, vcenter

# In Dataiku

<img class="phase-thumb" src="images/phase-mo.svg" alt="The CRISP-DM phases, modeling lit" />

.beside-thumb[
<div class="step-1"><object type="image/svg+xml" data="images/dss-text.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A drawing of Dataiku's Design, Features handling panel: TextSimple as text, TF/IDF vectorization, minimum rows fraction 0.1%, maximum 80%, n-grams 1 to 2; Text and URL rejected"></object></div>
.step-4.lead.big.center[The model reads TF-IDF on words and pairs, with folds grouped by film.]
]

.footnote[Drawn after Dataiku DSS's **Design → Features handling** panel, not a capture; Dataiku (2024), *Text variables*. .book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), p. 256.]]

???

**The model reads TF-IDF on the words and pairs of the simplified text, with folds grouped by film.** In **Design → Features handling**, it reads one column, `TextSimple`: the review after Dataiku's *Simplify text*, whose choices panel 1 checks. *TF/IDF vectorization* is Dataiku's name for TF-IDF, and n-grams 1 to 2 means words and pairs, so that "not great" can be a term. Pairs multiply the columns, so we cut the terms found in fewer than 0.1% of the reviews or in more than 80%: "minimum and maximum thresholds of term counts" (Provost & Fawcett, 2013, p. 256, verbatim). A term in a single review teaches the model about that review only; a term in nearly every review tells none apart. `URL` serves only to group the five folds. But where is `TextSimple` made, and what becomes of the model once trained?


---
class: stepwise-svg, vcenter

# The Flow

<img class="phase-thumb" src="images/phase-du-mo.svg" alt="The CRISP-DM phases, data understanding to modeling lit" />

.beside-thumb[
<div class="step-1"><object type="image/svg+xml" data="images/flow.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The Flow: the IMDb reviews, a Prepare recipe, the Lab, the model; Pang and Lee's reviews through a copied Prepare, the Score recipe and a count; the same reviews through the sentiment plugin and a count"></object></div>
.step-4.lead.big.center[The model and a plugin then score the same new reviews.]
]

.footnote[Drawn after a Dataiku DSS Flow; the sheet *Hands-on 5*, panels 1 to 4. Recipe colours schematic.]

???

**The model and a plugin then score the same new reviews.** On top of the Flow, a Prepare recipe writes `TextSimple`, and the Lab trains the model on it. Below, Pang and Lee's reviews take two paths. On one, a copy of the same Prepare recipe gives them the same simplified text, since the model reads nothing else, and the Score recipe adds the model's probability to each. On the other, Dataiku's sentiment plugin, an add-on installed separately (Dataiku, 2024, *Sentiment analysis*), reads the raw text and answers positive or negative. Both paths end by counting the four outcomes of *Evaluating a classifier*: true and false positives, false and true negatives (TP, FP, FN, TN). Same reviews, same labels, same counts: a fair comparison. That is a lot for one session, so we build it in two halves, the model first.


---
class: vcenter

# Hands-on 5: unhappy or not

<img class="phase-thumb" src="images/phase-du-mo.svg" alt="The CRISP-DM phases, data understanding to modeling lit" />

.beside-thumb[
.need[**The need.** A care team can read only some of the reviews it receives. Can a model trained on 2,000 labelled reviews pick the ones to read first, at the team's costs?]

<div class="moves">
<div><b>1. Prepare</b>Simplify the text; check what happens to "not".<br /><code>+ Recipe → Prepare</code>, <code>Simplify text</code>; panel 1</div>
<div><b>2. Train</b>Target <code>unhappy</code>; TF-IDF on words and pairs; 5 folds by <code>URL</code>.<br /><code>Lab → AutoML prediction → Design</code>; panel 2</div>
<div><b>3. Threshold</b>0.2, from the costs; the confusion matrix there.<br /><code>Results → Performance</code>; panel 3</div>
<div><b>4. Read</b>The heaviest terms, each way.<br /><code>Results → model → Regression coefficients</code>; panel 3</div>
</div>

.time[Sheet *Hands-on 5*, panels 1 to 3. Groups of three. 25 minutes.]
]

.footnote[Steps as on the sheet; Dataiku (2024), *Text variables*.]

???

**Can a model trained on 2,000 labelled reviews pick the ones the care team should read first?** Four moves answer it. First, simplify the text and look at what happens to "not": if the stop list drops it, "not great" becomes "great", and the pairs lose the verdict. Second, train a logistic regression, our linear model on words, on TF-IDF, with five folds grouped by film. Third, price the confusion matrix at 0.2 and at 0.5. A false negative, an unhappy review left unread, costs 4; a false positive, a happy one read for nothing, 1; in all, 4 × FN + FP. Why 0.5 too? The rule behind 0.2 trusts the probabilities to mean what they say; pricing both checks it. Fourth, read each term's weight, which Dataiku lists as regression coefficients. So far, the model has met only IMDb reviews. Would it do as well on others?


---
class: vcenter

# Hands-on 5, continued

<img class="phase-thumb" src="images/phase-du-mo.svg" alt="The CRISP-DM phases, data understanding to modeling lit" />

.beside-thumb[
<div class="moves">
<div><b>5. Score</b>Pang and Lee's 2,000 reviews with the model, after a copy of the Prepare recipe.<br /><code>+ Recipe → Score</code>; panel 4</div>
<div><b>6. Plugin</b>The same reviews through Dataiku's sentiment plugin.<br /><code>+ Recipe → Plugins → Sentiment Analysis</code>; panel 4</div>
<div><b>7. Count</b>TP, FP, FN, TN of each, and the cost 4 × FN + FP.<br /><code>Prepare → Formula</code>; panel 4</div>
<div><b>8. Decide</b>Which scorer goes to the care team?<br />Panel 5</div>
</div>

.admonition.question.near[
<i class="fa-solid fa-circle-question"></i> **Buy or build: the plugin, or the model you trained?**
]

.time[Sheet panels 4 and 5. 12 minutes.]
]

.footnote[B. Pang and L. Lee (2004): polarity dataset v2.0. Dataiku (2024), *Sentiment analysis*: a plugin marked not supported.]

???

**Past the checkpoint, each group sets its model against a ready-made scorer, on reviews from another source.** Pang and Lee's 2,000 reviews were written before 2002 (Pang & Lee, 2004, section 3). A sentiment classifier's accuracy can depend on the domain of its texts, and one study found it depends on their period too (Pang & Lee, 2008, section 4.4.1). Do our model's words travel? The rival is Dataiku's sentiment plugin: its page marks it not supported and states no method, and it runs offline, sending no review to an outside service (Dataiku, 2024, *Sentiment analysis*). Both are priced as in the core, 4 × FN + FP. Then the choice, buy or build, weighed by the questions we ask of any method: labels, domain, explanation, where the texts go. Whichever wins, someone will ask why a review was flagged. Can our model answer?


---
class: vcenter

# The heaviest terms

<img class="phase-thumb" src="images/phase-ev.svg" alt="The CRISP-DM phases, evaluation lit" />

.beside-thumb[
<div class="duo big">
<div><b class="k">Where to look</b>In the model's results, the regression coefficients: each term with its weight, the largest first.</div>
<div class="lit"><b class="k">What to ask of each</b>Is it an opinion, such as "bad" or "waste", or the name of a film or an actor?</div>
</div>

.lead.big.center[Every term keeps a weight that can be read: check what the model learned.]
]

.footnote[D. Jurafsky and J. H. Martin (2026), chapter 4; B. Pang et al. (2002), Figure 2: "bad", "waste"; A. L. Maas et al. (2011).]

???

**Each term's weight can be read, so we can check what the model learned.** A logistic regression adds up its terms' weights, so the largest say why it flags a review (Jurafsky & Martin, 2026, p. 121). Dataiku lists them largest first, towards unhappy and towards happy. Of each heavy term, we ask: an opinion, such as "bad" or "waste" (Pang et al., 2002, Figure 2), or a film's or an actor's name? A term found in one class only can get a very high weight (Jurafsky & Martin, 2026, p. 121): a name found only in the reviews of one disliked film, for instance. A model that leans on names has memorised films (Maas et al., 2011, p. 149), and the team's next film is not among them. All morning, we threw away the order of words. What about data where the order is everything?


---
class: vcenter

# Time series

.fullw[
<div class="duo big">
<div><b class="k">Values in order</b>One value per day or month: the order is the data, as word order was for text.</div>
<div><b class="k">Read before forecasting</b>Trend, season and the change from one step to the next, on bike rentals and the Dow Jones.</div>
</div>

.lead.big.center[After lunch, the same question for values ordered in time.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), p. 252.] R. J. Hyndman and G. Athanasopoulos (2021), sections 2.3 and 5.4.]

???

**After lunch, we turn the same question to values ordered in time.** This morning's bag of words threw away the order of the words (Provost & Fawcett, 2013, p. 252), and pairs of words gave back only a little of it. A time series is one value per day or per month, in order, and there the order is the data: the same values in another order make another series. Before forecasting a series, we read it. A trend is a long-term rise or fall; a season, a pattern with a fixed, known period, such as the week (Hyndman & Athanasopoulos, 2021, section 2.3). We look for both in daily bike rentals, and at how far the Dow Jones, an index of share prices, moves from one day to the next. What can a model read from values whose order is everything?
