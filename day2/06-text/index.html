## Text mining and sentiment analysis

### From words to a table, and which reviews to read first

<br />

Oscar Esteban &lt;<code>oscar.esteban@hevs.ch</code>>

EAD · Exploration avancée de données et intelligence décisionnelle · 23.10.2026

<div style="font-size: 0.8em; margin-top: 1.2em;"><a href="https://oesteban.github.io/msba-ead-2026-2027-slides/day2/06-text/index.html">
https://oesteban.github.io/msba-ead-2026-2027-slides/day2/06-text/index.html
</a></div>
]

???

**This deck turns text into a table a model can read, sets four ways to score sentiment side by side, and ends with Hands-on 5 on film reviews.** In text mining the general strategy is to "use the simplest (least expensive) technique that works" (Provost & Fawcett, 2013, p. 251, verbatim): the deck starts from counted words, then asks what each more elaborate method adds. Hands-on 5 compares a model trained in Dataiku DSS with a ready-made sentiment plugin.

**Four parts: text as data, from text to a table of words, scoring sentiment, then a hands-on on film reviews.** *Deep learning for decisions* closed on the question this deck answers: which features can a classifier read from words? Slides 2 to 4 show what firms read text for and what one review holds; slides 5 to 10 turn texts into term columns; slides 11 to 20 compare four ways to score sentiment and how to choose one. The deck ends on a hands-on in Dataiku.


---
class: vcenter
# Text in a firm

.fullw[
<div class="trio">
<div><b class="k">Records</b>Complaint logs, product inquiries, repair records: written for people, not for computers.</div>
<div><b class="k">Reviews</b>Review sites summarise them, and could catch a rating that contradicts its own review.</div>
<div class="lit"><b class="k">Intelligence</b>"Why aren't consumers buying our laptop?" Sales figures alone cannot answer.</div>
</div>

.lead.big.center[Firms hold more text than anyone can read.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), p. 250.] B. Pang and L. Lee (2008), sections 2.1 and 2.3.]

???

**Firms hold more text than anyone can read.** Complaint logs, product inquiries and repair records are written for people, not computers, and "understanding customer feedback often requires understanding text" (Provost & Fawcett, 2013, p. 250, verbatim). Opinion mining helps review sites summarise reviews and catch a rating at odds with its own review, and helps a laptop maker learn why its laptop does not sell, without reading hundreds of versions of the same complaint (Pang & Lee, 2008, sections 2.1 and 2.3). Slide 3 shows one review.


---
class: stepwise-svg, vcenter
# A review

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/review.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The review Great screen, but the battery does not last a day, then the same review as a row of single characters"></object></div>
.step-3.lead.big.center[A text has no columns: a string of characters, of any length.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), p. 250.] The review is written for this deck, as are all the reviews of slides 3 to 20.]

???

**A text has no columns: to a model, it is a string of characters, of any length.** The deck's review, written for it, is 50 characters in a row, and the next review has another length. Text is called unstructured because it lacks "tables of records with fields having fixed meanings" (Provost & Fawcett, 2013, p. 250, verbatim): its structure is linguistic, meant for people, and texts vary in their number of words (p. 250). Slide 4 names what a reader wants from it: the opinion.


---
class: stepwise-svg, vcenter
# Sentiment analysis

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/aspects.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The review split in two: Great screen, positive about the screen; but the battery does not last a day, negative about the battery"></object></div>
.step-4.lead.big.center[The opinion a text expresses; one review can hold two.]
]

.footnote[B. Pang and L. Lee (2008); W. Zhang et al. (2024): aspect-level tasks.]

???

**Sentiment analysis reads the opinion a text expresses, positive or negative; one review can hold two, one per aspect.** Labelling a whole text as positive or negative overall is polarity classification, much studied on reviews (Pang & Lee, 2008, section 4.1.1). Aspect-level classification finds the sentiment towards each aspect a sentence names, since one sentence can judge two targets differently (Zhang et al., 2024, section 3.1). The deck's review praises the screen and condemns the battery: one label for the whole loses one of the two. Slide 5 starts turning it into terms.


---
class: stepwise-svg, vcenter
# Normalisation

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/normalise.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The review cut into words and punctuation, then written in lower case without punctuation"></object></div>
.step-5.lead.big.center[Each word written one way, so that "Screen" and "screen" are one term.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), p. 253.] C. D. Manning, P. Raghavan and H. Schütze (2008), section 2.2.]

???

**Normalisation writes each word one way, so that "Screen" and "screen" count as one term; every step throws something away.** Cutting the review into words, then folding case and dropping punctuation, turns "Great" into "great" and loses a comma and a full stop; folding can also merge words better kept apart, such as "Fed" and "fed" (Manning et al., 2008, sections 2.2.1 and 2.2.3). Case is folded so that "words like Skype and SKYPE are counted as the same thing" (Provost & Fawcett, 2013, p. 253, verbatim). Slide 6 drops whole words.


---
class: stepwise-svg, vcenter
# Stop words

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/stopwords.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The review's ten words; a short stop list drops the and a; a longer list also drops but, does and not, leaving great screen battery last day"></object></div>
.step-5.lead.big.center[Frequent words are often dropped, but "not" can carry the verdict.]
]

.footnote[C. D. Manning et al. (2008), Figure 2.5 and section 2.2.2; the longer list illustrative. .book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), p. 254.]]

???

**Frequent words are often dropped as stop words, but in a review a stop word such as "not" can carry the verdict.** The 25-word stop list of Manning et al. (2008, Figure 2.5) drops only "the" and "a" from the review; the longer list, which is illustrative, also drops "not", and the complaint is gone. Retrieval systems went from stop lists of 200 to 300 terms to 7 to 12, then to none (section 2.2.2), and "stopword elimination is not always a good idea" (Provost & Fawcett, 2013, p. 254, verbatim). Slide 7 cuts the words that remain.


---
class: stepwise-svg, vcenter
# Stemming

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/stemming.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Porter's stemmer turns generalizations into generalization, generalize, general, then gener; battery becomes batteri, day dai, does doe, screen stays screen"></object></div>
.step-3.lead.big.center[Words cut to a common stem, by rule; a stem need not be a word.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), p. 253.] M. F. Porter (1980); C. D. Manning et al. (2008), section 2.2.4.]

???

**Stemming cuts words to a common stem by rule, and a stem need not be a word.** Suffixes are removed so that "announces", "announced" and "announcing" all count as "announc" (Provost & Fawcett, 2013, p. 253). Porter's stemmer does so in ordered steps, from "generalizations" down to "gener" (Porter, 1980). In English search it raises recall, lowers precision and helps little overall (Manning et al., 2008, section 2.2.4); that evidence is not from sentiment, and the movie-review study of slide 13 did not stem (Pang et al., 2002, section 6.1).


---
class: stepwise-svg, vcenter
# Bag of words

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/bow.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Three reviews as a table of term counts, one row per review and one column per term: battery, day, good, great, last, not, screen"></object></div>
.step-4.lead.big.center[One column per term, one row per text: the word order is gone.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 252 to 253.] Normalised, stop words but "not" removed, not stemmed.]

???

**A bag of words gives each term a column and each text a row, with a count in each cell; the word order is gone.** Each text becomes a feature vector, and the approach "ignores grammar, word order, sentence structure, and (usually) punctuation" (Provost & Fawcett, 2013, p. 252, verbatim); the counts are term frequencies (pp. 252 to 253). Reviews 1 and 2 both hold "not" and "great", yet one faults the battery and the other the screen: the counts cannot say what "not" negates. Slide 9 keeps some of the order.


---
class: stepwise-svg, vcenter
# N-grams

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/ngrams.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Reviews 1 and 2 as words; the pairs not last and not great become terms; 7 words and 9 pairs make 16 columns"></object></div>
.step-4.lead.big.center[Pairs of adjacent words keep a little order, at the cost of many more columns.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 263 to 264.] B. Pang, L. Lee and S. Vaithyanathan (2002); X. Zhang, J. Zhao and Y. LeCun (2015).]

???

**Pairs of adjacent words, n-grams, keep a little of the order: "not great" becomes a term, at the cost of many more columns.** N-grams "greatly increase the size of the feature set" (Provost & Fawcett, 2013, p. 264, verbatim): here 7 words and 9 pairs make 16 columns. On 1,400 movie reviews, adding pairs to words did not raise accuracy (Pang et al., 2002, Figure 3); on Yelp polarity, with 280,000 training reviews per class, n-grams cut a logistic regression's error from 7.76% to 4.36% (Zhang et al., 2015, Table 4). Slide 10 weighs the columns.


---
class: stepwise-svg, vcenter
# TF-IDF

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/tfidf.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The inverse document frequency of each term, then the three reviews' counts weighted by it: battery and screen weigh least, day, last and good most"></object></div>
.step-4.lead.big.center[A term weighs most when frequent in this text and rare in the others.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 254 to 256, with the natural logarithm.] G. Salton and C. Buckley (1988).]

???

**TF-IDF weighs a term most when it is frequent in this text and rare in the others.** The figure uses the textbook's formula, count times IDF(t) = 1 + log(N / documents containing t), with the natural logarithm (Provost & Fawcett, 2013, pp. 255 to 256). IDF is "the boost a term gets for being rare" (Provost & Fawcett, 2013, p. 255, verbatim): "battery" and "screen", in all three reviews, keep 1.00; "day" and "last", in one, get 2.10. Salton and Buckley (1988, p. 516) give the same reasoning for retrieval. Slide 11 turns to sentiment.


---
class: vcenter

# Four ways to score sentiment

.fullw[
<div class="quad big">
<div><b>1 · A lexicon</b>Listed words with scores, and rules; no labelled example, every verdict readable.</div>
<div class="lit"><b>2 · A model on words</b>A weight per term, learned from labelled texts; the weights can be read.</div>
<div><b>3 · A pretrained network</b>A new head, or fine-tuned, on labelled texts; hard to read.</div>
<div><b>4 · A prompted language model</b>The classes described in words; no training, hard to read.</div>
</div>
.lead.big.center[They differ in the labels they need and in how far a verdict can be read.]
]

.footnote[J. Hartmann et al. (2023); C. Hutto and E. Gilbert (2014); J. Devlin et al. (2019); W. Zhang et al. (2024).]

???

**Four ways to score sentiment differ in the labelled texts they need and in how far a verdict can be read.** A lexicon such as VADER needs no labelled data (Hutto & Gilbert, 2014), and each verdict traces back to its words; a model on words learns from labelled texts (Hartmann et al., 2023, p. 78). BERT is pretrained on unlabelled text, then fine-tuned with one added output layer (Devlin et al., 2019, p. 1); a prompted model gets only a description of the task (Zhang et al., 2024, section 4.2). Slides 12 to 18 take them in turn.


---
class: stepwise-svg, vcenter
# Lexicons

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/lexicon.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The review word by word: great scores plus 3.1; but makes what follows count more; not flips the next listed word, but the complaint holds no listed word"></object></div>
.step-5.lead.big.center[A lexicon scores the words it lists, with rules for "but", "not", capitals and "!".]
]

.footnote[C. Hutto and E. Gilbert (2014), section 3: the word scores and the rules.]

???

**A lexicon scores the words it lists, with rules for "but", "not", capitals and "!"; a complaint in unlisted words scores nothing.** VADER rates just over 7,500 features from -4 to +4, "great" 3.1; the clause after "but" dominates, a negation among the three words before a listed word flips it, and "!", capitals and degree words raise intensity (Hutto & Gilbert, 2014, section 3). In the deck's review only "great" is listed, so the verdict rests on the praise and the battery complaint counts for nothing. Slide 13 tests word lists made by hand.


---
class: vcenter

# Word lists by hand

.fullw[
<div class="facts big">
<div><span class="num">58%</span>five positive and five negative words chosen by one person, on 1,400 movie reviews.</div>
<div><span class="num">64%</span>a second person's longer lists, on the same reviews.</div>
<div><span class="num">69%</span>seven words each way read off the reviews' counts, "?" and "!" among them.</div>
</div>
.lead.big.center[Intuition missed what the data shows: learned classifiers reached 83%.]
]

.footnote[B. Pang, L. Lee and S. Vaithyanathan (2002), Figures 1 and 2, and Figure 3: 82.9%. Half the reviews positive: 50% by chance.]

???

**Word lists chosen by intuition scored 58% and 64% on movie reviews, below every classifier learned from the data.** Two graduate students proposed indicator words; counting them on 700 positive and 700 negative reviews, where chance gives 50%, scored 58% and 64% (Pang et al., 2002, Figure 1). Seven words each way, picked partly from the reviews' own counts, reached 69% (Figure 2); learned classifiers scored 72.8% to 82.9% (Figure 3). The authors conclude that features are better selected from the data than by intuition (section 4). Slide 14 shows such a model.

class: stepwise-svg, vcenter
# A linear model on words

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/linear.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Review 1's six terms, each with a weight towards negative, summed to plus 0.2, then the logistic function: a probability of 0.55 that the review is negative"></object></div>
.step-5.lead.big.center[One weight per term, learned from labelled texts; the score adds them up.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 85 and 97 to 98.] D. Jurafsky and J. H. Martin (2026), chapter 4 and p. 534. *Evaluating a classifier*, slide 3. Weights illustrative.]

???

**A linear model on words gives each term a weight learned from labelled texts and adds them up: the logistic regression of the first day.** A linear model is "a weighted sum of the attribute values" (Provost & Fawcett, 2013, p. 85, verbatim); logistic regression reads that sum as log-odds and turns it into a probability (pp. 97 to 98), as on slide 3 of *Evaluating a classifier*. Here the weights are illustrative: review 1's sum of +0.2 gives P(negative) 0.55. Trained on much labelled text like the texts to score, it is hard to beat (Jurafsky & Martin, 2026, p. 534).


---
class: stepwise-svg, vcenter
# Tokens

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/tokens.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="screen is one token; lower becomes low and er; GRPO becomes four letters"></object></div>
.step-4.lead.big.center[A language model reads tokens learned from text: words, or pieces of words.]
]

.footnote[D. Jurafsky and J. H. Martin (2026), section 2.4: "lower" and "GRPO"; the single token for "screen" illustrative.]

???

**A language model reads tokens learned from text: most are words, others pieces of words, so an unseen word becomes known pieces.** Its tokenizer learns a vocabulary from a training corpus, for instance by byte-pair encoding, instead of using words as slide 5 cut them (Jurafsky & Martin, 2026, section 2.4). A model that never saw "lower" reads "low" and "er", and a very rare acronym such as "GRPO" may become single letters (p. 43). The single token for "screen" is illustrative. Slide 16 turns each token into numbers.


---
class: stepwise-svg, vcenter
# Embeddings

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/embeddings.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Words placed in two dimensions: battery, charger and power together, screen and display together, great, good and excellent together, awful, bad and poor together; battery as a vector of numbers"></object></div>
.step-3.lead.big.center[Close meanings lie close, but no single number can be read.]
]

.footnote[D. Jurafsky and J. H. Martin (2026), chapter 5: 50 to 1,000 dimensions. Positions and values illustrative.]

???

**An embedding turns a token or a text into a few hundred numbers where close meanings lie close; unlike a TF-IDF column, no single number can be read.** Embeddings are learned from how words are distributed in texts: words in similar contexts tend to mean similar things (Jurafsky & Martin, 2026, p. 127). They have 50 to 1,000 dimensions with no clear interpretation, where TF-IDF gives one sparse column per term (p. 136). The RAG workshop's documents were embedded this way; the figure's positions and values are illustrative.


---
class: stepwise-svg, vcenter
# Pretrained transformers

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/transfer-text.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A review as tokens enters a pretrained network of seven locked blocks, then a new head that outputs positive or negative"></object></div>
.step-4.lead.big.center[Pretrained on text, given a new head for sentiment: transfer learning again.]
]

.footnote[J. Devlin et al. (2019), pp. 1 and 5. *Deep learning for decisions*, slides 30 and 31.]

???

**A transformer pretrained on unlabelled text and given a new head for sentiment is transfer learning again, as with the photos of the deep-learning deck.** BERT reads each word with its context on both sides and is fine-tuned for a task with one added output layer (Devlin et al., 2019, p. 1). It was pretrained on 800 million words of books and 2,500 million of English Wikipedia (p. 5). In the figure the blocks stay locked under a new head, as on slide 30 of *Deep learning for decisions*; unlocking some is the fine-tuning of its slide 31.


---
class: stepwise-svg, vcenter
# Prompted language models

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/prompt.svg" style="width: 86%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The question positive or negative and the review go to a language model, with no weight change; it answers negative"></object></div>
<div class="facts two step-4">
<div><span class="num">97%</span>of a fine-tuned model's accuracy, on average, on two-class polarity tasks.</div>
<div><span class="num">52% against 66%</span>on five-star Yelp reviews: the fine-tuned model far ahead.</div>
</div>
.step-5.lead.center[Zero-shot: close to a fine-tuned model on two classes, far behind it on five.]
]

.footnote[W. Zhang et al. (2024); T. Brown et al. (2020), p. 7. The answer is illustrative.]

???

**A prompted language model labels a text from the classes described in words: close to a fine-tuned model on two classes, far behind it on five.** With no labelled example, this is called zero-shot. The model gets only an instruction describing the task and answers with forward passes alone (Brown et al., 2020, p. 7). Zero-shot ChatGPT reached on average 97% of a fine-tuned model's accuracy on polarity, but 52.4 against 65.6 on five-class Yelp reviews; prompts and model versions move such scores (Zhang et al., 2024). Commercial models change without notice and may reuse what they are sent (Chae & Davidson, 2025). The answer shown is illustrative.


---
class: vcenter

# How accurate

.fullw[
<div class="facts big">
<div><span class="num">69%</span>lexicons, on average, across 1,188 published accuracy figures.</div>
<div><span class="num">+9</span>points for traditional machine learning, such as a model on words.</div>
<div><span class="num">+20</span>points for transfer learning: a pretrained network, fine-tuned.</div>
</div>
.lead.big.center[Each step up adds points; every figure shrinks on a firm's own texts.]
]

.footnote[J. Hartmann et al. (2023): 69.23%, +9.45 and +20.22 points; transformers about 89% on applied data, 95 to 97% on SST-2. J. Devlin et al. (2019).]

???

**Across 1,188 published accuracy figures, lexicons average about 69%, models on words about 9 points more and fine-tuned transformers about 20 more; every figure shrinks on applied data.** The meta-analysis gives 69.23%, then 9.45 and 20.22 points more; three classes instead of two cost 12.7 points (Hartmann et al., 2023). Fine-tuned transformers reach a median of about 89% on applied datasets, against 95 to 97% on SST-2, single movie-review sentences (Hartmann et al., 2023; Devlin et al., 2019). These are levels, not a ranking.


---
class: vcenter

# Choosing one

.fullw[
<div class="quad big">
<div><b>Labels</b>How many labelled texts exist, or can be made?</div>
<div><b>Domain</b>How far are your texts from those the method learned on?</div>
<div><b>Explanation</b>Must each verdict be explained to someone?</div>
<div class="lit"><b>Where the texts go</b>May they be sent to a provider's model?</div>
</div>
.lead.big.center[No method wins everywhere: measure it on a labelled sample of your own texts.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), p. 251.] J. Hartmann et al. (2023); B. Pang and L. Lee (2008); Y. Chae and T. Davidson (2025).]

???

**No method wins everywhere: whatever the method, its figure comes from a labelled sample of the firm's own texts.** Without labels, only a lexicon or a prompted model applies; only traditional machine learning gains significantly from more (Hartmann et al., 2023). Domain matters: "unpredictable" praises a plot and condemns a car's steering (Pang & Lee, 2008, section 4.4.1). Commercial models may reuse the texts sent to them, and every approach needs an annotated test sample (Chae & Davidson, 2025). The textbook advises starting with the cheapest technique that does the job (Provost & Fawcett, 2013, p. 251).

**Hands-on 5 trains a model on 2,000 IMDb reviews, then sets it against Dataiku's sentiment plugin on 2,000 reviews from another source.** The training reviews are a subset of the 50,000 that Maas et al. (2011) released for sentiment classification, all clear verdicts. The second set, Pang and Lee's polarity dataset, written before 2002 (Pang & Lee, 2004), serves only after the checkpoint. Slides 22 to 25 set the case and the data before any model is trained.

**Under TF-IDF each term keeps a weight that can be read: check that the words pushing towards "unhappy" are opinions, not names.** A weight's size shows why a logistic regression decides as it does, and a term found in one class only can get a very high weight (Jurafsky & Martin, 2026, p. 121). The telling words of movie reviews include "bad" and "waste" (Pang et al., 2002, Figure 2), but a learner can also memorise character names (Maas et al., 2011). Among the textbook's stock-news terms, econtent and edesign reflect their late-1990s corpus (Provost & Fawcett, 2013, p. 273).

<div class="duo big">

<div><b class="k">Read before forecasting</b>Trend, season and the change from one step to the next, on bike rentals and the Dow Jones.</div>
</div>

.lead.big.center[After lunch, the same question for values ordered in time.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), p. 252.] R. J. Hyndman and G. Athanasopoulos (2021), sections 2.3 and 5.4.]

???

**After lunch, the same question turns to values ordered in time: what a model can read from them.** The bag of words of slide 8 drops the word order (Provost & Fawcett, 2013, p. 252); in a time series the order is the data. A trend is a long-term rise or fall; a seasonal pattern has a fixed, known period, such as a week (Hyndman & Athanasopoulos, 2021, section 2.3). For stock indexes such as the Dow Jones, the last value is often the best forecast, leaving the change from one step to the next (section 5.4).
