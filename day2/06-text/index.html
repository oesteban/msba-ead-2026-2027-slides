.section-mark.center[
## Text mining and sentiment analysis

### From words to numbers that enable modeling

<br />

Oscar Esteban &lt;<code>oscar.esteban@hevs.ch</code>>

<br />

EAD · Exploration avancée de données et intelligence décisionnelle · 23.10.2026

<div style="font-size: 0.8em; margin-top: 1.2em;"><a href="https://oesteban.github.io/msba-ead-2026-2027-slides/day2/06-text/index.html">
https://oesteban.github.io/msba-ead-2026-2027-slides/day2/06-text/index.html
</a></div>
]

???

**Today, we'll turn words into numbers that a model can learn from.** This is text mining: data mining applied to text. This morning, *Deep learning* ended on a question: which features can a classifier read from words? A photo reaches a network as numbers, three per pixel. A review reaches us as a line of characters, and no model computes with a character. How does a review become numbers a model can use?

layout: true

<p class="rotate">

</p>

???

**We'll go in four parts.** First, text as data: we turn each review into a row of numbers, the kind of table the models of the first day read. Second, we score sentiment from those words, first with a list of scored words, then with a model that learns its own weights. Third, language models, which learn from text itself and have changed how text is read. Last, the hands-on in Dataiku, on film reviews. So, first: what is text, as data?


---
.section-mark.part[
.kicker[Part 1 of 4]

# Text as data

<div class="parts"><span class="now">Text as data</span><span>Scoring sentiment from words</span><span>Language models</span><span>Hands-on 5</span></div>
]

???

**Part 1 turns text into a table a model can read.** We'll see what a review is to a computer, how counting its words gives it columns, which choices that counting involves, and a second way to turn words into numbers. But why would a firm go to that trouble?


---
class: vcenter
# Text in a firm

.fullw[
<div class="trio">
<div><b class="k">Records</b>Complaint logs, product inquiries, repair records: written for people to read.</div>
<div><b class="k">Reviews</b>What customers think of a product, in their own words, by the thousand.</div>
<div class="lit"><b class="k">Questions</b>"Why aren't consumers buying our laptop?" Sales figures alone cannot say.</div>
</div>

.lead.big.center[Firms hold more text than anyone can read.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), p. 250.] B. Pang and L. Lee (2008), sections 2.1 and 2.3.]

???

**Firms hold more text than anyone can read.** Complaint logs, product inquiries, repair records and reviews are written for people, not for computers. Take a laptop maker whose sales disappoint. Its sales figures say that the laptop does not sell; they cannot say why. The why is in what customers write, in hundreds of versions of the same complaints. No analyst can read them all, so we want a model to read them for us. What does one review look like to that model?


---
class: stepwise-svg, vcenter
# Example: a review

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/review.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The review Great screen, but the battery does not last a day, then the same review as a row of single characters"></object></div>
.step-3.lead.big.center[To a model, a text is a string of characters.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), p. 250.] The review is written for this deck, as are all the reviews before the hands-on.]

???

**To a model, a text is a string of characters.** We read this review in a second: a good screen, a poor battery. A computer receives 50 characters in a row. Our models need columns that mean the same thing in every row, as the alcohol column did for every wine of *Beyond binary classification*. Text has no such columns: the seventh character belongs to "screen" here, to another word in the next review, and the next review has another length anyway. Before we look for columns, what do we want to read from a review?


---
class: stepwise-svg, vcenter
# Sentiment analysis

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/aspects.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The review split in two: Great screen, positive about the screen; but the battery does not last a day, negative about the battery"></object></div>
.step-4.lead.big.center[Sentiment analysis reads the opinion a text expresses.]
]

.footnote[B. Pang and L. Lee (2008); W. Zhang et al. (2024): aspect-level tasks.]

???

**Sentiment analysis reads the opinion a text expresses.** Most often, the question is the polarity: is the review, overall, positive or negative? That assumes one opinion per text. Ours holds two: it praises the screen and faults the battery, two aspects of the same laptop, and a single label keeps one opinion and loses the other. In the hands-on, each review gets one label, and we accept that loss. To learn a label, a model reads columns, and a review has none. How can we give it some?


---
class: vcenter
# From search to text mining

.fullw[
<div class="trio">
<div><b class="k">Search, around 1970</b>SMART, at Cornell, saw a document as a vector, a list of numbers, one weight per word, matched against a query's words.</div>
<div><b class="k">A bag of words</b>A text reduced to which words it holds, and how often: the order is ignored.</div>
<div class="lit"><b class="k">Text mining</b>The same counts give a classifier its columns: one per term (for now, a word), one row per text.</div>
</div>

.lead.big.center[To give a text columns, we count its words.]
]

.footnote[C. D. Manning, P. Raghavan and H. Schütze (2008), pp. 117, 133 and 182. .book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 251 to 252 and 263.]]

???

**To give a text columns, we count its words.** The idea comes from search engines. Around 1970, the SMART system treated each document as a vector, a list of numbers with one weight per word, and compared it with the words of a query. Counting words in this way turns a text into a bag of words: which words it holds, and how often, whatever their order. Text mining borrowed the bag of words to give classifiers their columns, one per term, a term being, for now, a word. But before we count, which strings count as the same word?


---
class: stepwise-svg, vcenter
# Normalisation

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/normalise.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The review cut into words and punctuation, then written in lower case without punctuation"></object></div>
.step-5.lead.big.center[Normalisation writes each word one way, so that "Great" and "great" share a column.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), p. 253.] C. D. Manning, P. Raghavan and H. Schütze (2008), section 2.2.]

???

**Normalisation writes each word one way, so that "Great" and "great" share a column.** To a computer they are two different strings, and each would get its own column, splitting one word's count. So we cut the text into words, write every letter in lower case and drop the punctuation. Each step throws something away: here, a capital, a comma and a full stop. Usually that is harmless; sometimes not, as when the Fed, the American central bank, becomes "fed". Then there are words like "the" and "a", in nearly every review. Do they help tell reviews apart?


---
class: stepwise-svg, vcenter
# Stop words

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/stopwords.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The review's ten words; a short stop list drops the and a; a longer list also drops but, does and not, leaving great screen battery last day"></object></div>
.step-6.lead.big.center[Dropping the most frequent words can drop the verdict.]
]

.footnote[C. D. Manning et al. (2008), Figure 2.5 and section 2.2.2; the longer list illustrative. .book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 253 to 254.]]

???

**Dropping the most frequent words can drop the verdict.** Words like "the" and "a" appear in nearly every text, so they tell texts apart very little, and a stop list removes them before counting. A short list takes only "the" and "a" from our review. A longer one also removes "but", "does" and "not", and without "not" the complaint is gone. Search engines learned this: their stop lists shrank from 200 or 300 words to a dozen, then to none, because a dropped word can carry the meaning. In the lab, we check whether "not" survives. And "battery" and "batteries": one term or two?


---
class: stepwise-svg, vcenter
# Stemming

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/stemming.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Forms of the review's words cut to one stem by Porter's rules: battery and batteries to batteri, day and days to dai, last, lasts and lasting to last, screen and screens to screen"></object></div>
.step-4.lead.big.center[Stemming merges the forms of a word into one term.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), p. 253.] M. F. Porter (1980), stems computed with NLTK's implementation; C. D. Manning et al. (2008), section 2.2.4; B. Pang et al. (2002).]

???

**Stemming merges the forms of a word into one term.** "Battery" in one review and "batteries" in another make the same complaint; counted apart, they split it. Stemming cuts word endings by rule, and Porter's rules, the most used for English, turn these nine forms into four terms. A stem need not be a word, as "batteri" and "dai" show: it only has to be the same for every form. In search, stemming helps little overall, and one early study of movie reviews did not stem at all. One problem remains: counted word by word, "not" is cut off from what it negates. Could a term hold two words?


---
class: stepwise-svg, vcenter
# N-grams

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/ngrams.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Reviews 1 and 2 as words; the pairs not last and not great become terms; 7 words and 9 pairs make 16 columns"></object></div>
.step-4.lead.big.center[N-grams, here pairs of adjacent words, keep a little of the order.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 118 and 263 to 264.] B. Pang, L. Lee and S. Vaithyanathan (2002); X. Zhang, J. Zhao and Y. LeCun (2015).]

???

**N-grams, here pairs of adjacent words, keep a little of the order.** An n-gram is a sequence of n words taken as one term; a pair is a bi-gram. With pairs, "not last" and "not great" become terms that say what is negated. The cost: these two reviews have 7 words and 7 pairs, twice the columns, and each column needs examples to learn from. So pairs pay off only with many labelled texts: on 1,400 movie reviews they did not help, on hundreds of thousands of Yelp reviews they did. With the terms chosen, what does the table look like?


---
class: stepwise-svg, vcenter
# Bag of words

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/bow.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The deck's three reviews, then a table with one row per review and one column per word as written, fifteen columns, with Great and great in two different columns"></object></div>
.step-4.lead.big.center[One column per word, one row per text, a count in each cell.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 252 to 253.] Normalised, stop words but "not" removed, not stemmed.]

???

**One column per term, one row per text, a count in each cell.** Here are our three reviews after preprocessing: lower case, a stop list that keeps "not", no stemming, and no pairs, to keep the table small. Each cell is a term frequency, how many times that term appears in that review: "good" twice in review 3. The order of the words is gone. Now look at "battery" and "screen": they are in every review. What does a count tell us about such a term, and what else can raw counts get wrong?


---
class: vcenter
# What a count misses

.fullw[
<div class="trio">
<div><b class="k">Long texts</b>A review of 1,000 words has larger counts than one of 50, without saying more.</div>
<div class="lit"><b class="k">Common terms</b>"battery" is in every review: its count tells no review from another.</div>
<div><b class="k">Rare terms</b>A term in one review only: most systems set a lower limit on the texts that must hold it.</div>
</div>

.lead.big.center[Raw counts favour long texts and common words.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 254 to 255.]]

???

**Raw counts favour long texts and common words.** A count should say how much a term matters to a text, and raw counts mislead in three ways. A review of 1,000 words has larger counts than one of 50 without saying more, so systems often divide each count by the text's length. A term found in every review, such as "battery", tells none apart. A term found in a single review gives a model nothing to generalise from, so systems require a minimum number of texts to hold it, as Dataiku does in the lab. For the common terms: could each term count more the rarer it is?


---
class: stepwise-svg, vcenter
# TF-IDF

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/tfidf.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The formula TF-IDF equals count times IDF, IDF equals 1 plus the natural log of N over the reviews holding the term; the IDF of each term; then the three reviews' counts weighted by it: battery and screen weigh least, day, last and good most"></object></div>
.step-6.lead.big.center[TF-IDF turns counts into weights a model can learn from.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 254 to 256, ln the natural logarithm.] G. Salton and C. Buckley (1988). D. Jurafsky and J. H. Martin (2026), pp. 136 to 137.]

???

**TF-IDF turns counts into weights a model can learn from: telling terms high, common ones low.** Each count is multiplied by the term's inverse document frequency, IDF, "the boost a term gets for being rare" (Provost & Fawcett, 2013, p. 255, verbatim). "Day" is in one of our three reviews: its IDF is 1 + ln 3 = 2.10. "Battery", in all three, keeps 1. Each review's heaviest terms now set it apart: "day" and "last" in review 1, "good" in review 3. That is what TF-IDF is for: these weights are the columns a model learns from, in the lab too. Yet "great" and "excellent" get two unrelated columns. Can numbers know which words are alike?


---
class: stepwise-svg, vcenter
# Embeddings by one example: GloVe

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/embeddings.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A table of cosines between six words in GloVe: great, good, bad and awful close to one another, good as close to bad as to great, 0.80; battery and charger close to each other and far from the judging words; the battery is good, the battery is bad: the same neighbours"></object></div>
.step-3.lead.big.center[Words used alike get close vectors, whatever their sentiment.]
]

.footnote[J. Pennington et al. (2014): GloVe, 6 billion tokens, .lic[PDDL]; computed. D. Jurafsky and J. H. Martin (2026), ch. 5; A. L. Maas et al. (2011).]

???

**Words used alike get close vectors, whatever their sentiment.** An embedding gives each word a vector, a list of numbers learned from the words around it in a large body of text. GloVe is one such method: 50 numbers per word, learned from 6 billion tokens of text, roughly words. The cosine says how close two vectors point: 1 for the same direction, 0 for unrelated. In the table, the judging words sit together, and so do "battery" and "charger". But "good" sits as close to "bad" as to "great", 0.80 each, because both fill the same places: "the battery is good", "the battery is bad". The vectors know which words are alike, not which are positive. From counts or vectors, how do we reach a verdict?


---
.section-mark.part[
.kicker[Part 2 of 4]

# Scoring sentiment from words

<div class="parts"><span>Text as data</span><span class="now">Scoring sentiment from words</span><span>Language models</span><span>Hands-on 5</span></div>
]

???

**Part 2 gets from a review's words to a verdict, positive or negative.** Part 1 gave each review numbers, but no number yet says which way a review leans. Something must decide which words point to which side, and how strongly. We'll see two answers: people who score words in advance, and a model that learns the scores from labelled reviews. What can a list of scored words make of our review?


---
class: stepwise-svg, vcenter
# Lexicons

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/lexicon.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="VADER on the review: great scores plus 3.1; but makes the clause after it dominate; the complaint holds no listed word and scores 0; VADER's verdict is plus 0.37, positive"></object></div>
.step-5.lead.big.center[A lexicon is a list of words, each with a sentiment score.]
]

.footnote[C. Hutto and E. Gilbert (2014), section 3: the word scores and the rules. Computed with the vaderSentiment package.]

???

**A lexicon is a list of words, each with a sentiment score.** A review's score adds up the scores of the listed words it holds, so no labelled review is needed, and every verdict can be traced back to its words. VADER is a ready-made lexicon of about 7,500 entries, each scored by people from −4 to +4; "great" scores 3.1. It also has a few rules: for instance, what follows "but" counts more than what comes before. In our review, VADER knows "great" and no word of the complaint, so the complaint counts for nothing and the review comes out positive, +0.37. The list decides everything. Could the data choose the words, and how much each counts?


---
class: stepwise-svg, vcenter
# A linear model on words

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/linear.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Review 1's six terms, each with a weight towards negative, summed to plus 0.2, then the logistic function: a probability of 0.55 that the review is negative"></object></div>
.step-5.lead.big.center[A linear model learns one weight per term from labelled texts.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 85 and 97 to 98.] D. Jurafsky and J. H. Martin (2026), chapter 4 and p. 534; B. Pang et al. (2002), Figures 1 to 3. *Evaluating a classifier*, slide 3. Weights illustrative.]

???

**A linear model learns one weight per term from labelled reviews.** It multiplies each term's value by its weight and adds the products up; the logistic function turns the sum into a probability, as in the first day's logistic regression. The weights are learned from reviews whose label we know, so the data, not a person, decides which words matter and how much. On 1,400 movie reviews, word lists chosen by people scored 58% and 64%, where guessing gives 50%; learned models reached 83%. The weights in the figure are illustrative. But the model learns only from our labelled reviews: a word none of them used gets no weight. What if a model learned language from all the text it can read?


---
.section-mark.part[
.kicker[Part 3 of 4]

# Language models

<div class="parts"><span>Text as data</span><span>Scoring sentiment from words</span><span class="now">Language models</span><span>Hands-on 5</span></div>
]

???

**Part 3 is about language models, which learn from text itself rather than from our labels.** Everything so far started from words we counted and labels we gave. Language models learn from vast amounts of unlabelled text which words fit together and what they mean. Where did they come from?


---
class: stepwise-svg, vcenter
# Language models before they were large

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/lm-history.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A timeline: 1948, Shannon predicts next words from counts; 1975 to 1985, IBM's speech recognition coins the term language model; 2003, a neural network predicts the next word; 2013, word2vec learns embeddings by predicting neighbours; 2018, ELMo, one language model reused for many tasks"></object></div>
.step-6.lead.big.center[A language model predicts the next word; it was first built for speech recognition.]
]

.footnote[D. Jurafsky and J. H. Martin (2026), pp. 13, 89, 137, 150 and 207. Drawn.]

???

**A language model predicts the next word; it was first built for speech recognition.** Given the words so far, it gives each possible next word a probability. In 1948, Shannon already approximated English by predicting each word from counts of the words before it. Between 1975 and 1985, a speech-recognition group at IBM coined the term "language model": to turn sound into text, it helps to know which word sequences are likely. Their models counted short sequences of words, n-grams. In 2003, a neural network learned to predict the next word; in 2013, word2vec learned word embeddings, of the kind GloVe gave us, by predicting neighbouring words. In 2018, ELMo showed that one language model could be reused for many tasks. Then language models grew. Why?


---
class: stepwise-svg, vcenter
# Large language models

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/lm-sizes.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Parameters on a log scale: BERT 0.34 billion in 2018, GPT-2 1.5 billion in 2019, GPT-3 175 billion in 2020, Llama 3.1 405 billion in 2024; GPT-5, Claude and Gemini do not disclose their size"></object></div>
.step-4.lead.big.center[More parameters, text and compute make a language model predict better.]
]

.footnote[J. Devlin et al. (2019); D. Jurafsky and J. H. Martin (2026), pp. 7, 204 and 205 (Fig. 7.24).]

???

**Language models became large because more parameters, more text and more compute make them predict better.** A parameter is one of the numbers a network learns. BERT, in 2018, had a third of a billion; GPT-3, two years later, 175 billion; Llama 3.1, in 2024, 405 billion, trained on over 15 trillion tokens. Mind the scale: each line on the chart is ten times the one below. A model's quality rises with its size, its training text and its training compute, so all three grew; these relationships are called scaling laws. The largest models today, such as GPT-5, Claude and Gemini, do not disclose their size. How can a model learn from so much text, when nobody labels it?


---
class: stepwise-svg, vcenter
# How language models learn

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/lm.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The review with its last word hidden; BERT's five likeliest words: second 0.43, minute 0.14, moment 0.08, day 0.08, week 0.07"></object></div>
.step-4.lead.big.center[A language model learns from text alone, by guessing the words left out.]
]

.footnote[D. Jurafsky and J. H. Martin (2026), pp. 5 and 9; J. Devlin et al. (2019), pp. 1 and 5: the masked language model. Computed with BERT base uncased, .lic[Apache 2.0].]

???

**A language model learns from text alone, by guessing the words left out.** The text supplies its own answers: hide a word, and the original still holds it. BERT learns by hiding words anywhere in a sentence and guessing each from the words on both sides; it learned from 3.3 billion words of books and Wikipedia. We hid our review's last word. BERT's first guess is "second", at 0.43, and the review's own "day" comes fourth, at 0.08: all five guesses are spans of time. This learning without labels is called pretraining. But what does BERT actually read: whole words?


---
class: stepwise-svg, vcenter
# Tokens

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/tokens.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="BERT's tokens: the review as twelve tokens, one per word or mark; touchscreen as touch and screen; overheating as over, hea and ting; a vocabulary of 30,522 tokens"></object></div>
.step-5.lead.big.center[A model that reads text reads tokens: whole words, or pieces of rarer ones.]
]

.footnote[J. Devlin et al. (2019), p. 4: WordPiece. D. Jurafsky and J. H. Martin (2026), section 2.4. Computed with BERT's tokenizer.]

???

**A language model reads tokens: whole words, or pieces of rarer ones.** A model works from a fixed list of units, each with its own numbers, and a word missing from the list could not be read at all. So the list itself is learned from text: common words get a token of their own, rarer ones are written as known pieces. BERT's list holds 30,522 tokens. Our review becomes 12 tokens, one per word or mark, all in lower case. "Touchscreen" becomes "touch" and "##screen", the "##" marking a piece that continues a word; "overheating" splits into pieces that mean nothing alone. To guess a hidden word, the model must read each token with the others. How?


---
class: stepwise-svg, vcenter
# Transformers

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/context.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Reviews 1 and 2, each with the word great; GloVe gives great one fixed vector, a cosine of 1.00 between the two; BERT reads great with its neighbours, a cosine of 0.62"></object></div>
.step-5.lead.big.center[Language models use transformers, which read each word with all the others.]
]

.footnote[A. Vaswani et al. (2017), pp. 1 to 2; D. Jurafsky and J. H. Martin (2026), pp. 177 to 178. Computed with BERT base uncased and GloVe.]

???

**Language models use transformers, which read each word with all the others.** To predict a word, a model needs the rest of the text, and not every word matters equally. A transformer computes, for each token, how much every other token matters to it, and mixes their numbers into its own; this step is called attention. It handles all the tokens at once rather than one after another, so it can be trained on huge amounts of text in parallel: that is what let language models grow. Our reviews show the effect. In GloVe, "great" has one fixed vector, the same in both reviews. In BERT, its vector changes once "not a" comes before it: a cosine of 0.62. How do we put such a model to work on our own task?


---
class: vcenter
# Four ways to get a model

.fullw[
<div class="quad big">
<div class="lit"><b>1 · Zero-shot</b>The classes described in words; no labelled example.</div>
<div><b>2 · A new head</b>Locked pretrained layers; tens to hundreds of examples.</div>
<div><b>3 · Fine-tuning</b>More layers learn: more examples needed.</div>
<div><b>4 · From scratch</b>Every weight learned: millions of examples, and a supercomputer's compute.</div>
</div>
.lead.big.center[Zero-shot, dimmed this morning, needs a model that reads text.]
]

.footnote[*Deep learning*, slide 34, and its sources.]

???

**Zero-shot, dimmed this morning, needs a model that reads text.** In *Deep learning*, we saw four ways to get a model, each needing more labelled examples than the one before. With a new head, the pretrained layers stay locked and only a new last layer learns from our examples: that is how EfficientNet learned lions and tigers. Fine-tuning also unlocks some pretrained layers. Zero-shot needs no labelled example at all: we describe the classes in words, so the model must understand words. We now have such models. First, let's do with BERT what we did with the photos.


---
class: stepwise-svg, vcenter
# Pretrained transformers

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/transfer-text.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A review as tokens enters a pretrained network of seven locked blocks, then a new head that outputs positive or negative"></object></div>
.step-4.lead.big.center[A pretrained transformer learns sentiment from labelled texts through a new head.]
]

.footnote[J. Devlin et al. (2019), pp. 1 and 5; J. Hartmann et al. (2023), p. 81. Transfer learning and fine-tuning: *Deep learning*.]

???

**A pretrained transformer learns sentiment from labelled reviews through a new head.** Pretraining taught BERT language, not our labels. As with the lions and tigers, we keep its layers and add a new last layer, with one output per class, positive and negative, trained on our labelled reviews. With the pretrained layers locked, this is transfer learning; with some unlocked, fine-tuning, which BERT's authors did for all of them. It needs fewer labelled reviews than a model on words, because it does not have to learn the language from them. But it still needs some. What if we have none?


---
class: stepwise-svg, vcenter
# Generative language models

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/generate.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The text so far goes to the model, which predicts the next word; the word is added and the model predicts again; trained further on questions and answers, it continues a question with its answer"></object></div>
.step-5.lead.big.center[A generative model writes by predicting the next word, again and again.]
]

.footnote[D. Jurafsky and J. H. Martin (2026), Fig. 1.3, p. 6, and pp. 9 to 10. Schematic; the words generated illustrative.]

???

**A generative model writes by predicting the next word, again and again.** Predict the likeliest next word, add it to the text, predict again: the model writes, one word at a time. The figure is schematic, its words illustrative. Why would such a model answer a question? It learned from text in which answers follow questions, and it is then trained further on hundreds of thousands of questions with their answers, which is called instruction tuning. So, given a question, it writes an answer. Can we simply ask it whether our review is positive or negative?


---
class: stepwise-svg, vcenter
# Zero-shot

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/zeroshot.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Two prompts: one-shot, the question positive or negative, one labelled review, then our review; zero-shot, the same with the labelled review dropped; the model writes the answer, no weight changes"></object></div>
.step-4.lead.big.center[Zero-shot: the task described in words, with no labelled example.]
]

.footnote[T. Brown et al. (2020), Fig. 2.1, p. 6. D. Jurafsky and J. H. Martin (2026), p. 207. Drawn; any answer illustrative.]

???

**Zero-shot: the task described in words, with no labelled example.** The text we send a generative model, the prompt, can show it the task by example: here, one review labelled positive, then our review, and the model writes the answer. That is one-shot; with a few examples, few-shot. Now drop the example: the instruction alone describes the task, and that is zero-shot. In both, none of the model's weights change. GPT-2 showed in 2019 that a language model could do tasks zero-shot, and GPT-3's authors named these settings. The answer is illustrative: how well this works depends on the model, the task and the wording of the prompt. Which models are we talking about when we ask?


---
class: vcenter
# Foundation and frontier models

.fullw[
<div class="trio">
<div><b class="k">Foundation models</b>One large pretrained model as the base for many tasks, and for more than text: images, speech, genetics.</div>
<div class="lit"><b class="k">Frontier models</b>The most capable of their time, such as GPT-5, Claude and Gemini: closed, their size not disclosed.</div>
<div><b class="k">ChatGPT</b>A chat service opened in November 2022, on a GPT-3.5 model fine-tuned with people's feedback.</div>
</div>

.lead.big.center[Today's largest language models are foundation models: one model, many tasks.]
]

.footnote[D. Jurafsky and J. H. Martin (2026), pp. 204 and 207, citing R. Bommasani et al. (2021). OpenAI (2022). Y. Chae and T. Davidson (2025).]

???

**Today's largest language models are foundation models: one model, many tasks.** A foundation model is pretrained once, at great cost, then adapted to many tasks, and not only on text: images, speech, genetics. The most capable ones at any moment are called frontier models: GPT-5, Claude and Gemini, for example, closed models whose makers disclose neither their size nor their design. ChatGPT, opened in November 2022, is a chat service on such a model, fine-tuned with people's feedback. For a firm, using one means sending its texts to the provider. In the lab, we stay with what we can build and check ourselves.


---

.kicker[Part 4 of 4]

# Hands-on 5: film reviews

]

**In the hands-on, we train a sentiment model in Dataiku and set it against a ready-made scorer.** We train on 2,000 film reviews from IMDb, the Internet Movie Database, drawn from 50,000 that researchers collected there. After the checkpoint, our model and Dataiku's sentiment plugin both score 2,000 reviews from another collection, Pang and Lee's, so the two are compared on the same texts. What does one row of our file hold?

---
class: vcenter

# Stated ratings

<img class="phase-thumb" src="images/phase-du.svg" alt="The CRISP-DM phases, data understanding lit" />

.beside-thumb[
<div class="facts big">
<div><span class="num">161</span>of the 2,000 reviews state their rating: "8/10", "9 out of 10", "4 stars".</div>
<div><span class="num">1 to 10</span>the rating set each label: 4 or less unhappy, 7 or more happy.</div>
<div><span class="num">0</span>stated ratings left in the course file: they are stripped.</div>
</div>
.lead.big.center[A rating written in the text gives the label away.]
]

.footnote[Counts on the course file; A. L. Maas et al. (2011), p. 149.]

???

**A rating written in the text gives the label away.** Each label comes from the rating the reviewer gave out of 10: 4 or less is unhappy, 7 or more happy. But 161 reviews also state that rating in their text, as "8/10" or "4 stars". A model could learn to read the number rather than the opinion. The care team needs the model for reviews that carry no rating, so this is a leak, as in *Beyond binary classification*: an input the model will not have when it is used. We deleted the stated ratings. Who, then, uses the model, and what do its errors cost?


---
class: stepwise-svg, vcenter

# The case

<img class="phase-thumb" src="images/phase-bu.svg" alt="The CRISP-DM phases, business understanding lit" />

.beside-thumb[
<div class="step-1"><object type="image/svg+xml" data="images/costs.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A missed unhappy review costs 4, a wasted reading costs 1; on the probability axis, the default threshold 0.5 and the cost threshold 0.2 = 1 / (1 + 4)"></object></div>
.step-4.lead.big.center[The team reads every review scored 0.2 or more.]
]

.footnote[A scenario, not data. .book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 195 to 196.] *Evaluating a classifier*, slide 17: the costs give the threshold.]

???

**The care team reads every review the model scores 0.2 or more.** In our scenario, a streaming service's care team cannot read every review and wants the unhappy ones first, so unhappy is the positive class. A missed unhappy review costs 4; a happy one read for nothing costs 1. Say the model gives a review a probability p of being unhappy. Left unread, it costs 4p on average; read, 1 − p. Reading pays when 4p > 1 − p, that is, above 1 / (1 + 4) = 0.2: the cost threshold of *Evaluating a classifier*. The default of 0.5 would leave many unhappy reviews unread. From which columns can the model learn p?


---
class: vcenter

# Column types

<img class="phase-thumb" src="images/phase-du.svg" alt="The CRISP-DM phases, data understanding lit" />

.beside-thumb[
<div class="types three">
<div><b>Free text<span class="n">1</span></b><code>Text</code>
<p>One column, a review each: as terms, it becomes thousands of columns.</p></div>
<div><b>An identifier<span class="n">1</span></b><code>URL</code>
<p>It names the film: no feature, but it keeps a film's reviews together.</p></div>
<div><b>The target<span class="n">1</span></b><code>unhappy</code>
<p>1 or 0: the class the care team looks for is 1.</p></div>
</div>

<p class="types-after">Only <code>Text</code> enters the model, as the columns of a bag of words.</p>
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), p. 252.] Dataiku (2024), *Text variables*. The course file's columns; the original labels POS and NEG became <code>unhappy</code>.]

???

**Only the text enters the model, and as a bag of words its one column becomes thousands.** `Text` is free text: the bag of words turns it into one column per term, and the reviews themselves decide which terms. `URL` identifies the film. A model that learned it would know which films were disliked, and nothing about a review of a new film, so it is no feature. `unhappy` is the target. If the model never reads the URL, why keep it?


---
class: vcenter

# Several reviews per film

<img class="phase-thumb" src="images/phase-du.svg" alt="The CRISP-DM phases, data understanding lit" />

.beside-thumb[
<div class="facts big">
<div><span class="num">1,225</span>of the 2,000 reviews share their film with another.</div>
<div><span class="num">7</span>reviews of one film, at most.</div>
<div><span class="num">5 folds</span>grouped by film: no film on both sides of a split.</div>
</div>
.lead.big.center[Reviews of one film share its names, so they stay in one fold.]
]

.footnote[Counts on the course file; A. L. Maas et al. (2011). *Model selection and cross-validation*, slides 10 and 11: rows from one site.]

???

**Reviews of one film share its names, so they stay in one fold.** 1,225 of our 2,000 reviews share their film with another, and with it the names of its characters and actors. With one review of a film in training and another in the test fold, a model can score well by recognising the film instead of reading the opinion. Grouping the folds by `URL` keeps every film on one side of each split, as leaving one site out did in *Model selection and cross-validation*. How do we set this, and the text, in Dataiku?

**The model reads TF-IDF on the words and pairs of the simplified text, with folds grouped by film.** In **Design → Features handling**, `Text` and `URL` are rejected, that is, not read. The model reads `TextSimple`, the review after the Prepare recipe's *Simplify text* step; the sheet's first panel checks what that step does to "not". *TF/IDF vectorization* is Dataiku's name for TF-IDF, and *N-grams* 1 to 2 means words and pairs. The minimum and maximum row fractions, 0.1% and 80%, drop the terms found in almost no review and in almost all of them. In **Train/Test set**, the five folds are grouped by `URL`. Where does this model sit in the whole lab?

**The model and a plugin then score the same new reviews.** The Flow is Dataiku's map of a project. On top, a Prepare recipe writes `TextSimple` and the Lab trains the model. Below, Pang and Lee's reviews take two paths: a copy of the Prepare recipe and the Score recipe give them our model's probability, while Dataiku's sentiment plugin, an add-on, reads the raw text. Both paths end by counting true and false positives and negatives, TP, FP, FN and TN, priced at 4 per missed unhappy review and 1 per wasted reading. Now to Dataiku, with the sheet: panels 1 to 3 build the top path, panels 4 and 5 the rest, and the decision. Buy or build?
