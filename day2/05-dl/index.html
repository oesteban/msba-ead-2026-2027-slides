.section-mark.center[
## Deep learning

### Introducing neural networks, how they learn, and how to use them

<br />

Oscar Esteban &lt;<code>oscar.esteban@hevs.ch</code>>

<br />

EAD · Exploration avancée de données et intelligence décisionnelle · 23.10.2026

<div style="font-size: 0.8em; margin-top: 1.2em;"><a href="https://oesteban.github.io/msba-ead-2026-2027-slides/day2/05-dl/index.html">
https://oesteban.github.io/msba-ead-2026-2027-slides/day2/05-dl/index.html
</a></div>
]

???

**Today, we'll cover deep learning.** Deep learning builds a model out of many simple models, stacked in layers, and learns them all from data (Provost & Fawcett, 2013, p. 107; LeCun et al., 2015, p. 436). Such a model is called a neural network. We'll see what a neural network is and how it learns. We'll reflect on why it took about sixty years to become useful. And we'll see how to reuse a network that someone else has trained. Each of these questions needs the one before it.

**We'll go in five parts, each built on the one before.** First, we'll look back with a bit of history: what a neural network is, and why it waited decades for data and computing power. Second, how a network learns, which is where all that computing goes. Third, pretrained models: training costs so much that reusing a network trained by others is often the sensible route. Fourth, beyond tabular data: where a network is worth its cost, and where it is not. Last, the hands-on: we reuse a pretrained network in Dataiku, on photos of lions and tigers. Every network, however large, is built from one small piece, and you have met it already.


---
.section-mark.part[
.kicker[Part 1 of 5]

# Neural networks

<div class="parts"><span class="now">Neural networks</span><span>How a network learns</span><span>Pretrained models</span><span>Beyond tabular data</span><span>Hands-on 4</span></div>
]

???

**Part 1 looks at what a neural network is, and why it took so long to work.** We start from a single neuron, which you have met already as the first day's logistic regression. Then we stack neurons into a network. Then we look back over sixty years, to see what held networks back and what released them. What is the smallest piece of a network?


---
class: stepwise-svg, vcenter
# An artificial neuron

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/unit.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Three values of one wine, alcohol 12.0, volatile acidity 0.27, sulphates 0.56, times three weights, summed with a bias to minus 0.70, then the logistic function: 0.33"></object></div>
.step-4.lead.big.center[An artificial neuron is a minimal linear model: a weighted sum, then a function.]
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 106 to 107.] The wine: line 12 of the course file, P. Cortez et al. (2009). Weights illustrative.]

???

**An artificial neuron is a minimal linear model: a weighted sum, then a function.** Why start so small? Because a network builds a complex model out of many such simple ones. Take one white wine of *Beyond binary classification*: alcohol 12.0, volatile acidity 0.27, sulphates 0.56. The neuron multiplies each value by an illustrative weight, then adds the products and a bias, a constant that shifts the sum: −0.70. The logistic function turns that sum into 0.33, the probability that this wine is high. This is the first day's logistic regression: "a weighted sum of the attribute values" (Provost & Fawcett, 2013, p. 85, verbatim), turned into a probability (pp. 97 to 100). If a network is many weighted sums, why keep a function after each one?


---
class: stepwise-svg, vcenter
# Activation functions

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/activation.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Two layers with no function collapse into one weighted sum; the logistic, flat at both ends; the ReLU, zero below zero and the sum itself above, with slope 1"></object></div>
]

.footnote[S. J. D. Prince (2023), pp. 25, 35, 37 and 38.]

???

**Without a function after each sum, stacking layers adds nothing.** Take two layers with no function: the first computes 2x + 1, the second halves it. Together they give x + 0.5, one weighted sum again. However many we stack, the model stays a straight line (Prince, 2023, p. 35). A function after each sum, the activation function, lets the network bend. Why the ReLU rather than the logistic? The logistic is flat at both ends: there, a change in the sum barely moves the output, and training stalls (p. 38). The ReLU passes the sum on above zero, with slope 1, which "contributes to the stability and efficiency of training" (p. 37). With a bend after each sum, stacking pays. So what does a stack of neurons look like?


---
class: stepwise-svg, vcenter
# A neural network

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/layers.svg" style="width: 96%; display: block; margin: 0 auto; pointer-events: none;" aria-label="An input layer for a wine's values, two hidden layers, an output layer with one neuron per class: low, medium, high"></object></div>
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), p. 107.] S. J. D. Prince (2023), chapter 4; deep: p. 41. Schematic.]

???

**A neural network arranges neurons in layers, each feeding the next.** The input layer holds a wine's values. The output layer has one neuron per class: low (grade 5 or less), medium (6) and high (7 or more), the classes of *Beyond binary classification*. In between, "each subsequent layer in the stack applies a simple model" (Provost & Fawcett, 2013, p. 107, verbatim) to the outputs of the layer below. These layers are hidden: the data gives values only for the inputs and the true class (p. 107). A network with more than one hidden layer is called deep, hence deep learning (Prince, 2023, p. 41). Finding good weights for the hidden layers is the hard part, and it took decades (p. 37).


---
class: stepwise-svg, vcenter
# 1958 to 1998

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/timeline-1.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A timeline with pictures: in 1958 the perceptron, one neuron that learns its weights from examples; in 1986 back-propagation, a way to train hidden layers, with a portrait of G. Hinton; in 1998 LeNet, a network that read the digits on bank cheques"></object></div>
.step-5.lead.big.center[The ideas are old: they waited for labelled data and compute.]
]

.footnote[F. Rosenblatt (1958); D. E. Rumelhart, G. E. Hinton and R. J. Williams (1986); Y. LeCun et al. (1998); S. J. D. Prince (2023), p. 37. Photos: U.S. Navy, public domain; Arthur Petron, .lic[CC BY-SA 4.0], cropped; Josef Steppan, .lic[CC BY-SA 4.0]; all via Wikimedia Commons.]

???

**The ideas are old: they waited for labelled data and compute.** In 1958, Rosenblatt's perceptron was a single neuron that learned its weights from examples (Prince, 2023, p. 37). But one neuron draws one straight boundary. Hidden layers could draw more, yet nobody could train them (p. 37). In 1986, back-propagation found a way: the hidden layers learn from the error at the output (Rumelhart et al., 1986, p. 533). Part 2 shows how. In 1998, a cheque reader built on LeNet, a network for handwritten digits, read several million cheques a day (LeCun et al., 1998, p. 1). Yet by the late 1990s, networks were largely set aside. Two things were missing: labelled data by the million, and the computing power to learn from it (LeCun et al., 2015, pp. 438 to 440). Where would millions of labelled examples come from?


---
class: stepwise-svg, vcenter
# 2009 to 2022

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/timeline-2.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The timeline continued: ImageNet in 2009, millions of photos each labelled by people; AlexNet in 2012 wins ImageNet, trained on two graphics cards; ResNet in 2015, 152 layers that can still be trained; the transformer in 2017, a network for text; GPT-3 in 2020, 175 billion weights, a task from a few examples; ChatGPT in 2022, open to the public"></object></div>
.step-5.lead.big.center[With labelled data and graphics cards, networks won, then grew.]
]

.footnote[J. Deng et al. (2009); A. Krizhevsky, I. Sutskever and G. Hinton (2017, first published 2012); K. He et al. (2016); A. Vaswani et al. (2017); T. Brown et al. (2020); OpenAI (2022). Photo: a GTX 580 board, Fritzchens Fritz, Wikimedia Commons, .lic[CC0].]

???

**With labelled data and graphics cards, networks won, then grew.** ImageNet, in 2009, held 3.2 million photos, each labelled by people (Deng et al., 2009, section 1). AlexNet, in 2012, trained on it for five to six days on two graphics cards (Krizhevsky et al., 2017, p. 2). It almost halved the best rival's error, partly thanks to them (LeCun et al., 2015, p. 440). Until 2015, deeper networks often trained worse; ResNet made 152 layers trainable (He et al., 2016, p. 1). The transformer, in 2017, spread its work on text across many chips, and trained much faster (Vaswani et al., 2017, abstract). GPT-3, in 2020, had 175 billion weights, and at that size could do a new task from a few examples (Brown et al., 2020, p. 1). ChatGPT, in 2022, was free for the public to use (OpenAI, 2022). How much data did each learn from?


---
class: stepwise-svg, vcenter
# Training data

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/data-sizes.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Training sets on a log scale: 60,000 digits for MNIST in 1998, 1.28 million photos for ImageNet, 3.3 billion words for BERT, 300 billion tokens for GPT-3, 400 million captioned photos for CLIP"></object></div>
.step-3.lead.big.center[From thousands of examples to hundreds of billions.]
]

.footnote[Y. LeCun et al. (1998), p. 10; K. He et al. (2016), p. 4; J. Devlin et al. (2019), p. 13; T. Brown et al. (2020), p. 8; A. Radford et al. (2021), p. 1. The units differ.]

???

**Training sets grew from thousands of examples to hundreds of billions.** In 1998, LeNet learned from MNIST, 60,000 handwritten digits (LeCun et al., 1998, p. 10). ResNet learned from 1.28 million labelled photos of ImageNet (He et al., 2016, p. 4). BERT, a 2018 network for text, read 3.3 billion words (Devlin et al., 2019, p. 13). GPT-3 read 300 billion tokens, a token being a word or part of a word (Brown et al., 2020, p. 8; Jurafsky & Martin, 2026, p. 6). CLIP, which links photos to words, learned from 400 million captioned photos (Radford et al., 2021, p. 1). How could text outgrow ImageNet so far? Nobody labels it by hand: the text supplies its own answers, such as a hidden word to guess (Prince, 2023, p. 152). More examples, through more weights, meant more arithmetic.


---
class: stepwise-svg, vcenter

# Training compute


.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/compute-1.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Training compute of milestone models on a log scale, from the perceptron near a million operations to Llama 3.1 near 10 to the 25; FLOP are floating-point operations, a computer's additions and multiplications"></object></div>
.step-3.lead.big.center[From under a million operations to about 10<sup>25</sup>.]
]

.footnote[Data: Epoch AI (2026), *Data on Notable AI Models*, .lic[CC BY 4.0]. Training compute in floating-point operations (FLOP), log scale.]

???

**Training compute rose from under a million operations to about 10<sup>25</sup>.** Training compute counts the operations spent to train a model (Epoch AI, 2026). Its unit is the FLOP, a floating-point operation: one addition or one multiplication done by a computer. The scale is logarithmic: each gridline is 100,000 times the one below. The perceptron needed under a million operations. Llama 3.1, a network for text from 2024, needed about 4 × 10<sup>25</sup>. That is four gridlines: 100,000 times, four times over. Each operation takes hardware and time, so compute is a cost. Was the climb steady, or did it speed up?


---
class: stepwise-svg, vcenter

# Training compute over time


.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/compute-2.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The same points with two trend lines: doubling about every 20 months before 2010, about every 6 months since 2012"></object></div>
]

.footnote[J. Sevilla et al. (2022); data: Epoch AI (2026), .lic[CC BY 4.0].]

???

**Since the early 2010s, training compute has doubled about every six months.** Before 2010, it doubled about every 20 months (Sevilla et al., 2022, p. 1). That matched Moore's law, chips doubling in performance about every two years (p. 4): trainings grew as fast as the chips. Then deep learning took off, and the doubling came every six months (p. 1). That is four times more each year, about a million times more in ten years. Faster chips alone cannot explain it: the largest models came from large companies, whose budgets presumably let them break the trend (p. 5). Still, 10<sup>25</sup> operations is hard to picture. What does it mean in time, on a real machine?


---
class: stepwise-svg, vcenter

# Supercomputers


.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/compute-3.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="One day of the year's fastest supercomputer at peak, a stepped line from 1993 to 2026: AlexNet took 23 seconds of Sequoia, BERT 25 minutes of Summit, GPT-3 18 days of Summit, Llama 3.1 256 days of Frontier"></object></div>
.step-5.lead.big.center[From seconds of the fastest supercomputer to months of it.]
]

.footnote[TOP500 lists, June 1993 to June 2026: each leader's theoretical peak, for one day; data: Epoch AI (2026), .lic[CC BY 4.0]. Peak and training arithmetic differ: an order of magnitude only.]

???

**The largest trainings went from seconds of the fastest supercomputer to months of it.** Twice a year, the TOP500 list names the world's fastest computer (TOP500, 2026). The red line is what that leader computes in one day at its peak. Until 2018, trainings sat far below that line. AlexNet's training was 23 seconds of Sequoia, the 2012 leader. BERT's, in 2018, was 25 minutes of Summit (Epoch AI, 2026). Then trainings crossed the line. GPT-3's was 18 days of Summit. Llama 3.1's, in 2024, was 256 days of Frontier. These hold to an order of magnitude only: real trainings run below peak and count operations differently. And what is all this arithmetic for? It is spent searching for good weights, and that search is how a network learns.


---
.section-mark.part[
.kicker[Part 2 of 5]

# How a network learns

<div class="parts"><span>Neural networks</span><span class="now">How a network learns</span><span>Pretrained models</span><span>Beyond tabular data</span><span>Hands-on 4</span></div>
]

???

**Part 2 answers one question: how does a network find good weights?** Every weight we have used so far was illustrative, made up for the example. A real network starts from random weights and must find good ones from examples (Prince, 2023, p. 96). Part 1 showed what that search costs. Part 2 shows how it works, on the wine of *Beyond binary classification*. Before a network can learn anything, it must make a prediction.


---
class: stepwise-svg, vcenter
# Forward pass

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/forward.svg" style="width: 96%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The wine's values 12.0, 0.27 and 0.56 pass through three hidden neurons to three class scores: low 0.4, medium 1.6, high 0.2"></object></div>
]

.footnote[S. J. D. Prince (2023), chapter 4. The example wine of *Beyond binary classification*. Hidden values and scores illustrative.]

???

**In the forward pass, the wine's values flow through the network, layer by layer, to one score per class.** The same white wine enters: alcohol 12.0, volatile acidity 0.27, sulphates 0.56. Each hidden neuron takes its weighted sum, then a ReLU: here 0.9, 0 and 1.4, the middle sum having been negative. The output layer gives one score per class: low 0.4, medium 1.6, high 0.2. All values but the wine's are illustrative. Running the network on an example and keeping every layer's values is the forward pass (Prince, 2023, p. 97). But a score can take any value, negative or above 1 (p. 68). What chance of being medium does 1.6 mean? None yet: the scores must first become probabilities.


---
class: stepwise-svg, vcenter
# Softmax

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/softmax.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Three scores, 0.4, 1.6 and 0.2, become the probabilities 0.19, 0.65 and 0.16: e raised to each score, divided by their sum, worked for medium as 4.95 divided by 7.67"></object></div>
]

.footnote[S. J. D. Prince (2023), section 5.5. Illustrative scores.]

???

**Softmax turns the scores into probabilities that sum to one.** First, each score goes through the exponential, e<sup>score</sup>, the e<sup>x</sup> key of a calculator. The exponential turns any score into a positive number (Prince, 2023, p. 68), and a larger score into a larger one. Here, e<sup>0.4</sup> = 1.49, e<sup>1.6</sup> = 4.95 and e<sup>0.2</sup> = 1.22. Then each is divided by their sum, 7.67, so that the three add up to one (p. 68). Medium gets 4.95 / 7.67 = 0.65. Low gets 0.19, and high 0.16. The network predicts the most probable class, medium (p. 69). But this wine's grade is 5: its class is low. The network is wrong, and nothing in it knows that yet.


---
class: stepwise-svg, vcenter
# Learning from examples

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/learn.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="One training wine whose class is low goes through a network with random weights; the output gives the true class only 0.19; the network needs one number for how wrong this is"></object></div>
]

.footnote[S. J. D. Prince (2023), pp. 56 and 77. The example wine, grade 5: class low. Illustrative output.]

???

**To learn, the network needs one number that says how wrong it is.** A training example comes with its answer: this wine's class is low. With random weights, the network gives low only 0.19. Learning means changing the weights until the true class gets a high probability. But each change moves all three probabilities. To know whether a change helped, we need one number to compare before and after. That number is the loss: the mismatch between the predictions and the true answers (Prince, 2023, p. 77). Training looks for the weights that make it smallest (p. 56). Which number, then? It must be small when the true class gets a high probability, and large when it gets a low one.


---
class: stepwise-svg, vcenter
# Loss

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/loss.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The same output, 0.65 medium: for this wine, whose class is low, the loss is minus log 0.19, 1.66, high; for a medium wine it is minus log 0.65, 0.43, low"></object></div>
]

.footnote[S. J. D. Prince (2023), section 5.5: the cross-entropy loss, natural logarithm. Illustrative values.]

???

**The loss is minus the log of the probability given to the true class.** The log is the natural logarithm, the inverse of the exponential (Prince, 2023, p. 441). The log of 1 is 0, and the log of any probability below 1 is negative: the minus sign makes the loss positive. So a certain, right answer costs nothing, and the loss grows as the true class's probability falls. Our wine is low and gets 0.19 for low: −log 0.19 = 1.66, high. A medium wine with the same output gets 0.65 for its class: −log 0.65 = 0.43, low. Over the training set, the losses of all examples add up (p. 69). We now have one number to lower. But it is measured at the end of the network: which weights must change to lower it?


---
class: stepwise-svg, vcenter
# Hidden weights

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/blame.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A weight in layer 1; a small change to it ripples through layers 2, 3 and the last layer before it reaches the loss, which is measured only at the end"></object></div>
]

.footnote[S. J. D. Prince (2023), p. 97. Schematic.]

???

**To lower the loss, we must change the weights of every layer, not only the last.** We want the true class to get more probability, on every training example. The scores come from the last layer, but the last layer reads the hidden layers, and they read the inputs. So every weight plays a part. A weight in layer 1 reaches the loss only through layers 2 and 3 and the scores: "a ripple effect of changes through the subsequent network" (Prince, 2023, p. 97). For each weight, then, we need to know two things: which way to move it, and how far. Both come from one quantity: how the loss changes when that weight changes a little.


---
class: stepwise-svg, vcenter
# The gradient

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/gradient.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A loss curve over one weight; at the weight's current value, the slope of the curve is the gradient; the loss falls the other way"></object></div>
]

.footnote[S. J. D. Prince (2023), pp. 78 and 97. Illustrative curve.]

???

**The gradient says how much the loss changes when a weight changes a little.** Picture the loss as a curve over one weight, every other weight held still; the curve is illustrative. Where the weight is now, the curve has a slope. Its sign says which way the loss rises, and its size how fast. That slope is this weight's gradient, and a network has one per weight (Prince, 2023, p. 78). The gradient "determines the uphill direction of the loss function" (p. 78), so the loss falls the other way. But a slope describes the curve only where we stand. How do we get to the bottom?


---
class: stepwise-svg, vcenter
# Gradient descent

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/descent.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A loss curve over one weight; from a random start, each step goes a little downhill"></object></div>
.step-4.lead.big.center[Gradient descent lowers the loss one small step at a time.]
]

.footnote[S. J. D. Prince (2023), chapter 6; 175 billion: T. Brown et al. (2020), p. 5. Illustrative curve.]

???

**Gradient descent lowers the loss one small step at a time.** It starts from random weights (Prince, 2023, p. 96). It computes the gradient where the weights are now, and moves every weight a small step against it, downhill. Then it repeats. How far each step goes is a setting, the learning rate (p. 78). Every fitted model shares this goal: "find the optimal value for the weights by maximizing or minimizing the objective function" (Provost & Fawcett, 2013, p. 87, verbatim). Here the objective is the loss, to minimize, and each step moves all the weights at once: GPT-3 has 175 billion (Brown et al., 2020, p. 1). Each step needs the slope of every weight, the hidden ones included. How is that computed in practice?


---
class: stepwise-svg, vcenter
# Back-propagation

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/backprop.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Forward through four layers to the loss, then the error sent back to every layer"></object></div>
]

.footnote[D. E. Rumelhart, G. E. Hinton and R. J. Williams (1986); S. J. D. Prince (2023), chapter 7. Schematic.]

???

**Back-propagation computes every weight's gradient in one backward pass.** We need the slope of every weight at every step, and the largest networks have about 10<sup>12</sup> weights (Prince, 2023, p. 96). Traced one weight at a time, the same ripples would be worked out again and again. Back-propagation works them out once. First, the forward pass runs the wine through the network and stores every layer's values (p. 97). At the end comes the loss: 1.66 for our wine. The backward pass then starts from the loss and works back, layer by layer, each layer reusing what the layer after it computed (pp. 99 to 100). This solves the puzzle that "target labels for training are provided only for the final layer" (Provost & Fawcett, 2013, p. 107, verbatim). It is the method of 1986 that made hidden layers trainable (Rumelhart et al., 1986, p. 533). Should each step run on all the training examples, or on one?


---
class: stepwise-svg, vcenter
# Batches

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/batches.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Three paths down the same loss: all the examples per step, smooth but slow; one example per step, cheap but very noisy; a batch per step, computed together on the graphics card, less noisy"></object></div>
.step-4.lead.big.center[Neither all the examples at once nor one by one: a batch.]
]

.footnote[S. J. D. Prince (2023), pp. 85 to 86; A. Zhang et al. (2023), section 12.5.2. Illustrative paths, simulated noise.]

???

**Neither all the examples at once nor one by one: training takes a batch at a time.** Why not all at once? Each step would need the gradient over the whole training set: exact, but slow. And even then training takes many steps, because no formula gives a network's weights in one go: the standard methods are iterative (Prince, 2023, p. 77). Why not one example at a time? Each step is cheap but very noisy, and the computer does many small sums one after another, paying an overhead each time (Zhang et al., 2023, section 12.5.2). A batch is a few examples drawn at random from the training set (Prince, 2023, p. 85), and a graphics card computes it in one go. Averaging its gradients reduces the noise without removing it, and the noise left can even help the path out of a poor valley (pp. 85 to 86). How does training run through the batches?


---
class: stepwise-svg, vcenter
# The training loop

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/loop.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A batch drawn at random from the training examples, then four steps in a loop: forward the batch, its loss, the backward pass, an update of every weight; then the next batch"></object></div>
.step-7.lead.center[When Dataiku trains an image model, this loop runs, in PyTorch.]
]

.footnote[S. J. D. Prince (2023), pp. 85 to 86, sections 6.2 and 7.2; A. Zhang et al. (2023), section 3.4; Dataiku (2024), *Computer vision*.]

???

**Training repeats one loop, on one batch of examples at a time.** Forward: the batch to its scores. Loss: how wrong the batch is. Backward: each weight's gradient. Update: every weight moves a small step. Then the next batch, drawn at random from the examples not yet used (Prince, 2023, p. 85). This is stochastic gradient descent, stochastic meaning random. Dataiku's computer vision is built on PyTorch (Dataiku, 2024), so when we train an image model in Dataiku, this loop runs. One pass through all the batches uses each example once. Is once enough?


---
class: stepwise-svg, vcenter
# Epochs

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/epochs.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Every training example once, a batch at a time, is one epoch; the training loss falls over twenty epochs"></object></div>
]

.footnote[S. J. D. Prince (2023), section 6.2. Illustrative curve.]

???

**An epoch is one pass over every training example, a batch at a time.** When the batches have used up the training set, the drawing starts again (Prince, 2023, p. 85). LeNet-5, for instance, trained for 20 passes over its 60,000 digits (LeCun et al., 1998, p. 11). On the illustrative curve, the training loss falls fast in the first epochs, then slowly. The number of epochs is set before training, and Dataiku asks for it as an upper limit (Dataiku, 2024). The training loss keeps falling as long as we let it run. But a winery does not need a network that grades the wines it has already seen. It needs one that grades the next wines well.


---
class: stepwise-svg, vcenter

# Early stopping


.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/early-stop.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The training loss keeps falling; the validation loss falls, then rises; training stops at its lowest point"></object></div>

]

.footnote[S. J. D. Prince (2023), section 9.3.1. Illustrative curves.]

???

**Training should stop where the loss on held-out examples is lowest.** Held-out examples, the validation set, are labelled examples kept out of training: they stand in for new wines. On the illustrative curves, the training loss keeps falling, while the validation loss falls, then rises. From that point the network overfits: it tends to "tailor models to the training data, at the expense of generalization" (Provost & Fawcett, 2013, p. 113, verbatim). Early stopping watches the validation loss during training and keeps the weights from where it was lowest (Prince, 2023, p. 145). Dataiku offers it as an option (Dataiku, 2024). Could we get more examples without collecting new ones?


---
class: stepwise-svg, vcenter
# Augmentation

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/augment.svg" style="width: 96%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The tiger photo flipped, a sentence with a synonym, a sound filtered: each a new training example with the same label"></object></div>
.step-5.lead.big.center[Variety, not new information: it cannot fix a wrong label.]
]

.footnote[S. J. D. Prince (2023), section 9.3.8. Photo: S. Taheri, edited by Fir0002, Wikimedia Commons, .lic[CC BY-SA 2.5], resized and flipped. Sentence and sound drawn.]

???

**Augmentation makes new training examples by changing old ones in ways that keep their label.** The tiger photo, flipped left to right, still shows a tiger. A review that says "superb" instead of "excellent" is still positive. A sound with one band of frequencies turned down keeps its label too (Prince, 2023, p. 152). The aim is to teach the network to ignore changes that do not matter: which way the tiger faces says nothing about whether it is a tiger (p. 154). But a copy adds variety, not new information. And it copies its label as it is: if the label is wrong, every copy is wrong too. How often are labels wrong, even in carefully built datasets?


---
class: vcenter

# Label noise

.fullw[
<div class="facts big two">
<div><span class="num">3.3%</span>of test labels at least, on average across ten widely used test sets of images, text and sound.</div>
<div><span class="num">2,916</span>wrong labels at least in ImageNet's validation set: about 6% of it.</div>
</div>

.lead.big.center[A wrong label costs a point as surely as a model error.]
]

.footnote[C. G. Northcutt, A. Athalye and J. Mueller (2021), pp. 1 and 2.]

???

**A wrong label costs a point as surely as a model error.** Even benchmark test sets carry wrong labels. A benchmark is a public dataset on which everyone scores their models, so that scores can be compared. Northcutt et al. checked ten widely used benchmarks of images, text and sound: an algorithm flagged suspect labels, and people confirmed them (Northcutt et al., 2021, p. 1). On average, at least 3.3% of the test labels were wrong. ImageNet's validation set held at least 2,916 wrong labels, about 6% (pp. 1 and 2). Such errors can change which model looks best (p. 1). Millions of checked labels and months of a supercomputer: what can a firm with a few hundred labelled photos do?


---

# Pretrained models

]

???

**Part 3 is about reusing a network that someone else has already trained.** Why reuse one? Part 2 showed how a network learns: every weight, batch after batch, from labelled examples. Part 1 showed what that costs for the large networks: millions of labelled examples, and up to months of the fastest supercomputer. How many firms can pay for that? So who does train these networks, and what can the rest of us take from them?


---
class: vcenter

# Pretraining

.fullw[
<div class="trio">
<div><b class="k">Photos</b><span class="num">1.28 million</span> labelled photos of ImageNet train image networks: AlexNet, ResNet.</div>
<div><b class="k">Text</b><span class="num">3.3 billion</span> words of books and Wikipedia train BERT; 300 billion tokens, GPT-3.</div>
<div><b class="k">Photos with captions</b><span class="num">400 million</span> pairs train CLIP, which links a photo to words.</div>
</div>
.lead.big.center[How can we get the most out of a model that cost so much to train?]
]

.footnote[A. Zhang et al. (2023), section 14.2.1; K. He et al. (2016), p. 4; J. Devlin et al. (2019), pp. 3, 5 and 13; T. Brown et al. (2020), p. 8; A. Radford et al. (2021), p. 1.]

???

**How can we get the most out of a model that cost so much to train?** We reuse it. Collecting ImageNet alone cost millions of dollars (Zhang et al., 2023, section 14.2). So a network is trained once, on a large dataset: this first training is called pretraining. Others then adapt it to their own task. What does adapting take? For BERT, one output layer was added for the new task, and the whole network trained a little further on that task's examples (Devlin et al., 2019, pp. 1 and 3). Pretraining the larger BERT had taken 4 days on 64 specialised chips (p. 13). Each adaptation took a few hours on one graphics card (p. 5). But why should a network trained for one task help with another?


---
class: stepwise-svg, vcenter
# Inside a pretrained network

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/general.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Seven blocks of a pretrained network shaded from general to specific: the first layers general, the last layers and the head fitted to the original task"></object></div>
.step-4.lead.big.center[Keep the general layers for a new task; replace the specific ones.]
]

.footnote[J. Yosinski, J. Clune, Y. Bengio and H. Lipson (2014), p. 1 and sections 2 and 4.1. Schematic.]

???

**Keep a pretrained network's general layers, and replace its specific ones.** Each layer's outputs are features that the next layer reads (Provost & Fawcett, 2013, p. 107). Are they general, or tied to the classes the network was trained on? Yosinski et al. split ImageNet's 1,000 classes at random into two halves, A and B. They trained a network on A. They copied its first layers, locked, into a new network, and trained the layers above on B. If that network matched one trained on B alone, the copied layers were general (Yosinski et al., 2014, p. 3). Layers 1 and 2 transferred almost perfectly. From layer 3 on, accuracy fell, and at layers 6 and 7 mostly because the features were specific to A (p. 6). The head, the last layer, is the most specific: one output per old class (p. 1). What if we replace only the head?


---
class: stepwise-svg, vcenter

# Transfer learning


.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/transfer.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Seven locked blocks of a pretrained network; its original head replaced by a new head for your classes, the only weights that learn"></object></div>
.step-4.lead.big.center[Only the new head learns from your examples.]
]

.footnote[S. J. D. Prince (2023), section 9.3.6; A. Zhang et al. (2023), section 14.2. Schematic.]

???

**Only the new head learns from your examples.** This is transfer learning, the simplest way to reuse a pretrained network. We remove the old head, whose outputs are the old classes, and add a new one, with one output per class of our task. Its weights start at random (Zhang et al., 2023, section 14.2.1). Every layer below stays locked. Why not let those layers learn too? Our examples are few, and their weights are many: AlexNet alone has about 60 million (Prince, 2023, p. 176). With so few examples, the network would overfit: it would fit our photos so closely that it fails on new ones (Provost & Fawcett, 2013, p. 113). So with a small dataset, the copied layers are usually left locked (Yosinski et al., 2014, p. 2). What if our photos need slightly different features?


---
class: stepwise-svg, vcenter

# Fine-tuning


.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/finetune.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The same network with its last two blocks unlocked: they learn with the new head"></object></div>
.step-3.lead.big.center[The unlocked layers adapt the pretrained features to the new task.]
]

.footnote[S. J. D. Prince (2023), section 9.3.6; A. Zhang et al. (2023), section 14.2. Schematic.]

???

**The unlocked layers adapt the pretrained features to the new task.** Fine-tuning goes one step further: we unlock some pretrained layers, here the last two, and they learn along with the new head. Why the last ones? They hold the features most specific to the old classes (Yosinski et al., 2014, p. 6), so they have the most to adjust. They start from their pretrained weights, not from random ones (Zhang et al., 2023, section 14.2.1). And it pays: copied layers, fine-tuned, generalised better than training on the new classes alone (Yosinski et al., 2014, p. 6). But each unlocked layer adds weights that our examples must set. When is that worth it?


---
class: vcenter

# Transfer learning or fine-tuning

.fullw[
<div class="duo big">
<div><b class="k">What fine-tuning buys</b>The pretrained features adapt to the new examples: worth it when these differ from the pretraining data.</div>
<div class="lit"><b class="k">What it costs</b>More examples, and on a small set, a model that learns its training examples by heart.</div>
</div>
.lead.big.center[More layers that learn: more data needed, more risk of overfitting.]
]

.footnote[Dataiku (2024), *Computer vision*: fine-tuned layers and overfitting; A. Zhang et al. (2023), section 14.2.3; J. Yosinski et al. (2014), pp. 2 and 8.]

???

**More layers that learn need more data, and bring more risk of overfitting.** What does fine-tuning buy? Features that fit our photos better. That matters most when our photos differ from the pretraining photos: features copied from a more distant task transfer worse (Yosinski et al., 2014, p. 8). What does it cost? Every unlocked layer adds weights, and with them flexibility: "we increase the chance that we fit the data too well" (Provost & Fawcett, 2013, p. 108, verbatim). Dataiku's documentation gives the same warning for more fine-tuned layers on a small training set (Dataiku, 2024). How many examples are enough, then, and how far is too far?


---
class: vcenter

# How much to retrain

.fullw[
<div class="duo big">
<div class="lit"><b class="k">A few photos per class</b>Trained on 47 to 800 photos in all, a new head on locked layers matched fine-tuning, or beat it.</div>
<div><b class="k">Classes ImageNet barely covers</b>ImageNet holds more car photos than a car dataset, but in 10 classes against 196 models: pretraining added little.</div>
</div>
.lead.big.center[It depends on how many examples you have, and how far your task is from ImageNet.]
]

.footnote[S. Kornblith, J. Shlens and Q. Le (2019), sections 4.5 and 4.7.]

???

**How much to retrain depends on how many examples we have, and how far our task is from ImageNet.** Kornblith et al. measured both, on twelve photo datasets. First, the examples. They trained on small subsets with a few photos per class: 47 to 800 photos in all. With so few, logistic regression on the locked features, which is what a new head is, did as well as fine-tuning or better. With more photos, fine-tuning pulled ahead (Kornblith et al., 2019, p. 7). Second, the distance. ImageNet holds more car photos than the Stanford Cars dataset, 12,455 against 8,144, but in 10 broad classes, such as sports car. Stanford Cars has 196, by make, model and year (p. 7). Pretraining never had to tell one model year from the next, so it barely helped: 93.3% fine-tuned, 92.7% from scratch (p. 6). Which way to a model fits which case?


---
class: vcenter

# Four ways to get a model

.fullw[
<div class="quad big">
<div class="dim"><b>1 · Zero-shot</b>The classes described in words; no labelled example.</div>
<div class="lit"><b>2 · A new head</b>Locked pretrained layers; tens to hundreds of examples.</div>
<div><b>3 · Fine-tuning</b>More layers learn: more examples needed.</div>
<div><b>4 · From scratch</b>Every weight learned: millions of examples, and a supercomputer's compute.</div>
</div>
.lead.big.center[Each way to the right needs more labelled examples and more compute.]
]

.footnote[A. Radford et al. (2021); S. Kornblith, J. Shlens and Q. Le (2019); K. He et al. (2016).]

???

**Each way to the right needs more labelled examples and more compute.** Zero-shot, dimmed, needs no labelled example: the classes are described in words (Radford et al., 2021, p. 6). It needs a model that reads text, so it waits for the next deck. A new head on locked layers did well with tens to hundreds of examples, and fine-tuning pulled ahead with more (Kornblith et al., 2019, p. 7). From scratch, every weight is learned: that takes millions of labelled examples, such as ImageNet's 1.28 million photos (He et al., 2016, p. 4), and a supercomputer's time. Yet every dataset of the first day was a table. Do networks earn their cost on tables too?


---

???

**Part 4 asks where a network earns its cost: on tables, or beyond them, on pictures.** We look at a table first, then at a photo. For each, we ask the same question: what does it give a model before any learning starts? What does a table already hold?


---
class: vcenter

# A table

.fullw.terms[
<table class="big">
<tr><th>alcohol</th><th>volatile acidity</th><th>sulphates</th><th>colour</th><th class="tgt">grade</th></tr>
<tr class="meaning"><td>% by volume</td><td>acetic acid, g/dm³</td><td>potassium sulphate, g/dm³</td><td>red or white</td><td class="tgt">the target: the class</td></tr>
<tr><td>8.8</td><td>0.27</td><td>0.45</td><td>white</td><td class="tgt">medium</td></tr>
<tr><td>12.0</td><td>0.27</td><td>0.56</td><td>white</td><td class="tgt">low</td></tr>
<tr><td>12.4</td><td>0.16</td><td>0.52</td><td>white</td><td class="tgt">high</td></tr>
</table>
.lead.big.center[Each column means something before any model reads it.]
]

.footnote[Lines 2, 12 and 15 of the course file, five of its 13 columns. P. Cortez et al. (2009); UCI Machine Learning Repository, .lic[CC BY 4.0].]

???

**Each column of a table means something before any model reads it.** Here are three wines of the course file, on five of its 13 columns. The middle one is the wine we followed through parts 1 and 2. Each row is one wine: "An instance is described by a set of attributes" (Provost & Fawcett, 2013, p. 46, verbatim). The attributes are the columns, also called features. Alcohol, in % by volume, says how strong the wine is. The last column is the target, the class we want to predict. So a table hands the model its features ready-made. Do networks still have an edge on such data?


---
class: vcenter

# Trees and networks on tables

.fullw[
<div class="duo big">
<div><b class="k">45 tables, up to 10,000 rows</b>Tree-based models, boosted trees first, stayed ahead of the networks tested at every tuning budget.</div>
<div class="lit"><b class="k">The wines of <i>Beyond binary classification</i></b>A network did about as well as a regression, and a support vector machine beat both.</div>
</div>
.lead.big.center[A table's columns already carry meaning: on a firm's tables, try a tree ensemble first.]
]

.footnote[L. Grinsztajn, E. Oyallon and G. Varoquaux (2022), pp. 1 to 8; P. Cortez et al. (2009), p. 13.]

???

**On a firm's tables, try a tree ensemble first.** Why? A network's layers build new features from their inputs (Provost & Fawcett, 2013, p. 107). That pays when a single input means little. In a table, each column already carries a meaning of its own (Grinsztajn et al., 2022, p. 8), so little is left for layers to discover. Grinsztajn et al. compared models on 45 tables of up to 10,000 rows. Tree ensembles, like the random forest and gradient boosting of *Model selection and cross-validation*, stayed ahead of the networks, however long these were tuned (pp. 1 and 6). On our wines, a support vector machine beat a network and a regression (Cortez et al., 2009, p. 13). First does not mean only: "we can easily compare various models on the same data" (Provost & Fawcett, 2013, p. 353, verbatim). Where, then, does a network earn its cost?


---
class: stepwise-svg, vcenter

# A photo


.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/pixels.svg" style="width: 92%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A tiger photo at 224 by 224 pixels, one patch of 25 pixels zoomed in their colours: 224 times 224 is 50,176 pixels"></object></div>
.step-2.lead.big.center[Can you guess a tiger from this tiny window?]
]

.footnote[Photo: S. Taheri, edited by Fir0002, Wikimedia Commons, .lic[CC BY-SA 2.5], resized. 224 × 224 pixels: S. J. D. Prince (2023), p. 161.]

???

**Can you guess a tiger from this tiny window?** No one can. A photo is a grid of pixels: small squares, each of one colour. This one is resized to 224 by 224 pixels, a typical size for image classification (Prince, 2023, p. 161): 50,176 pixels. The window zooms into 25 of them, on the tiger's forehead. We see orange and dark brown, part of a stripe, nothing more. Compare the wine's alcohol column: one number, already meaningful. In a photo, the meaning lies in how many pixels are arranged together: stripes, eyes, the shape of a face. And to a computer, a colour is not yet a number. How does it store one?


---
class: stepwise-svg, vcenter

# Colour channels


.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/channels.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The same 25 pixels split into their red, green and blue values, one grid of numbers per channel: 224 times 224 times 3 is 150,528 numbers"></object></div>
]

.footnote[The 25 pixels of the previous slide, read from the resized photo (S. Taheri, edited by Fir0002, .lic[CC BY-SA 2.5]). 224 × 224 × 3: S. J. D. Prince (2023), p. 161.]

???

**Each pixel is three numbers: how much red, how much green and how much blue it holds.** These three grids are the photo's colour channels (Prince, 2023, p. 170). Each holds one number per pixel, and the higher the number, the more of that colour. Take the top-left pixel of our window, orange fur: 234 red, 163 green, 85 blue. The dark stripe is low in all three: one of its pixels reads 50, 3 and 0. For the whole photo, 224 × 224 pixels times 3 channels gives 150,528 numbers (p. 161). Those numbers are all a network receives. What does the plain network of part 1 do with them?


---
class: stepwise-svg, vcenter
# A photo in a plain network

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/flatten.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A 4 by 4 patch of the tiger's pixels unrolled into one list, row after row: two pixels one above the other end up 4 places apart"></object></div>
.step-4.lead.big.center[Shuffle every photo's pixels the same way: a plain network can still be trained.]
]

.footnote[S. J. D. Prince (2023), p. 161. The colours are the tiger photo's pixels (S. Taheri, edited by Fir0002, .lic[CC BY-SA 2.5]).]

???

**Shuffle every photo's pixels the same way, and a plain network can still be trained.** A plain network, like those of part 1, wires every input to every neuron of the next layer. So it takes the photo as one long list, row after row: two pixels one above the other end up 4 places apart in this patch, and 224 apart in the full photo. The network does not mind, because it has no notion of neighbours (Prince, 2023, p. 161). Yet neighbours are where the meaning lies: a stripe is a run of dark pixels side by side. And a plain network must learn each pattern separately at every position (p. 161). Could a layer read each pixel together with its neighbours?


---
class: stepwise-svg, vcenter

# Convolution


.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/convolution.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A 6 by 6 grid of pixels, dark on the left and light on the right; a 3 by 3 filter with weights minus 1, 0 and plus 1; at a flat place it gives 0, across the edge 2.1; its map is lit along the edge"></object></div>
.step-6.lead.big.center[A filter reads each pixel together with its neighbours.]
]

.footnote[S. J. D. Prince (2023), section 10.3, p. 170. Illustrative values.]

???

**A filter reads each pixel together with its neighbours.** A filter is a small grid of weights, here 3 by 3. We lay it over 3 by 3 pixels, multiply each pixel by the weight on top of it, and add the nine products (Prince, 2023, p. 170). This filter has minus 1 in its left column, 0 in the middle, plus 1 on the right. In the illustrative grid, dark pixels are 0.2 and light ones 0.9. On a flat place, left and right cancel out: 0. Across the edge, the light right column gives 2.7 and the dark left one minus 0.6: 2.1. Slid to every position, the filter fills a new grid, its map, lit only along the edge. Sliding a filter over the input like this is a convolution (p. 163). Why keep the same nine weights everywhere?


---
class: stepwise-svg, vcenter
# Weight sharing

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/sharing.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="One 3 by 3 filter applied at three places of the tiger photo with the same 9 weights; a plain layer would need 22 billion weights, a filter 9"></object></div>
]

.footnote[S. J. D. Prince (2023), pp. 161, 163 and 170; Y. LeCun, Y. Bengio and G. Hinton (2015), p. 439. Photo: S. Taheri, edited by Fir0002, .lic[CC BY-SA 2.5]; window places illustrative.]

???

**Weight sharing: one filter uses the same nine weights at every position of the photo.** Why does that help? First, a pattern can appear anywhere: a tiger's stripes run over its face, neck and shoulders. A filter that responds to a stripe finds it in all those places; the three windows are placed by hand. Image patterns are not tied to one place, which is why sharing suits images (LeCun et al., 2015, p. 439). Second, there are few weights to learn: 9 per colour channel, 27 for a colour photo (Prince, 2023, p. 170). A plain layer from our photo to as many neurons gives each neuron its own weight for each of the 150,528 numbers. That is 150,528 times 150,528: over 22 billion weights, with the data, memory and computation they demand (p. 161). One filter finds one pattern. What do a trained network's filters find?


---
class: stepwise-svg, vcenter

# First layers

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/visualise.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A starting picture, changed step by step so that one filter of the first layer responds more and more; after 2,560 steps it shows what the filter looks for: edges. Not the filter's weights, nor a photo"></object></div>
.step-5.lead.big.center[To see what a filter looks for, change a picture until the filter responds most.]
]

.footnote[C. Olah, A. Mordvintsev and L. Schubert (2017), *Feature Visualization*, *Distill*, doi:10.23915/distill.00007, .lic[CC BY 4.0]: GoogLeNet, layer conv2d0; J. Yosinski et al. (2014). The starting picture is drawn.]

???

**To see what a filter looks for, we change a picture until the filter responds most.** A layer runs many filters side by side, each giving its own map (Prince, 2023, p. 165). A filter's weights do not show what it looks for, so Olah et al. ask the network itself. They take a starting picture, then "use derivatives to iteratively tweak the input" (Olah et al., 2017, verbatim), 2,560 times, until one filter of GoogLeNet's first layer responds as strongly as it can. It is the gradient of part 2, used the other way round: the weights stay fixed, and the pixels change (Simonyan et al., 2014, p. 2). The picture that remains is neither the filter's weights nor a photo. It shows what the filter looks for: fine stripes at one angle, that is, edges. Networks trained on photos learn similar first layers whatever the dataset (Yosinski et al., 2014, p. 1). What do the deeper layers build from these edges?


---
class: stepwise, vcenter

# Deeper layers


.fullw[
<div class="feat four">
<figure class="step-1"><img src="images/features/features-textures.png" alt="Textures" /><figcaption>textures</figcaption></figure>
<figure class="step-2"><img src="images/features/features-patterns.png" alt="Patterns" /><figcaption>patterns</figcaption></figure>
<figure class="step-3"><img src="images/features/features-parts.png" alt="Parts" /><figcaption>parts</figcaption></figure>
<figure class="step-4"><img src="images/features/features-objects.png" alt="Objects" /><figcaption>objects</figcaption></figure>
</div>

.step-4.lead.center[Made the same way, layer after layer: from textures to whole objects.]
]

.footnote[C. Olah, A. Mordvintsev and L. Schubert (2017), *Feature Visualization*, *Distill*, .lic[CC BY 4.0]: GoogLeNet, layers mixed3a to mixed4e.]

???

**Made the same way, layer after layer, the pictures go from textures to whole objects.** Each picture is made for one filter of a deeper layer of the same GoogLeNet (Olah et al., 2017). Its colours and shapes come from no photo: they are whatever makes that filter respond most. The first responds to a mesh-like texture, the second to a woven pattern, the third to parts that look like eyes. The last responds to whole dog faces, and ImageNet holds many dog classes (Yosinski et al., 2014, p. 3). Each layer combines what the layer below found: edges into motifs, motifs into parts, parts into objects (LeCun et al., 2015, p. 439). These pictures show what a filter looks for in any photo. For one decision about one photo, which pixels mattered?


---
class: stepwise-svg, vcenter

# Saliency maps

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/saliency-map.svg" style="width: 92%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The tiger photo, which the network calls tiger, and its gradient map: where the tiger score reacts most to a change, densest on the face"></object></div>

.step-3.lead.big.center[Where the score is sensitive, not why.]
]

.footnote[K. Simonyan, A. Vedaldi and A. Zisserman (2014), pp. 2 and 4. Computed with torchvision's ResNet-18, the map averaged over 4 × 4 pixel blocks. Photo: S. Taheri, edited by Fir0002, .lic[CC BY-SA 2.5].]

???

**A saliency map shows where the score is sensitive, not why.** ResNet-18, a network of 18 layers trained on ImageNet (He et al., 2016, p. 5), calls our photo tiger, with probability 0.68. Which pixels did its tiger score depend on? Simonyan et al. take the gradient of the score with respect to each pixel: how much the score would move if that pixel changed a little (Simonyan et al., 2014, p. 2). It is the gradient of part 2, taken for the pixels instead of the weights (p. 4). Averaged over blocks of 4 by 4 pixels, the map is densest on the face. Would we show this map to a regulator as the reason for a decision?


---
class: stepwise-svg, vcenter

# Saliency maps under test

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/saliency-scrambled.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Two methods' maps of the tiger, before and after the network's top layers are scrambled: the plain gradient map changes, the Guided Backprop map barely changes"></object></div>

.step-4.lead.big.center[A map that ignores the model cannot explain it.]
]

.footnote[J. Adebayo et al. (2018), pp. 1 to 7. Computed with ResNet-18, its last block and output layer re-initialised: rank correlation 0.26 for the gradient, 0.95 for Guided Backprop. Photo: S. Taheri, .lic[CC BY-SA 2.5].]

???

**A map that ignores the model cannot explain it.** Why does this matter? Such maps are offered to satisfy regulators and to debug models (Adebayo et al., 2018, p. 1). Both uses assume that the map depends on what the model learned. Adebayo et al. test that: they replace the top layers' learned weights with random ones, then draw the map again (p. 4). Here we scrambled ResNet-18's top layers. A rank correlation compares the maps: 1 if they order the pixel blocks alike, 0 if their orders are unrelated. The plain gradient map changed: 0.26. Guided Backprop, a variant that drops negative gradients on the way back (p. 3), barely changed: 0.95. It looks like a drawing of the tiger's edges, which an edge detector, using no model, draws too (p. 2). Could a network also say where the tiger is, not only what it is?


---
class: stepwise-svg, vcenter

# Three image tasks

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/tasks.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Three questions asked of one tiger photo: one label for the photo, tiger; a box around the tiger; the tiger's pixels coloured"></object></div>

]

.footnote[S. J. D. Prince (2023), sections 10.5.1 to 10.5.3. Label: ResNet-18; box and mask: a Mask R-CNN trained on COCO, which has no tiger class. Photo: Charles J. Sharp, Wikimedia Commons, .lic[CC BY-SA 4.0].]

???

**We can ask a photo three questions: what it shows, where the object is, and which pixels belong to it.** Classification gives one label per photo: ResNet-18 says tiger, with probability 0.88. Detection draws a box around each object. Segmentation labels every pixel with its object (Prince, 2023, p. 174). Our box and mask come from Mask R-CNN, a network trained on COCO, a dataset of 80 kinds of object (He et al., 2016, p. 10), none of them a tiger. It called the tiger a zebra, with a score of 0.999. A network names only the classes it was trained on, however sure it sounds: that is why we give it a new head. Can a new head learn lion and tiger from about thirty photos of each?


---
.section-mark.part[
.kicker[Part 5 of 5]

# Hands-on 4: lions and tigers

<div class="pair">
<img src="images/photos/lion-1.jpg" alt="A lion" />
<img src="images/photos/tiger-2.jpg" alt="A tiger" />
</div>

<div class="parts"><span>Neural networks</span><span>How a network learns</span><span>Pretrained models</span><span>Beyond tabular data</span><span class="now">Hands-on 4</span></div>
]

.footnote[Photos: Thomas Fuhrmann, Wikimedia Commons, .lic[CC BY-SA 4.0], resized; Charles J. Sharp, Wikimedia Commons, .lic[CC BY-SA 4.0], resized.]

???

**Hands-on 4 asks what a firm can do with a few dozen labelled photos per class.** Say a firm wants its photos sorted into classes: products, defects, species. Training every weight from scratch, the last of our four ways to get a model, would take millions of labelled examples. The firm has a few dozen. So it reuses a network that others have pretrained, and trains only a new head for its own classes. We run this case on lions and tigers. With so few photos, each one counts, so we first look closely at what we have.


---
class: vcenter

# The data

<img class="phase-thumb" src="images/phase-du.svg" alt="The CRISP-DM phases, data understanding lit" />

.beside-thumb.terms[

</table>

</div>

<div class="facts">
<div><span class="num">58</span>training photos: 30 lions, 28 tigers.</div>
<div><span class="num">56</span>test photos: 38 lions, 18 tigers.</div>
<div><span class="num">68%</span>right by always saying lion on the test photos; one photo is 1.79 points.</div>
</div>
]

.footnote[File names of the course archives. The photos' licences are unknown: they stay on the learning platform.]

???

**Each photo's label is the word before the underscore in its file name.** The network reads only the pixels, and the file name is the only place the animal is named. In test, 38 photos are lions and 18 are tigers, so always answering lion is right on 38 of 56: 68%. It is the baseline we met with the bank's credits: "a classifier that always selects the majority class is called a base rate classifier" (Provost & Fawcett, 2013, p. 115, verbatim). Any model of ours must beat 68%. And each photo is 1 of 56, so accuracy moves in steps of 1.79 points: one test photo the model has already seen can lift a score on its own.


---
class: vcenter

# Reusing EfficientNet B0

<img class="phase-thumb" src="images/phase-mo.svg" alt="The CRISP-DM phases, modeling lit" />

.beside-thumb[
<div class="facts big two">
<div><span class="num">1.28 million</span>labelled training photos in ImageNet's 2012 challenge set.</div>
<div><span class="num">1,000</span>classes, lion and tiger among them, and several domestic cats.</div>
</div>
.lead.big.center[EfficientNet B0, pretrained on ImageNet, has seen lions and tigers before Hands-on 4 begins.]
]

.footnote[M. Tan and Q. Le (2019); K. He et al. (2016), section 4.1: 1.28 million training images; J. Yosinski et al. (2014), section 2: the felid classes.]

???

**EfficientNet B0, pretrained on ImageNet, has seen lions and tigers before Hands-on 4 begins.** It is the smallest and fastest to train of the three image networks Dataiku offers (Dataiku, 2024). It learned from ImageNet's 2012 challenge set: 1.28 million labelled photos in 1,000 classes, lion and tiger among them (He et al., 2016, p. 4). Why should we care what it saw? Pretrained features transfer worse when the new task is far from the old one (Yosinski et al., 2014, p. 3). Ours is the easy case of *How much to retrain*: few photos, of classes ImageNet already holds. A firm's defects or products may lie much further away, and then how many layers to retrain matters more. In Dataiku, that choice is one number.


---
class: vcenter

# The Flow

<img class="phase-thumb" src="images/phase-du-mo.svg" alt="The CRISP-DM phases, data understanding to modeling lit" />

.beside-thumb[
<img src="images/flow.png" style="width: 100%; display: block; margin: 0 auto;" alt="The Flow of Hands-on 4 in Dataiku: the folder dataset, List Contents to paths, two Prepare recipes to labels and sets, a Split into cats-train, cats-test, lion-tiger-train and lion-tiger-test; two Stack recipes into felines-train and felines-test; a training recipe on lion-tiger-train to model_lions_tigers, a Score recipe on lion-tiger-test, and a Prepare to lion-tiger-test_scored_errors" />
]

.footnote[Screen capture: Dataiku DSS 15.0, course server, 23 October 2026.]

???

**The Flow turns one folder of photos into the datasets that train and test the model.** The four archives sit in one folder, `dataset`. *List Contents* writes one row per file, with its path and its name. A first *Prepare* reads the label from the name: the letters before the underscore. A second reads the set from the subfolder, and *Split* makes one dataset per archive. The Lab trains on `lion-tiger-train`. *Score* adds the model's prediction to each photo of `lion-tiger-test`, and a last *Prepare* marks it right or wrong. The two *Stack* recipes join the cats to the lions and tigers. Why score a separate set, when Dataiku already reports a score? Dataiku's own test split comes out of the training photos, and early stopping uses it to decide when to stop. The 56 test photos have shaped nothing: their score is the one that answers the firm.
