.section-mark.center[
## Deep learning for decisions

### When a network is worth its cost, and how to borrow a trained one

<br />

Oscar Esteban &lt;<code>oscar.esteban@hevs.ch</code>>

<br />

EAD · Exploration avancée de données et intelligence décisionnelle · 23.10.2026

<div style="font-size: 0.8em; margin-top: 1.2em;"><a href="https://oesteban.github.io/msba-ead-2026-2027-slides/day2/05-dl/index.html">
https://oesteban.github.io/msba-ead-2026-2027-slides/day2/05-dl/index.html
</a></div>
]

???

**This deck shows what a neural network is and how it learns, on familiar data first, why it took about sixty years, and when a firm borrows a pretrained network rather than training its own.** A network is a stack of simple models, such as logistic regressions, whose weights are fitted together (Provost & Fawcett, 2013, p. 107). Hands-on 4 then trains an image classifier in Dataiku DSS, lions against tigers, on a borrowed network.

???

**Five parts: neural networks and their sixty years, how a network learns, pretrained models, tables and photos, then one case and its result.** Parts 1 to 4 teach the concepts on a wine of *Beyond binary classification*, on photos in general or on drawings; part 5 applies them to one case and reads its errors. Slide 2 starts from a single artificial neuron.


---
class: stepwise-svg, vcenter
# An artificial neuron

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/unit.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Three values of one wine, alcohol 12.0, volatile acidity 0.27, sulphates 0.56, times three weights, summed with a bias to minus 0.70, then the logistic function: 0.33"></object></div>
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), pp. 106 to 107.] *Evaluating a classifier*, slide 3. The wine: line 12 of the course file, P. Cortez et al. (2009). Weights illustrative.]

???

**An artificial neuron multiplies each input by a weight, adds a bias, then applies a function: with the logistic function, it is the logistic regression of the first day.** Three values of one white wine, line 12 of the course file, times illustrative weights, plus a bias of -7.0, give -0.70; the logistic function turns that into 0.33, read as P(high). Logistic regression maps "a weighted sum of the attribute values" (Provost & Fawcett, 2013, p. 85, verbatim) to a probability (pp. 97 to 98), as on slide 3 of *Evaluating a classifier*; networks stack such models (p. 107).


---
class: stepwise-svg, vcenter
# Activation functions

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/activation.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Two functions of the weighted sum: the logistic, between 0 and 1, and the ReLU, zero below zero and the sum itself above"></object></div>
.step-3.lead.big.center[Without one, a stack of layers is a single weighted sum.]
]

.footnote[S. J. D. Prince (2023), pp. 25, 35 and 66.]

???

**Without an activation function, a stack of layers is a single weighted sum.** After its weighted sum, each neuron applies a function: the logistic gives a value between 0 and 1, as on the first day (Prince, 2023, p. 66); the ReLU, the most common choice, gives 0 below zero and the sum itself above (pp. 25 and 35). With no activation function, or a linear one, a network describes only a linear relation between inputs and output (p. 35). Slide 4 arranges the neurons in layers.


---
class: stepwise-svg, vcenter
# A neural network

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/layers.svg" style="width: 96%; display: block; margin: 0 auto; pointer-events: none;" aria-label="An input layer for a wine's values, two hidden layers, an output layer with one neuron per line: low, medium, high"></object></div>
]

.footnote[.book[<i class="fa-solid fa-book-open"></i> Provost & Fawcett (2013), p. 107.] S. J. D. Prince (2023), chapter 4; deep: p. 41. Schematic.]

???

**A neural network arranges neurons in layers: inputs, hidden layers, one output neuron per class; deep means more than one hidden layer.** Layer after layer, "each subsequent layer in the stack applies a simple model" (Provost & Fawcett, 2013, p. 107, verbatim) to the outputs of the layer below; for the wines, the outputs are the three lines. Prince counts any network with more than one hidden layer as deep (2023, p. 41), and many have far more than the two drawn: LeCun et al. speak of 5 to 20 (2015, p. 438). Slide 5 asks why networks took decades to pay off.


---
class: stepwise-svg, vcenter
# 1958 to 1998

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/timeline-1.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A timeline with pictures: the Mark I Perceptron in 1958; back-propagation in 1986, with a portrait of G. Hinton; handwritten digits read by LeNet in 1998"></object></div>
.step-5.lead.big.center[The ideas are old; labelled data and compute were missing.]
]

.footnote[F. Rosenblatt (1958); D. E. Rumelhart, G. E. Hinton and R. J. Williams (1986); Y. LeCun et al. (1998). Photos: U.S. Navy, public domain; Arthur Petron, .lic[CC BY-SA 4.0], cropped; Josef Steppan, .lic[CC BY-SA 4.0]; all via Wikimedia Commons.]

???

**The ideas are old, the perceptron of 1958, back-propagation of 1986, LeNet of 1998; labelled data and compute were missing.** Back-propagation let hidden units learn their own features, where those of the perceptron (Rosenblatt, 1958) were set by hand (Rumelhart et al., 1986, p. 533); G. Hinton, pictured, co-signed it and later AlexNet. A cheque reader built on LeNet-5 read several million cheques a day (LeCun et al., 1998, pp. 1 and 2), yet by the late 1990s networks were largely set aside, until graphics cards and labelled datasets brought them back (LeCun et al., 2015, pp. 438 to 440).


---
class: stepwise-svg, vcenter
# 2009 to 2022

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/timeline-2.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The timeline continued: ImageNet in 2009, AlexNet on two graphics cards in 2012, ResNet with 152 layers in 2015, the transformer in 2017, GPT-3 in 2020, ChatGPT in 2022"></object></div>
.step-5.lead.big.center[Labelled data and graphics cards made networks win; then they grew.]
]

.footnote[J. Deng et al. (2009); A. Krizhevsky, I. Sutskever and G. Hinton (2017, first published 2012); K. He et al. (2016); A. Vaswani et al. (2017); T. Brown et al. (2020); OpenAI (2022). Photo: a GTX 580 board, Fritzchens Fritz, Wikimedia Commons, .lic[CC0].]

???

**Large labelled datasets and graphics cards made networks win; then they grew.** ImageNet held 3.2 million labelled images in 2009 (Deng et al., 2009, abstract). In 2012, AlexNet, trained for five to six days on two GTX 580 graphics cards, won the ImageNet challenge with a top-5 error of 15.3% against 26.2% (Krizhevsky et al., 2017, abstract and section 1). Then came ResNet's 152 layers (He et al., 2016, p. 1), the transformer for translation (Vaswani et al., 2017, p. 1), GPT-3's 175 billion parameters (Brown et al., 2020, p. 5) and ChatGPT, free to use in 2022 (OpenAI, 2022).


---
class: stepwise-svg, vcenter
# Training data

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/data-sizes.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Training sets on a log scale: 60,000 digits for MNIST in 1998, 1.28 million photos for ImageNet, 3.3 billion words for BERT, 300 billion tokens for GPT-3, 400 million captioned photos for CLIP"></object></div>
.step-3.lead.big.center[From thousands of examples to hundreds of billions.]
]

.footnote[Y. LeCun et al. (1998), p. 10; K. He et al. (2016), p. 4; J. Devlin et al. (2019), p. 13; T. Brown et al. (2020), p. 8; A. Radford et al. (2021), p. 1. The units differ.]

???

**Training sets grew from thousands of examples to hundreds of billions.** LeNet learned from 60,000 handwritten digits (LeCun et al., 1998, p. 10), ResNet from 1.28 million labelled photos (He et al., 2016, p. 4), BERT from 3.3 billion words (Devlin et al., 2019, p. 13), GPT-3 from 300 billion tokens of text (Brown et al., 2020, p. 8) and CLIP from 400 million photos with their captions (Radford et al., 2021, p. 1). The units differ, so the log scale compares orders of magnitude only. Slide 8 does the same for compute.


---
class: stepwise-svg, vcenter

# Training compute


.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/compute-1.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Training compute of milestone models on a log scale, from the perceptron near a million operations to Llama 3.1 near 10 to the 25"></object></div>
.step-3.lead.big.center[A log scale: each gridline is 100,000 times the one below.]
]

.footnote[Data: Epoch AI (2026), *Data on Notable AI Models*, .lic[CC BY 4.0]. Training compute in floating-point operations (FLOP), log scale.]

???

**On a log scale, each gridline is 100,000 times the one below: training compute rose from under a million operations for the perceptron to about 4 × 10<sup>25</sup> for Llama 3.1 in 2024.** The chart counts floating-point operations (FLOP), additions and multiplications, as reported by each paper or estimated from its hardware or architecture (Epoch AI, 2026). Epoch rates ten of the twelve values accurate within a factor of 3, those of the perceptron and GPT-4 within a factor of 10. Slide 9 measures how fast the climb was.


---
class: stepwise-svg, vcenter

# Training compute over time


.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/compute-2.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The same points with two trend lines: doubling about every 20 months before 2010, about every 6 months since 2012"></object></div>
]

.footnote[J. Sevilla et al. (2022); data: Epoch AI (2026), .lic[CC BY 4.0].]

???

**Training compute doubled about every 20 months before 2010 and about every 6 months since the early 2010s.** Sevilla et al. find the older pace in line with Moore's law and the change coming with deep learning (2022, p. 1). Their fitted 0.6 orders of magnitude a year since 2010 (p. 3) is about four times more each year, a million times more in ten years. The two dashed lines carry these two rates through the chart's points; they are not fitted to them. Slide 10 sets the result against one supercomputer.


---
class: stepwise-svg, vcenter

# Lonestar 5


.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/compute-3.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="One day of Lonestar 5 at peak, about 10 to the 20 operations: AlexNet takes 6 minutes of it, GPT-3 8 years"></object></div>

]

.footnote[T. Brown et al. (2020), Table D.1; TACC (2015): 1.25 petaflops at peak; data: Epoch AI (2026), .lic[CC BY 4.0]. Peak and training arithmetic differ. Photo: Julian Herzog, .lic[CC BY 4.0].]

???

**One day of the Lonestar 5 supercomputer at its peak would do AlexNet's training arithmetic in 6 minutes, GPT-3's in 8 years.** In service from January 2016, Lonestar 5 peaked at 1.25 petaflops (Texas Advanced Computing Center, 2015), about 1.08 × 10<sup>20</sup> operations a day. AlexNet took 4.7 × 10<sup>17</sup> operations (Epoch AI, 2026), GPT-3 3.14 × 10<sup>23</sup> (Brown et al., 2020, Table D.1). Its benchmark counts 64-bit operations (Texas Advanced Computing Center, 2015), and training runs reach about 30% to 50% of peak (Epoch AI, 2026): an order of magnitude only. Borrowing a trained network avoids this cost.


---
class: stepwise-svg, vcenter
# Forward pass

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/forward.svg" style="width: 96%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The wine's values 12.0, 0.27 and 0.56 pass through three hidden neurons to three line scores: low 0.4, medium 1.6, high 0.2"></object></div>
]

.footnote[S. J. D. Prince (2023), chapter 4. The wine of *Beyond binary classification*, slide 2. Hidden values and scores illustrative.]

???

**In the forward pass, the wine's values flow through the layers to one score per line.** The wine of *Beyond binary classification*, slide 2, enters with alcohol 12.0, volatile acidity 0.27 and sulphates 0.56; each hidden neuron takes a weighted sum, then a ReLU, giving 0.9, 0 and 1.4; the output layer turns these into scores: low 0.4, medium 1.6, high 0.2. All values but the wine's are illustrative. Running the network on an example and keeping every layer's values is the forward pass (Prince, 2023, p. 97). Slide 12 turns the scores into probabilities.


---
class: stepwise-svg, vcenter
# Softmax

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/softmax.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Three scores, 0.4, 1.6 and 0.2, become the probabilities 0.19, 0.65 and 0.16 through a softmax"></object></div>
]

.footnote[S. J. D. Prince (2023), section 5.5. *Beyond binary classification*, slide 2. Illustrative scores.]

???

**Softmax turns the scores into probabilities that sum to one.** It raises e to each score and divides by their sum, so each result lies between 0 and 1 and all add up to 1 (Prince, 2023, p. 68): the illustrative scores 0.4, 1.6 and 0.2 become 0.19 low, 0.65 medium and 0.16 high. The most probable line is predicted (p. 69), unless the costs say otherwise (*Beyond binary classification*, slide 2). There, a random forest, a different model, gave this wine 0.19, 0.59 and 0.22. This wine's line is low: slide 13 measures the miss.


---
class: stepwise-svg, vcenter
# Loss

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/loss.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The same output, 0.65 medium: for this wine, whose line is low, the loss is 1.64, high; for a medium wine it is 0.44, low"></object></div>
]

.footnote[S. J. D. Prince (2023), section 5.5: the cross-entropy loss. Illustrative values.]

???

**The more probability the network puts on wrong lines, the higher the loss.** The loss is minus the log of the probability given to the true line, the multiclass cross-entropy (Prince, 2023, p. 69). With the same illustrative output, this wine, whose line is low and gets 0.19, costs 1.64; a medium wine, given 0.65, costs 0.44. A loss is "a general term for error penalty" (Provost & Fawcett, 2013, p. 94, verbatim); logistic regression is fitted the same way, on the probability given to each example's actual class (p. 101). Slide 14 lowers the loss.


---
class: stepwise-svg, vcenter
# Gradient descent

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/descent.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A loss curve over one weight; from a random start, each step goes a little downhill"></object></div>
.step-4.lead.big.center[Deep-learning frameworks train every network this way, whatever its data.]
]

.footnote[S. J. D. Prince (2023), chapter 6; 175 billion: T. Brown et al. (2020), p. 5. Illustrative curve.]

???

**Gradient descent moves each weight a small step down the loss; frameworks train every network this way, whatever its data.** From random initial weights, it computes the gradient, the direction in which the loss rises, and moves a small step the other way, again and again (Prince, 2023, pp. 78 and 96). Provost and Fawcett give every fitted model this goal: "find the optimal value for the weights by maximizing or minimizing the objective function" (Provost & Fawcett, 2013, p. 87, verbatim). The curve is illustrative; GPT-3 has 175 billion parameters to move (Brown et al., 2020, p. 5).


---
class: stepwise-svg, vcenter
# Back-propagation

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/backprop.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Forward through four layers to the loss, then the error sent back to every layer"></object></div>
]

.footnote[D. E. Rumelhart, G. E. Hinton and R. J. Williams (1986); S. J. D. Prince (2023), chapter 7. Schematic.]

???

**Back-propagation sends the error back through the layers to give each weight its gradient.** From the loss of slide 13, it computes the derivatives at the end of the network first and works backward, reusing the values the forward pass stored (Prince, 2023, pp. 97 and 99), as Rumelhart et al. set out (1986, pp. 533 to 534). It solves the problem that "target labels for training are provided only for the final layer" (Provost & Fawcett, 2013, p. 107, verbatim): the hidden layers learn from the error passed back. Slide 16 puts the steps in a loop.


---
class: stepwise-svg, vcenter
# The training loop

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/loop.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Four steps in a loop: forward a batch, its loss, the backward pass, an update of every weight; then the next batch"></object></div>
.step-6.lead.big.center[PyTorch runs this loop; Dataiku's image models are built on PyTorch.]
]

.footnote[S. J. D. Prince (2023), sections 6.2 and 7.2; A. Zhang et al. (2023), section 3.4; Dataiku (2024), *Computer vision*.]

???

**Training is a loop, forward, loss, backward, update, one batch at a time; PyTorch runs this loop, and Dataiku's image models are built on PyTorch.** A batch is a random subset of the training examples; taking each gradient from a batch alone is stochastic gradient descent, cheaper than using all the data at every step (Prince, 2023, pp. 85 to 86). Zhang et al. write it in PyTorch and use similar loops for every model of their book (2023, section 3.4.4), and Dataiku's computer vision is based on PyTorch (Dataiku, 2024). Slide 17 counts the passes over the data.


---
class: stepwise-svg, vcenter
# Epochs

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/epochs.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Every training example once, a batch at a time, is one epoch; the training loss falls over twenty epochs"></object></div>
]

.footnote[S. J. D. Prince (2023), section 6.2. Illustrative curve.]

???

**An epoch is one pass over all the training examples, a batch at a time; training runs many.** Batches are drawn until every example has been used, then drawing starts again over the full training set; each full pass is an epoch (Prince, 2023, p. 85). The illustrative curve shows the training loss falling over 20 epochs, fast at first, then slowly. The number of epochs is a setting chosen before training, like the learning rate (Zhang et al., 2023, section 3.4.4). Slide 18 shows when to stop sooner.


---
class: stepwise-svg, vcenter

# Early stopping


.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/early-stop.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The training loss keeps falling; the validation loss falls, then rises; training stops at its lowest point"></object></div>

]

.footnote[S. J. D. Prince (2023), section 9.3.1; Illustrative curves.]

???

**Training should stop where the validation loss is lowest, before the network learns its training set by heart.** On the illustrative curves, the training loss keeps falling while the loss on held-out validation examples falls, then rises: overfitting, the tendency to "tailor models to the training data, at the expense of generalization" (Provost & Fawcett, 2013, p. 113, verbatim). Early stopping checks the validation loss during training and keeps the weights where it was lowest (Prince, 2023, p. 145). Slide 19 adds variety to the data instead.


---
class: stepwise-svg, vcenter
# Augmentation

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/augment.svg" style="width: 96%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A photo flipped, a sentence with a synonym, a sound filtered: each a new training example with the same label"></object></div>
.step-5.lead.big.center[Variety, not new information: it cannot fix a wrong label.]
]

.footnote[S. J. D. Prince (2023), section 9.3.8. Drawn examples.]

???

**Augmentation adds varied copies of each training example with the same label: variety, not new information, and it cannot fix a wrong label.** A photo is flipped, a sentence takes a synonym, a sound has a frequency band filtered: each change leaves the label valid (Prince, 2023, p. 152), and the aim is to teach the model to ignore such irrelevant changes (p. 154). Every copy inherits its original's label, so a wrong label is copied, not corrected. Slide 20 shows how common wrong labels are.


---
class: vcenter

# Wrong labels in benchmarks

.fullw[
<div class="facts big two">
<div><span class="num">3.3%</span>of test labels at least, on average across ten widely used test sets of images, text and sound.</div>
<div><span class="num">2,916</span>wrong labels at least in ImageNet's validation set: about 6% of it.</div>
</div>

.lead.big.center[A wrong label costs a point as surely as a model error.]
]

.footnote[C. G. Northcutt, A. Athalye and J. Mueller (2021), pp. 1 and 2.]

???

**A wrong label costs a point as surely as a model error, and even benchmark test sets carry them.** Northcutt et al. flagged likely errors with an algorithm and had crowd workers confirm them: at least 3.3% of test labels on average across ten widely used test sets of images, text and sound, and 2,916 wrong labels, about 6%, in ImageNet's validation set (Northcutt et al., 2021, pp. 1 and 2). With corrected labels, ResNet-18 overtakes ResNet-50 on ImageNet if the share of mislabelled test examples rises by 6% (p. 1). Practitioners' own datasets are often noisier than such curated benchmarks (p. 2). Part 4 turns from training a network to borrowing one.


---
class: vcenter

# Pretrained models

.fullw[
<div class="trio">
<div><b class="k">Photos</b><span class="num">1.28 million</span> labelled photos of ImageNet train image networks: AlexNet, ResNet.</div>
<div><b class="k">Text</b><span class="num">3.3 billion</span> words of books and Wikipedia train BERT; 300 billion tokens, GPT-3.</div>
<div><b class="k">Photos with captions</b><span class="num">400 million</span> pairs train CLIP, which links a photo to words.</div>
</div>
.lead.big.center[Trained once, at great cost, then reused by others for their own tasks.]
]

.footnote[A. Zhang et al. (2023), section 14.2.1; K. He et al. (2016), p. 4; J. Devlin et al. (2019), pp. 3 and 13; T. Brown et al. (2020), p. 8; A. Radford et al. (2021), p. 1.]

???

**A pretrained model is trained once, at great cost, then reused by others for their own tasks.** The slide's three families learned from the training sets of slide 7: labelled photos, text, photos with captions. Collecting ImageNet cost millions of dollars (Zhang et al., 2023, section 14.2), and pretraining BERT took 4 days, while adapting it to a new task took a few hours on one graphics card (Devlin et al., 2019, pp. 13 and 5). The same pretrained weights start the models of many different tasks (p. 3).


---
class: stepwise-svg, vcenter
# Inside a pretrained network

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/general.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Seven blocks of a pretrained network shaded from general to specific: the first layers general, the last layers and the head fitted to the original task"></object></div>
.step-4.lead.big.center[Keep the general layers for a new task; replace the specific ones.]
]

.footnote[J. Yosinski, J. Clune, Y. Bengio and H. Lipson (2014), p. 1 and section 4.1. Schematic.]

???

**Keep a pretrained network's general first layers for a new task; replace its specific last ones.** First-layer features suit many datasets and tasks, while each output of the last layer belongs to one class of the original task (Yosinski et al., 2014, p. 1). Between two halves of ImageNet's classes, layers 1 and 2 transferred almost perfectly; from layer 3 on, accuracy dropped, and at layers 6 and 7 mostly because the features were specific (section 4.1). Slide 23 replaces the head.


---
class: stepwise-svg, vcenter

# Transfer learning


.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/transfer.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Seven locked blocks of a pretrained network; its original head replaced by a new head for your classes, the only weights that learn"></object></div>
.step-4.lead.big.center[Only the new head learns from your examples.]
]

.footnote[S. J. D. Prince (2023), section 9.3.6; A. Zhang et al. (2023), section 14.2. Schematic.]

???

**Transfer learning keeps the pretrained layers locked: only a new head learns from your examples.** The original last layer is replaced by a new head, one output per new class, starting from random weights (Prince, 2023, p. 152; Zhang et al., 2023, section 14.2.1). Locking suits a small set of examples, on which training many weights may overfit (Yosinski et al., 2014, p. 2). In display advertising, models transferred from cheaper data let a team "operate with a substantially reduced investment in data" (Provost & Fawcett, 2013, p. 324, verbatim).


---
class: stepwise-svg, vcenter

# Fine-tuning


.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/finetune.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The same network with its last two blocks unlocked: they learn with the new head"></object></div>
.step-3.lead.big.center[The unlocked layers adapt the pretrained features to the new task.]
]

.footnote[S. J. D. Prince (2023), section 9.3.6; A. Zhang et al. (2023), section 14.2. Schematic.]

???

**Fine-tuning unlocks some pretrained layers, so that they adapt their features to the new task.** In the figure, the last two blocks learn along with the new head. The copied layers keep training on the new data in smaller steps than the new output layer, which learns from scratch (Zhang et al., 2023, section 14.2.3); fine-tuning may also cover the whole network (Prince, 2023, p. 152). Copying layers and then fine-tuning them generalised better than training on the target data alone (Yosinski et al., 2014, section 4.1).


---
class: vcenter

# Transfer learning or fine-tuning

.fullw[
<div class="duo big">
<div><b class="k">What fine-tuning buys</b>The pretrained features adapt to the new examples: worth it when these differ from the pretraining data.</div>
<div class="lit"><b class="k">What it costs</b>More examples, and on a small set, a model that learns its training examples by heart.</div>
</div>
.lead.big.center[More layers that learn: more data needed, more risk of overfitting.]
]

.footnote[Dataiku (2024), *Computer vision*: fine-tuned layers and overfitting; A. Zhang et al. (2023), section 14.2.3; S. Kornblith, J. Shlens and Q. Le (2019).]

???

**More layers that learn need more examples and bring more risk of overfitting.** Fine-tuning improves the copied features when the new dataset is large enough (Yosinski et al., 2014, p. 2), and locked layers copied from a distant task lose more, above all the higher ones (p. 8). Dataiku warns that more fine-tuned layers can overfit a training set that is not large enough (Dataiku, 2024, Computer vision): with more flexibility, "we increase the chance that we fit the data too well" (Provost & Fawcett, 2013, p. 108, verbatim).


---
class: vcenter

# How much to retrain

.fullw[
<div class="duo big">
<div class="lit"><b class="k">Few examples: 47 to 800 in all</b>A logistic regression on locked pretrained features matched or beat fine-tuning.</div>
<div><b class="k">Far from ImageNet</b>Car models and aircraft types gained little from pretraining on ImageNet's classes.</div>
</div>
.lead.big.center[With few examples, a new head is enough; on a distant task, pretraining helps little.]
]

.footnote[S. Kornblith, J. Shlens and Q. Le (2019), sections 4.5 and 4.7.]

???

**With few examples, a new head is enough; on a task far from the pretraining data, pretraining helps little.** With 47 to 800 examples in all, a logistic regression on locked pretrained features, that is, a new head, did as well as fine-tuning or better (Kornblith et al., 2019, p. 7). On car models and aircraft types, classes ImageNet barely covers, pretraining gave little over training from scratch: 93.3% against 92.7% for cars (pp. 6 to 7). Features transfer less as the original and new tasks grow apart (Yosinski et al., 2014, p. 1).


---
class: stepwise-svg, vcenter
# Zero-shot

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/zeroshot.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A review and the question positive or negative go to a pretrained language model, with no example and no weight change; it answers negative"></object></div>
.step-5.lead.big.center[No labelled example and no training: the classes described in words.]
]

.footnote[T. Brown et al. (2020), p. 7; A. Radford et al. (2021), p. 6. The review is invented.]

???

**Zero-shot needs no labelled example and no training: the classes are described in words.** A pretrained language model is given only a natural-language instruction describing the task, no demonstration, and answers with forward passes alone, its weights unchanged (Brown et al., 2020, p. 7). For photos, CLIP compares a photo with the class names written as text and picks the most probable pair (Radford et al., 2021, p. 6). Brown et al. call it the most convenient setting and the most challenging (p. 7); the review in the figure is invented.


---
class: vcenter

# Four ways to get a model

.fullw[
<div class="quad big">
<div><b>1 · Zero-shot</b>The classes described in words; no labelled example.</div>
<div class="lit"><b>2 · A new head</b>Locked pretrained layers; tens to hundreds of examples.</div>
<div><b>3 · Fine-tuning</b>More layers learn: more examples needed.</div>
<div><b>4 · From scratch</b>Every weight learned: millions of examples, and slide 10's compute.</div>
</div>
.lead.big.center[Each rung up needs more labelled examples; the last, slide 10's compute.]
]

.footnote[A. Radford et al. (2021); S. Kornblith, J. Shlens and Q. Le (2019); K. He et al. (2016).]

???

**Of four ways to get a model, each rung up needs more labelled examples; the last also needs slide 10's compute.** Zero-shot needs only the class names (Radford et al., 2021, p. 6); a new head on locked layers did well with 47 to 800 examples (Kornblith et al., 2019, p. 7), and fine-tuning pulls ahead with more (p. 7). Training from scratch learns every weight from millions of examples (slide 7), with slide 10's compute; even where both end equal, fine-tuning gets there about 17 times faster (p. 7). Part 5 turns to the data, a table first.


---
class: vcenter

.fullw.terms[
<table class="big">
<tr><th>alcohol</th><th>volatile acidity</th><th>sulphates</th><th>colour</th><th class="tgt">grade</th></tr>
<tr class="meaning"><td>% by volume</td><td>acetic acid, g/dm³</td><td>potassium sulphate, g/dm³</td><td>red or white</td><td class="tgt">the target: the line</td></tr>
<tr><td>8.8</td><td>0.27</td><td>0.45</td><td>white</td><td class="tgt">medium</td></tr>
<tr><td>12.0</td><td>0.27</td><td>0.56</td><td>white</td><td class="tgt">low</td></tr>

</table>
.lead.big.center[Each column means something before any model reads it.]
]

.footnote[Lines 2, 12 and 15 of the course file, five of its 13 columns. P. Cortez et al. (2009); UCI Machine Learning Repository, .lic[CC BY 4.0].]

???

**Each column of a table means something before any model reads it.** Three wines of the course file, the middle one the wine of slides 2 and 11, appear on five of its 13 columns with their units (Cortez et al., 2009, Table 1) and the target, the wine's line. Each row is an instance "described by a set of attributes" (Provost & Fawcett, 2013, p. 46, verbatim), each with a meaning of its own (Grinsztajn et al., 2022, p. 8). Slide 30 asks which models suit such columns.


---
class: vcenter

# Trees and networks on tables

.fullw[
<div class="duo big">
<div><b class="k">45 tables, up to 10,000 rows</b>Tree-based models, boosted trees first, stayed ahead of the networks tested at every tuning budget.</div>
<div class="lit"><b class="k">The wines of <i>Beyond binary classification</i></b>A network did about as well as a regression, and a support vector machine beat both.</div>
</div>
.lead.big.center[On a firm's tables, try a tree ensemble first.]
]

.footnote[L. Grinsztajn, E. Oyallon and G. Varoquaux (2022), pp. 1 to 8; P. Cortez et al. (2009), p. 13; N. Hollmann et al. (2025).]

???

**On a firm's tables, try a tree ensemble first.** On 45 tables of up to 10,000 rows, tree-based models stayed ahead of the networks tested at every tuning budget (Grinsztajn et al., 2022, pp. 3 to 6); on the wines, a support vector machine beat both a network and a regression (Cortez et al., 2009, p. 13). First, not only: "we can easily compare various models on the same data" (Provost & Fawcett, 2013, p. 353, verbatim). TabPFN, pretrained on synthetic tables, has since beaten tree ensembles there (Hollmann et al., 2025, p. 323).


---
class: stepwise-svg, vcenter

# A photo


.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/pixels.svg" style="width: 92%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A tiger photo at 224 by 224 pixels, one patch of 25 pixels zoomed to its red, green and blue values"></object></div>
]

.footnote[Photo: S. Taheri, edited by Fir0002, Wikimedia Commons, .lic[CC BY-SA 2.5], resized. 224 × 224 × 3: S. J. D. Prince (2023), p. 161.]

???

**To a model, a colour photo is 150,528 numbers, and no single one means anything.** A typical image for classification holds 224 by 224 pixels, each with a red, a green and a blue value: 150,528 inputs (Prince, 2023, p. 161). The zoomed patch shows 25 of the photo's pixels with their three values. A table's columns carry meaning one by one (slide 29); in a photo, nearby pixels are related (p. 161), which a plain network ignores, as slide 32 shows.


---
class: stepwise-svg, vcenter
# A photo in a plain network

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/flatten.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A 4 by 4 patch unrolled into one list, row after row: two pixels one above the other end up 4 places apart"></object></div>
.step-4.lead.big.center[Shuffle every photo's pixels the same way: a plain network can still be trained.]
]

.footnote[S. J. D. Prince (2023), p. 161. Illustrative grey levels.]

???

**A plain network reads a photo's pixels as one long list, without knowing which are neighbours.** Unrolled row after row, two vertical neighbours land 4 places apart in the illustrative patch, 224 in a photo 224 pixels wide. A fully connected network treats every pair of inputs alike: shuffle the pixels of every training and test photo the same way, and it can still be trained (Prince, 2023, p. 161). It must also learn a pattern separately at every position (p. 161), which slide 33 avoids.


---
class: stepwise-svg, vcenter

# Convolution


.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/convolution.svg" style="width: 100%; display: block; margin: 0 auto; pointer-events: none;" aria-label="A three by three filter slides over the pixels; its map is lit where the pixels change from dark to light"></object></div>
.step-4.lead.big.center[A filter reads each pixel together with its neighbours.]
]

.footnote[S. J. D. Prince (2023), section 10.3, p. 170. Illustrative.]

???

**A convolution's filter reads each pixel together with its neighbours.** A 3 by 3 filter takes a weighted sum of each pixel and the eight around it, then slides on, with the same weights at every position (Prince, 2023, pp. 163 and 170). In the illustrative grid, dark on the left and light on the right, the filter's map lights up only along the edge between them. Slide 34 counts what sharing the same weights everywhere saves.


---
class: vcenter

# Weight sharing

.fullw[
<div class="facts big two">
<div><span class="num">22 billion</span>weights in one plain layer from a 224 × 224 colour photo to as many hidden neurons.</div>
<div><span class="num">9</span>weights in a 3 × 3 filter on one channel, the same at every position of the photo.</div>
</div>
.lead.big.center[The same weights everywhere: a pattern is found wherever it appears.]
]

.footnote[S. J. D. Prince (2023), pp. 161 and 163; Y. LeCun, Y. Bengio and G. Hinton (2015), p. 439.]

???

**The same weights at every position find a pattern wherever it appears, with a handful of weights instead of billions.** A plain layer from a 224 by 224 colour photo to as many hidden neurons would need over 22 billion weights (Prince, 2023, p. 161); a 3 by 3 filter has 9 per channel, 27 over the three colours (p. 170). Sharing suits images because a motif that can appear in one place can appear anywhere (LeCun et al., 2015, p. 439). Slide 35 shows what trained filters find.


---
class: vcenter

# First layers


.fullw[
<div class="feat one">
<figure><img src="images/features/features-edges.png" alt="Feature visualisation of a first layer: edges" /><figcaption>a first layer: edges</figcaption></figure>
</div>

.lead.big.center[Learned, not given: the network found these from labelled photos alone.]
]

.footnote[C. Olah, A. Mordvintsev and L. Schubert (2017), *Feature Visualization*, *Distill*, doi:10.23915/distill.00007, .lic[CC BY 4.0]; J. Yosinski et al. (2014).]

???

**The first layers of a trained network find edges, and nobody programmed them to.** The image was adjusted step by step until one channel of layer conv2d0 of GoogLeNet, a network trained on ImageNet, responded strongly to it (Olah et al., 2017). Networks trained on natural images learn such first-layer features, edge detectors and colour blobs, whatever the dataset or training objective (Yosinski et al., 2014, p. 1); they are learned from data, not designed by engineers (LeCun et al., 2015, p. 436). Slide 36 goes deeper.


---
class: stepwise, vcenter

# Deeper layers


.fullw[
<div class="feat four">
<figure class="step-1"><img src="images/features/features-textures.png" alt="Textures" /><figcaption>textures</figcaption></figure>
<figure class="step-2"><img src="images/features/features-patterns.png" alt="Patterns" /><figcaption>patterns</figcaption></figure>
<figure class="step-3"><img src="images/features/features-parts.png" alt="Parts" /><figcaption>parts</figcaption></figure>
<figure class="step-4"><img src="images/features/features-objects.png" alt="Objects" /><figcaption>objects</figcaption></figure>
</div>

.step-4.lead.center[Layer after layer, from the first to the last.]
]

.footnote[C. Olah, A. Mordvintsev and L. Schubert (2017), *Feature Visualization*, *Distill*, .lic[CC BY 4.0]: GoogLeNet, layers mixed3a to mixed4e.]

???

**Layer after layer, a trained network combines edges into textures, patterns, parts and whole objects.** The four visualisations come from the same GoogLeNet: textures from layer mixed3a, patterns from mixed4a, parts from mixed4b and mixed4c, objects from mixed4d and mixed4e (Olah et al., 2017). LeCun et al. (2015, p. 439) describe the same hierarchy: edges form motifs, motifs parts, parts objects. The last layers become specific to the classes trained on (Yosinski et al., 2014, p. 1), as slide 22 drew for any pretrained network.


---
class: stepwise-svg, vcenter

# Saliency maps

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/saliency-map.svg" style="width: 92%; display: block; margin: 0 auto; pointer-events: none;" aria-label="An image the model classifies, and its map: the pixels the score is most sensitive to"></object></div>

.step-3.lead.big.center[Where the score is sensitive, not why.]
]

.footnote[K. Simonyan, A. Vedaldi and A. Zisserman (2014), pp. 2 and 4. Illustrative.]

???

**A saliency map lights the pixels the class score is most sensitive to: where the score reacts, not why.** Simonyan et al. take the derivative of the class score with respect to each pixel: its magnitude marks the pixels that need to change least to move the score most, in one back-propagation pass, the algorithm of slide 15 (Simonyan et al., 2014, pp. 2 and 4). A map may light only the most telling part of an object (p. 4). The figure's image and map are drawn, not computed. Slide 38 puts the maps to a test.


---
class: stepwise-svg, vcenter

# Saliency maps under test

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/saliency-scrambled.svg" style="width: 92%; display: block; margin: 0 auto; pointer-events: none;" aria-label="The trained model's map, and a near-identical map after its top layers are scrambled"></object></div>

.step-3.lead.big.center[A map is a question to ask of the model, not a proof.]
]

.footnote[J. Adebayo et al. (2018), pp. 2 to 7. Illustrative.]

???

**A saliency map is a question to ask of the model, not a proof: some methods draw almost the same map after the model's top layers are scrambled.** Adebayo et al. re-initialised a trained network from its top layer down: the maps of the plain gradient and GradCAM changed, while those of Guided Backprop and Guided GradCAM stayed nearly the same until the lowest layers (Adebayo et al., 2018, pp. 3 to 5). An edge detector, which uses no model, drew maps strikingly like some methods', so visual inspection is a poor guide (p. 2). The figure is illustrative.


---
class: stepwise-svg, vcenter

# Three image tasks

.fullw[
<div class="step-1"><object type="image/svg+xml" data="images/tasks.svg" style="width: 92%; display: block; margin: 0 auto; pointer-events: none;" aria-label="Three questions asked of a photo: one label for the photo, a box per object, a label for each pixel"></object></div>

]

.footnote[S. J. D. Prince (2023), sections 10.5.1 to 10.5.3. Illustrative shapes.]

???

**A photo can be asked what it shows, where each object is, or which pixels belong to which object.** Image classification assigns the image to one of a set of classes; object detection finds each object and the box around it; semantic segmentation labels every pixel (Prince, 2023, p. 174). The early detector YOLO starts from a network trained to classify ImageNet, then adapted to detection (Prince, 2023, p. 177): the reuse of slide 23, applied to a new task.

???

**Hands-on 4 tells lions from tigers with a borrowed network; photos carry rights, and photos of people carry legal limits.** The two photos here are openly licensed (CC BY-SA 4.0); the course's own, from the web with no source or licence recorded, stay on the learning platform.

As field facts, not legal advice: since 2 February 2025, the EU AI Act (Regulation (EU) 2024/1689, amended by 2026/1744) bans untargeted scraping of facial images for recognition databases, and emotion inference at work or in education save for medical or safety reasons (Art. 5(1)(e) and (f), Art. 113). Remote biometric identification, recruitment and the creditworthiness of natural persons, the first day's case, are high-risk (Annex III, points 1, 4 and 5(b)), with obligations from 2 December 2027 (Art. 113 as amended).

**The photos are labelled by their file names: a row is one photo, its pixels are its only input, its label the word before the underscore.** Each folder numbers its own photos, so `lion_001.jpg` is a different photo in train and in test. Test holds 38 lions and 19 tigers, so always saying lion scores 67%: "a classifier that always selects the majority class is called a base rate classifier" (Provost & Fawcett, 2013, p. 115, verbatim). Every model is measured against it, at 1.75 points a test photo. Slide 42 checks that the test photos are new.

.footnote[Counted on the course copy. B. Recht et al. (2019), p. 27: copies of training images score 99 to 100%.]

???

**A test photo must be new to the model: 8 copies of training photos were removed from the test set, and 2 wrong labels corrected.** Holdout data "will not be used to build the model" (Provost & Fawcett, 2013, p. 113, verbatim); a copy measures memory instead. On CIFAR-10, most classifiers scored 99% to 100% on test images that nearly duplicated training images (Recht et al., 2019, p. 27). The copies were 8 of 65 inherited test photos, leaving 57; the two relabelled photos were training photos of the other animal. The figure's file names are illustrative.

# 57 test photos

<img class="phase-thumb" src="images/phase-ev.svg" alt="The CRISP-DM phases, evaluation lit" />

.beside-thumb[
<div class="step-1"><object type="image/svg+xml" data="images/interval.svg" style="width: 100%; display: block; margin: 1em auto 0; pointer-events: none;" aria-label="51 of 57 right is 89%, with a 95% interval from 78% to 96%; with 10,000 test photos, about 1 point either way"></object></div>
.step-4.lead.big.center[On 57 test photos, a score is known only roughly.]
]

.footnote[A 95% Clopper-Pearson interval for 51 of 57. B. Recht et al. (2019), p. 3: at most 1% for 10,000 test images.]

???

**On 57 test photos, a score is known only roughly: an observed 89% could be anything from 78% to 96%.** For 51 right of 57, an example, a 95% Clopper-Pearson interval runs from 78% to 96%; with 10,000 test images it is at most 1 point either way (Recht et al., 2019, p. 3). One holdout score may reflect "a single particularly lucky (or unlucky) choice of training and test data" (Provost & Fawcett, 2013, p. 126, verbatim). A gap of one or two photos between groups, 1.75 or 3.5 points, lies well inside that interval.

**EfficientNet B0, pretrained on ImageNet, has seen lions and tigers before Hands-on 4 begins.** It learned from the 1.28 million training images of ImageNet's 2012 challenge, in 1,000 classes (He et al., 2016, section 4.1); 13 of them are felids, lion, tiger and several domestic cats among them (Yosinski et al., 2014, section 2). B0 is the baseline of its family and reads photos of 224 by 224 pixels (Tan & Le, 2019, Table 1). Hands-on 4's task is thus close to the pretraining data, the case of slide 26; a firm's own photos may lie further from it.

# Hands-on 4: lion or tiger

<img class="phase-thumb" src="images/phase-du-mo.svg" alt="The CRISP-DM phases, data understanding to modeling lit" />

.beside-thumb[
.need[**The need.** A firm holds a few dozen labelled photos of each class. Can it borrow a network trained on ImageNet, train only a new head, and follow how the training goes?]

<div class="moves">
<div><b>1. Load</b>The 58 photos into a folder; the label from each file name.<br /><code>+ Dataset → Folder</code>, <code>List Contents</code>, <code>Prepare</code>; sheet step 1</div>
<div><b>2. Train</b>Target <code>label</code>; EfficientNet B0, 0 fine-tuned layers.<br /><code>Lab → Image classification → Design</code>; sheet step 2</div>
<div><b>3. Score</b>The 57 test photos the model has never seen.<br /><code>+ Recipe → Score</code>; sheet step 3</div>
<div><b>4. Look</b>The training curve, the confusion matrix, the wrong photos.<br /><code>Results</code>; sheet steps 2 and 3</div>
</div>

.time[Sheet *Hands-on 4*, panels 1 to 3. Groups of three. 25 minutes.]
]

.footnote[Steps as on the sheet; Dataiku (2024), *Computer vision*.]

???

**In the 25 minutes of the core, each group loads the 58 photos, trains a new head on EfficientNet B0, scores the 57 test photos and reads its errors.** The need is a firm's: a few dozen labelled photos per class, of products or defects, and a network trained on ImageNet to borrow. Only the new head of slide 23 learns; the 57 test photos are holdout data, never used to build the model (Provost & Fawcett, 2013, p. 113). In **Results**, selecting a cell of the confusion matrix shows its photos (Dataiku, 2024).

**In 8 minutes past the checkpoint, groups fine-tune 2 layers, add a larger third class, cats, then decide which model and which score to report.** Panel 4 compares time and score at 0 and 2 fine-tuned layers, the trade-off of slide 25. Panel 5 adds 120 training and 80 test photos from the 885 cats of Natural Images (Roy et al., 2018, p. 2); with uneven classes, "accuracy can be greatly misleading" (Provost & Fawcett, 2013, p. 190, verbatim), so groups read the macro average, every class counted the same, and the weighted one (*Beyond binary classification*, slide 6).

.footnote[Dataiku (2024), *Computer vision*: results, confusion matrix and image feed.]

???

**With 57 test photos, one error is 1.75 points: read each wrong photo before trusting the percentage.** In Dataiku's results, the confusion matrix puts true classes in rows and predictions in columns; selecting a cell shows its photos, and clicking one shows each class's probability (Dataiku, 2024). The matrix exists for "making explicit how one class is being confused for another" (Provost & Fawcett, 2013, p. 189, verbatim). Each wrong photo then gets two questions: is its label right, and is the animal visible, alone and the main subject? Even benchmark test sets carry wrong labels (slide 20).

# Text


.fullw[
<div class="duo big">
<div><b class="k">Learned representations</b>The embeddings of week 2's RAG workshop are short, dense vectors learned by networks from text, as this deck's features were learned from photos.</div>
<div><b class="k">Borrowed, then adapted</b>A language model trained first on a large body of text, then given a new output layer for a task, is transfer learning again.</div>
</div>

.lead.big.center[After the break, the same question for text: which features can a classifier read from words?]
]

.footnote[D. Jurafsky and J. H. Martin (2026 draft), chapters 5 and 9; J. Devlin et al. (2019).]

???

**After the break, the same question for text: which features can a classifier read from words?** The embeddings of week 2's RAG workshop are short, dense vectors of 50 to 1,000 dimensions learned from text, by representation learning (Jurafsky & Martin, 2026, pp. 127 and 136). BERT is pretrained on unlabelled text, then fine-tuned with one additional output layer (Devlin et al., 2019, p. 1): transfer learning again (slide 23). The textbook frames the choice: engineer the data to fit existing tools, or "build new tools to match the data" (Provost & Fawcett, 2013, p. 249, verbatim).
