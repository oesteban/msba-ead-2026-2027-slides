<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- Three ideas on a time axis, 1950 to 2002: Rosenblatt's perceptron (1958; the Mark I Perceptron, U.S. Navy photo, public domain), back-propagation (Rumelhart, Hinton and Williams 1986; G. Hinton by Arthur Petron, CC BY-SA 4.0), LeNet (LeCun et al. 1998; MNIST digits by Josef Steppan, CC BY-SA 4.0). Photos cropped and resized; see images/photos/CREDITS.md. Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<polygon class="accent-fill" points="20,330 962,330 962,318 990,346.0 962,374 962,362 20,362" fill="#00609c"/>
<text x="195.3846153846154" y="352.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">1958</text>
<text x="669.2307692307693" y="352.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">1986</text>
<text x="872.3076923076923" y="352.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">1998</text>
</g>
<g data-step="2">
<image href="photos/perceptron.jpg" x="94.5" y="14" width="211.0" height="200" preserveAspectRatio="xMidYMid slice"/>
<rect x="94.5" y="14" width="211" height="200" rx="0" fill="none" stroke="#c9cfd2" stroke-width="1.2"/>
<text x="200" y="242" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">1958 · The perceptron</text>
<text x="200" y="264" font-size="15" font-weight="normal" text-anchor="middle" fill="#1c2e36">one artificial neuron</text>
<text x="200" y="286" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">learns from examples</text>
<path d="M 200 296 L 195.4 327" fill="none" stroke-dasharray="3 3" stroke="#556268" stroke-width="1.3" marker-end="url(#)"/>
</g>
<g data-step="3">
<image href="photos/hinton.jpg" x="424.5" y="14" width="191.0" height="200" preserveAspectRatio="xMidYMid slice"/>
<rect x="424.5" y="14" width="191" height="200" rx="0" fill="none" stroke="#c9cfd2" stroke-width="1.2"/>
<text x="520" y="242" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">1986 · Back-propagation</text>
<text x="520" y="264" font-size="15" font-weight="normal" text-anchor="middle" fill="#1c2e36">errors sent back through layers</text>
<text x="520" y="286" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">pictured: G. Hinton, a co-author</text>
<path d="M 520 296 L 669.2 327" fill="none" stroke-dasharray="3 3" stroke="#556268" stroke-width="1.3" marker-end="url(#)"/>
</g>
<g data-step="4">
<image href="photos/mnist.png" x="670.0" y="14" width="300.0" height="200" preserveAspectRatio="xMidYMid slice"/>
<rect x="670.0" y="14" width="300" height="200" rx="0" fill="none" stroke="#c9cfd2" stroke-width="1.2"/>
<text x="820" y="242" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">1998 · LeNet</text>
<text x="820" y="264" font-size="15" font-weight="normal" text-anchor="middle" fill="#1c2e36">reads handwritten digits</text>
<text x="820" y="286" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">on bank cheques</text>
<path d="M 820 296 L 872.3 327" fill="none" stroke-dasharray="3 3" stroke="#556268" stroke-width="1.3" marker-end="url(#)"/>
</g>
</svg>
