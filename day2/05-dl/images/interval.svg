<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- An observed 50 of 56 (89%) with its 95% Clopper-Pearson interval, 78% to 96%, against the at most 1 point of 10,000 test images (Recht et al. 2019). Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<line x1="50" y1="140" x2="950" y2="140" stroke="#556268" stroke-width="1.8"/>
<line x1="50.0" y1="132" x2="50.0" y2="148" stroke="#556268" stroke-width="1.6"/>
<line x1="200.0" y1="132" x2="200.0" y2="148" stroke="#556268" stroke-width="1.6"/>
<line x1="350.0" y1="132" x2="350.0" y2="148" stroke="#556268" stroke-width="1.6"/>
<line x1="500.0" y1="132" x2="500.0" y2="148" stroke="#556268" stroke-width="1.6"/>
<line x1="650.0" y1="132" x2="650.0" y2="148" stroke="#556268" stroke-width="1.6"/>
<line x1="800.0" y1="132" x2="800.0" y2="148" stroke="#556268" stroke-width="1.6"/>
<line x1="950.0" y1="132" x2="950.0" y2="148" stroke="#556268" stroke-width="1.6"/>
<text x="50.0" y="178" font-size="20" font-weight="normal" text-anchor="middle" fill="#556268">70%</text>
<text x="200.0" y="178" font-size="20" font-weight="normal" text-anchor="middle" fill="#556268">75%</text>
<text x="350.0" y="178" font-size="20" font-weight="normal" text-anchor="middle" fill="#556268">80%</text>
<text x="500.0" y="178" font-size="20" font-weight="normal" text-anchor="middle" fill="#556268">85%</text>
<text x="650.0" y="178" font-size="20" font-weight="normal" text-anchor="middle" fill="#556268">90%</text>
<text x="800.0" y="178" font-size="20" font-weight="normal" text-anchor="middle" fill="#556268">95%</text>
<text x="950.0" y="178" font-size="20" font-weight="normal" text-anchor="middle" fill="#556268">100%</text>
<circle class="accent-fill" cx="629.0" cy="140" r="14" fill="#00609c"/>
<text x="628.9999999999999" y="104" font-size="24" font-weight="bold" text-anchor="middle" fill="#1c2e36">50 of 56 right: 89%</text>
</g>
<g data-step="2">
<rect class="accent-fill" x="292.99999999999983" y="129" width="537.0000000000002" height="22" rx="11" fill="#00609c" fill-opacity="0.3"/>
<text class="accent-fill" x="292.99999999999983" y="216" font-size="23" font-weight="bold" text-anchor="middle" fill="#00609c">78%</text>
<text class="accent-fill" x="830.0" y="216" font-size="23" font-weight="bold" text-anchor="middle" fill="#00609c">96%</text>
<text class="accent-fill" x="566.0000000000001" y="254" font-size="22" font-weight="normal" text-anchor="middle" fill="#00609c">a 95% interval: the score could be anywhere here</text>
</g>
<g data-step="3">
<rect x="620.0" y="290" width="30.0" height="16" rx="5" fill="#1c2e36"/>
<text x="604.0" y="304" font-size="20" font-weight="normal" text-anchor="end" fill="#1c2e36">with 10,000 test photos: about 1 point either way</text>
</g>
</svg>
