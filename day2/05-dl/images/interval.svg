<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- An observed 51 of 57 (89%) with its 95% Clopper-Pearson interval, 78% to 96%, against the at most 1 point of 10,000 test images (Recht et al. 2019). Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<line x1="60" y1="120" x2="940" y2="120" stroke="#556268" stroke-width="1.4"/>
<line x1="60.0" y1="114" x2="60.0" y2="126" stroke="#556268" stroke-width="1.2"/>
<line x1="206.66666666666666" y1="114" x2="206.66666666666666" y2="126" stroke="#556268" stroke-width="1.2"/>
<line x1="353.3333333333333" y1="114" x2="353.3333333333333" y2="126" stroke="#556268" stroke-width="1.2"/>
<line x1="500.0" y1="114" x2="500.0" y2="126" stroke="#556268" stroke-width="1.2"/>
<line x1="646.6666666666666" y1="114" x2="646.6666666666666" y2="126" stroke="#556268" stroke-width="1.2"/>
<line x1="793.3333333333334" y1="114" x2="793.3333333333334" y2="126" stroke="#556268" stroke-width="1.2"/>
<line x1="940.0" y1="114" x2="940.0" y2="126" stroke="#556268" stroke-width="1.2"/>
<text x="60.0" y="150" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">70%</text>
<text x="206.66666666666666" y="150" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">75%</text>
<text x="353.3333333333333" y="150" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">80%</text>
<text x="500.0" y="150" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">85%</text>
<text x="646.6666666666666" y="150" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">90%</text>
<text x="793.3333333333334" y="150" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">95%</text>
<text x="940.0" y="150" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">100%</text>
<circle class="accent-fill" cx="632.0" cy="120" r="10" fill="#00609c"/>
<text x="632.0" y="92" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">51 of 57 right: 89%</text>
</g>
<g data-step="2">
<rect class="accent-fill" x="309.3333333333333" y="112" width="513.3333333333335" height="16" rx="8" fill="#00609c" fill-opacity="0.3"/>
<text class="accent-fill" x="309.3333333333333" y="182" font-size="17" font-weight="bold" text-anchor="middle" fill="#00609c">78%</text>
<text class="accent-fill" x="822.6666666666667" y="182" font-size="17" font-weight="bold" text-anchor="middle" fill="#00609c">96%</text>
<text class="accent-fill" x="564.5333333333335" y="214" font-size="17" font-weight="normal" text-anchor="middle" fill="#00609c">a 95% interval: the score could be anywhere here</text>
</g>
<g data-step="3">
<rect x="617.3333333333333" y="230" width="29.33333333333337" height="12" rx="4" fill="#1c2e36"/>
<text x="660.6666666666666" y="241" font-size="15" font-weight="normal" text-anchor="start" fill="#1c2e36">with 10,000 test photos: about 1 point either way</text>
</g>
</svg>
