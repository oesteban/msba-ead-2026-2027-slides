<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- Maps of torchvision's ResNet-18 tiger score on the tiger photo, computed by src/vision.py, before and after its last block and output layer are re-initialised at random (after Adebayo et al. 2018): rank correlation 0.255 for the plain gradient, 0.946 for Guided Backprop, over 4 by 4 pixel blocks. Adapted from S. Taheri's photo, edited by Fir0002, CC BY-SA 2.5. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<image href="photos/tiger-224.jpg" x="30" y="130" width="170" height="170"/>
<text x="115.0" y="330" font-size="16" font-weight="normal" text-anchor="middle" fill="#556268">the photo</text>
<text x="335.0" y="26" font-size="17" font-weight="bold" text-anchor="middle" fill="#1c2e36">the trained network</text>
<rect x="250" y="44" width="170" height="170" rx="0" fill="#ffffff"/>
<image href="vision/saliency.png" x="250" y="44" width="170" height="170"/>
<rect x="250" y="44" width="170" height="170" rx="0" fill="none" stroke="#c9cfd2" stroke-width="1.4"/>
<rect x="250" y="230" width="170" height="170" rx="0" fill="#ffffff"/>
<image href="vision/guided.png" x="250" y="230" width="170" height="170"/>
<rect x="250" y="230" width="170" height="170" rx="0" fill="none" stroke="#c9cfd2" stroke-width="1.4"/>
</g>
<g data-step="2">
<text x="555.0" y="26" font-size="17" font-weight="bold" text-anchor="middle" fill="#da232f">top layers scrambled</text>
<rect x="470" y="44" width="170" height="170" rx="0" fill="#ffffff"/>
<image href="vision/saliency-random.png" x="470" y="44" width="170" height="170"/>
<rect x="470" y="44" width="170" height="170" rx="0" fill="none" stroke="#c9cfd2" stroke-width="1.4"/>
<rect x="470" y="230" width="170" height="170" rx="0" fill="#ffffff"/>
<image href="vision/guided-random.png" x="470" y="230" width="170" height="170"/>
<rect x="470" y="230" width="170" height="170" rx="0" fill="none" stroke="#c9cfd2" stroke-width="1.4"/>
</g>
<g data-step="3">
<text x="670" y="121.0" font-size="18" font-weight="bold" text-anchor="start" fill="#1c2e36">plain gradient</text>
<text class="accent-fill" x="670" y="147.0" font-size="16" font-weight="normal" text-anchor="start" fill="#00609c">changes: the map follows the model</text>
<text x="670" y="285.0" font-size="14" font-weight="normal" text-anchor="start" fill="#556268">that passes back only positive signals</text>
<text x="670" y="255.0" font-size="18" font-weight="bold" text-anchor="start" fill="#1c2e36">Guided Backprop: a gradient</text>
<text x="670" y="333.0" font-size="16" font-weight="normal" text-anchor="start" fill="#da232f">barely changes: the map ignores the model</text>
</g>
</svg>
