<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- Data augmentation: one abstract training image flipped, cropped (Dataiku's default minimum kept ratio, 0.75) and recoloured; the label does not change. Illustrative. Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<clipPath id="clipc"><rect x="525" y="20" width="170" height="150" rx="6"/></clipPath>
<g data-step="1">
<rect x="25" y="20" width="170" height="150" rx="6" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<g transform="translate(110,100) scale(1.0,1.0)"><polygon class="accent-a-light-fill" points="-50,40 -10,-40 50,40" fill="#8cb3cf"/><circle cx="18" cy="-18" r="14" fill="#1c2e36"/></g>
<text x="110" y="200" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">a training photo</text>
</g>
<g data-step="2">
<line class="accent-stroke" x1="205" y1="95" x2="270" y2="95" stroke="#00609c" stroke-width="2.4" marker-end="url(#ahA)"/>
<rect x="285" y="20" width="170" height="150" rx="6" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<g transform="translate(370,100) scale(-1.0,1.0)"><polygon class="accent-a-light-fill" points="-50,40 -10,-40 50,40" fill="#8cb3cf"/><circle cx="18" cy="-18" r="14" fill="#1c2e36"/></g>
<text x="370" y="200" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">flipped</text>
<text x="370" y="224" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">left to right</text>
<rect x="525" y="20" width="170" height="150" rx="6" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<g clip-path="url(#clipc)"><g transform="translate(630,110) scale(1.45,1.45)"><polygon class="accent-a-light-fill" points="-50,40 -10,-40 50,40" fill="#8cb3cf"/><circle cx="18" cy="-18" r="14" fill="#1c2e36"/></g></g>
<text x="610" y="200" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">cropped</text>
<text x="610" y="224" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">75% of it kept, or more</text>
<rect x="765" y="20" width="170" height="150" rx="6" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<g transform="translate(850,100) scale(1.0,1.0)"><polygon class="" points="-50,40 -10,-40 50,40" fill="#f0c46a"/><circle cx="18" cy="-18" r="14" fill="#1c2e36"/></g>
<text x="850" y="200" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">recoloured</text>
<text x="850" y="224" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">hue, contrast, brightness</text>
</g>
</svg>
