<text x="500" y="82" font-size="17" font-weight="normal" text-anchor="middle" fill="#1c2e36">“The wine was excellent.”</text>
<text x="500" y="108" font-size="14" font-weight="normal" text-anchor="middle" fill="#556268">label: positive</text>
<line class="accent-stroke" x1="500" y1="140" x2="500" y2="184" stroke="#00609c" stroke-width="2.2" marker-end="url(#ahA)"/>
<text class="accent-fill" x="512" y="168" font-size="15" font-weight="normal" text-anchor="start" fill="#00609c">a synonym</text>
<rect x="360.0" y="190" width="280" height="96" rx="6" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="500" y="232" font-size="17" font-weight="normal" text-anchor="middle" fill="#1c2e36">“The wine was superb.”</text>
<text x="500" y="258" font-size="14" font-weight="normal" text-anchor="middle" fill="#556268">label: positive</text>
</g>
