<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- Data augmentation on three kinds of input: an image flipped, a sentence with a synonym, a sound with a frequency band attenuated; the label does not change (Prince 2023, sections 9.3.6 and 9.3.8). Drawn; illustrative. Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<text x="170" y="26" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">a photo</text>
<rect x="30.0" y="40" width="280" height="96" rx="6" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<g transform="translate(170,88) scale(0.55,0.55)"><polygon class="accent-a-light-fill" points="-50,40 -10,-40 50,40" fill="#8cb3cf"/><circle cx="18" cy="-18" r="14" fill="#1c2e36"/></g>
<line class="accent-stroke" x1="170" y1="140" x2="170" y2="184" stroke="#00609c" stroke-width="2.2" marker-end="url(#ahA)"/>
<text class="accent-fill" x="182" y="168" font-size="15" font-weight="normal" text-anchor="start" fill="#00609c">flipped</text>
<rect x="30.0" y="190" width="280" height="96" rx="6" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<g transform="translate(170,238) scale(-0.55,0.55)"><polygon class="accent-a-light-fill" points="-50,40 -10,-40 50,40" fill="#8cb3cf"/><circle cx="18" cy="-18" r="14" fill="#1c2e36"/></g>
</g>
<g data-step="2">
<text x="500" y="26" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">a sentence</text>
