<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- Data augmentation on three kinds of input: the tiger photo of the photo slides flipped (S. Taheri, edited by Fir0002, CC BY-SA 2.5), a sentence with a synonym, a sound with a frequency band attenuated; the label does not change (Prince 2023, sections 9.3.6 and 9.3.8). The sentence and the wave are drawn. Adapted, CC BY-SA 2.5. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<text x="170" y="26" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">a photo</text>
<rect x="30.0" y="40" width="280" height="120" rx="6" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<image href="photos/tiger-224.jpg" x="88" y="48" width="104" height="104"/>
<text x="204" y="96" font-size="14" font-weight="normal" text-anchor="start" fill="#556268">label:</text>
<text x="204" y="116" font-size="14" font-weight="normal" text-anchor="start" fill="#556268">tiger</text>
<line class="accent-stroke" x1="170" y1="164" x2="170" y2="204" stroke="#00609c" stroke-width="2.2" marker-end="url(#ahA)"/>
<text class="accent-fill" x="182" y="190" font-size="15" font-weight="normal" text-anchor="start" fill="#00609c">flipped</text>
<rect x="30.0" y="210" width="280" height="120" rx="6" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<g transform="translate(280,0) scale(-1,1)"><image href="photos/tiger-224.jpg" x="88" y="218" width="104" height="104"/></g>
<text x="204" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#556268">label:</text>
<text x="204" y="286" font-size="14" font-weight="normal" text-anchor="start" fill="#556268">tiger</text>
</g>
<g data-step="2">
<text x="500" y="26" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">a sentence</text>
<rect x="360.0" y="40" width="280" height="120" rx="6" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="500" y="92" font-size="17" font-weight="normal" text-anchor="middle" fill="#1c2e36">“The wine was excellent.”</text>
<text x="500" y="120" font-size="14" font-weight="normal" text-anchor="middle" fill="#556268">label: positive</text>
<line class="accent-stroke" x1="500" y1="164" x2="500" y2="204" stroke="#00609c" stroke-width="2.2" marker-end="url(#ahA)"/>
<text class="accent-fill" x="512" y="190" font-size="15" font-weight="normal" text-anchor="start" fill="#00609c">a synonym</text>
<rect x="360.0" y="210" width="280" height="120" rx="6" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="500" y="262" font-size="17" font-weight="normal" text-anchor="middle" fill="#1c2e36">“The wine was superb.”</text>
<text x="500" y="290" font-size="14" font-weight="normal" text-anchor="middle" fill="#556268">label: positive</text>
</g>
