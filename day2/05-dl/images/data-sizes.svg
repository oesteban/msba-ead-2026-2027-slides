<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- Training-set sizes, log scale: MNIST 60000 handwritten digits (LeCun et al. 1998, p. 10); ImageNet 1.28e+06 labelled photos (He et al. 2016, p. 4); BERT 3.3e+09 words of books and Wikipedia (Devlin et al. 2019, p. 13); GPT-3 3e+11 tokens of text (Brown et al. 2020, p. 8); CLIP 4e+08 photos with their captions (Radford et al. 2021, p. 1). Units differ: digits, photos, words, tokens, image and caption pairs. Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<line x1="210" y1="318" x2="740" y2="318" stroke="#556268" stroke-width="1.3"/>
<line x1="210.0" y1="312" x2="210.0" y2="324" stroke="#556268" stroke-width="1.2"/>
<text x="210.0" y="344" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">10<tspan baseline-shift='super' font-size='11'>4</tspan></text>
<line x1="342.5" y1="312" x2="342.5" y2="324" stroke="#556268" stroke-width="1.2"/>
<text x="342.5" y="344" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">10<tspan baseline-shift='super' font-size='11'>6</tspan></text>
<line x1="475.0" y1="312" x2="475.0" y2="324" stroke="#556268" stroke-width="1.2"/>
<text x="475.0" y="344" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">10<tspan baseline-shift='super' font-size='11'>8</tspan></text>
<line x1="607.5" y1="312" x2="607.5" y2="324" stroke="#556268" stroke-width="1.2"/>
<text x="607.5" y="344" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">10<tspan baseline-shift='super' font-size='11'>10</tspan></text>
<line x1="740.0" y1="312" x2="740.0" y2="324" stroke="#556268" stroke-width="1.2"/>
<text x="740.0" y="344" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">10<tspan baseline-shift='super' font-size='11'>12</tspan></text>
<text x="740" y="300" font-size="14" font-weight="normal" text-anchor="end" fill="#556268">training examples, log scale</text>
<text x="196" y="44" font-size="16" font-weight="bold" text-anchor="end" fill="#1c2e36">1998 · MNIST</text>
<rect class="accent-fill" x="210" y="26" width="51.552520337916405" height="28" rx="3" fill="#00609c"/>
<text x="271.5525203379164" y="46" font-size="15" font-weight="normal" text-anchor="start" fill="#1c2e36">60,000 handwritten digits</text>
<text x="196" y="100" font-size="16" font-weight="bold" text-anchor="end" fill="#1c2e36">2012 · ImageNet</text>
<rect class="accent-fill" x="210" y="82" width="139.60266048917129" height="28" rx="3" fill="#00609c"/>
<text x="359.6026604891713" y="102" font-size="15" font-weight="normal" text-anchor="start" fill="#1c2e36">1.28 million labelled photos</text>
</g>
<g data-step="2">
<text x="196" y="156" font-size="16" font-weight="bold" text-anchor="end" fill="#1c2e36">2018 · BERT</text>
<rect class="accent-a-light-fill" x="210" y="138" width="365.60154851691004" height="28" rx="3" fill="#8cb3cf"/>
<text x="585.60154851691" y="158" font-size="15" font-weight="normal" text-anchor="start" fill="#1c2e36">3.3 billion words of books and Wikipedia</text>
<text x="196" y="212" font-size="16" font-weight="bold" text-anchor="end" fill="#1c2e36">2020 · GPT-3</text>
<rect class="accent-a-light-fill" x="210" y="194" width="495.3592831251776" height="28" rx="3" fill="#8cb3cf"/>
<text x="715.3592831251776" y="214" font-size="15" font-weight="normal" text-anchor="start" fill="#1c2e36">300 billion tokens of text</text>
<text x="196" y="268" font-size="16" font-weight="bold" text-anchor="end" fill="#1c2e36">2021 · CLIP</text>
<rect class="accent-a-light-fill" x="210" y="250" width="304.88647442547745" height="28" rx="3" fill="#8cb3cf"/>
<text x="524.8864744254774" y="270" font-size="15" font-weight="normal" text-anchor="start" fill="#1c2e36">400 million photos with their captions</text>
</g>
</svg>
