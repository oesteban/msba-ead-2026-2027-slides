<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- One unit with illustrative inputs [0.2, 0.9, 0.5], weights [1.5, -0.8, 2.0] and bias -0.3: weighted sum 0.28, logistic squash 0.57 (Provost and Fawcett 2013, pp. 106 to 108). Illustrative. Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<circle class="accent-stroke" cx="110" cy="70" r="30" fill="#ffffff" stroke="#00609c" stroke-width="2"/>
<text x="110" y="77" font-size="19" font-weight="bold" text-anchor="middle" fill="#1c2e36">0.2</text>
<line x1="142" y1="70" x2="416" y2="170" stroke="#c9cfd2" stroke-width="2"/>
<text class="accent-fill" x="214" y="87.0" font-size="17" font-weight="bold" text-anchor="middle" fill="#00609c">× +1.5</text>
<circle class="accent-stroke" cx="110" cy="170" r="30" fill="#ffffff" stroke="#00609c" stroke-width="2"/>
<text x="110" y="177" font-size="19" font-weight="bold" text-anchor="middle" fill="#1c2e36">0.9</text>
<line x1="142" y1="170" x2="416" y2="170" stroke="#c9cfd2" stroke-width="2"/>
<text class="accent-fill" x="214" y="161.0" font-size="17" font-weight="bold" text-anchor="middle" fill="#00609c">× −0.8</text>
<circle class="accent-stroke" cx="110" cy="270" r="30" fill="#ffffff" stroke="#00609c" stroke-width="2"/>
<text x="110" y="277" font-size="19" font-weight="bold" text-anchor="middle" fill="#1c2e36">0.5</text>
<line x1="142" y1="270" x2="416" y2="170" stroke="#c9cfd2" stroke-width="2"/>
<text class="accent-fill" x="214" y="235.0" font-size="17" font-weight="bold" text-anchor="middle" fill="#00609c">× +2.0</text>
<text x="110" y="30" font-size="16" font-weight="normal" text-anchor="middle" fill="#556268">three pixel values</text>
</g>
<g data-step="2">
<rect class="accent-stroke" x="420" y="120" width="190" height="100" rx="8" fill="#ffffff" stroke="#00609c" stroke-width="1.6"/>
<text x="515" y="155" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">weighted sum</text>
<text x="515" y="180" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">plus a bias (−0.3)</text>
<text x="515" y="207" font-size="19" font-weight="bold" text-anchor="middle" fill="#1c2e36">= 0.28</text>
</g>
<g data-step="3">
<line x1="612" y1="170" x2="676" y2="170" stroke="#1c2e36" stroke-width="1.8" marker-end="url(#ah)"/>
<rect class="accent-stroke" x="690" y="120" width="176" height="100" rx="8" fill="#ffffff" stroke="#00609c" stroke-width="1.6"/>
<polyline points="700.0,209.8 713.0,209.5 726.0,208.6 739.0,206.2 752.0,200.5 765.0,188.5 778.0,170.0 791.0,151.5 804.0,139.5 817.0,133.8 830.0,131.4 843.0,130.5 856.0,130.2" fill="none" stroke="#00609c" class="accent-stroke" stroke-width="3"/>
<text x="778" y="246" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">a squash: 0 to 1</text>
<line x1="868" y1="170" x2="912" y2="170" stroke="#1c2e36" stroke-width="1.8" marker-end="url(#ah)"/>
<text class="accent-fill" x="950" y="178" font-size="26" font-weight="bold" text-anchor="middle" fill="#00609c">0.57</text>
</g>
<g data-step="4">
<text class="accent-fill" x="520" y="330" font-size="19" font-weight="bold" text-anchor="middle" fill="#00609c">the logistic regression of the first day</text>
</g>
</svg>
