<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- Three questions asked of a photo: classification (a label), detection (boxes) and segmentation (a label for each pixel); after Prince (2023), section 10.5. Illustrative shapes. Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<rect x="20" y="20" width="290" height="200" rx="6" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<rect x="239" y="130" width="12" height="44" fill="#9aa4a8"/><circle cx="245" cy="112" r="30" fill="#9aa4a8" fill-opacity="0.55"/>
<g transform="translate(130,140) scale(0.95,0.95)"><polygon class="accent-a-light-fill" points="-50,40 -10,-40 50,40" fill="#8cb3cf"/><circle cx="18" cy="-18" r="14" fill="#1c2e36"/></g>
<rect class="accent-a-light-fill accent-stroke" x="95" y="232" width="140" height="34" rx="17" fill="#8cb3cf" stroke="#00609c" stroke-width="1.6"/>
<text x="165" y="255" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">tiger</text>
<text x="165" y="300" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">What? One label per photo</text>
</g>
<g data-step="2">
<rect x="355" y="20" width="290" height="200" rx="6" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<rect x="574" y="130" width="12" height="44" fill="#9aa4a8"/><circle cx="580" cy="112" r="30" fill="#9aa4a8" fill-opacity="0.55"/>
<g transform="translate(465,140) scale(0.95,0.95)"><polygon class="accent-a-light-fill" points="-50,40 -10,-40 50,40" fill="#8cb3cf"/><circle cx="18" cy="-18" r="14" fill="#1c2e36"/></g>
<rect class="accent-stroke" x="405" y="82" width="128" height="104" rx="2" fill="none" stroke="#00609c" stroke-width="3"/>
<text class="accent-fill" x="410" y="76" font-size="15" font-weight="bold" text-anchor="start" fill="#00609c">tiger</text>
<rect x="545" y="72" width="72" height="108" rx="2" fill="none" stroke="#9aa4a8" stroke-width="3"/>
<text x="550" y="66" font-size="15" font-weight="bold" text-anchor="start" fill="#9aa4a8">tree</text>
<text x="500" y="300" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">Where? A box per object</text>
</g>
<g data-step="3">
<rect x="690" y="20" width="290" height="200" rx="6" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<rect x="909" y="130" width="12" height="44" fill="#25bcca"/><circle cx="915" cy="112" r="30" fill="#25bcca" fill-opacity="0.55"/>
<g transform="translate(800,140) scale(0.95,0.95)"><polygon class="accent-fill" points="-50,40 -10,-40 50,40" fill="#00609c"/><circle cx="18" cy="-18" r="14" fill="#1c2e36"/></g>
<text x="835" y="300" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">Which pixels? A label for each pixel</text>
</g>
</svg>
