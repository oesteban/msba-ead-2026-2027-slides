<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- Three questions asked of one tiger photo (Charles J. Sharp, CC BY-SA 4.0): classification, detection and segmentation (Prince 2023, section 10.5). Computed by src/vision.py: the label by torchvision's ResNet-18 (tiger, 0.878), the box and the mask by a Mask R-CNN trained on COCO, whose classes hold no tiger (it said zebra). Adapted, CC BY-SA 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<image href="photos/tiger-2.jpg" x="16" y="20" width="296" height="197"/>
<rect x="16" y="20" width="296" height="197" rx="0" fill="none" stroke="#c9cfd2" stroke-width="1.2"/>
<rect class="accent-a-light-fill accent-stroke" x="94.0" y="232" width="140" height="34" rx="17" fill="#8cb3cf" stroke="#00609c" stroke-width="1.6"/>
<text x="164.0" y="255" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">tiger</text>
<text x="164.0" y="304" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">What? One label per photo</text>
</g>
<g data-step="2">
<image href="photos/tiger-2.jpg" x="352" y="20" width="296" height="197"/>
<rect x="352" y="20" width="296" height="197" rx="0" fill="none" stroke="#c9cfd2" stroke-width="1.2"/>
<rect x="419.118" y="89.14066666666668" width="188.6506666666667" height="95.21333333333332" rx="0" fill="none" stroke="#ffffff" stroke-width="6"/>
<rect class="accent-stroke" x="419.118" y="89.14066666666668" width="188.6506666666667" height="95.21333333333332" rx="0" fill="none" stroke="#00609c" stroke-width="3"/>
<text x="500.0" y="304" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">Where? A box per object</text>
</g>
<g data-step="3">
<image href="photos/tiger-2.jpg" x="688" y="20" width="296" height="197"/>
<rect x="688" y="20" width="296" height="197" rx="0" fill="none" stroke="#c9cfd2" stroke-width="1.2"/>
<image href="vision/tiger-mask.png" x="688" y="20" width="296" height="197"/>
<text x="836.0" y="304" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">Which pixels? One label per pixel</text>
</g>
</svg>
