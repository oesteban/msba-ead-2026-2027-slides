<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- A stack of linear layers is one linear function, so each neuron applies a function after its sum: the logistic sigmoid, which saturates, and the rectified linear unit, whose derivative is 1 above zero (Prince 2023, pp. 25, 35, 37 and 38). Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
