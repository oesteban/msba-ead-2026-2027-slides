<text x="500" y="36" font-size="20" font-weight="bold" text-anchor="middle" fill="#1c2e36">two layers with no function:  0.5 × (2x + 1)  =  x + 0.5</text>
<text x="500" y="62" font-size="17" font-weight="normal" text-anchor="middle" fill="#556268">still one weighted sum: a straight line</text>
