<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- A drawing, not a capture, of Dataiku DSS's Design, Training panel for image classification, labels as in the previous teacher's 2025 captures of the course server; to be checked on DSS 15.0. Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<rect x="20" y="20" width="230" height="290" rx="4" fill="#f4f6f7" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="44" y="60" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">Target</text>
<text x="44" y="106" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">Train / Test set</text>
<rect class="accent-a-light-fill" x="20" y="128" width="230" height="38" rx="0" fill="#8cb3cf"/>
<rect class="accent-fill" x="20" y="128" width="6" height="38" rx="0" fill="#00609c"/>
<text x="44" y="152" font-size="17" font-weight="bold" text-anchor="start" fill="#1c2e36">Training</text>
<text x="44" y="198" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">Metrics</text>
<text x="44" y="244" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">Data augmentation</text>
<rect x="270" y="20" width="710" height="290" rx="4" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="296" y="58" font-size="19" font-weight="bold" text-anchor="start" fill="#1c2e36">Model</text>
<text x="296" y="112" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">Pretrained model</text>
<rect x="560" y="88" width="330" height="38" rx="4" fill="#ffffff" stroke="#9aa4a8" stroke-width="1.6"/>
<text x="576" y="113" font-size="17" font-weight="bold" text-anchor="start" fill="#1c2e36">EfficientNet B0</text>
<text x="872" y="113" font-size="17" font-weight="normal" text-anchor="middle" fill="#556268">▾</text>
</g>
<g data-step="2">
<text x="296" y="178" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">Number of fine-tuned layers</text>
<rect class="accent-stroke" x="560" y="154" width="90" height="38" rx="4" fill="#ffffff" stroke="#00609c" stroke-width="2.4"/>
<text x="605" y="180" font-size="19" font-weight="bold" text-anchor="middle" fill="#1c2e36">0</text>
</g>
<g data-step="3">
<text x="296" y="246" font-size="16" font-weight="normal" text-anchor="start" fill="#556268" font-style="italic">The last layer is trained from scratch: with 0, it is the only one that learns.</text>
</g>
</svg>
