<text x="432" y="152" font-size="13" font-weight="normal" text-anchor="middle" fill="#556268">label from the name</text>
<text class="accent-fill" x="20" y="30" font-size="15" font-weight="bold" text-anchor="start" fill="#00609c">steps 1 and 2</text>
