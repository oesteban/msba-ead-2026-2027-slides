<svg xmlns="http://www.w3.org/2000/svg" viewBox="55 0 850 330" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- The inherited photo sets before cleaning: a test photo byte-identical to a training photo (8 of 65) and a mislabelled photo (2), as counted on the course copy. File names illustrative. Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<text x="200" y="32" font-size="19" font-weight="bold" text-anchor="middle" fill="#1c2e36">training photos</text>
<text x="760" y="32" font-size="19" font-weight="bold" text-anchor="middle" fill="#1c2e36">test photos</text>
<rect x="70" y="56" width="120" height="54" rx="6" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="130" y="89" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">lion_007</text>
<rect x="210" y="56" width="120" height="54" rx="6" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="270" y="89" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">tiger_012</text>
<rect x="70" y="130" width="120" height="54" rx="6" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="130" y="163" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">lion_017</text>
<rect x="210" y="130" width="120" height="54" rx="6" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="270" y="163" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">tiger_020</text>
<rect x="630" y="56" width="120" height="54" rx="6" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="690" y="89" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">tiger_003</text>
<rect x="770" y="56" width="120" height="54" rx="6" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="830" y="89" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">lion_031</text>
<rect x="630" y="130" width="120" height="54" rx="6" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="690" y="163" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">lion_017</text>
<rect x="770" y="130" width="120" height="54" rx="6" fill="#ffffff" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="830" y="163" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">tiger_009</text>
</g>
<g data-step="2">
<rect x="210" y="130" width="120" height="54" rx="6" fill="none" stroke="#da232f" stroke-width="3"/>
<rect x="630" y="130" width="120" height="54" rx="6" fill="none" stroke="#da232f" stroke-width="3"/>
<path d="M 330 157 C 450 230, 520 230, 630 157" fill="none" stroke="#da232f" stroke-width="2.2"/>
<text x="480" y="232" font-size="17" font-weight="bold" text-anchor="middle" fill="#da232f">the same photo in both sets: 8 of the 65</text>
<text x="480" y="254" font-size="16" font-weight="normal" text-anchor="middle" fill="#da232f">test photos were copies of training photos</text>
</g>
<g data-step="3">
<rect x="140" y="236" width="120" height="54" rx="6" fill="#fdecee" stroke="#da232f" stroke-width="1.6"/>
<text x="200" y="269" font-size="16" font-weight="normal" text-anchor="middle" fill="#da232f">labelled lion</text>
<text x="200" y="312" font-size="16" font-weight="bold" text-anchor="middle" fill="#da232f">shows a tiger: 2 such labels</text>
