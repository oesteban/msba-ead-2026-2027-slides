<svg xmlns="http://www.w3.org/2000/svg" viewBox="130 0 740 310" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- A gradient saliency map (Simonyan et al. 2014) of torchvision's ResNet-18 tiger score on the tiger photo (S. Taheri, edited by Fir0002, CC BY-SA 2.5), computed by src/vision.py: the largest absolute gradient over the colour channels, averaged over 4 by 4 pixel blocks. Adapted, CC BY-SA 2.5. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<image href="photos/tiger-224.jpg" x="160" y="20" width="230" height="230"/>
<rect x="160" y="20" width="230" height="230" rx="0" fill="none" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="275.0" y="280" font-size="17" font-weight="bold" text-anchor="middle" fill="#1c2e36">the network says tiger, 0.68</text>
</g>
<g data-step="2">
<line class="accent-stroke" x1="400" y1="135" x2="600" y2="135" stroke="#00609c" stroke-width="2.4" marker-end="url(#ahA)"/>
<rect x="610" y="20" width="230" height="230" rx="0" fill="#ffffff"/>
<image href="vision/saliency.png" x="610" y="20" width="230" height="230"/>
<rect x="610" y="20" width="230" height="230" rx="0" fill="none" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="725.0" y="280" font-size="17" font-weight="bold" text-anchor="middle" fill="#1c2e36">its map: where the tiger score</text>
<text x="725.0" y="302" font-size="17" font-weight="bold" text-anchor="middle" fill="#1c2e36">reacts most to a change</text>
</g>
</svg>
