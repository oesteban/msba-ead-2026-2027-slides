<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- The training loop of stochastic gradient descent: forward pass on a batch, loss, backward pass, update, repeated batch after batch (Prince 2023, sections 6.2 and 7.2; Zhang et al. 2023, section 3.4). Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<rect class="accent-stroke" x="30" y="60" width="200" height="120" rx="8" fill="#ffffff" stroke="#00609c" stroke-width="1.6"/>
<text x="130" y="98" font-size="20" font-weight="bold" text-anchor="middle" fill="#1c2e36">1 · forward</text>
<text x="130" y="132" font-size="16" font-weight="normal" text-anchor="middle" fill="#556268">a batch of examples</text>
<text x="130" y="154" font-size="16" font-weight="normal" text-anchor="middle" fill="#556268">to the scores</text>
</g>
<g data-step="2">
<line x1="232" y1="120" x2="271" y2="120" stroke="#1c2e36" stroke-width="2" marker-end="url(#ah)"/>
<rect class="accent-stroke" x="275" y="60" width="200" height="120" rx="8" fill="#ffffff" stroke="#00609c" stroke-width="1.6"/>
<text x="375" y="98" font-size="20" font-weight="bold" text-anchor="middle" fill="#1c2e36">2 · loss</text>
<text x="375" y="132" font-size="16" font-weight="normal" text-anchor="middle" fill="#556268">how wrong</text>
<text x="375" y="154" font-size="16" font-weight="normal" text-anchor="middle" fill="#556268">the batch is</text>
</g>
<g data-step="3">
<line x1="477" y1="120" x2="516" y2="120" stroke="#1c2e36" stroke-width="2" marker-end="url(#ah)"/>
<rect class="accent-stroke" x="520" y="60" width="200" height="120" rx="8" fill="#ffffff" stroke="#00609c" stroke-width="1.6"/>
<text x="620" y="98" font-size="20" font-weight="bold" text-anchor="middle" fill="#1c2e36">3 · backward</text>
<text x="620" y="132" font-size="16" font-weight="normal" text-anchor="middle" fill="#556268">each weight's</text>
<text x="620" y="154" font-size="16" font-weight="normal" text-anchor="middle" fill="#556268">gradient</text>
</g>
<g data-step="4">
<line x1="722" y1="120" x2="761" y2="120" stroke="#1c2e36" stroke-width="2" marker-end="url(#ah)"/>
<rect class="accent-a-light-fill accent-stroke" x="765" y="60" width="200" height="120" rx="8" fill="#8cb3cf" stroke="#00609c" stroke-width="1.6"/>
<text x="865" y="98" font-size="20" font-weight="bold" text-anchor="middle" fill="#1c2e36">4 · update</text>
<text x="865" y="132" font-size="16" font-weight="normal" text-anchor="middle" fill="#556268">every weight moves</text>
<text x="865" y="154" font-size="16" font-weight="normal" text-anchor="middle" fill="#556268">a small step</text>
</g>
<g data-step="5">
<path class="accent-stroke" d="M 865 184 L 865 240 L 130 240 L 130 186" fill="none" stroke="#00609c" stroke-width="2.6" marker-end="url(#ahA)"/>
<text class="accent-fill" x="497" y="272" font-size="17" font-weight="bold" text-anchor="middle" fill="#00609c">then the next batch, until every example has been used</text>
</g>
</svg>
