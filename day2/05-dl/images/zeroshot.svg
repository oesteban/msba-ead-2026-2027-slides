<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- Zero-shot classification as in CLIP (Radford et al. 2021): an image encoder and a text encoder map the photo and each class name to vectors, and the closest name wins. Illustrative values. Oscar Esteban, CC BY 4.0. -->
<defs>
