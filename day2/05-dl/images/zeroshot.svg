<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- Zero-shot: a pretrained model given only a natural-language description of the task (Brown et al. 2020, p. 7); CLIP does the same for images from the class names (Radford et al. 2021, p. 6). The review is invented. Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<rect x="30" y="40" width="430" height="190" rx="10" fill="#f4f6f7" stroke="#c9cfd2" stroke-width="1.6"/>
<text x="50" y="76" font-size="17" font-weight="bold" text-anchor="start" fill="#1c2e36">Is this review positive or negative?</text>
<text x="50" y="120" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">“The bottle arrived broken, and</text>
<text x="50" y="146" font-size="17" font-weight="normal" text-anchor="start" fill="#1c2e36">what was left tasted of cork.”</text>
<text x="50" y="200" font-size="15" font-weight="normal" text-anchor="start" fill="#556268">the task, in words; no labelled example</text>
</g>
<g data-step="2">
<line x1="466" y1="135" x2="540" y2="135" stroke="#1c2e36" stroke-width="2" marker-end="url(#ah)"/>
<rect class="accent-stroke" x="546" y="85" width="190" height="100" rx="8" fill="#ffffff" stroke="#00609c" stroke-width="1.6"/>
<text x="641" y="128" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">a pretrained</text>
<text x="641" y="152" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2e36">language model</text>
<text x="641" y="212" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">no weight changes</text>
</g>
<g data-step="3">
<line x1="742" y1="135" x2="800" y2="135" stroke="#1c2e36" stroke-width="2" marker-end="url(#ah)"/>
<rect class="accent-a-light-fill accent-stroke" x="806" y="105" width="160" height="60" rx="30" fill="#8cb3cf" stroke="#00609c" stroke-width="1.6"/>
<text x="886" y="142" font-size="20" font-weight="bold" text-anchor="middle" fill="#1c2e36">negative</text>
</g>
<g data-step="4">
<text x="500" y="292" font-size="16" font-weight="normal" text-anchor="middle" fill="#556268">for photos, CLIP compares a photo with the class names written as text</text>
</g>
</svg>
