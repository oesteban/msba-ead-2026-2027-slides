<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- One 3 by 3 filter applied at three places of the 224 by 224 tiger photo (S. Taheri, edited by Fir0002, CC BY-SA 2.5): the same weights at every position; a plain layer from a 224 × 224 colour photo to as many neurons needs over 22 billion weights (Prince 2023, pp. 161, 163 and 170). Window places drawn by hand. Adapted, CC BY-SA 2.5. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<image href="photos/tiger-224.jpg" x="30" y="20" width="313.59999999999997" height="313.59999999999997"/>
</g>
<g data-step="2">
<text class="accent-fill" x="474.0" y="92" font-size="17" font-weight="bold" text-anchor="middle" fill="#00609c">one filter: 9 weights</text>
<rect class="accent-a-light-fill accent-stroke" x="420" y="110" width="36" height="36" rx="0" fill="#8cb3cf" stroke="#00609c" stroke-width="1.6"/>
<rect class="accent-a-light-fill accent-stroke" x="420" y="146" width="36" height="36" rx="0" fill="#8cb3cf" stroke="#00609c" stroke-width="1.6"/>
<rect class="accent-a-light-fill accent-stroke" x="420" y="182" width="36" height="36" rx="0" fill="#8cb3cf" stroke="#00609c" stroke-width="1.6"/>
<rect class="accent-a-light-fill accent-stroke" x="456" y="110" width="36" height="36" rx="0" fill="#8cb3cf" stroke="#00609c" stroke-width="1.6"/>
<rect class="accent-a-light-fill accent-stroke" x="456" y="146" width="36" height="36" rx="0" fill="#8cb3cf" stroke="#00609c" stroke-width="1.6"/>
<rect class="accent-a-light-fill accent-stroke" x="456" y="182" width="36" height="36" rx="0" fill="#8cb3cf" stroke="#00609c" stroke-width="1.6"/>
<rect class="accent-a-light-fill accent-stroke" x="492" y="110" width="36" height="36" rx="0" fill="#8cb3cf" stroke="#00609c" stroke-width="1.6"/>
<rect class="accent-a-light-fill accent-stroke" x="492" y="146" width="36" height="36" rx="0" fill="#8cb3cf" stroke="#00609c" stroke-width="1.6"/>
<rect class="accent-a-light-fill accent-stroke" x="492" y="182" width="36" height="36" rx="0" fill="#8cb3cf" stroke="#00609c" stroke-width="1.6"/>
<rect x="114.0" y="76.0" width="30.799999999999997" height="30.799999999999997" rx="0" fill="none" stroke="#ffffff" stroke-width="5"/>
<rect class="accent-stroke" x="114.0" y="76.0" width="30.799999999999997" height="30.799999999999997" rx="0" fill="none" stroke="#00609c" stroke-width="3"/>
<line class="accent-stroke" x1="148.8" y1="91.4" x2="414" y2="164.0" stroke="#00609c" stroke-width="1.6" stroke-dasharray="5 4"/>
<rect x="212.0" y="154.39999999999998" width="30.799999999999997" height="30.799999999999997" rx="0" fill="none" stroke="#ffffff" stroke-width="5"/>
<rect class="accent-stroke" x="212.0" y="154.39999999999998" width="30.799999999999997" height="30.799999999999997" rx="0" fill="none" stroke="#00609c" stroke-width="3"/>
<line class="accent-stroke" x1="246.8" y1="169.79999999999998" x2="414" y2="164.0" stroke="#00609c" stroke-width="1.6" stroke-dasharray="5 4"/>
<rect x="86.0" y="230.0" width="30.799999999999997" height="30.799999999999997" rx="0" fill="none" stroke="#ffffff" stroke-width="5"/>
<rect class="accent-stroke" x="86.0" y="230.0" width="30.799999999999997" height="30.799999999999997" rx="0" fill="none" stroke="#00609c" stroke-width="3"/>
<line class="accent-stroke" x1="120.8" y1="245.4" x2="414" y2="164.0" stroke="#00609c" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="474.0" y="248" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">the same weights here, here and here:</text>
<text x="474.0" y="268" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">a stripe is found wherever it is</text>
</g>
<g data-step="3">
<rect x="640" y="70" width="340" height="110" rx="8" fill="#fdecee" stroke="#da232f" stroke-width="1.6"/>
<text x="810" y="110" font-size="20" font-weight="bold" text-anchor="middle" fill="#da232f">a plain layer: 22 billion</text>
<text x="810" y="140" font-size="15" font-weight="normal" text-anchor="middle" fill="#da232f">weights, each pixel its own,</text>
<text x="810" y="160" font-size="15" font-weight="normal" text-anchor="middle" fill="#da232f">for every neuron</text>
<rect class="accent-a-light-fill accent-stroke" x="640" y="200" width="340" height="110" rx="8" fill="#8cb3cf" stroke="#00609c" stroke-width="1.6"/>
<text x="810" y="240" font-size="20" font-weight="bold" text-anchor="middle" fill="#1c2e36">a filter: 9 weights</text>
<text x="810" y="270" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">27 over the three colours,</text>
<text x="810" y="290" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">the same at every position</text>
</g>
</svg>
