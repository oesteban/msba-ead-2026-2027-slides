<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- Milestones of neural networks on a broken time axis: Rosenblatt 1958, Rumelhart et al. 1986, LeCun et al. 1998, Deng et al. 2009, Krizhevsky et al. 2012, He et al. 2016 (ILSVRC 2015), Vaswani et al. 2017, Brown et al. 2020, OpenAI 2022. Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<polygon class="accent-fill" points="20,150 962,150 962,136 990,167.0 962,198 962,184 20,184" fill="#00609c"/>
<path d="M418,188 L430,146 M430,188 L442,146" stroke="#ffffff" stroke-width="5"/>
</g>
<g data-step="1">
<line x1="64.0" y1="113" x2="64.0" y2="148" stroke="#556268" stroke-width="1.3" stroke-dasharray="3 3"/>
<text x="64.0" y="173.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">1958</text>
<text x="44.0" y="84" font-size="16" font-weight="bold" text-anchor="start" fill="#9aa4a8">One artificial neuron</text>
<text x="44.0" y="105" font-size="16" font-weight="normal" text-anchor="start" fill="#9aa4a8">learns from examples</text>
<line x1="288.0" y1="186" x2="288.0" y2="208" stroke="#556268" stroke-width="1.3" stroke-dasharray="3 3"/>
<text x="288.0" y="173.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">1986</text>
<text x="288.0" y="224" font-size="16" font-weight="bold" text-anchor="middle" fill="#9aa4a8">Errors sent back</text>
<text x="288.0" y="245" font-size="16" font-weight="normal" text-anchor="middle" fill="#9aa4a8">through the layers</text>
<line x1="384.0" y1="113" x2="384.0" y2="148" stroke="#556268" stroke-width="1.3" stroke-dasharray="3 3"/>
<text x="384.0" y="173.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">1998</text>
<text x="384.0" y="84" font-size="16" font-weight="bold" text-anchor="middle" fill="#9aa4a8">A network reads</text>
<text x="384.0" y="105" font-size="16" font-weight="normal" text-anchor="middle" fill="#9aa4a8">digits on cheques</text>
</g>
<g data-step="1">
<line x1="557.3684210526316" y1="186" x2="557.3684210526316" y2="208" stroke="#556268" stroke-width="1.3" stroke-dasharray="3 3"/>
<text x="557.3684210526316" y="173.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">2009</text>
<text x="557.3684210526316" y="224" font-size="16" font-weight="bold" text-anchor="middle" fill="#1c2e36">ImageNet: millions</text>
<text x="557.3684210526316" y="245" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">of labelled photos</text>
</g>
<g data-step="2">
<line x1="637.8947368421052" y1="113" x2="637.8947368421052" y2="148" stroke="#556268" stroke-width="1.3" stroke-dasharray="3 3"/>
<text x="637.8947368421052" y="173.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">2012</text>
<text x="637.8947368421052" y="84" font-size="16" font-weight="bold" text-anchor="middle" fill="#1c2e36">AlexNet wins,</text>
<text x="637.8947368421052" y="105" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">on two gaming GPUs</text>
</g>
<g data-step="3">
<line x1="718.421052631579" y1="186" x2="718.421052631579" y2="208" stroke="#556268" stroke-width="1.3" stroke-dasharray="3 3"/>
<text x="718.421052631579" y="173.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">2015</text>
<text x="718.421052631579" y="224" font-size="16" font-weight="bold" text-anchor="middle" fill="#1c2e36">ResNet:</text>
<text x="718.421052631579" y="245" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">152 layers</text>
</g>
<g data-step="4">
<line x1="772.1052631578948" y1="113" x2="772.1052631578948" y2="148" stroke="#556268" stroke-width="1.3" stroke-dasharray="3 3"/>
<text x="772.1052631578948" y="173.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">2017</text>
<text x="772.1052631578948" y="84" font-size="16" font-weight="bold" text-anchor="middle" fill="#1c2e36">The transformer,</text>
<text x="772.1052631578948" y="105" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">for text</text>
</g>
<g data-step="5">
<line x1="852.6315789473684" y1="186" x2="852.6315789473684" y2="208" stroke="#556268" stroke-width="1.3" stroke-dasharray="3 3"/>
<text x="852.6315789473684" y="173.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">2020</text>
<text x="852.6315789473684" y="224" font-size="16" font-weight="bold" text-anchor="middle" fill="#1c2e36">GPT-3: 175 billion</text>
<text x="852.6315789473684" y="245" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">weights</text>
</g>
<g data-step="6">
<line x1="906.3157894736842" y1="113" x2="906.3157894736842" y2="148" stroke="#556268" stroke-width="1.3" stroke-dasharray="3 3"/>
<text x="906.3157894736842" y="173.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">2022</text>
<text x="906.3157894736842" y="84" font-size="16" font-weight="bold" text-anchor="middle" fill="#1c2e36">ChatGPT opens</text>
<text x="906.3157894736842" y="105" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2e36">to the public</text>
</g>
</svg>
