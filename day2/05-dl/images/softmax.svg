<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" font-family="Inter, Arimo, Helvetica, sans-serif">
<!-- Softmax of three illustrative line scores [0.4, 1.6, 0.2] into 0.19, 0.65, 0.16. Illustrative. Oscar Esteban, CC BY 4.0. -->
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2e36"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent-fill" d="M0,0 L10,5 L0,10 z" fill="#00609c"/></marker>
</defs>
<g data-step="1">
<text x="150" y="40" font-size="19" font-weight="bold" text-anchor="middle" fill="#1c2e36">the last layer's scores</text>
<rect class="accent-stroke" x="40" y="80" width="220" height="60" rx="8" fill="#ffffff" stroke="#00609c" stroke-width="1.6"/>
<text x="150" y="118" font-size="22" font-weight="normal" text-anchor="middle" fill="#1c2e36">low: +0.4</text>
<rect class="accent-stroke" x="40" y="166" width="220" height="60" rx="8" fill="#ffffff" stroke="#00609c" stroke-width="1.6"/>
<text x="150" y="204" font-size="22" font-weight="normal" text-anchor="middle" fill="#1c2e36">medium: +1.6</text>
<rect class="accent-stroke" x="40" y="252" width="220" height="60" rx="8" fill="#ffffff" stroke="#00609c" stroke-width="1.6"/>
<text x="150" y="290" font-size="22" font-weight="normal" text-anchor="middle" fill="#1c2e36">high: +0.2</text>
</g>
<g data-step="2">
<line class="accent-stroke" x1="300" y1="190" x2="450" y2="190" stroke="#00609c" stroke-width="2.6" marker-end="url(#ahA)"/>
<text x="375" y="170" font-size="20" font-weight="bold" text-anchor="middle" fill="#1c2e36">softmax</text>
<text x="375" y="222" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">e to each score,</text>
<text x="375" y="242" font-size="15" font-weight="normal" text-anchor="middle" fill="#556268">divided by their sum</text>
<text x="740" y="40" font-size="19" font-weight="bold" text-anchor="middle" fill="#1c2e36">probabilities, summing to 1</text>
<line x1="510" y1="300" x2="960" y2="300" stroke="#556268" stroke-width="1.4"/>
<rect class="accent-a-light-fill" x="520" y="253.2969227460203" width="100" height="46.70307725397971" rx="3" fill="#8cb3cf"/>
<text x="570" y="243.2969227460203" font-size="21" font-weight="normal" text-anchor="middle" fill="#1c2e36">0.19</text>
<text x="570" y="328" font-size="19" font-weight="normal" text-anchor="middle" fill="#1c2e36">low</text>
<rect class="accent-fill" x="670" y="144.94032286518967" width="100" height="155.05967713481033" rx="3" fill="#00609c"/>
<text x="720" y="134.94032286518967" font-size="21" font-weight="bold" text-anchor="middle" fill="#1c2e36">0.65</text>
<text x="720" y="328" font-size="19" font-weight="bold" text-anchor="middle" fill="#1c2e36">medium</text>
<rect class="accent-a-light-fill" x="820" y="261.76275438879003" width="100" height="38.23724561120997" rx="3" fill="#8cb3cf"/>
<text x="870" y="251.76275438879003" font-size="21" font-weight="normal" text-anchor="middle" fill="#1c2e36">0.16</text>
<text x="870" y="328" font-size="19" font-weight="normal" text-anchor="middle" fill="#1c2e36">high</text>
</g>
<g data-step="3">
<text class="accent-fill" x="740" y="378" font-size="17" font-weight="bold" text-anchor="middle" fill="#00609c">the most probable line wins, unless the costs say otherwise</text>
</g>
</svg>
